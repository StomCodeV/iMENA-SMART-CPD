<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#071B33" />
  <title>iMENA Smart CPD — The Living Ocean</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/268DpvQt/i-MENA-Smart-CPD-Badge.png" />
  <link rel="apple-touch-icon" href="https://i.postimg.cc/268DpvQt/i-MENA-Smart-CPD-Badge.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* ============ LIVE OCEAN LANDING ============ */
    .landing-root { position: relative; width: 100%; background: #071B33; }
    .landing-canvas-fixed { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
    #ocean-canvas { display: block; }
    #droplet-canvas { display: block; z-index: 2; }
    .landing-scroll { position: relative; z-index: 3; pointer-events: none; }
    .landing-section {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 1;
      transition: opacity 0.15s linear;
      pointer-events: auto;
    }
    .landing-section-inner { max-width: 1100px; width: 100%; text-align: center; color: #F8FAFC; }

    /* Top-right floating dashboard link (only when signed in) */
    #floating-dashboard {
      display: none;
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 50;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      background: rgba(248, 250, 252, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #071B33;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    #floating-dashboard:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0, 217, 255, 0.35);
      background: #F8FAFC;
    }
    #floating-dashboard.visible { display: inline-flex; }
    @media (max-width: 640px) {
      #floating-dashboard { top: 12px; right: 12px; padding: 8px 14px; font-size: 12px; }
    }

    /* ============ HERO TYPOGRAPHY ============ */
    .landing-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(0, 217, 255, 0.12);
      border: 1px solid rgba(0, 217, 255, 0.35);
      color: #00D9FF;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      margin-bottom: 24px;
    }
    .landing-badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #00D9FF;
      box-shadow: 0 0 12px #00D9FF;
      animation: pulse-cyan 2s ease-in-out infinite;
    }
    @keyframes pulse-cyan {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.5); }
    }
    .landing-h1 {
      font-size: clamp(38px, 7vw, 92px);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.04em;
      margin: 0 0 24px;
      text-shadow: 0 4px 40px rgba(0, 0, 0, 0.5);
      background: linear-gradient(180deg, #FFFFFF 0%, #B8E8F5 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .landing-h1 .accent {
      background: linear-gradient(135deg, #00D9FF 0%, #10B981 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .landing-h2 {
      font-size: clamp(28px, 5vw, 60px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin: 0 0 20px;
      text-shadow: 0 4px 40px rgba(0, 0, 0, 0.6);
      color: #F8FAFC;
    }
    .landing-h2 .accent {
      background: linear-gradient(135deg, #00D9FF 0%, #10B981 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .landing-sub {
      font-size: clamp(15px, 1.6vw, 19px);
      color: rgba(248, 250, 252, 0.78);
      line-height: 1.6;
      max-width: 640px;
      margin: 0 auto 40px;
      font-weight: 400;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
    }
    .landing-cta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .btn-google {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 16px 32px;
      border-radius: 16px;
      background: #F8FAFC;
      color: #071B33;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      box-shadow: 0 12px 32px rgba(0, 217, 255, 0.25), 0 4px 12px rgba(0, 0, 0, 0.3);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      border: none;
    }
    .btn-google:hover { transform: translateY(-3px); box-shadow: 0 20px 48px rgba(0, 217, 255, 0.4), 0 8px 20px rgba(0, 0, 0, 0.4); }
    .btn-google:disabled { opacity: 0.6; cursor: wait; }
    .btn-google.dashboard-mode {
      background: linear-gradient(135deg, #00D9FF, #10B981);
      color: #071B33;
      box-shadow: 0 12px 32px rgba(0, 217, 255, 0.5), 0 4px 12px rgba(0, 0, 0, 0.3);
    }
    .btn-google.dashboard-mode:hover {
      box-shadow: 0 20px 48px rgba(0, 217, 255, 0.65), 0 8px 20px rgba(0, 0, 0, 0.4);
    }
    .spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .landing-logo-hero {
      width: 120px; height: 120px;
      margin: 0 auto 32px;
      filter: drop-shadow(0 12px 40px rgba(0, 217, 255, 0.4));
    }
    .landing-logo-hero img { width: 100%; height: 100%; object-fit: contain; }

    .scroll-hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(248, 250, 252, 0.6);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: floatDown 2s ease-in-out infinite;
    }
    @keyframes floatDown {
      0%, 100% { transform: translate(-50%, 0); opacity: 0.6; }
      50% { transform: translate(-50%, 8px); opacity: 1; }
    }

    .glass-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 40px auto 0;
    }
    .glass-panel {
      padding: 32px 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      text-align: left;
      color: #F8FAFC;
      transition: all 0.35s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .glass-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 217, 255, 0.5), transparent);
    }
    .glass-panel:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(0, 217, 255, 0.35);
      transform: translateY(-6px);
      box-shadow: 0 20px 60px rgba(0, 217, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .glass-panel-num {
      font-size: 11px;
      font-weight: 800;
      color: #00D9FF;
      letter-spacing: 0.15em;
      margin-bottom: 16px;
      opacity: 0.9;
    }
    .glass-panel-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; color: #F8FAFC; letter-spacing: -0.01em; }
    .glass-panel-text { font-size: 13px; color: rgba(248, 250, 252, 0.65); line-height: 1.6; }

    .landing-footer {
      position: absolute;
      bottom: 24px;
      left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.05em;
      color: rgba(248, 250, 252, 0.4);
    }

    .landing-fallback {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #0a2540 0%, #075985 40%, #0c4a6e 70%, #082f49 100%);
      z-index: 1;
    }

    /* Toast */
    .toast {
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      max-width: 340px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
      animation: toastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    .toast.success { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
    .toast.error   { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
    .toast.warn    { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
    .toast.info    { background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff; }

    @media (prefers-reduced-motion: reduce) {
      .scroll-hint, .landing-badge .dot { animation: none !important; }
      .landing-section { transition: none; }
    }
    @media (max-width: 640px) {
      .landing-section { padding: 16px; }
      .glass-panel { padding: 22px 18px; }
      .btn-google { padding: 14px 24px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast-root" style="position:fixed;bottom:20px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none"></div>

  <script type="module">
    import * as THREE from 'three';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAnalytics } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js';
    import {
      getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect,
      getRedirectResult, GoogleAuthProvider, setPersistence,
      browserLocalPersistence
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import {
      getFirestore, doc, getDoc, setDoc, serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    /* ============================================================
       FIREBASE CONFIG (same project as userboard.html)
    ============================================================ */
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAa3mJKaSFaRqN0b5YUPtQcM--SsYOzHj8",
      authDomain: "imena-smart-cpd-attendance.firebaseapp.com",
      projectId: "imena-smart-cpd-attendance",
      storageBucket: "imena-smart-cpd-attendance.firebasestorage.app",
      messagingSenderId: "515464832241",
      appId: "1:515464832241:web:9e05a6cc3d4447dfff7550",
      measurementId: "G-NQGDXWN6G8"
    };

    const firebaseApp = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);
    try { getAnalytics(firebaseApp); } catch {}
    setPersistence(auth, browserLocalPersistence).catch(() => {});
    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: 'select_account' });
    getRedirectResult(auth).catch(err => { if (err?.code !== 'auth/no-auth-event') console.warn('[redirect]', err); });

    /* ============================================================
       ROUTES
    ============================================================ */
    const DASHBOARD_URL = 'userboard.html';

    /* ============================================================
       STATE + UTILS
    ============================================================ */
    const state = { user: null, view: 'boot' };

    function toast(message, type = 'info') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = message;
      el.style.pointerEvents = 'auto';
      document.getElementById('toast-root').appendChild(el);
      setTimeout(() => {
        el.style.transition = 'opacity .3s, transform .3s';
        el.style.opacity = '0';
        el.style.transform = 'translateX(40px)';
        setTimeout(() => el.remove(), 320);
      }, 4500);
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    /* ============================================================
       OCEAN ENGINE (unchanged — copy from your original)
       Full ocean scene preserved exactly as-is.
    ============================================================ */
    const oceanScene = {
      renderer: null, scene: null, camera: null,
      ocean: null, sky: null, sunDir: null, sunColor: null,
      clock: null, animationId: null, isActive: false,
      container: null, dropletCanvas: null, dropletCtx: null, droplets: [],
      lastScrollY: 0, scrollVelocity: 0,
      targetProgress: 0, currentProgress: 0,
      cameraTarget: new THREE.Vector3(0, 8, -100),
      reducedMotion: false, isMobile: false,
      oceanTime: 0,

      waveTable: [
        { dir: [ 0.78,  0.63], len: 110, amp: 0.95, spd: 0.55, steep: 0.42 },
        { dir: [ 0.92,  0.39], len:  78, amp: 0.62, spd: 0.62, steep: 0.48 },
        { dir: [ 0.55,  0.83], len:  56, amp: 0.42, spd: 0.72, steep: 0.55 },
        { dir: [ 0.28,  0.96], len:  40, amp: 0.28, spd: 0.82, steep: 0.60 },
        { dir: [-0.42,  0.91], len:  30, amp: 0.20, spd: 0.92, steep: 0.66 },
        { dir: [ 0.87, -0.49], len:  22, amp: 0.13, spd: 1.02, steep: 0.72 },
        { dir: [-0.72,  0.69], len:  16, amp: 0.09, spd: 1.12, steep: 0.78 },
        { dir: [ 0.91, -0.30], len:  12, amp: 0.06, spd: 1.22, steep: 0.82 },
        { dir: [ 0.40, -0.91], len:   9, amp: 0.04, spd: 1.32, steep: 0.86 },
        { dir: [-0.55, -0.83], len: 6.5, amp: 0.025, spd: 1.42, steep: 0.90 },
        { dir: [ 0.62,  0.78], len: 4.5, amp: 0.016, spd: 1.52, steep: 0.92 },
        { dir: [-0.83,  0.42], len: 3.0, amp: 0.010, spd: 1.62, steep: 0.94 },
      ],

      _buildWaveGLSL() {
        return this.waveTable.map(w => {
          const k  = (2 * Math.PI / w.len).toFixed(6);
          const c  = Math.sqrt(9.81 / (2 * Math.PI / w.len)).toFixed(4);
          const dx = w.dir[0].toFixed(3);
          const dz = w.dir[1].toFixed(3);
          const a  = w.amp.toFixed(3);
          const st = w.steep.toFixed(3);
          const spd = w.spd.toFixed(3);
          return `
          {
            float k = ${k};
            float cw = ${c};
            vec2 d = normalize(vec2(${dx}, ${dz}));
            float f = k * (dot(d, p.xz) - cw * ${spd} * uTime);
            float cf = cos(f);
            float sf = sin(f);
            float A = ${a};
            float st = ${st};
            float Q = st / (k * max(A, 1e-3) * float(${this.waveTable.length}));
            p.x += d.x * Q * A * cf;
            p.z += d.y * Q * A * cf;
            p.y += A * sf;
            grad.x += A * k * d.x * cf;
            grad.z += A * k * d.y * cf;
            steepAcc += abs(A * k * cf);
          }`;
        }).join('\n');
      },

      _skyGLSL() {
        return `
          float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
          float vnoise(vec2 p){
            vec2 i = floor(p), f = fract(p);
            f = f*f*(3.0-2.0*f);
            float a = hash21(i), b = hash21(i + vec2(1.0, 0.0));
            float c = hash21(i + vec2(0.0, 1.0)), d = hash21(i + vec2(1.0, 1.0));
            return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
          }
          float fbm3(vec2 p){
            float s = 0.0, a = 0.5;
            for (int i = 0; i < 4; i++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; }
            return s;
          }
          vec3 skyColor(vec3 dir){
            float y = max(dir.y, 0.0);
            vec3 zenith  = vec3(0.030, 0.115, 0.335);
            vec3 mid     = vec3(0.180, 0.380, 0.640);
            vec3 horizon = vec3(0.680, 0.780, 0.870);
            vec3 sky = mix(horizon, mid, smoothstep(0.0, 0.35, y));
            sky = mix(sky, zenith, smoothstep(0.30, 0.85, y));
            float sunDot = dot(dir, uSunDirection);
            float disc = smoothstep(0.99965, 0.99990, sunDot);
            float glow = pow(max(sunDot, 0.0), 60.0) * 0.35;
            float aureole = pow(max(sunDot, 0.0), 6.0) * 0.06;
            sky += uSunColor * (disc * 12.0 + glow + aureole);
            if (dir.y > 0.015) {
              float t = 1.0 / (dir.y + 0.05);
              vec2 cp = dir.xz * t * 0.16 + vec2(uTime * 0.0022, uTime * 0.0014);
              float base = fbm3(cp * 1.4);
              float detail = fbm3(cp * 4.2 + 7.0);
              float density = smoothstep(0.50, 0.80, base * 0.72 + detail * 0.28);
              float shSample = fbm3(cp + uSunDirection.xz * 0.10);
              float shadow = smoothstep(0.55, 0.85, shSample);
              float lit = clamp(1.0 - shadow * 0.7, 0.0, 1.0);
              lit = mix(lit, 1.0, smoothstep(0.0, 0.4, sunDot) * 0.35);
              vec3 cloudCol = mix(vec3(0.42, 0.47, 0.55), vec3(1.02, 0.99, 0.94), lit);
              cloudCol += uSunColor * pow(max(sunDot, 0.0), 12.0) * 0.12;
              float haze = smoothstep(0.015, 0.14, dir.y);
              sky = mix(sky, cloudCol, density * haze * 0.9);
            }
            float hz = exp(-y * 22.0) * 0.55;
            sky = mix(sky, vec3(0.72, 0.80, 0.88), hz);
            return sky;
          }
        `;
      },

      init(container) {
        if (!this.webglSupported()) { this.buildFallback(container); return; }
        this.container = container;
        this.isMobile = window.innerWidth < 768 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        this.reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        this.renderer = new THREE.WebGLRenderer({
          canvas: document.getElementById('ocean-canvas'),
          antialias: !this.isMobile,
          alpha: false,
          powerPreference: 'high-performance'
        });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, this.isMobile ? 1.5 : 2));
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.02;
        this.renderer.outputColorSpace = THREE.SRGBColorSpace;

        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x071B33);
        this.camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 3000);
        this.camera.position.set(0, 15, 20);

        this.clock = new THREE.Clock();
        this.sunDir = new THREE.Vector3(0.42, 0.32, -0.85).normalize();
        this.sunColor = new THREE.Color(1.00, 0.94, 0.84);

        this.sky = this.createSky(this.sunDir);
        this.scene.add(this.sky);
        this.ocean = this.createOcean(this.sunDir);
        this.scene.add(this.ocean);

        const sunLight = new THREE.DirectionalLight(0xfff2dd, 1.1);
        sunLight.position.copy(this.sunDir).multiplyScalar(100);
        this.scene.add(sunLight);
        this.scene.add(new THREE.AmbientLight(0x4a7fa5, 0.35));

        this.dropletCanvas = document.getElementById('droplet-canvas');
        this.dropletCtx = this.dropletCanvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', this.handleResize);
        this.boundScrollHandler = () => this.onScroll();
        window.addEventListener('scroll', this.boundScrollHandler, { passive: true });

        const initial = this.getCameraAtProgress(0);
        this.camera.position.set(initial.pos.x, initial.pos.y, initial.pos.z);
        this.cameraTarget.set(initial.target.x, initial.target.y, initial.target.z);
        this.camera.lookAt(this.cameraTarget);

        this.isActive = true;
        this.animate();
      },

      webglSupported() {
        try { const c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); } catch { return false; }
      },
      buildFallback(container) {
        const fb = document.createElement('div');
        fb.className = 'landing-fallback';
        container.insertBefore(fb, container.firstChild);
        this.isActive = false;
      },

      createSky(sunDir) {
        const geo = new THREE.SphereGeometry(1500, this.isMobile ? 32 : 64, this.isMobile ? 16 : 32);
        const skyUniforms = {
          uSunDirection: { value: sunDir.clone() },
          uSunColor:     { value: this.sunColor.clone() },
          uTime:         { value: 0 },
        };
        const mat = new THREE.ShaderMaterial({
          side: THREE.BackSide,
          depthWrite: false,
          uniforms: skyUniforms,
          vertexShader: `
            varying vec3 vWorldPosition;
            void main() {
              vec4 wp = modelMatrix * vec4(position, 1.0);
              vWorldPosition = wp.xyz;
              gl_Position = projectionMatrix * viewMatrix * wp;
            }
          `,
          fragmentShader: `
            precision highp float;
            uniform vec3  uSunDirection;
            uniform vec3  uSunColor;
            uniform float uTime;
            varying vec3 vWorldPosition;
            ${this._skyGLSL()}
            void main() {
              vec3 dir = normalize(vWorldPosition);
              gl_FragColor = vec4(skyColor(dir), 1.0);
            }
          `,
        });
        const sky = new THREE.Mesh(geo, mat);
        sky.userData.uniforms = skyUniforms;
        return sky;
      },

      createOcean(sunDir) {
        const segs = this.isMobile ? 128 : 448;
        const size = 1200;
        const geo = new THREE.PlaneGeometry(size, size, segs, segs);
        geo.rotateX(-Math.PI / 2);
        const waveBody = this._buildWaveGLSL();
        const oceanUniforms = {
          uTime:         { value: 0 },
          uSunDirection: { value: sunDir.clone() },
          uSunColor:     { value: this.sunColor.clone() },
          uCameraPos:    { value: new THREE.Vector3() },
        };
        const mat = new THREE.ShaderMaterial({
          uniforms: oceanUniforms,
          side: THREE.DoubleSide,
          vertexShader: `
            precision highp float;
            uniform float uTime;
            varying vec3 vWorldPosition;
            varying vec3 vNormal;
            varying float vHeight;
            varying float vSteep;
            const float PI = 3.141592653589793;
            void main() {
              vec3 p = position; p.y = 0.0;
              vec3 grad = vec3(0.0);
              float steepAcc = 0.0;
              ${waveBody}
              vec3 n = normalize(vec3(-grad.x, 1.0, -grad.z));
              vHeight = p.y;
              vNormal = n;
              vSteep  = steepAcc;
              vec4 wp = modelMatrix * vec4(p, 1.0);
              vWorldPosition = wp.xyz;
              gl_Position = projectionMatrix * viewMatrix * wp;
            }
          `,
          fragmentShader: `
            precision highp float;
            uniform float uTime;
            uniform vec3  uSunDirection;
            uniform vec3  uSunColor;
            uniform vec3  uCameraPos;
            varying vec3 vWorldPosition;
            varying vec3 vNormal;
            varying float vHeight;
            varying float vSteep;
            ${this._skyGLSL()}
            void main() {
              vec3 N = normalize(vNormal);
              vec3 V = normalize(uCameraPos - vWorldPosition);
              vec3 L = normalize(uSunDirection);
              vec2 q = vWorldPosition.xz;
              float t = uTime;
              N.x += cos(q.x * 2.6 + q.y * 1.9 + t * 2.1) * 0.045 + cos(q.x * 6.3 - q.y * 5.1 + t * 3.4) * 0.018;
              N.z += cos(q.x * 1.8 - q.y * 2.7 + t * 1.7) * 0.045 + cos(q.x * 5.2 + q.y * 6.2 + t * 3.0) * 0.018;
              N = normalize(N);
              float NdotV = max(dot(N, V), 0.0);
              float F = 0.02 + 0.98 * pow(1.0 - NdotV, 5.0);
              vec3 deepC   = vec3(0.008, 0.035, 0.095);
              vec3 midC    = vec3(0.020, 0.095, 0.200);
              vec3 crestC  = vec3(0.050, 0.250, 0.320);
              float depthF = smoothstep(-1.2, 1.2, vHeight);
              vec3 water = mix(deepC, midC, depthF);
              float crestF = smoothstep(0.30, 1.10, vHeight) * smoothstep(0.40, 0.90, vSteep);
              water = mix(water, crestC, crestF * 0.55);
              vec3 R = reflect(-V, N);
              R.y = max(R.y, 0.0);
              vec3 refl = skyColor(normalize(R));
              vec3 H = normalize(L + V);
              float NdotL = max(dot(N, L), 0.0);
              float NdotH = max(dot(N, H), 0.0);
              float m = mix(0.05, 0.28, clamp(vSteep * 0.35, 0.0, 1.0));
              float c2 = max(NdotH * NdotH, 1e-4);
              float D  = exp(-(1.0 - c2) / (c2 * m * m)) / (3.14159 * m * m * c2 * c2 + 1e-5);
              float spec = D * NdotL * F * 8.0;
              float sss = pow(max(dot(-V, L) * 0.5 + 0.5, 0.0), 3.0);
              sss *= smoothstep(0.20, 1.10, vHeight) * (1.0 - F);
              vec3 sssCol = vec3(0.08, 0.28, 0.24) * sss * 0.7;
              vec3 color = mix(water, refl, F);
              color += uSunColor * spec;
              color += sssCol;
              float foamMask = smoothstep(0.95, 1.45, vHeight) * smoothstep(0.55, 0.95, vSteep);
              float foamNoise = fbm3(q * 1.4 + vec2(t * 0.20, t * 0.10));
              foamMask *= smoothstep(0.55, 0.85, foamNoise);
              color = mix(color, vec3(0.93, 0.96, 0.98), clamp(foamMask * 0.85, 0.0, 1.0));
              float dist = length(uCameraPos - vWorldPosition);
              float fog = 1.0 - exp(-dist * 0.00085);
              color = mix(color, vec3(0.68, 0.78, 0.86), clamp(fog * 0.7, 0.0, 1.0));
              gl_FragColor = vec4(color, 1.0);
            }
          `,
        });
        const ocean = new THREE.Mesh(geo, mat);
        ocean.frustumCulled = false;
        ocean.userData.uniforms = oceanUniforms;
        return ocean;
      },

      getCameraAtProgress(p) {
        const keyframes = [
          { p: 0.00, pos: { x:  0, y: 14, z:  20 }, target: { x:  0, y:  7, z: -100 } },
          { p: 0.25, pos: { x:  2, y:  9, z:  -5 }, target: { x:  1, y:  4, z: -130 } },
          { p: 0.50, pos: { x: -3, y:  4, z: -40 }, target: { x: -1, y:  2, z: -170 } },
          { p: 0.75, pos: { x:  4, y:  7, z: -75 }, target: { x:  2, y:  3, z: -210 } },
          { p: 1.00, pos: { x:  0, y: 24, z:-110 }, target: { x:  0, y:  6, z: -260 } },
        ];
        let i = 0;
        while (i < keyframes.length - 1 && keyframes[i + 1].p < p) i++;
        const a = keyframes[i], b = keyframes[Math.min(i + 1, keyframes.length - 1)];
        const t = b.p === a.p ? 0 : (p - a.p) / (b.p - a.p);
        const e = t * t * (3 - 2 * t);
        const L = (av, bv) => av + (bv - av) * e;
        return {
          pos:    { x: L(a.pos.x, b.pos.x),    y: L(a.pos.y, b.pos.y),    z: L(a.pos.z, b.pos.z) },
          target: { x: L(a.target.x, b.target.x), y: L(a.target.y, b.target.y), z: L(a.target.z, b.target.z) },
        };
      },

      onScroll() {
        const sy = window.scrollY;
        const d = Math.abs(sy - this.lastScrollY);
        this.scrollVelocity = d;
        this.lastScrollY = sy;
        const max = document.documentElement.scrollHeight - window.innerHeight;
        this.targetProgress = max > 0 ? Math.min(1, Math.max(0, sy / max)) : 0;
      },

      updateCamera(dt) {
        this.currentProgress += (this.targetProgress - this.currentProgress) * Math.min(1, dt * 3.5);
        const cam = this.getCameraAtProgress(this.currentProgress);
        const k = Math.min(1, dt * 5.5);
        this.camera.position.x += (cam.pos.x - this.camera.position.x) * k;
        this.camera.position.y += (cam.pos.y - this.camera.position.y) * k;
        this.camera.position.z += (cam.pos.z - this.camera.position.z) * k;
        this.cameraTarget.x += (cam.target.x - this.cameraTarget.x) * k;
        this.cameraTarget.y += (cam.target.y - this.cameraTarget.y) * k;
        this.cameraTarget.z += (cam.target.z - this.cameraTarget.z) * k;
        this.camera.lookAt(this.cameraTarget);
      },

      spawnDroplet() {
        const w = window.innerWidth;
        const s = 3 + Math.random() * 12;
        this.droplets.push({
          x: Math.random() * w, y: -s,
          vx: (Math.random() - 0.5) * 0.3, vy: 0.5 + Math.random() * 2.5,
          size: s, life: 1,
          wobble: Math.random() * Math.PI * 2,
          wobbleSpeed: 0.02 + Math.random() * 0.05,
        });
      },

      updateDroplets(dt) {
        const ctx = this.dropletCtx; if (!ctx) return;
        const dpr = window.devicePixelRatio || 1;
        const w = this.dropletCanvas.width / dpr;
        const h = this.dropletCanvas.height / dpr;
        ctx.clearRect(0, 0, w, h);
        const inWater = this.currentProgress > 0.30 && this.currentProgress < 0.72;
        const fast = this.scrollVelocity > 25;
        if (!this.reducedMotion && (inWater || fast)) {
          const chance = this.isMobile ? 0.025 : 0.05;
          const boost = fast ? 0.14 : 0;
          if (Math.random() < chance + boost) this.spawnDroplet();
        }
        for (let i = this.droplets.length - 1; i >= 0; i--) {
          const d = this.droplets[i];
          d.wobble += d.wobbleSpeed;
          d.x += d.vx + Math.sin(d.wobble) * 0.4;
          d.y += d.vy; d.vy += 0.08;
          if (d.y > h + d.size) d.life -= 0.15; else d.life = Math.min(1, d.life + 0.05);
          if (d.life <= 0) { this.droplets.splice(i, 1); continue; }
          const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.size);
          g.addColorStop(0,    `rgba(180,220,255,${0.08 * d.life})`);
          g.addColorStop(0.55, `rgba(120,180,230,${0.15 * d.life})`);
          g.addColorStop(0.90, `rgba(60,120,180,${0.25 * d.life})`);
          g.addColorStop(1,    `rgba(60,120,180,0)`);
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2); ctx.fill();
          const hl = ctx.createRadialGradient(d.x - d.size * .3, d.y - d.size * .35, 0, d.x - d.size * .3, d.y - d.size * .35, d.size * .35);
          hl.addColorStop(0, `rgba(255,255,255,${0.7 * d.life})`);
          hl.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = hl; ctx.beginPath(); ctx.arc(d.x - d.size * .3, d.y - d.size * .35, d.size * .35, 0, Math.PI * 2); ctx.fill();
        }
      },

      animate() {
        if (!this.isActive) return;
        this.animationId = requestAnimationFrame(() => this.animate());
        if (document.hidden) return;
        const dt = Math.min(this.clock.getDelta(), 0.1);
        this.oceanTime += dt;
        if (this.sky?.userData.uniforms)  this.sky.userData.uniforms.uTime.value = this.oceanTime;
        if (this.ocean?.userData.uniforms) {
          this.ocean.userData.uniforms.uTime.value = this.oceanTime;
          this.ocean.userData.uniforms.uCameraPos.value.copy(this.camera.position);
        }
        this.updateCamera(dt);
        this.updateDroplets(dt);
        this.renderer.render(this.scene, this.camera);
        this.scrollVelocity *= 0.92;
      },

      handleResize() {
        if (!this.renderer) return;
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, this.isMobile ? 1.5 : 2));
        this.resize();
      },

      resize() {
        if (!this.dropletCanvas) return;
        const dpr = window.devicePixelRatio || 1;
        this.dropletCanvas.width = window.innerWidth * dpr;
        this.dropletCanvas.height = window.innerHeight * dpr;
        this.dropletCanvas.style.width = window.innerWidth + 'px';
        this.dropletCanvas.style.height = window.innerHeight + 'px';
        this.dropletCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      },

      dispose() {
        this.isActive = false;
        if (this.animationId) cancelAnimationFrame(this.animationId);
        if (this.boundScrollHandler) window.removeEventListener('scroll', this.boundScrollHandler);
        window.removeEventListener('resize', this.handleResize);
        if (this.ocean) { this.ocean.geometry.dispose(); this.ocean.material.dispose(); }
        if (this.sky)   { this.sky.geometry.dispose();   this.sky.material.dispose();   }
        if (this.renderer) {
          this.renderer.dispose();
          const c = this.renderer.domElement;
          if (c && c.parentNode) c.parentNode.removeChild(c);
        }
        this.droplets = [];
        this.renderer = null; this.scene = null; this.camera = null;
        this.ocean = null; this.sky = null;
        this.dropletCanvas = null; this.dropletCtx = null;
      },
    };

    let landingFadeRAF = null;
    function startLandingFadeLoop() {
      if (landingFadeRAF) cancelAnimationFrame(landingFadeRAF);
      const sections = document.querySelectorAll('.landing-section');
      function loop() {
        if (state.view !== 'landing') { landingFadeRAF = null; return; }
        const vh = window.innerHeight, center = vh / 2;
        sections.forEach(s => {
          const r = s.getBoundingClientRect();
          const d = Math.abs(r.top + r.height / 2 - center);
          const o = Math.max(0, 1 - d / (vh * 0.7));
          s.style.opacity = o.toFixed(3);
          s.style.pointerEvents = o > 0.6 ? 'auto' : 'none';
        });
        landingFadeRAF = requestAnimationFrame(loop);
      }
      landingFadeRAF = requestAnimationFrame(loop);
    }

    /* ============================================================
       AUTH: sign in → ensure profile → redirect to dashboard
    ============================================================ */
    async function handleGoogleSignIn(btn) {
      btn.disabled = true;
      const original = btn.innerHTML;
      btn.innerHTML = '<span class="spin" style="display:inline-block;width:18px;height:18px;border:2px solid rgba(7,27,51,.25);border-top-color:#071B33;border-radius:50%"></span> Signing in…';
      try {
        const result = await signInWithPopup(auth, googleProvider);
        if (result?.user) {
          await ensureProfile(result.user);
          // Small delay so user sees confirmation before nav
          btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:8px">✓ Signed in. Redirecting…</span>';
          window.location.href = DASHBOARD_URL;
          return;
        }
      } catch (err) {
        if (['auth/popup-blocked','auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(err.code)) {
          try {
            await signInWithRedirect(auth, googleProvider);
            return;
          } catch (e2) {
            toast('Sign-in failed: ' + e2.message, 'error');
          }
        } else if (err.code !== 'auth/popup-closed-by-user') {
          toast('Sign-in failed: ' + err.message, 'error');
        }
      }
      btn.disabled = false;
      btn.innerHTML = original;
    }

    async function ensureProfile(user) {
      const ref = doc(db, 'users', user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          email: user.email,
          fullName: user.displayName || user.email,
          role: 'teacher',
          createdAt: serverTimestamp(),
        });
      }
    }

    /* ============================================================
       AUTH LIFECYCLE
       - If signed in while on landing → swap CTA to "Go to Dashboard"
       - If signed out → swap back to "Continue with Google"
    ============================================================ */
    onAuthStateChanged(auth, user => {
      const wasSignedIn = !!state.user;
      state.user = user || null;
      state.loading = false;

      // Only re-render landing if auth state actually changed and we're on it
      if (state.view === 'landing' && wasSignedIn !== !!state.user) {
        // Re-render landing to update CTA text
        if (oceanScene.isActive) oceanScene.dispose();
        goLanding();
      }
    });

      document.getElementById('app').innerHTML = `

          <img src="https://i.postimg.cc/QMd5HYhd/i-MENA-Smart-CPD-Attendance-Logo.png" alt="iMENA" style="width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 12px 40px rgba(0,217,255,.5))" />
          <div style="font-size:13px;opacity:.7;letter-spacing:.15em;text-transform:uppercase;">Loading iMENA Smart CPD</div>
          <div style="width:48px;height:48px;border-radius:50%;border:3px solid rgba(0,217,255,0.15);border-top-color:#00D9FF;animation:spin .9s linear infinite"></div>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>`;
    }

    // Show loading briefly, then landing. If auth resolves first, landing still renders correctly.
    boot();
    setTimeout(() => {
      if (state.view === 'boot') {
        state.loading = false;
        goLanding();
      }
    }, 800);
  </script>
