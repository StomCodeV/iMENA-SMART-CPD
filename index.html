<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0ea5e9" />
  <title>iMENA Smart CPD Attendance</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* ============ RESET & BASE ============ */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow-x: hidden;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, textarea { font-family: inherit; }

    /* ============ AURORA SCENE ============ */
    .scene {
      position: relative;
      min-height: 100vh;
      background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 45%, #fae8ff 100%);
      overflow: hidden;
      isolation: isolate;
    }
    .scene.admin {
      background: linear-gradient(135deg, #0b1220 0%, #1e1b4b 55%, #312e81 100%);
      color: #e2e8f0;
    }

    .aurora-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      pointer-events: none;
      animation: floatOrb 24s ease-in-out infinite;
      will-change: transform;
    }
    .aurora-orb.o1 { width: 380px; height: 380px; background: #60a5fa; top: -80px; left: -100px; animation-delay: 0s; }
    .aurora-orb.o2 { width: 460px; height: 460px; background: #c084fc; top: 20%; right: -150px; animation-delay: -6s; }
    .aurora-orb.o3 { width: 340px; height: 340px; background: #f0abfc; bottom: -120px; left: 20%; animation-delay: -12s; }
    .aurora-orb.o4 { width: 300px; height: 300px; background: #38bdf8; bottom: 10%; right: 10%; animation-delay: -18s; }

    .admin .aurora-orb.o1 { background: #6366f1; opacity: 0.4; }
    .admin .aurora-orb.o2 { background: #a855f7; opacity: 0.35; }
    .admin .aurora-orb.o3 { background: #0ea5e9; opacity: 0.35; }
    .admin .aurora-orb.o4 { background: #ec4899; opacity: 0.25; }

    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(40px, -60px) scale(1.08); }
      50% { transform: translate(-30px, 50px) scale(0.94); }
      75% { transform: translate(60px, 30px) scale(1.04); }
    }

    /* Grid overlay for depth */
    .scene::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 40%, black, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at 50% 40%, black, transparent 75%);
      pointer-events: none;
      z-index: 0;
    }
    .admin.scene::before {
      background-image:
        linear-gradient(rgba(139,92,246,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139,92,246,0.08) 1px, transparent 1px);
    }

    .scene-inner { position: relative; z-index: 1; }

    /* ============ GLASS CARDS (3D) ============ */
    .card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 22px;
      box-shadow:
        0 8px 32px rgba(59, 130, 246, 0.09),
        0 2px 8px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.4s ease,
                  border-color 0.4s ease;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .card.hoverable:hover {
      transform: translateY(-6px) rotateX(-1.5deg);
      box-shadow:
        0 24px 60px rgba(59, 130, 246, 0.18),
        0 4px 16px rgba(0, 0, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    .admin .card {
      background: rgba(30, 27, 75, 0.55);
      border: 1px solid rgba(139, 92, 246, 0.22);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
    }
    .admin .card.hoverable:hover {
      transform: translateY(-6px) rotateX(-1.5deg);
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow:
        0 24px 60px rgba(139, 92, 246, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* ============ BUTTONS ============ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
      white-space: nowrap;
      min-height: 44px;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      color: #fff;
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.35);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(14, 165, 233, 0.45);
    }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #fff;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.35);
    }
    .btn-danger:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(239, 68, 68, 0.45);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.4);
      color: #334155;
    }
    .btn-ghost:hover:not(:disabled) { background: rgba(255, 255, 255, 0.85); }
    .admin .btn-ghost {
      background: rgba(139, 92, 246, 0.12);
      border-color: rgba(139, 92, 246, 0.35);
      color: #c4b5fd;
    }
    .admin .btn-ghost:hover:not(:disabled) { background: rgba(139, 92, 246, 0.22); }

    /* ============ BADGES ============ */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .badge-live { background: rgba(16, 185, 129, 0.15); color: #059669; }
    .admin .badge-live { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-upcoming { background: rgba(148, 163, 184, 0.2); color: #475569; }
    .admin .badge-upcoming { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }
    .badge-ended { background: rgba(148, 163, 184, 0.15); color: #64748b; }
    .admin .badge-ended { background: rgba(148, 163, 184, 0.12); color: #94a3b8; }
    .badge-ongoing { background: rgba(14, 165, 233, 0.15); color: #0284c7; }
    .admin .badge-ongoing { background: rgba(14, 165, 233, 0.2); color: #38bdf8; }

    /* ============ LIVE PULSE ============ */
    .pulse-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #10b981;
      position: relative;
    }
    .pulse-dot::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: #10b981;
      opacity: 0.6;
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 0.8; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* ============ ANIMATIONS ============ */
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .slide-up { animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ HEADER ============ */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 12px 0;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
    }
    .admin .app-header {
      background: rgba(15, 23, 42, 0.55);
      border-bottom-color: rgba(139, 92, 246, 0.15);
    }

    /* ============ INPUTS ============ */
    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      transition: all 0.2s;
      min-height: 44px;
    }
    .input:focus {
      outline: none;
      border-color: #0ea5e9;
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
      background: rgba(255, 255, 255, 0.95);
    }
    .admin .input {
      background: rgba(30, 27, 75, 0.5);
      border-color: rgba(139, 92, 246, 0.28);
      color: #e2e8f0;
    }
    .admin .input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
      background: rgba(30, 27, 75, 0.75);
    }

    /* ============ TOAST ============ */
    .toast {
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      max-width: 340px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
      animation: toastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    .toast.success { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
    .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
    .toast.warn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
    .toast.info { background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff; }

    /* ============ DATA CELLS ============ */
    .data-cell {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .admin .data-cell {
      background: rgba(30, 27, 75, 0.4);
      border-color: rgba(139, 92, 246, 0.18);
    }
    .data-cell-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      margin-bottom: 3px;
      font-weight: 500;
    }
    .admin .data-cell-label { color: #94a3b8; }
    .data-cell-value { font-size: 14px; font-weight: 600; color: #1e293b; }
    .admin .data-cell-value { color: #e2e8f0; }

    /* ============ STAT CARD (admin) ============ */
    .stat-card {
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.55);
      position: relative;
      overflow: hidden;
    }
    .admin .stat-card {
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.7) 0%, rgba(49, 46, 129, 0.4) 100%);
      border: 1px solid rgba(139, 92, 246, 0.28);
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, #0ea5e9, #6366f1, #a855f7);
      opacity: 0.8;
    }
    .stat-value {
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #0f172a;
      line-height: 1.1;
    }
    .admin .stat-value { color: #f1f5f9; }
    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .admin .stat-label { color: #94a3b8; }

    /* ============ TABLE ============ */
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th {
      text-align: left;
      padding: 10px 8px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
    }
    .admin .data-table th { color: #94a3b8; border-bottom-color: rgba(139, 92, 246, 0.2); }
    .data-table td {
      padding: 12px 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      vertical-align: top;
    }
    .admin .data-table td { border-bottom-color: rgba(139, 92, 246, 0.12); }
    .data-table tr:last-child td { border-bottom: none; }

    /* ============ SCROLL TABLE (mobile) ============ */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .table-wrap::-webkit-scrollbar { height: 6px; }
    .table-wrap::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.4); border-radius: 3px; }

    /* ============ MAP ============ */
    .map-wrap {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .admin .map-wrap { border-color: rgba(139, 92, 246, 0.22); }

    /* ============ BANNER ============ */
    .banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
    }
    .banner-warn {
      background: rgba(254, 240, 199, 0.7);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #78350f;
    }
    .banner-error {
      background: rgba(254, 226, 226, 0.7);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #7f1d1d;
    }
    .banner-info {
      background: rgba(219, 234, 254, 0.7);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #1e3a8a;
    }
    .admin .banner-warn {
      background: rgba(120, 53, 15, 0.35);
      border-color: rgba(251, 191, 36, 0.3);
      color: #fcd34d;
    }
    .admin .banner-error {
      background: rgba(127, 29, 29, 0.4);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }
    .admin .banner-info {
      background: rgba(30, 58, 138, 0.35);
      border-color: rgba(59, 130, 246, 0.3);
      color: #93c5fd;
    }

    /* ============ LOADER ============ */
    .loader {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(14, 165, 233, 0.2);
      border-top-color: #0ea5e9;
      animation: spin 0.9s linear infinite;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast-root" style="position:fixed;bottom:20px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none"></div>

  <script type="module">
    /* ============================================================
       FIREBASE IMPORTS
    ============================================================ */
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAnalytics } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js';
    import {
      getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect,
      getRedirectResult, GoogleAuthProvider, signOut, setPersistence,
      browserLocalPersistence
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import {
      getFirestore, collection, doc, getDoc, setDoc, addDoc,
      updateDoc, deleteDoc, onSnapshot, query, where, serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    /* ============================================================
       FIREBASE CONFIG
    ============================================================ */
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAa3mJKaSFaRqN0b5YUPtQcM--SsYOzHj8",
      authDomain: "imena-smart-cpd-attendance.firebaseapp.com",
      projectId: "imena-smart-cpd-attendance",
      storageBucket: "imena-smart-cpd-attendance.firebasestorage.app",
      messagingSenderId: "515464832241",
      appId: "1:515464832241:web:9e05a6cc3d4447dfff7550",
      measurementId: "G-NQGDXWN6G8"
    };

    const firebaseApp = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);
    try { getAnalytics(firebaseApp); } catch { /* analytics blocked */ }

    // Persist session across tabs
    setPersistence(auth, browserLocalPersistence).catch(() => {});

    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: 'select_account' });

    // Resolve any pending redirect login
    getRedirectResult(auth).catch(err => {
      if (err?.code !== 'auth/no-auth-event') console.warn('[redirect]', err);
    });

    /* ============================================================
       STATE
    ============================================================ */
    const DEFAULT_LAT = -1.9441;
    const DEFAULT_LNG = 30.0619;

    const state = {
      user: null, profile: null, view: 'login',
      cpds: [], myAttendances: [],
      selectedCpdId: null, selectedCpd: null, cpdAttendances: [],
      subCpds: null, subMine: null, subDetail: null, subDetailAtt: null,
      watchId: null, watchingFor: null, liveMap: null,
      firestoreError: null, loading: true,
    };

    /* ============================================================
       HELPERS
    ============================================================ */
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
    function toDate(ts) {
      if (!ts) return null;
      if (ts.toDate) return ts.toDate();
      if (ts instanceof Date) return ts;
      return new Date(ts);
    }
    function fmtTime(ts) {
      const d = toDate(ts);
      return d ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
    }
    function fmtDateTime(ts) {
      const d = toDate(ts);
      return d ? d.toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
    }
    function formatDist(m) {
      if (m == null || isNaN(m)) return '—';
      return m >= 1000 ? `${(m/1000).toFixed(2)} km` : `${Math.round(m)} m`;
    }
    function distanceMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000, toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function classify(m, r) { return m <= r ? 'near' : 'far'; }

    function getPositionOnce() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('Geolocation is not supported by this browser.'));
        navigator.geolocation.getCurrentPosition(
          pos => resolve({
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
          }),
          err => reject(new Error(
            err.code === 1 ? 'Location permission denied. Please enable location access and try again.' :
            err.code === 2 ? 'Unable to determine your location. Please check your signal.' :
            'Location request timed out. Please try again.'
          )),
          { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
        );
      });
    }

    function toast(message, type = 'info') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = message;
      el.style.pointerEvents = 'auto';
      document.getElementById('toast-root').appendChild(el);
      setTimeout(() => {
        el.style.transition = 'opacity .3s, transform .3s';
        el.style.opacity = '0';
        el.style.transform = 'translateX(40px)';
        setTimeout(() => el.remove(), 320);
      }, 4500);
    }

    function clearWatch() {
      if (state.watchId != null) {
        navigator.geolocation.clearWatch(state.watchId);
        state.watchId = null;
        state.watchingFor = null;
      }
    }
    function clearAllSubs() {
      ['subCpds','subMine','subDetail','subDetailAtt'].forEach(k => {
        if (state[k]) { try { state[k](); } catch {} state[k] = null; }
      });
    }
    function handleFirestoreError(scope, err) {
      console.error(`[firestore/${scope}]`, err);
      const msg = String(err?.code || err?.message || err);
      if (msg.includes('unavailable') || msg.includes('transport') || msg.includes('deadline')) {
        state.firestoreError = 'connection';
      } else if (msg.includes('permission')) {
        state.firestoreError = 'permission';
      } else {
        state.firestoreError = 'unknown';
      }
      if (state.view !== 'login') renderErrorBanner();
    }
    function renderErrorBanner() {
      const el = document.getElementById('firestore-banner');
      if (!el) return;
      const messages = {
        connection: 'Connection to Firestore failed. Please verify that the Firestore database has been created in your Firebase Console, then refresh.',
        permission: 'Firestore rules are blocking access. Please verify that your security rules allow signed-in users.',
        unknown: 'An unexpected Firestore error occurred. Check the browser console for details.'
      };
      el.innerHTML = `
        <div class="banner banner-error">
          <span style="font-size:18px;line-height:1">⚠️</span>
          <div>
            <strong>Database connectivity issue.</strong><br/>
            ${escapeHtml(messages[state.firestoreError] || messages.unknown)}
            <button id="btn-retry" class="btn btn-ghost" style="margin-top:10px;padding:8px 14px;font-size:12px;min-height:auto">Retry</button>
          </div>
        </div>`;
      document.getElementById('btn-retry').onclick = () => {
        state.firestoreError = null;
        clearAllSubs();
        location.reload();
      };
    }

    /* ============================================================
       LIVE GPS WATCH
    ============================================================ */
    function ensureWatchForActive() {
      const active = state.myAttendances.find(a => a.state === 'active');
      if (!active) { clearWatch(); return; }
      if (state.watchingFor === active.id) return;
      clearWatch();
      state.watchingFor = active.id;
      state.watchId = navigator.geolocation.watchPosition(
        pos => {
          updateDoc(doc(db, 'attendance', active.id), {
            liveLat: pos.coords.latitude,
            liveLng: pos.coords.longitude,
            liveAccuracy: pos.coords.accuracy,
            liveUpdatedAt: serverTimestamp(),
          }).catch(err => console.warn('[live ping]', err));
        },
        err => console.warn('[watch]', err),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
      );
    }

    /* ============================================================
       AUTH LIFECYCLE
    ============================================================ */
    onAuthStateChanged(auth, async user => {
      if (user) {
        state.user = user;
        try {
          const ref = doc(db, 'users', user.uid);
          const snap = await getDoc(ref);
          if (snap.exists()) {
            state.profile = snap.data();
          } else {
            const newProfile = {
              email: user.email,
              fullName: user.displayName || user.email,
              role: 'teacher',
              createdAt: serverTimestamp(),
            };
            await setDoc(ref, newProfile);
            state.profile = newProfile;
          }
        } catch (err) {
          console.error('[profile load]', err);
          toast('Could not load your profile. Please check your Firestore setup.', 'error');
          state.loading = false;
          goLogin();
          return;
        }
        state.loading = false;
        if (state.profile.role === 'admin') goAdmin();
        else goTeacher();
      } else {
        clearAllSubs();
        clearWatch();
        Object.assign(state, {
          user: null, profile: null, cpds: [], myAttendances: [],
          cpdAttendances: [], selectedCpd: null, selectedCpdId: null,
          firestoreError: null, loading: false,
        });
        goLogin();
      }
    });

    /* ============================================================
       TEACHER VIEW
    ============================================================ */
    function cpdStatus(cpd) {
      const start = toDate(cpd.startTime)?.getTime();
      const end = toDate(cpd.endTime)?.getTime();
      const now = Date.now();
      if (!start || !end) return 'unknown';
      if (now < start - 15 * 60 * 1000) return 'upcoming';
      if (now > end) return 'ended';
      return 'ongoing';
    }

    function goTeacher() {
      state.view = 'teacher';
      if (!state.subCpds) {
        state.subCpds = onSnapshot(collection(db, 'cpds'),
          snap => {
            state.cpds = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            state.firestoreError = null;
            if (state.view === 'teacher') renderTeacher();
          },
          err => handleFirestoreError('cpds', err)
        );
      }
      if (!state.subMine && state.user) {
        const q = query(collection(db, 'attendance'), where('teacherId', '==', state.user.uid));
        state.subMine = onSnapshot(q,
          snap => {
            state.myAttendances = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            ensureWatchForActive();
            if (state.view === 'teacher') renderTeacher();
          },
          err => handleFirestoreError('mine', err)
        );
      }
      renderTeacher();
    }

    function renderTeacher() {
      const activeAtt = state.myAttendances.find(a => a.state === 'active');
      const ongoing = state.cpds.filter(c => cpdStatus(c) === 'ongoing');
      const upcoming = state.cpds.filter(c => cpdStatus(c) === 'upcoming');
      const ended = state.cpds.filter(c => cpdStatus(c) === 'ended');

      const cards = state.cpds
        .sort((a, b) => (toDate(a.startTime)?.getTime() || 0) - (toDate(b.startTime)?.getTime() || 0))
        .map(cpd => renderTeacherCpdCard(cpd, activeAtt, !!activeAtt))
        .join('');

      const inner = `
        ${headerHtml()}
        <main style="max-width:1200px;margin:0 auto;padding:28px 16px 60px">
          ${state.firestoreError ? `<div id="firestore-banner" style="margin-bottom:20px"></div>` : '<div id="firestore-banner"></div>'}

          <!-- Welcome -->
          <div class="fade-in" style="margin-bottom:28px">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:#0ea5e9;font-weight:700;margin-bottom:6px">Welcome back</div>
            <h1 style="font-size:clamp(22px,4.5vw,30px);font-weight:800;letter-spacing:-0.02em;margin:0 0 6px;line-height:1.2">
              ${escapeHtml((state.profile?.fullName || '').split(' ')[0] || 'Teacher')}
            </h1>
            <p style="font-size:14px;color:#64748b;margin:0">
              ${activeAtt ? `You are currently attending <strong>${escapeHtml(activeAtt.cpdTitle)}</strong>.` : 'View available sessions and record your attendance.'}
            </p>
          </div>

          ${activeAtt ? `
            <div class="banner banner-warn slide-up" style="margin-bottom:20px">
              <span style="font-size:20px;line-height:1">🔴</span>
              <div>
                <strong>Live tracking is active.</strong> Please keep this tab open until the session ends.
                If you lock your phone or switch applications, tracking will pause and the administrator will see your last recorded position.
              </div>
            </div>` : ''}

          <!-- Quick Stats (only when teacher has activity) -->
          ${state.myAttendances.length > 0 ? `
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px">
              <div class="stat-card">
                <div class="stat-label">Sessions attended</div>
                <div class="stat-value">${state.myAttendances.filter(a => a.state === 'ended').length}</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Verified</div>
                <div class="stat-value" style="color:#059669">${state.myAttendances.filter(a => a.verified).length}</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">In progress</div>
                <div class="stat-value" style="color:#0ea5e9">${state.myAttendances.filter(a => a.state === 'active').length}</div>
              </div>
            </div>` : ''}

          <!-- CPDs list -->
          ${state.cpds.length === 0
            ? `<div class="card" style="padding:60px 24px;text-align:center">
                <div style="font-size:48px;margin-bottom:16px">📚</div>
                <div style="font-size:16px;font-weight:600;margin-bottom:6px">No sessions yet</div>
                <div style="font-size:14px;color:#64748b">Your administrator will publish sessions here.</div>
              </div>`
            : `
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
                <h2 style="font-size:15px;font-weight:700;margin:0;letter-spacing:-0.01em">Available Sessions</h2>
                <div style="font-size:12px;color:#64748b">${ongoing.length} ongoing · ${upcoming.length} upcoming</div>
              </div>
              <div style="display:grid;gap:14px">${cards}</div>
            `}
        </main>
      `;
      document.getElementById('app').innerHTML = sceneWrapper(inner, false);
      bindHeader();
      bindTeacherEvents();
      if (state.firestoreError) renderErrorBanner();
    }

    function renderTeacherCpdCard(cpd, activeAtt, hasActiveElsewhere) {
      const myAtt = state.myAttendances.find(a => a.cpdId === cpd.id);
      const status = myAtt?.state === 'active' ? 'live'
        : myAtt?.state === 'ended' ? 'ended'
        : cpdStatus(cpd);

      const badgeMap = {
        upcoming: '<span class="badge badge-upcoming">Upcoming</span>',
        ongoing: '<span class="badge badge-ongoing">● Ongoing</span>',
        ended: '<span class="badge badge-ended">Ended</span>',
        live: '<span class="badge badge-live">● Live</span>',
        unknown: '',
      };
      const badge = badgeMap[status] || '';

      let actionHtml = '';
      if (!myAtt) {
        if (status === 'upcoming') {
          actionHtml = `<button disabled class="btn btn-ghost" style="padding:12px 18px;font-size:13px">Not started</button>`;
        } else if (status === 'ended') {
          actionHtml = `<button disabled class="btn btn-ghost" style="padding:12px 18px;font-size:13px">Ended</button>`;
        } else if (hasActiveElsewhere) {
          actionHtml = `<button disabled class="btn btn-ghost" style="padding:12px 18px;font-size:13px">Finish current</button>`;
        } else {
          actionHtml = `<button data-attend="${cpd.id}" class="btn btn-primary" style="padding:12px 20px;font-size:13px">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Attend
          </button>`;
        }
      } else if (myAtt.state === 'active') {
        actionHtml = `<button data-end="${myAtt.id}" class="btn btn-danger" style="padding:12px 20px;font-size:13px">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg> End Session
        </button>`;
      } else {
        actionHtml = myAtt.verified
          ? `<div style="display:flex;align-items:center;gap:6px;color:#059669;font-size:13px;font-weight:700;padding:10px 14px;background:rgba(16,185,129,.1);border-radius:12px">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg> Verified
            </div>`
          : `<div style="display:flex;align-items:center;gap:6px;color:#d97706;font-size:13px;font-weight:700;padding:10px 14px;background:rgba(245,158,11,.1);border-radius:12px">
              <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 7v5m0 3v.5"/></svg> Flagged
            </div>`;
      }

      let liveRow = '';
      if (myAtt && myAtt.state === 'active' && myAtt.liveLat != null) {
        const dist = distanceMeters(myAtt.liveLat, myAtt.liveLng, cpd.venueLat, cpd.venueLng);
        const near = dist <= cpd.radiusMeters;
        liveRow = `
          <div style="margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:#475569">
            <span class="pulse-dot"></span>
            <span style="font-weight:600">Live tracking</span>
            <span style="opacity:.5">·</span>
            <span>${formatDist(dist)} from venue</span>
            <span style="opacity:.5">·</span>
            <span style="color:${near ? '#059669' : '#d97706'};font-weight:700">${near ? 'At venue' : 'Away from venue'}</span>
          </div>`;
      }

      const detailRow = myAtt ? `
        <div style="margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px">
          <div class="data-cell"><div class="data-cell-label">Attended</div><div class="data-cell-value">${fmtTime(myAtt.attendedAt)}</div></div>
          <div class="data-cell"><div class="data-cell-label">Ended</div><div class="data-cell-value">${fmtTime(myAtt.endedAt)}</div></div>
          <div class="data-cell"><div class="data-cell-label">Start distance</div><div class="data-cell-value">${formatDist(myAtt.attendedDistanceMeters)}</div></div>
          <div class="data-cell"><div class="data-cell-label">End distance</div><div class="data-cell-value">${formatDist(myAtt.endedDistanceMeters)}</div></div>
        </div>` : '';

      return `
        <div class="card hoverable fade-in" style="padding:20px">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap">
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">
                <h3 style="font-size:15px;font-weight:700;margin:0;letter-spacing:-0.01em;line-height:1.3">${escapeHtml(cpd.title)}</h3>
                ${badge}
              </div>
              ${cpd.theme ? `<p style="font-size:13px;color:#64748b;margin:0 0 6px;line-height:1.4">${escapeHtml(cpd.theme)}</p>` : ''}
              <p style="font-size:12px;color:#94a3b8;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span style="display:inline-flex;align-items:center;gap:4px">
                  <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                  ${fmtTime(cpd.startTime)} – ${fmtTime(cpd.endTime)}
                </span>
                <span style="opacity:.5">·</span>
                <span>${escapeHtml(cpd.venueName)}</span>
                <span style="opacity:.5">·</span>
                <span>${cpd.radiusMeters}m radius</span>
              </p>
              ${liveRow}
            </div>
            <div style="flex-shrink:0">${actionHtml}</div>
          </div>
          ${detailRow}
        </div>`;
    }

    function bindTeacherEvents() {
      document.querySelectorAll('[data-attend]').forEach(btn => {
        btn.onclick = () => handleAttend(btn.dataset.attend, btn);
      });
      document.querySelectorAll('[data-end]').forEach(btn => {
        btn.onclick = () => handleEnd(btn.dataset.end, btn);
      });
    }

    async function handleAttend(cpdId, btn) {
      const cpd = state.cpds.find(c => c.id === cpdId);
      if (!cpd) return;
      if (state.myAttendances.some(a => a.state === 'active')) {
        toast('Please end your current session before starting another.', 'warn');
        return;
      }
      btn.disabled = true;
      const originalHtml = btn.innerHTML;
      btn.innerHTML = '<span class="spin" style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%"></span> Locating…';
      try {
        const pos = await getPositionOnce();
        const dist = distanceMeters(pos.lat, pos.lng, cpd.venueLat, cpd.venueLng);
        const status = classify(dist, cpd.radiusMeters);
        await addDoc(collection(db, 'attendance'), {
          cpdId,
          cpdTitle: cpd.title,
          teacherId: state.user.uid,
          teacherName: state.profile?.fullName || state.user.email,
          teacherEmail: state.user.email,
          attendedAt: serverTimestamp(),
          attendedLat: pos.lat,
          attendedLng: pos.lng,
          attendedDistanceMeters: dist,
          attendedStatus: status,
          liveLat: pos.lat,
          liveLng: pos.lng,
          liveAccuracy: pos.accuracy,
          liveUpdatedAt: serverTimestamp(),
          state: 'active',
          verified: false,
        });
        toast(status === 'near'
          ? `Attendance recorded. You are ${formatDist(dist)} from the venue. Please keep this tab open.`
          : `Attendance recorded, but you are ${formatDist(dist)} from the venue.`,
          status === 'near' ? 'success' : 'warn');
      } catch (err) {
        toast(err.message || 'Unable to capture your location.', 'error');
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    }

    async function handleEnd(attId, btn) {
      const att = state.myAttendances.find(a => a.id === attId);
      const cpd = state.cpds.find(c => c.id === att?.cpdId);
      if (!att || !cpd) return;
      btn.disabled = true;
      const originalHtml = btn.innerHTML;
      btn.innerHTML = '<span class="spin" style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%"></span> Finalizing…';
      try {
        const pos = await getPositionOnce();
        const dist = distanceMeters(pos.lat, pos.lng, cpd.venueLat, cpd.venueLng);
        const status = classify(dist, cpd.radiusMeters);
        const verified = att.attendedStatus === 'near' && status === 'near';
        await updateDoc(doc(db, 'attendance', att.id), {
          endedAt: serverTimestamp(),
          endedLat: pos.lat,
          endedLng: pos.lng,
          endedDistanceMeters: dist,
          endedStatus: status,
          state: 'ended',
          verified,
        });
        clearWatch();
        toast(verified
          ? 'Session completed successfully. Your attendance is verified.'
          : `Session completed, but you were ${formatDist(dist)} from the venue. The administrator will review your record.`,
          verified ? 'success' : 'warn');
      } catch (err) {
        toast(err.message || 'Could not complete the session.', 'error');
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    }

    ============================================================ */
    function goAdmin() {
      state.view = 'admin';
      clearWatch();
      if (state.subMine) { try { state.subMine(); } catch {} state.subMine = null; }
      if (state.subDetail) { try { state.subDetail(); } catch {} state.subDetail = null; }
      if (state.subDetailAtt) { try { state.subDetailAtt(); } catch {} state.subDetailAtt = null; }
      if (!state.subCpds) {
        state.subCpds = onSnapshot(collection(db, 'cpds'),
          snap => {
            state.cpds = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            state.firestoreError = null;
            if (state.view === 'admin') renderAdmin();
          },
          err => handleFirestoreError('admin-cpds', err)
        );
      }
      renderAdmin();

              <div class="stat-value" style="color:#c4b5fd">${upcoming}</div>
            </div>

              <div class="stat-label">Completed</div>
              <div class="stat-value" style="color:#94a3b8">${ended}</div>

      const form = document.getElementById('cpd-form');
      const latInput = form.elements.venueLat;
      const lngInput = form.elements.venueLng;
      const radiusInput = form.elements.radiusMeters;

      const map = L.map('venue-map', { zoomControl: true }).setView(
        [parseFloat(latInput.value) || DEFAULT_LAT, parseFloat(lngInput.value) || DEFAULT_LNG], 16
      );
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
      }).addTo(map);

        lngInput.value = lng.toFixed(6);

        circle.setLatLng([lat, lng]);
      });

          latInput.value = pos.lat.toFixed(6);
          lngInput.value = pos.lng.toFixed(6);
          marker.setLatLng([pos.lat, pos.lng]);
          circle.setLatLng([pos.lat, pos.lng]);
          map.setView([pos.lat, pos.lng], 17);

          const data = {
            title: String(fd.get('title')).trim(),
            theme: String(fd.get('theme') || '').trim(),
            description: String(fd.get('description') || '').trim(),
            startTime: new Date(fd.get('startTime')),
            endTime: new Date(fd.get('endTime')),
            venueName: String(fd.get('venueName') || 'Venue').trim(),
            venueLat: Number(fd.get('venueLat')),
            venueLng: Number(fd.get('venueLng')),
            radiusMeters: Number(fd.get('radiusMeters')) || 100,
            createdBy: state.user.uid,
            createdAt: serverTimestamp(),

          if (isNaN(data.venueLat) || isNaN(data.venueLng)) throw new Error('Venue coordinates are invalid.');
          if (data.endTime <= data.startTime) throw new Error('End time must be later than start time.');

          goAdmin();

          errEl.style.display = 'flex';
          btn.disabled = false;
          btn.textContent = 'Create Session';
        }
      };
    }

      state.view = 'cpd-detail';
      state.selectedCpdId = cpdId;
      state.selectedCpd = null;
      state.cpdAttendances = [];

      if (state.subDetail) { try { state.subDetail(); } catch {} }
      if (state.subDetailAtt) { try { state.subDetailAtt(); } catch {} }

      state.subDetail = onSnapshot(doc(db, 'cpds', cpdId),
        snap => {
          state.selectedCpd = snap.exists() ? { id: snap.id, ...snap.data() } : null;
          if (state.view === 'cpd-detail') renderCpdDetail();
        },
        err => handleFirestoreError('detail', err)
      );

      const q = query(collection(db, 'attendance'), where('cpdId', '==', cpdId));
      state.subDetailAtt = onSnapshot(q,
        snap => {
          state.cpdAttendances = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          if (state.view === 'cpd-detail') renderCpdDetail();
        },
        err => handleFirestoreError('detail-att', err)
      );

      renderCpdDetail();
    }

    function updateLiveMap(cpd) {
      const el = document.getElementById('live-map');
      if (!el) return;

      let center = [cpd.venueLat, cpd.venueLng];
      let zoom = 16;
      if (state.liveMap) {
        try {
          center = state.liveMap.getCenter();
          zoom = state.liveMap.getZoom();
          state.liveMap.remove();
        } catch {}
        state.liveMap = null;
      }

      const map = L.map(el).setView(center, zoom);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
      }).addTo(map);

      L.circle([cpd.venueLat, cpd.venueLng], {
        radius: cpd.radiusMeters,
        color: '#a855f7', fillColor: '#a855f7', fillOpacity: 0.08,
        weight: 2, dashArray: '6 4',
      }).addTo(map);

      const venueIcon = L.divIcon({
        className: '',
        html: `<div style="background:linear-gradient(135deg,#0ea5e9,#a855f7);width:32px;height:32px;border-radius:50%;border:3px solid white;box-shadow:0 4px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:white;font-size:15px">🏫</div>`,
        iconSize: [32, 32], iconAnchor: [16, 16],
      });
      L.marker([cpd.venueLat, cpd.venueLng], { icon: venueIcon }).addTo(map)
        .bindPopup(`<b>Venue:</b> ${escapeHtml(cpd.venueName)}`);

      state.cpdAttendances.forEach(a => {
        let lat, lng, label, color, glow;
        if (a.state === 'active' && a.liveLat != null) {
          lat = a.liveLat; lng = a.liveLng;
          label = `<b>${escapeHtml(a.teacherName)}</b><br/><span style="color:#059669">● Live tracking</span>`;
          color = '#10b981'; glow = 'rgba(16,185,129,.5)';
        } else if (a.endedLat != null) {
          lat = a.endedLat; lng = a.endedLng;
          label = `<b>${escapeHtml(a.teacherName)}</b><br/>Ended · ${a.verified ? 'Verified' : 'Flagged'}`;
          color = a.verified ? '#0ea5e9' : '#f59e0b';
          glow = a.verified ? 'rgba(14,165,233,.4)' : 'rgba(245,158,11,.4)';
        } else if (a.attendedLat != null) {
          lat = a.attendedLat; lng = a.attendedLng;
          label = `<b>${escapeHtml(a.teacherName)}</b><br/>Not ended`;
          color = '#ef4444'; glow = 'rgba(239,68,68,.4)';
        } else return;

        const icon = L.divIcon({
          className: '',
          html: `<div style="background:${color};width:20px;height:20px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 4px ${glow}, 0 2px 8px rgba(0,0,0,.4)"></div>`,
          iconSize: [20, 20], iconAnchor: [10, 10],
        });
        L.marker([lat, lng], { icon }).addTo(map).bindPopup(label);
      });

      state.liveMap = map;
    }

    /* ============================================================
       BOOT
    ============================================================ */
    state.loading = false;
    goLogin();
  </script>
</body>
</html>
