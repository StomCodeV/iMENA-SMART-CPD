<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#071B33" />
  <title>iMENA SMART CPD</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/268DpvQt/i-MENA-Smart-CPD-Badge.png" />
  <link rel="apple-touch-icon" href="https://i.postimg.cc/268DpvQt/i-MENA-Smart-CPD-Badge.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    a { color: inherit; }

    /* ============ OCEAN BACKGROUND ============ */
    .landing-canvas-fixed {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
    }
    #ocean-canvas { display: block; }
    #droplet-canvas { display: block; z-index: 2; }

    /* ============ NAVIGATION BAR ============ */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      background: linear-gradient(to bottom, rgba(7,27,51,0.85) 0%, rgba(7,27,51,0) 100%);
      border-bottom: 1px solid transparent;
      transition: all 0.3s ease;
    }
    .nav.scrolled {
      background: rgba(7, 27, 51, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 28px;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .nav-logo {
      width: 38px; height: 38px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-logo img {
      width: 100%; height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 217, 255, 0.4));
    }
    .nav-brand {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #F8FAFC;
      white-space: nowrap;
    }
    .nav-brand span {
      background: linear-gradient(135deg, #00D9FF, #10B981);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 24px;
    }
    .nav-links a {
      padding: 8px 14px;
      border-radius: 8px;
      color: rgba(248, 250, 252, 0.75);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .nav-links a:hover {
      color: #F8FAFC;
      background: rgba(255, 255, 255, 0.08);
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 10px;
      background: #F8FAFC;
      color: #071B33;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 16px rgba(0, 217, 255, 0.25);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      white-space: nowrap;
    }
    .nav-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 217, 255, 0.4);
    }
    .nav-cta.dashboard-mode {
      background: linear-gradient(135deg, #00D9FF, #10B981);
    }
    .nav-cta svg { flex-shrink: 0; }

    /* Mobile Menu Toggle */
    .mobile-menu-btn {
      display: none;
      color: #F8FAFC;
      font-size: 24px;
      padding: 8px;
      cursor: pointer;
      line-height: 1;
    }

    /* Mobile Menu Drawer */
    .mobile-menu {
      position: fixed;
      inset: 0;
      background: rgba(7, 27, 51, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .mobile-menu.open {
      opacity: 1;
      pointer-events: auto;
    }
    .mobile-menu a {
      color: #F8FAFC;
      font-size: 20px;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }
    .mobile-menu a:hover { color: #00D9FF; }
    .mobile-close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      color: #F8FAFC;
      font-size: 28px;
      cursor: pointer;
    }

    /* ============ RESPONSIVE NAVBAR ============ */
    @media (max-width: 900px) {
      .nav { padding: 12px 16px; }
      .nav-links { display: none; }
      .mobile-menu-btn { display: block; }
      .nav-brand { display: none; } /* Hide brand text on very small screens to fit CTA */
      .nav-cta { padding: 8px 14px; font-size: 12px; }
    }
    @media (max-width: 480px) {
      .nav-cta span { display: none; } /* Show only Google icon on very narrow phones */
      .nav-cta { padding: 8px; width: 36px; height: 36px; justify-content: center; border-radius: 50%; }
    }

    /* ============ LANGUAGE SWITCHER ============ */
    .lang-switcher {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .lang-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(7, 27, 51, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #F8FAFC;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-toggle:hover {
      background: rgba(7, 27, 51, 1);
      border-color: rgba(0, 217, 255, 0.4);
    }
    .lang-menu {
      display: none;
      flex-direction: column;
      gap: 4px;
      padding: 6px;
      border-radius: 12px;
      background: rgba(7, 27, 51, 0.95);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      min-width: 160px;
    }
    .lang-menu.open { display: flex; }
    .lang-menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      color: rgba(248, 250, 252, 0.8);
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      transition: all 0.15s ease;
    }
    .lang-menu button:hover {
      background: rgba(0, 217, 255, 0.12);
      color: #F8FAFC;
    }
    .lang-menu button.active {
      background: rgba(0, 217, 255, 0.18);
      color: #00D9FF;
      font-weight: 600;
    }
    .lang-flag { font-size: 16px; line-height: 1; }

    @media (max-width: 640px) {
      .lang-switcher { bottom: 16px; right: 16px; }
      .lang-toggle { padding: 8px 12px; font-size: 11px; }
    }

    /* ============ SCROLLING CONTENT ============ */
    .landing-scroll {
      position: relative;
      z-index: 3;
      pointer-events: none;
    }
    .section {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 24px;
      pointer-events: auto;
    }
    .section-inner {
      max-width: 1100px;
      width: 100%;
      text-align: center;
      color: #F8FAFC;
    }

    /* ============ HERO ============ */
    .hero-logo {
      width: 110px; height: 110px;
      margin: 0 auto 28px;
      filter: drop-shadow(0 12px 40px rgba(0, 217, 255, 0.5));
    }
    .hero-logo img { width: 100%; height: 100%; object-fit: contain; }
    .hero-h1 {
      font-size: clamp(32px, 6vw, 72px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin: 0 0 24px;
      text-shadow: 0 4px 40px rgba(0, 0, 0, 0.5);
      color: #F8FAFC;
    }
    .hero-h1 span.accent {
      background: linear-gradient(135deg, #00D9FF 0%, #10B981 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-sub {
      font-size: clamp(15px, 1.6vw, 20px);
      color: rgba(248, 250, 252, 0.85);
      line-height: 1.6;
      max-width: 680px;
      margin: 0 auto;
      font-weight: 400;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
    }

    /* ============ SECTION HEADINGS ============ */
    .section-h2 {
      font-size: clamp(26px, 4vw, 48px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin: 0 0 18px;
      text-shadow: 0 4px 40px rgba(0, 0, 0, 0.6);
      color: #F8FAFC;
    }
    .section-h2 .accent {
      background: linear-gradient(135deg, #00D9FF 0%, #10B981 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .section-sub {
      font-size: clamp(14px, 1.4vw, 17px);
      color: rgba(248, 250, 252, 0.75);
      line-height: 1.6;
      max-width: 680px;
      margin: 0 auto 40px;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
    }

    /* ============ INNOVATION GRID ============ */
    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .benefit-card {
      padding: 24px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      text-align: left;
      color: #F8FAFC;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }
    .benefit-card:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(0, 217, 255, 0.3);
      transform: translateY(-4px);
    }
    .benefit-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: rgba(0, 217, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: #00D9FF;
    }
    .benefit-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .benefit-text {
      font-size: 13px;
      color: rgba(248, 250, 252, 0.7);
      line-height: 1.6;
    }

    /* ============ FOUNDER ============ */
    .founder-card {
      max-width: 820px;
      margin: 0 auto;
      padding: 36px 32px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      text-align: left;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }
    .founder-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .founder-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00D9FF, #10B981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #071B33;
      flex-shrink: 0;
    }
    .founder-name {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .founder-role {
      font-size: 13px;
      color: #00D9FF;
      font-weight: 600;
    }
    .founder-quote {
      font-size: 15px;
      color: rgba(248, 250, 252, 0.85);
      line-height: 1.7;
      margin: 0 0 16px;
      font-style: italic;
      border-left: 3px solid rgba(0, 217, 255, 0.5);
      padding-left: 20px;
    }
    .founder-body {
      font-size: 14px;
      color: rgba(248, 250, 252, 0.75);
      line-height: 1.7;
    }

    /* ============ DEVELOPERS ============ */
    .dev-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 800px;
      margin: 0 auto;
    }
    .dev-card {
      padding: 32px 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      text-align: center;
      color: #F8FAFC;
      transition: all 0.3s ease;
    }
    .dev-card:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(0, 217, 255, 0.3);
      transform: translateY(-4px);
    }
    .dev-photo {
      width: 110px; height: 110px;
      border-radius: 50%;
      margin: 0 auto 18px;
      overflow: hidden;
      border: 3px solid rgba(0, 217, 255, 0.4);
    }
    .dev-photo img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .dev-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .dev-role {
      font-size: 12px;
      color: #00D9FF;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .dev-bio {
      font-size: 13px;
      color: rgba(248, 250, 252, 0.7);
      line-height: 1.6;
      margin-bottom: 18px;
    }
    .dev-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 10px;
      background: rgba(0, 217, 255, 0.15);
      border: 1px solid rgba(0, 217, 255, 0.3);
      color: #00D9FF;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }
    .dev-link:hover { background: rgba(0, 217, 255, 0.25); }

    /* ============ CONTACT ============ */
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    .contact-card {
      padding: 24px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
    }
    .contact-card:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(0, 217, 255, 0.3);
      transform: translateY(-4px);
    }
    .contact-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(0, 217, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00D9FF;
    }
    .contact-text {
      font-size: 14px;
      font-weight: 500;
      color: #F8FAFC;
    }

    /* ============ PROFESSIONAL FOOTER ============ */
    .footer {
      position: relative;
      z-index: 4;
      padding: 60px 24px 30px;
      background: rgba(7, 27, 51, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: #F8FAFC;
    }
    .footer-top {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 40px;
    }
    .footer-brand-col {
      max-width: 320px;
    }
    .footer-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .footer-logo img {
      width: 40px; height: 40px;
      object-fit: contain;
    }
    .footer-logo-text {
      font-size: 20px;
      font-weight: 800;
    }
    .footer-logo-text span {
      background: linear-gradient(135deg, #00D9FF, #10B981);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .footer-desc {
      font-size: 14px;
      color: rgba(248, 250, 252, 0.6);
      line-height: 1.6;
    }
    .footer-heading {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(248, 250, 252, 0.4);
      margin-bottom: 20px;
    }
    .footer-links-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .footer-links-list a {
      font-size: 14px;
      color: rgba(248, 250, 252, 0.75);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links-list a:hover {
      color: #00D9FF;
    }
    .footer-contact-item {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
    }
    .footer-contact-label {
      font-size: 11px;
      text-transform: uppercase;
      color: rgba(248, 250, 252, 0.4);
      margin-bottom: 4px;
      letter-spacing: 0.05em;
    }
    .footer-contact-value {
      font-size: 14px;
      color: #F8FAFC;
    }
    .footer-bottom {
      max-width: 1200px;
      margin: 60px auto 0;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    .footer-copy {
      font-size: 13px;
      color: rgba(248, 250, 252, 0.5);
    }
    .footer-lab {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #F8FAFC;
      text-decoration: none;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .footer-lab:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(0, 217, 255, 0.3);
    }
    .footer-lab img {
      width: 20px; height: 20px;
    }

    /* ============ SCROLL HINT & TOAST ============ */
    .scroll-hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(248, 250, 252, 0.6);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: floatDown 2s ease-in-out infinite;
    }
    @keyframes floatDown {
      0%, 100% { transform: translate(-50%, 0); opacity: 0.6; }
      50% { transform: translate(-50%, 8px); opacity: 1; }
    }
    .toast {
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      max-width: 340px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
      animation: toastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    .toast.success { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
    .toast.error   { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
    .spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ RESPONSIVE FOOTER ============ */
    @media (max-width: 900px) {
      .footer-top {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (max-width: 640px) {
      .section { padding: 80px 16px; }
      .founder-card { padding: 28px 20px; }
      .footer-top {
        grid-template-columns: 1fr;
        gap: 32px;
      }
      .footer-bottom {
        flex-direction: column;
        text-align: center;
        justify-content: center;
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <canvas id="ocean-canvas" class="landing-canvas-fixed"></canvas>
  <canvas id="droplet-canvas" class="landing-canvas-fixed" style="pointer-events:none"></canvas>

  <div id="app"></div>
  <div id="toast-root" style="position:fixed;bottom:20px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none"></div>

  <script type="module">

      _buildWaveGLSL() {
        return this.waveTable.map(w => {
          const k  = (2 * Math.PI / w.len).toFixed(6);
          const c  = Math.sqrt(9.81 / (2 * Math.PI / w.len)).toFixed(4);
          const dx = w.dir[0].toFixed(3);
          const dz = w.dir[1].toFixed(3);
          const a  = w.amp.toFixed(3);
          const st = w.steep.toFixed(3);
          const spd = w.spd.toFixed(3);
          return `
          {
            float k = ${k};
            float cw = ${c};
            vec2 d = normalize(vec2(${dx}, ${dz}));
            float f = k * (dot(d, p.xz) - cw * ${spd} * uTime);
            float cf = cos(f);
            float sf = sin(f);
            float A = ${a};
            float st = ${st};
            float Q = st / (k * max(A, 1e-3) * float(${this.waveTable.length}));
            p.x += d.x * Q * A * cf;
            p.z += d.y * Q * A * cf;
            p.y += A * sf;
            grad.x += A * k * d.x * cf;
            grad.z += A * k * d.y * cf;
            steepAcc += abs(A * k * cf);
          }`;
        }).join('\n');
      },

      _skyGLSL() {
        return `
          float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
          float vnoise(vec2 p){
            vec2 i = floor(p), f = fract(p);
            f = f*f*(3.0-2.0*f);
            float a = hash21(i), b = hash21(i + vec2(1.0, 0.0));
            float c = hash21(i + vec2(0.0, 1.0)), d = hash21(i + vec2(1.0, 1.0));
            return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
          }
          float fbm3(vec2 p){
            float s = 0.0, a = 0.5;
            for (int i = 0; i < 4; i++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; }
            return s;
          }
          vec3 skyColor(vec3 dir){
            float y = max(dir.y, 0.0);
            vec3 zenith  = vec3(0.030, 0.115, 0.335);
            vec3 mid     = vec3(0.180, 0.380, 0.640);
            vec3 horizon = vec3(0.680, 0.780, 0.870);
            vec3 sky = mix(horizon, mid, smoothstep(0.0, 0.35, y));
            sky = mix(sky, zenith, smoothstep(0.30, 0.85, y));
            float sunDot = dot(dir, uSunDirection);
            float disc = smoothstep(0.99965, 0.99990, sunDot);
            float glow = pow(max(sunDot, 0.0), 60.0) * 0.35;
            float aureole = pow(max(sunDot, 0.0), 6.0) * 0.06;
            sky += uSunColor * (disc * 12.0 + glow + aureole);
            if (dir.y > 0.015) {
              float t = 1.0 / (dir.y + 0.05);
              vec2 cp = dir.xz * t * 0.16 + vec2(uTime * 0.0022, uTime * 0.0014);
              float base = fbm3(cp * 1.4);
              float detail = fbm3(cp * 4.2 + 7.0);
              float density = smoothstep(0.50, 0.80, base * 0.72 + detail * 0.28);
              float shSample = fbm3(cp + uSunDirection.xz * 0.10);
              float shadow = smoothstep(0.55, 0.85, shSample);
              float lit = clamp(1.0 - shadow * 0.7, 0.0, 1.0);
              lit = mix(lit, 1.0, smoothstep(0.0, 0.4, sunDot) * 0.35);
              vec3 cloudCol = mix(vec3(0.42, 0.47, 0.55), vec3(1.02, 0.99, 0.94), lit);
              cloudCol += uSunColor * pow(max(sunDot, 0.0), 12.0) * 0.12;
              float haze = smoothstep(0.015, 0.14, dir.y);
              sky = mix(sky, cloudCol, density * haze * 0.9);
            }
            float hz = exp(-y * 22.0) * 0.55;
            sky = mix(sky, vec3(0.72, 0.80, 0.88), hz);
            return sky;
          }
        `;
      },

              vec4 wp = modelMatrix * vec4(position, 1.0);
              vWorldPosition = wp.xyz;
              gl_Position = projectionMatrix * viewMatrix * wp;
            }
          `,
          fragmentShader: `
            precision highp float;
            uniform vec3  uSunDirection;
            uniform vec3  uSunColor;
            uniform float uTime;
            varying vec3 vWorldPosition;
            ${this._skyGLSL()}
            void main() {
              vec3 dir = normalize(vWorldPosition);
              gl_FragColor = vec4(skyColor(dir), 1.0);
            }
          `,
        });
        const sky = new THREE.Mesh(geo, mat);
        sky.userData.uniforms = skyUniforms;
        return sky;
      },

      createOcean(sunDir) {
        const segs = this.isMobile ? 128 : 448;
        const size = 1200;
        const geo = new THREE.PlaneGeometry(size, size, segs, segs);
        geo.rotateX(-Math.PI / 2);
        const waveBody = this._buildWaveGLSL();
        const oceanUniforms = {
          uTime:         { value: 0 },
          uSunDirection: { value: sunDir.clone() },
          uSunColor:     { value: this.sunColor.clone() },
          uCameraPos:    { value: new THREE.Vector3() },
        };
        const mat = new THREE.ShaderMaterial({
          uniforms: oceanUniforms,
          side: THREE.DoubleSide,
          vertexShader: `
            precision highp float;
            uniform float uTime;
            varying vec3 vWorldPosition;
            varying vec3 vNormal;
            varying float vHeight;
            varying float vSteep;
            const float PI = 3.141592653589793;
            void main() {
              vec3 p = position; p.y = 0.0;
              vec3 grad = vec3(0.0);
              float steepAcc = 0.0;
              ${waveBody}
              vec3 n = normalize(vec3(-grad.x, 1.0, -grad.z));
              vHeight = p.y;
              vNormal = n;
              vSteep  = steepAcc;
              vec4 wp = modelMatrix * vec4(p, 1.0);
              vWorldPosition = wp.xyz;
              gl_Position = projectionMatrix * viewMatrix * wp;
            }
          `,
          fragmentShader: `
            precision highp float;
            uniform float uTime;
            uniform vec3  uSunDirection;
            uniform vec3  uSunColor;
            uniform vec3  uCameraPos;
            varying vec3 vWorldPosition;
            varying vec3 vNormal;
            varying float vHeight;
            varying float vSteep;
            ${this._skyGLSL()}
            void main() {
              vec3 N = normalize(vNormal);
              vec3 V = normalize(uCameraPos - vWorldPosition);
              vec3 L = normalize(uSunDirection);
              vec2 q = vWorldPosition.xz;
              float t = uTime;
              N.x += cos(q.x * 2.6 + q.y * 1.9 + t * 2.1) * 0.045 + cos(q.x * 6.3 - q.y * 5.1 + t * 3.4) * 0.018;
              N.z += cos(q.x * 1.8 - q.y * 2.7 + t * 1.7) * 0.045 + cos(q.x * 5.2 + q.y * 6.2 + t * 3.0) * 0.018;
              N = normalize(N);
              float NdotV = max(dot(N, V), 0.0);
              float F = 0.02 + 0.98 * pow(1.0 - NdotV, 5.0);
              vec3 deepC   = vec3(0.008, 0.035, 0.095);
              vec3 midC    = vec3(0.020, 0.095, 0.200);
              vec3 crestC  = vec3(0.050, 0.250, 0.320);
              float depthF = smoothstep(-1.2, 1.2, vHeight);
              vec3 water = mix(deepC, midC, depthF);
              float crestF = smoothstep(0.30, 1.10, vHeight) * smoothstep(0.40, 0.90, vSteep);
              water = mix(water, crestC, crestF * 0.55);
              vec3 R = reflect(-V, N);
              R.y = max(R.y, 0.0);
              vec3 refl = skyColor(normalize(R));
              vec3 H = normalize(L + V);
              float NdotL = max(dot(N, L), 0.0);
              float NdotH = max(dot(N, H), 0.0);
              float m = mix(0.05, 0.28, clamp(vSteep * 0.35, 0.0, 1.0));
              float c2 = max(NdotH * NdotH, 1e-4);
              float D  = exp(-(1.0 - c2) / (c2 * m * m)) / (3.14159 * m * m * c2 * c2 + 1e-5);
              float spec = D * NdotL * F * 8.0;
              float sss = pow(max(dot(-V, L) * 0.5 + 0.5, 0.0), 3.0);
              sss *= smoothstep(0.20, 1.10, vHeight) * (1.0 - F);
              vec3 sssCol = vec3(0.08, 0.28, 0.24) * sss * 0.7;
              vec3 color = mix(water, refl, F);
              color += uSunColor * spec;
              color += sssCol;
              float foamMask = smoothstep(0.95, 1.45, vHeight) * smoothstep(0.55, 0.95, vSteep);
              float foamNoise = fbm3(q * 1.4 + vec2(t * 0.20, t * 0.10));
              foamMask *= smoothstep(0.55, 0.85, foamNoise);
              color = mix(color, vec3(0.93, 0.96, 0.98), clamp(foamMask * 0.85, 0.0, 1.0));
              float dist = length(uCameraPos - vWorldPosition);
              float fog = 1.0 - exp(-dist * 0.00085);
              color = mix(color, vec3(0.68, 0.78, 0.86), clamp(fog * 0.7, 0.0, 1.0));
              gl_FragColor = vec4(color, 1.0);
            }
          `,
        });
        const ocean = new THREE.Mesh(geo, mat);
        ocean.frustumCulled = false;
        ocean.userData.uniforms = oceanUniforms;
        return ocean;
      },

      getCameraAtProgress(p) {
        const keyframes = [
          { p: 0.00, pos: { x:  0, y: 14, z:  20 }, target: { x:  0, y:  7, z: -100 } },
          { p: 0.25, pos: { x:  2, y:  9, z:  -5 }, target: { x:  1, y:  4, z: -130 } },
          { p: 0.50, pos: { x: -3, y:  4, z: -40 }, target: { x: -1, y:  2, z: -170 } },
          { p: 0.75, pos: { x:  4, y:  7, z: -75 }, target: { x:  2, y:  3, z: -210 } },
          { p: 1.00, pos: { x:  0, y: 24, z:-110 }, target: { x:  0, y:  6, z: -260 } },
        ];
        let i = 0;
        while (i < keyframes.length - 1 && keyframes[i + 1].p < p) i++;
        const a = keyframes[i], b = keyframes[Math.min(i + 1, keyframes.length - 1)];
        const t = b.p === a.p ? 0 : (p - a.p) / (b.p - a.p);
        const e = t * t * (3 - 2 * t);
        const L = (av, bv) => av + (bv - av) * e;
        return {
          pos:    { x: L(a.pos.x, b.pos.x),    y: L(a.pos.y, b.pos.y),    z: L(a.pos.z, b.pos.z) },
          target: { x: L(a.target.x, b.target.x), y: L(a.target.y, b.target.y), z: L(a.target.z, b.target.z) },
        };
      },

      onScroll() {
        const sy = window.scrollY;
        const d = Math.abs(sy - this.lastScrollY);
        this.scrollVelocity = d;
        this.lastScrollY = sy;
        const max = document.documentElement.scrollHeight - window.innerHeight;
        this.targetProgress = max > 0 ? Math.min(1, Math.max(0, sy / max)) : 0;
      },

      updateCamera(dt) {
        this.currentProgress += (this.targetProgress - this.currentProgress) * Math.min(1, dt * 3.5);
        const cam = this.getCameraAtProgress(this.currentProgress);
        const k = Math.min(1, dt * 5.5);
        this.camera.position.x += (cam.pos.x - this.camera.position.x) * k;
        this.camera.position.y += (cam.pos.y - this.camera.position.y) * k;
        this.camera.position.z += (cam.pos.z - this.camera.position.z) * k;
        this.cameraTarget.x += (cam.target.x - this.cameraTarget.x) * k;
        this.cameraTarget.y += (cam.target.y - this.cameraTarget.y) * k;
        this.cameraTarget.z += (cam.target.z - this.cameraTarget.z) * k;
        this.camera.lookAt(this.cameraTarget);
      },

      spawnDroplet() {
        const w = window.innerWidth;
        const s = 3 + Math.random() * 12;
        this.droplets.push({
          x: Math.random() * w, y: -s,
          vx: (Math.random() - 0.5) * 0.3, vy: 0.5 + Math.random() * 2.5,
          size: s, life: 1,
          wobble: Math.random() * Math.PI * 2,
          wobbleSpeed: 0.02 + Math.random() * 0.05,
        });
      },

      updateDroplets(dt) {
        const ctx = this.dropletCtx; if (!ctx) return;
        const dpr = window.devicePixelRatio || 1;
        const w = this.dropletCanvas.width / dpr;
        const h = this.dropletCanvas.height / dpr;
        ctx.clearRect(0, 0, w, h);
        const inWater = this.currentProgress > 0.30 && this.currentProgress < 0.72;
        const fast = this.scrollVelocity > 25;
        if (!this.reducedMotion && (inWater || fast)) {
          const chance = this.isMobile ? 0.025 : 0.05;
          const boost = fast ? 0.14 : 0;
          if (Math.random() < chance + boost) this.spawnDroplet();
        }
        for (let i = this.droplets.length - 1; i >= 0; i--) {
          const d = this.droplets[i];
          d.wobble += d.wobbleSpeed;
          d.x += d.vx + Math.sin(d.wobble) * 0.4;
          d.y += d.vy; d.vy += 0.08;
          if (d.y > h + d.size) d.life -= 0.15; else d.life = Math.min(1, d.life + 0.05);
          if (d.life <= 0) { this.droplets.splice(i, 1); continue; }
          const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.size);
          g.addColorStop(0,    `rgba(180,220,255,${0.08 * d.life})`);
          g.addColorStop(0.55, `rgba(120,180,230,${0.15 * d.life})`);
          g.addColorStop(0.90, `rgba(60,120,180,${0.25 * d.life})`);
          g.addColorStop(1,    `rgba(60,120,180,0)`);
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2); ctx.fill();
          const hl = ctx.createRadialGradient(d.x - d.size * .3, d.y - d.size * .35, 0, d.x - d.size * .3, d.y - d.size * .35, d.size * .35);
          hl.addColorStop(0, `rgba(255,255,255,${0.7 * d.life})`);
          hl.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = hl; ctx.beginPath(); ctx.arc(d.x - d.size * .3, d.y - d.size * .35, d.size * .35, 0, Math.PI * 2); ctx.fill();
        }
      },

      animate() {
        if (!this.isActive) return;
        this.animationId = requestAnimationFrame(() => this.animate());
        if (document.hidden) return;
        const dt = Math.min(this.clock.getDelta(), 0.1);
        this.oceanTime += dt;
        if (this.sky?.userData.uniforms)  this.sky.userData.uniforms.uTime.value = this.oceanTime;
        if (this.ocean?.userData.uniforms) {
          this.ocean.userData.uniforms.uTime.value = this.oceanTime;
          this.ocean.userData.uniforms.uCameraPos.value.copy(this.camera.position);
        }
        this.updateCamera(dt);
        this.updateDroplets(dt);
        this.renderer.render(this.scene, this.camera);
        this.scrollVelocity *= 0.92;
      },

      handleResize() {
        if (!this.renderer) return;
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, this.isMobile ? 1.5 : 2));
        this.resize();
      },

      resize() {
        if (!this.dropletCanvas) return;
        const dpr = window.devicePixelRatio || 1;
        this.dropletCanvas.width = window.innerWidth * dpr;
        this.dropletCanvas.height = window.innerHeight * dpr;
        this.dropletCanvas.style.width = window.innerWidth + 'px';
        this.dropletCanvas.style.height = window.innerHeight + 'px';
        this.dropletCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      },

      dispose() {
        this.isActive = false;
        if (this.animationId) cancelAnimationFrame(this.animationId);
        if (this.boundScrollHandler) window.removeEventListener('scroll', this.boundScrollHandler);
        window.removeEventListener('resize', this.handleResize);
        if (this.ocean) { this.ocean.geometry.dispose(); this.ocean.material.dispose(); }
        if (this.sky)   { this.sky.geometry.dispose();   this.sky.material.dispose();   }
        if (this.renderer) {
          this.renderer.dispose();
          const c = this.renderer.domElement;
          if (c && c.parentNode) c.parentNode.removeChild(c);
        }
        this.droplets = [];
        this.renderer = null; this.scene = null; this.camera = null;
        this.ocean = null; this.sky = null;
        this.dropletCanvas = null; this.dropletCtx = null;
      },
    };

        </div>

        <!-- FOOTER -->
        <footer class="footer">
          <div class="footer-top">
            <!-- Col 1: Brand -->
            <div class="footer-brand-col">
              <div class="footer-logo">

      // CTA handlers
      document.querySelectorAll('[data-cta]').forEach(btn => {
        btn.onclick = signedIn
          ? () => { window.location.href = DASHBOARD_URL; }
          : () => handleGoogleSignIn(btn);
      });

      // Mobile Menu
      const mobileMenu = document.getElementById('mobile-menu');
      document.getElementById('mobile-menu-btn').onclick = () => mobileMenu.classList.add('open');
      document.getElementById('mobile-close').onclick = () => mobileMenu.classList.remove('open');
      mobileMenu.querySelectorAll('a').forEach(a => {
        a.onclick = () => mobileMenu.classList.remove('open');
      });

      // Language Switcher
      const langToggle = document.getElementById('lang-toggle');
      const langMenu = document.getElementById('lang-menu');
      langToggle.onclick = (e) => {
        e.stopPropagation();
        langMenu.classList.toggle('open');
      };
      document.querySelectorAll('[data-lang]').forEach(btn => {
        btn.onclick = () => {
          const lang = btn.dataset.lang;
          if (lang === state.lang) return;
          state.lang = lang;
          langMenu.classList.remove('open');
          updateLanguage(lang); // Just swap text, DO NOT re-render ocean
        };
      });
      document.addEventListener('click', () => langMenu.classList.remove('open'));

      // Nav scroll effect
      window.addEventListener('scroll', () => {
        const nav = document.getElementById('nav');
        if (nav) nav.classList.toggle('scrolled', window.scrollY > 40);
      }, { passive: true });

      // Initialize ocean if not already running
      if (!oceanScene.isActive) {
        initOcean();
      }
    }

    function initOcean() {
      requestAnimationFrame(() => {
        try {
          const root = document.querySelector('.landing-scroll');
          if (root) oceanScene.init(root.parentElement || document.body);
        } catch (e) {
          console.warn('[ocean init failed]', e);
        }
      });
    }

    /* ============================================================
       UPDATE LANGUAGE DYNAMICALLY (NO RE-RENDER)
    ============================================================ */
    function updateLanguage(lang) {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (I18N[lang][key]) {
          // If the element is a container for an SVG, find the text span
          const span = el.querySelector('span:not(.lang-flag)');
          if (span && el.tagName === 'BUTTON') {
            span.innerText = I18N[lang][key];
          } else {
            el.innerText = I18N[lang][key];
          }
        }
      });

      // Update language toggle text
      const currentLangText = document.getElementById('lang-current');
      if (currentLangText) {
        currentLangText.innerText = lang === 'rw' ? 'Kinyarwanda' : lang === 'fr' ? 'Français' : 'English';
      }

      // Update active state in menu
      document.querySelectorAll('[data-lang]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
    }

    function signinButtonContent() {
      return `
        <svg width="16" height="16" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.4-11.2-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.2 5.2c-.4.4 6.7-4.9 6.7-14.9 0-1.2-.1-2.4-.4-3.5z"/>
        </svg>
        <span data-i18n="signin">${t('signin')}</span>`;
    }

    function dashboardButtonContent() {
      return `
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-5a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 001 1h3a1 1 0 001-1V10"/>
        </svg>
        <span data-i18n="dashboard">${t('dashboard')}</span>`;
    }

    /* ============================================================
       AUTH: sign in → ensure profile → redirect
    ============================================================ */
    async function handleGoogleSignIn(btn) {
      btn.disabled = true;
      const original = btn.innerHTML;
      btn.innerHTML = '<span class="spin" style="display:inline-block;width:14px;height:14px;border:2px solid rgba(7,27,51,.25);border-top-color:#071B33;border-radius:50%"></span>';
      try {
        const result = await signInWithPopup(auth, googleProvider);
        if (result?.user) {
          await ensureProfile(result.user);
          btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:6px">✓</span>';
          window.location.href = DASHBOARD_URL;
          return;
        }
      } catch (err) {
        if (['auth/popup-blocked','auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(err.code)) {
          try {
            await signInWithRedirect(auth, googleProvider);
            return;
          } catch (e2) {
            toast('Sign-in failed: ' + e2.message, 'error');
          }
        } else if (err.code !== 'auth/popup-closed-by-user') {
          toast('Sign-in failed: ' + err.message, 'error');
        }
      }
      btn.disabled = false;
      btn.innerHTML = original;
    }

    async function ensureProfile(user) {
      const ref = doc(db, 'users', user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          email: user.email,
          fullName: user.displayName || user.email,
          role: 'teacher',
          createdAt: serverTimestamp(),
        });
      }
    }

    function toast(message, type = 'info') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = message;
      el.style.pointerEvents = 'auto';
      document.getElementById('toast-root').appendChild(el);
      setTimeout(() => {
        el.style.transition = 'opacity .3s, transform .3s';
        el.style.opacity = '0';
        el.style.transform = 'translateX(40px)';
        setTimeout(() => el.remove(), 320);
      }, 4500);
    }

    /* ============================================================
       AUTH LIFECYCLE
    ============================================================ */
    onAuthStateChanged(auth, user => {
      const wasSignedIn = !!state.user;
      state.user = user || null;
      state.loading = false;

      // If auth state changes while on landing, update the CTA buttons
      if (state.view === 'landing' && wasSignedIn !== !!state.user) {
        document.querySelectorAll('[data-cta]').forEach(btn => {
          btn.innerHTML = state.user ? dashboardButtonContent() : signinButtonContent();
          btn.classList.toggle('dashboard-mode', !!state.user);
          btn.onclick = state.user
            ? () => { window.location.href = DASHBOARD_URL; }
            : () => handleGoogleSignIn(btn);
        });
      }
    });

    /* ============================================================
       BOOT
    ============================================================ */
    function boot() {
      document.getElementById('app').innerHTML = `
        <div style="position:fixed;inset:0;background:linear-gradient(135deg,#071B33 0%,#0a2540 50%,#075985 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;color:#F8FAFC;font-family:Inter,sans-serif;z-index:9999">
          <img src="https://i.postimg.cc/QMd5HYhd/i-MENA-Smart-CPD-Attendance-Logo.png" alt="iMENA" style="width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 12px 40px rgba(0,217,255,.5))" />
          <div style="font-size:12px;opacity:.6;letter-spacing:.15em;text-transform:uppercase;">OPENING iMENA SMART CPD...</div>
          <div style="width:40px;height:40px;border-radius:50%;border:3px solid rgba(0,217,255,0.15);border-top-color:#00D9FF;animation:spin .9s linear infinite"></div>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>`;
    }

    boot();
    setTimeout(() => {
      if (state.view === 'boot') {
        state.loading = false;
        renderLanding();
      }
    }, 700);
  </script>
