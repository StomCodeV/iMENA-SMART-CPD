<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070b13" />
  <title>iMENA Smart Attendance — Teacher</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/zBDCZhCb/i-MENA-Smart-CPD-Badge.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
  <style>
    /* ── CSS base ── */
    :root{--bg:#070b13;--ink:#edf6ff;--muted:#8b9caf;--line:rgba(185,220,255,.15);--cyan:#68e4e0;--lime:#d4ff69;--orange:#ff9d68;--purple:#a88cff;--ease:cubic-bezier(.2,.8,.2,1)}
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; background: var(--bg); }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; line-height: 1.5; background: var(--bg); }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }

    /* ── Background Engine CSS ── */
    .noise,.aurora,.stars{position:fixed;inset:0;pointer-events:none}
    .noise{z-index:4;opacity:.06;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");mix-blend-mode:screen}
    .aurora{z-index:0;background:radial-gradient(ellipse at 15% 10%,rgba(104,228,224,.16),transparent 38%),radial-gradient(ellipse at 85% 52%,rgba(168,140,255,.15),transparent 42%),radial-gradient(ellipse at 45% 100%,rgba(212,255,105,.1),transparent 40%);filter:blur(32px);animation:aurora 18s ease-in-out infinite alternate}
    .stars{z-index:0;background-image:radial-gradient(rgba(255,255,255,.7) 1px,transparent 1px),radial-gradient(rgba(104,228,224,.5) 1px,transparent 1px);background-size:77px 77px,137px 137px;background-position:10px 20px,40px 80px;opacity:.25;animation:drift 40s linear infinite}
    #space{position:fixed;z-index:1;inset:0;width:100%;height:100%;pointer-events:none}
    @keyframes aurora{to{transform:scale(1.15) rotate(4deg)}}
    @keyframes drift{to{background-position:100px 120px,0 0}}

    #app { position: relative; z-index: 5; min-height: 100vh; display: flex; flex-direction: column; }

    /* Header */
    .header { position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; gap: 8px; background: rgba(7,11,19,0.72); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-bottom: 1px solid var(--line); padding-top: max(10px, env(safe-area-inset-top)); }
    .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .header-logo { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 0 8px rgba(104,228,224,.4)); }
    .header-title { font-size: 14px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .header-title span { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; color: var(--cyan); }
    .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .avatar-btn { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; border: 2px solid var(--purple); padding: 0; background: #fff; flex-shrink: 0; }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Profile modal */
    .profile-modal { position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .profile-modal.open { opacity: 1; pointer-events: auto; }
    .profile-card { background: #0f172a; color: #fff; border-radius: 24px; padding: 24px; width: 100%; max-width: 340px; text-align: center; transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); border: 1px solid var(--line); }
    .profile-modal.open .profile-card { transform: translateY(0); }
    .profile-img { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 16px; border: 3px solid var(--purple); object-fit: cover; }
    .profile-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .profile-email { font-size: 13px; color: var(--muted); margin-bottom: 12px; word-break: break-all; }
    .profile-role { display: inline-block; padding: 6px 12px; border-radius: 99px; background: rgba(168,140,255,0.15); color: var(--purple); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 20px; }
    .profile-actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-home, .btn-logout, .btn-face { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; }
    .btn-home { background: rgba(255,255,255,0.05); color: #fff; }
    .btn-logout { background: rgba(239,68,68,0.15); color: #f87171; }
    .btn-face { background: rgba(104,228,224,0.15); color: var(--cyan); border: 1px solid rgba(104,228,224,0.3); }

    /* Buttons */
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px 20px; border-radius: 14px; font-size: 15px; font-weight: 800; transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s; min-height: 48px; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--lime); color: #111a13; box-shadow: 0 6px 24px rgba(212,255,105,0.3); }
    .btn-danger { background: linear-gradient(135deg,#ef4444,#dc2626); color: #fff; box-shadow: 0 6px 20px rgba(239,68,68,0.35); }
    .btn-ghost { background: rgba(255,255,255,0.06); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1); }
    .btn-present { background: linear-gradient(135deg,#10b981,#06b6d4); color: #fff; box-shadow: 0 6px 20px rgba(16,185,129,0.35); font-size: 17px; padding: 20px; }
    .btn-departure { background: linear-gradient(135deg,#f59e0b,#ef4444); color: #fff; box-shadow: 0 6px 20px rgba(245,158,11,0.35); font-size: 17px; padding: 20px; }

    /* Main + tab bar */
    .main { flex: 1; padding: 18px 14px calc(80px + env(safe-area-inset-bottom)); max-width: 800px; margin: 0 auto; width: 100%; }
    .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; z-index: 90; background: rgba(7,11,19,0.85); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    .tab-btn { flex: 1; padding: 10px 2px; color: var(--muted); font-size: 9.5px; font-weight: 700; text-align: center; transition: color 0.2s; text-transform: uppercase; letter-spacing: 0.03em; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
    .tab-btn.active { color: #fff; }
    .tab-btn.active svg { filter: drop-shadow(0 0 8px rgba(104,228,224,0.6)); stroke: var(--cyan); }

    /* Cards & Hero */
    .t-hero { border-radius: 24px; padding: 24px 20px; margin-bottom: 20px; position: relative; overflow: hidden; background: rgba(15,23,42,0.6); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid var(--line); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    .t-hero::before { content: ''; position: absolute; inset: 0; padding: 1px; background: linear-gradient(135deg,var(--cyan),var(--purple),var(--lime)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; border-radius: 24px; pointer-events: none; opacity: 0.5; }
    .t-hero-active::before { background: linear-gradient(135deg,#10b981,#06b6d4); opacity: 1; }
    .t-hero h1 { font-size: 22px; font-weight: 900; margin: 0 0 8px; line-height: 1.2; color: #fff; }
    .t-hero p { font-size: 14px; color: var(--muted); margin: 0 0 16px; line-height: 1.5; }
    .t-hero .status-pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10b981; margin-right: 6px; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16,185,129,0.5); } 50% { opacity: 0.6; box-shadow: 0 0 0 8px rgba(16,185,129,0); } }

    .t-session-card { border-radius: 20px; padding: 18px; margin-bottom: 12px; background: rgba(15,23,42,0.6); backdrop-filter: blur(20px); border: 1px solid var(--line); position: relative; overflow: hidden; transition: transform 0.15s; }
    .t-session-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg,var(--cyan),var(--purple)); border-radius: 3px 0 0 3px; }
    .t-session-card.live::before { background: linear-gradient(180deg,#10b981,#06b6d4); }
    .t-session-card.ended::before { background: rgba(148,163,184,0.3); }
    .t-session-card h3 { font-size: 17px; font-weight: 800; color: #fff; margin: 0 0 8px; line-height: 1.3; }
    .t-session-meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
    .badge-live { background: rgba(16,185,129,0.18); color: #34d399; border: 1px solid rgba(16,185,129,0.35); }
    .badge-upcoming { background: rgba(148,163,184,0.15); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.2); }
    .badge-ended { background: rgba(148,163,184,0.1); color: #94a3b8; border: 1px solid rgba(148,163,184,0.15); }
    .badge-verified { background: rgba(14,165,233,0.18); color: #38bdf8; border: 1px solid rgba(14,165,233,0.35); }
    .badge-flagged { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .badge-absent { background: rgba(239,68,68,0.18); color: #f87171; border: 1px solid rgba(239,68,68,0.35); }
    .badge-late { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .badge-out { background: rgba(56,189,248,0.18); color: #38bdf8; border: 1px solid rgba(56,189,248,0.35); }
    .badge-type { background: rgba(139,92,246,0.15); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.35); }

    /* Daily Tab - Premium Look */
    .daily-card { border-radius: 24px; padding: 24px 20px; margin-bottom: 20px; position: relative; overflow: hidden; background: rgba(15,23,42,0.6); backdrop-filter: blur(24px); border: 1px solid var(--line); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    .daily-card::before { content: ''; position: absolute; inset: 0; padding: 1px; background: linear-gradient(135deg,#10b981,#06b6d4); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; border-radius: 24px; pointer-events: none; opacity: 0.7; }
    .daily-card.signed-out::before { background: linear-gradient(135deg,#f59e0b,#ef4444); }
    .daily-card h2 { font-size: 20px; font-weight: 900; margin: 0 0 6px; line-height: 1.2; color: #fff; }
    .daily-card p { font-size: 13px; color: var(--muted); margin: 0 0 16px; line-height: 1.5; }
    .daily-times { display: flex; gap: 12px; margin-bottom: 16px; }
    .daily-time-box { flex: 1; background: rgba(0,0,0,0.3); padding: 14px; border-radius: 14px; border: 1px dashed rgba(255,255,255,0.15); text-align: center; position: relative; }
    .daily-time-box .lbl { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: 0.05em; }
    .daily-time-box .val { font-size: 18px; font-weight: 800; color: #fff; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .daily-time-box .badge { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); }

    .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .analytics-card { background: rgba(15,23,42,0.6); backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 16px; padding: 16px; text-align: center; }
    .analytics-card .val { font-size: 24px; font-weight: 900; color: #fff; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(104,228,224,0.2); }
    .analytics-card .lbl { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-top: 6px; letter-spacing: 0.05em; }
    
    .chart-container { background: rgba(15,23,42,0.6); backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
    .chart-container h3 { font-size: 14px; font-weight: 800; color: #fff; margin: 0 0 20px; }
    .chart-bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-bottom: 24px; position: relative; }
    .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
    .chart-bar { width: 100%; max-width: 40px; background: rgba(104,228,224,0.2); border-radius: 6px 6px 0 0; transition: height 0.3s; position: relative; min-height: 4px; }
    .chart-bar.active { background: linear-gradient(180deg, var(--cyan), var(--purple)); box-shadow: 0 0 10px rgba(104,228,224,0.4); }
    .chart-bar.absent { background: rgba(239,68,68,0.2); }
    .chart-bar:hover { background: rgba(104,228,224,0.5); }
    .chart-label { position: absolute; bottom: -24px; font-size: 10px; font-weight: 700; color: var(--muted); }
    .chart-val { position: absolute; top: -20px; font-size: 10px; font-weight: 800; color: var(--cyan); opacity: 0; transition: opacity 0.2s; }
    .chart-col:hover .chart-val { opacity: 1; }

    /* History */
    .hist-month { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 20px 0 8px; padding-left: 4px; }
    .hist-month:first-child { margin-top: 0; }
    .hist-item { background: rgba(15,23,42,0.6); backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .hist-item .hist-info { flex: 1; min-width: 0; }
    .hist-item h4 { font-size: 14px; font-weight: 700; color: #fff; margin: 0 0 4px; }
    .hist-item p { font-size: 12px; color: var(--muted); margin: 0; }

    .section-title { font-size: 13px; font-weight: 800; color: var(--muted); margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 0.06em; padding-left: 4px; }
    .section-title:first-child { margin-top: 0; }

    /* Empty states */
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; background: rgba(15,23,42,0.55); border-radius: 16px; border: 1px dashed var(--line); }
    .empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 6px; }

    .pro-empty { text-align: center; padding: 32px 22px; margin: 16px 0; border-radius: 20px; background: rgba(15,23,42,0.6); border: 1px solid var(--line); backdrop-filter: blur(20px); position: relative; overflow: hidden; }
    .pro-empty-icon { font-size: 40px; line-height: 1; margin-bottom: 14px; display: inline-block; position: relative; filter: drop-shadow(0 4px 12px rgba(104,228,224,0.35)); }
    .pro-empty strong { display: block; color: #fff; font-size: 16px; font-weight: 800; margin-bottom: 8px; position: relative; }
    .pro-empty p { font-size: 13px; color: var(--muted); margin: 0 auto; line-height: 1.6; max-width: 340px; position: relative; }

    /* Greeting card */
    .greet-card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; margin-bottom: 16px; border-radius: 20px; position: relative; overflow: hidden; background: rgba(15,23,42,0.6); backdrop-filter: blur(22px); border: 1px solid var(--line); }
    .greet-card::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(135deg, rgba(104,228,224,0.05), rgba(168,140,255,0.05)); }
    .greet-emoji { font-size: 34px; line-height: 1; flex-shrink: 0; animation: greetFloat 4s ease-in-out infinite; }
    @keyframes greetFloat { 50% { transform: translateY(-4px) rotate(5deg); } }
    .greet-text { min-width: 0; }
    .greet-text h2 { font-size: 18px; font-weight: 900; margin: 0 0 4px; color: #fff; letter-spacing: -0.02em; line-height: 1.25; }
    .greet-text p { font-size: 12.5px; color: var(--muted); margin: 0; line-height: 1.5; }

    /* Thank-you modal */
    .thank-modal { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.72); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.25s; }
    .thank-modal.open { opacity: 1; }
    .thank-card { max-width: 360px; width: 100%; text-align: center; background: linear-gradient(160deg,#0f172a,#070b13); border: 1px solid var(--line); border-radius: 24px; padding: 30px 22px; transform: translateY(20px) scale(0.95); transition: transform 0.35s var(--ease); box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    .thank-modal.open .thank-card { transform: translateY(0) scale(1); }
    .thank-emoji { font-size: 54px; line-height: 1; margin-bottom: 12px; display: inline-block; animation: greetFloat 3s ease-in-out infinite; }
    .thank-card h2 { font-size: 20px; font-weight: 900; color: #fff; margin: 0 0 10px; line-height: 1.3; }
    .thank-card p { font-size: 14px; color: #cbd5e1; margin: 0 0 6px; line-height: 1.55; }

    /* Toasts */
    #toast-root { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
    .toast { padding: 14px 16px; border-radius: 14px; font-weight: 700; text-align: center; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.35); animation: slideUp 0.3s ease; }
    .toast.success { background: linear-gradient(135deg,#10b981,#06b6d4); }
    .toast.error { background: linear-gradient(135deg,#ef4444,#dc2626); }
    .toast.warn { background: linear-gradient(135deg,#f59e0b,#d97706); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loader { position: fixed; inset: 0; background: #070b13; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #fff; }
    .loader-ring { width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(104,228,224,0.2); border-top-color: var(--cyan); animation: spin 1s linear infinite; }

    /* LESSON PLAN STYLES */
    .lp-upload-card { background: rgba(15,23,42,0.6); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
    .lp-upload-card h3 { font-size: 16px; font-weight: 800; color: #fff; margin: 0 0 12px; }
    .lp-upload-card p { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
    .lp-file-input { display: block; width: 100%; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.3); border: 1px dashed var(--line); color: #fff; margin-bottom: 12px; cursor: pointer; }
    .lp-file-input::file-selector-button { background: rgba(104,228,224,0.15); border: 1px solid var(--cyan); color: var(--cyan); padding: 8px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-right: 12px; font-family: inherit; }
    .lp-list { display: flex; flex-direction: column; gap: 10px; }
    .lp-item { background: rgba(15,23,42,0.6); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .lp-item .info { flex: 1; min-width: 0; }
    .lp-item h4 { font-size: 14px; color: #fff; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lp-item p { font-size: 12px; color: var(--muted); margin: 0; }
    .lp-item .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .lp-btn { background: rgba(104,228,224,0.15); color: var(--cyan); border: 1px solid var(--cyan); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px; cursor: pointer; transition: background 0.2s; }
    .lp-btn:hover { background: rgba(104,228,224,0.3); }
    .lp-btn.delete { background: rgba(239,68,68,0.15); color: #f87171; border-color: #ef4444; }
    .lp-btn.delete:hover { background: rgba(239,68,68,0.3); }

    .lp-preview-modal { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .lp-preview-modal.open { opacity: 1; pointer-events: auto; }

        const cx = overlay.querySelector('#cx');
        const msg = overlay.querySelector('#msg');
        const snap = overlay.querySelector('#snap');
        const flash = overlay.querySelector('#flash');

        // Only 2 steps now, and MUCH easier thresholds
        let step = 0, hold = 0;
        const NEED = [10, 3]; // Look straight (10 frames ≈ 700ms), Blink (3 frames ≈ 200ms)

        const t = k => {
           const dict = {
             ttl: isEnrollment ? 'Face Enrollment' : 'Face Verification',
             sub: isEnrollment ? 'Position your face in the oval and hold still.' : 'Hold still while we verify your identity.',
             start: 'Start Scan', cancel: 'Cancel', load: 'Starting camera…',
             s0: 'Look straight at the camera', s1: 'Now blink your eyes',
             none: 'No face detected — face the camera', near: 'Move closer', far: 'Move back a little', center: 'Center your face in the oval',
             move: 'Hold still…', dark: 'Too dark — find more light', bright: 'Too bright — avoid direct light',
             done: 'Face Verified ✓', donesub: 'Identity confirmed. Returning to attendance...',
             cont: 'Continue', retake: 'Retry',
             err: 'Camera failed to load. Allow camera access and try again.', retry: 'Try again',
             q0: 'Light', q1: 'Position', q2: 'Steady', priv: 'Face detection runs on your device — nothing is uploaded.'
           };
           return dict[k] || k;
        };

        function render() {
          const s = M.dataset.s;
          overlay.querySelector('#ttl').textContent = t('ttl');
          msg.textContent = t({ idle: 'sub', load: 'load', done: 'donesub', err: 'err' }[s] || 's0');
          go.textContent = t(s === 'done' ? 'cont' : s === 'err' ? 'retry' : 'start');
          go.hidden = !/idle|done|err/.test(s);
          cx.textContent = t(s === 'done' ? 'retake' : 'cancel');
          cx.hidden = /idle|err/.test(s);
          ['q0', 'q1', 'q2'].forEach(q => overlay.querySelector('#' + q + ' u').textContent = t(q));
          overlay.querySelector('#priv').textContent = t('priv');
        }

        function setState(s) {
          M.dataset.s = s;
          msg.classList.remove('warn');
          overlay.querySelector('#frame').classList.remove('on');
          render();
        }

        function stopCam() {
          if (stream) stream.getTracks().forEach(x => x.stop());
          stream = null; V.srcObject = null;
        }

        function draw(p) {
          overlay.querySelector('#prog').style.strokeDashoffset = 100 - p * 100;
          const steps = overlay.querySelectorAll('#steps i');
          steps.forEach((el, i) => {
            el.className = i < step ? 'd' : i === step ? 'c' : '';
            el.style.setProperty('--p', (Math.min(1, hold / NEED[step] || 0) * 100) + '%');
          });
        }

        function chip(id, ok) {
          overlay.querySelector('#' + id).className = 'chip ' + (ok ? 'ok' : 'no');
        }

        async function start() {
          setState('load'); show(0);
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
              audio: false
            });
            V.srcObject = stream;
            await V.play();
          } catch (e) {
            console.error(e); stopCam(); return setState('err');
          }
          step = 0; hold = 0; frontal = null; lastBox = null; stillFrames = 0;
          setState('scan'); loop();
        }

        async function loop() {
          if (M.dataset.s !== 'scan') return;
          if (V.readyState >= 2) {
            const vw = V.videoWidth, vh = V.videoHeight, cw = C.clientWidth, ch = C.clientHeight, d = devicePixelRatio || 1;
            if (C.width !== Math.round(cw * d)) { C.width = cw * d; C.height = ch * d; }
            ctx.setTransform(d, 0, 0, d, 0, 0);
            ctx.clearRect(0, 0, cw, ch);

            // Light check only every 500ms (was every frame - slow!)
            const now = performance.now();
            if (now - lastLumaTime > 500) {
              lastLumaTime = now;
              const tmp = document.createElement('canvas'); tmp.width = 24; tmp.height = 24;
              const tc = tmp.getContext('2d'); tc.drawImage(V, 0, 0, 24, 24);
              const data = tc.getImageData(0, 0, 24, 24).data;
              let luma = 0;
              for (let i = 0; i < data.length; i += 4) luma += .299 * data[i] + .587 * data[i + 1] + .114 * data[i + 2];
              luma /= 576;
              lastLumaOk = luma > 50 && luma < 220;
            }
            const lightOk = lastLumaOk;

            // FAST detection — landmarks only, NO descriptor on each frame
            const detection = await faceapi.detectSingleFace(V, detOptions).withFaceLandmarks();

            let key = 's0', fit = false, still = false;

            if (!detection) {
              hold = Math.max(0, hold - 2);
              key = 'none';
              stillFrames = 0;
            } else {
              const box = detection.detection.box;
              const fx = box.x + box.width / 2, fy = box.y + box.height / 2;
              const ex = vw / 2, ey = vh / 2;
              const size = box.height / vh;
              fit = Math.abs(fx - ex) / vw < 0.22 && Math.abs(fy - ey) / vh < 0.22 && size > 0.25 && size < 0.75;

              // Still detection
              if (lastBox) {
                const dist = Math.hypot(box.x - lastBox.x, box.y - lastBox.y);
                if (dist < 6) stillFrames++; else stillFrames = Math.max(0, stillFrames - 1);
              }
              lastBox = { x: box.x, y: box.y };
              still = stillFrames >= 3;

              // Draw landmarks
              const pts = detection.landmarks.positions.map(p => [cw - (p.x * cw / vw), p.y * ch / vh]);
              const prog = (step + Math.min(1, hold / NEED[step])) / 2;
              ctx.fillStyle = `rgba(120,255,235,${.45 + .4 * prog})`;
              for (const p of pts) ctx.fillRect(p[0] - .8, p[1] - .8, 1.6, 1.6);

              if (step === 0) {
                const ok = lightOk && fit && still;
                hold = ok ? hold + 1 : Math.max(0, hold - 2);
                key = !lightOk ? 'dark' : !fit ? (size <= 0.25 ? 'near' : size >= 0.75 ? 'far' : 'center') : !still ? 'move' : 's0';

                if (hold >= NEED[0]) {
                  // === CAPTURE: NOW compute the descriptor ONCE ===
                  const capture = await faceapi.detectSingleFace(V, detOptions).withFaceLandmarks().withFaceDescriptor();
                  if (capture) {
                    const cv = document.createElement('canvas'); cv.width = vw; cv.height = vh;
                    cv.getContext('2d').drawImage(V, 0, 0);
                    const mirrorCv = document.createElement('canvas'); mirrorCv.width = vw; mirrorCv.height = vh;
                    const mCtx = mirrorCv.getContext('2d'); mCtx.translate(vw, 0); mCtx.scale(-1, 1); mCtx.drawImage(cv, 0, 0);
                    frontal = { photo: mirrorCv.toDataURL('image/jpeg', 0.85), descriptor: capture.descriptor };
                    flash.classList.add('fire');
                    setTimeout(() => flash.classList.remove('fire'), 400);
                    navigator.vibrate && navigator.vibrate(20);
                    step = 1; hold = 0; stillFrames = 0;
                  }
                }
              } else if (step === 1) {
                // === BLINK LIVENESS CHECK ===
                const lm = detection.landmarks;
                const leftEye = lm.getLeftEye();
                const ear = (Math.abs(leftEye[1].y - leftEye[5].y) + Math.abs(leftEye[2].y - leftEye[4].y)) / (2 * Math.abs(leftEye[0].x - leftEye[3].x));
                const blink = ear < 0.25; // lenient threshold
                hold = blink ? hold + 1 : Math.max(0, hold - 1);
                key = blink ? 's1' : 's1';

                if (hold >= NEED[1]) {
                  return finish();
                }
              }
            }

            chip('q0', lightOk);
            chip('q1', fit);
            chip('q2', still);
            overlay.querySelector('#frame').classList.toggle('on', !!detection);
            if (msg.textContent !== t(key)) {
              msg.textContent = t(key);
              msg.classList.toggle('warn', !/^s\d$/.test(key));
            }
            draw((step + Math.min(1, hold / NEED[Math.min(step, 1)])) / 2);
          }
          requestAnimationFrame(loop);
        }

        function finish() {
          stopCam();
          snap.src = frontal.photo;
          draw(1);
          setState('done');
          navigator.vibrate && navigator.vibrate([30, 40, 30]);

          // Auto-close after a brief success display
          setTimeout(() => {
            if (M.dataset.s === 'done') {
              overlay.remove();
              resolve({ descriptor: frontal.descriptor, selfie: frontal.photo });
            }
          }, 1200);
        }

        go.onclick = () => {
          if (M.dataset.s === 'done') { overlay.remove(); resolve({ descriptor: frontal.descriptor, selfie: frontal.photo }); }
          else start();
        };

        cx.onclick = () => {
          if (M.dataset.s === 'done') return start();
          stopCam(); overlay.remove(); resolve(null);
        };

        const sc = [...overlay.querySelectorAll('.sc')], dots = [...overlay.querySelectorAll('.dots button')], CAP = ['Goats at play', 'Fishing at sunset', 'The Hare and the Tortoise'];
        let si = 0;
        function show(i) {
          si = i; sc.forEach((e, k) => e.classList.toggle('a', k === i)); dots.forEach((d, k) => d.setAttribute('aria-current', k === i)); overlay.querySelector('#cap').textContent = CAP[i];
        }
        dots.forEach((d, k) => d.onclick = () => show(k));
        const distractionTimer = setInterval(() => { if (/load|scan/.test(M.dataset.s)) show((si + 1) % sc.length); }, 9000);

        const origRemove = overlay.remove;
        overlay.remove = function() { clearInterval(distractionTimer); stopCam(); origRemove.call(this); };

        show(0); render();
      });
    }
    async function ensureFaceEnrollment() {
      if (state.profile.faceDescriptor) return true;

      toast('Face enrollment required.', 'info');
      const result = await scanFaceUI(true);
      if (!result) return false;

      toast('Checking face uniqueness...', 'info');
      try {
        const usersSnap = await getDocs(collection(db, 'users'));
        let isDuplicate = false;

        for (const docSnap of usersSnap.docs) {
          if (docSnap.id === state.user.uid) continue;
          const data = docSnap.data();
          if (data.faceDescriptor && Array.isArray(data.faceDescriptor)) {
            const existingDescriptor = new Float32Array(data.faceDescriptor);
            const distance = faceapi.euclideanDistance(existingDescriptor, result.descriptor);
            if (distance < 0.55) { isDuplicate = true; break; }
          }
        }

        if (isDuplicate) {
          toast('This face is already registered to another account. Access denied.', 'error');
          return false; 
        }
      } catch (err) {
        console.error('Error checking face uniqueness:', err);
        toast('Could not verify face uniqueness. Check your connection.', 'error');
        return false;
      }

      try {
        await updateDoc(doc(db, 'users', state.user.uid), {
          faceDescriptor: Array.from(result.descriptor),
          faceSelfie: result.selfie,
          faceEnrolledAt: serverTimestamp()
        });
        state.profile.faceDescriptor = Array.from(result.descriptor);
        state.profile.faceSelfie = result.selfie;
        toast('Face enrolled successfully!', 'success');
        renderTeacher();
        return true;
      } catch (err) { toast('Failed to save face data.', 'error'); return false; }
    }

    async function verifyFace() {
      if (!state.profile.faceDescriptor) { 
        const enrolled = await ensureFaceEnrollment();
        return enrolled ? verifyFace() : false;
      }
      
      const result = await scanFaceUI(false);
      if (!result) return false;
      
      const storedDescriptor = new Float32Array(state.profile.faceDescriptor);
      const distance = faceapi.euclideanDistance(storedDescriptor, result.descriptor);
      
      if (distance < 0.55) { return result.selfie; } 
      else { toast('Face does not match. Access denied.', 'error'); return false; }
    }

    function dayHash(salt) {
      const d = new Date(); const uid = state.user?.uid || 'guest';
      const key = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}|${uid}|${salt || ''}`;
      let h = 0; for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0; return h;
    }
    function pickDaily(list, salt) { return list[dayHash(salt) % list.length]; }
    function getGreetingInfo() {
      const h = new Date().getHours();
      const fullName = state.profile?.fullName || state.user?.displayName || state.user?.email || 'Friend';
      const name = (fullName.split(/[\s@]/)[0] || 'Friend');
      let slot, greetings, emoji;
      if (h >= 5 && h < 11) { slot = 'morning'; emoji = '☀️'; greetings = ['Good morning','Hello','Hey','Welcome back','Rise and shine','Top of the morning']; }
      else if (h >= 11 && h < 14) { slot = 'lunch'; emoji = '🍽️'; greetings = ['Have a good lunch','Hello','Hey','Good day','Enjoy your lunch']; }
      else if (h >= 14 && h < 18) { slot = 'afternoon'; emoji = '🌤️'; greetings = ['Good afternoon','Hello','Hey','Welcome back','Good day']; }
      else if (h >= 18 && h < 22) { slot = 'evening'; emoji = '🌆'; greetings = ['Good evening','Hello','Hey','Welcome','Nice to see you']; }
      else { slot = 'night'; emoji = '🌙'; greetings = ['Good night','Hello','Hey','Working late','Welcome']; }
      return { name, slot, emoji, greeting: pickDaily(greetings, 'greet'), sub: pickDaily(GREET_SUBLINES[slot], 'sub') };

      if (btnProfile) btnProfile.onclick = () => modal.classList.add('open');
      if (modal) modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };
      if (btnLogout) btnLogout.onclick = () => { if (confirm(t('msg_sign_out'))) signOut(auth); };
      if (btnDeleteFace) btnDeleteFace.onclick = () => { modal.classList.remove('open'); deleteFace(); };
      if (btnEnrollFace) btnEnrollFace.onclick = async () => { 
        modal.classList.remove('open'); 
        const enrolled = await ensureFaceEnrollment(); 
        if (enrolled) toast('Face enrolled successfully!', 'success');

    /* ==================== TEACHER ==================== */
    function goTeacher() {
      state.view = 'teacher';
      if (!state.subCpds) state.subCpds = onSnapshot(collection(db, 'cpds'),
        snap => { state.cpds = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (state.view === 'teacher') renderTeacher(); },
        err => console.error(err));
      
      if (!state.subMine && state.user) {
        const q = query(collection(db, 'attendance'), where('teacherId', '==', state.user.uid));
        state.subMine = onSnapshot(q,
          snap => { state.myAttendances = snap.docs.map(d => ({ id: d.id, ...d.data() })); ensureWatchForActive(); if (state.view === 'teacher') renderTeacher(); },
          err => console.error(err));
      }
      
      if (!state.subSettings) {
        state.subSettings = onSnapshot(doc(db, 'settings', 'attendance'), snap => {
          if (snap.exists()) {
            const d = snap.data();
            state.settings = { 
              startTime: d.startTime ? parseInt(d.startTime.split(':')[0])*60 + parseInt(d.startTime.split(':')[1]) : 480,
              endTime: d.endTime ? parseInt(d.endTime.split(':')[0])*60 + parseInt(d.endTime.split(':')[1]) : 1020
            };
          }
          if (state.view === 'teacher') renderTeacher();
        });
      }

      const todayKey = todayLocalDateKey();
      const dailyId = `${state.user.uid}_${todayKey}`;
      if (!state.subDaily) {
        onSnapshot(doc(db, 'daily_attendance', dailyId), snap => {
          state.todayDaily = snap.exists() ? { id: snap.id, ...snap.data() } : null;
          if (state.view === 'teacher') renderTeacher();
        }, err => console.error(err));

        const q = query(collection(db, 'daily_attendance'), where('teacherId', '==', state.user.uid));
        state.subDaily = onSnapshot(q, snap => {
          state.myDailyRecords = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.date.localeCompare(a.date));
          if (state.view === 'teacher') renderTeacher();
        }, err => console.error(err));
      }

      if (!state.subLessonPlans) {
        const q = query(collection(db, 'lesson_plans'), where('teacherId', '==', state.user.uid));
        state.subLessonPlans = onSnapshot(q, snap => {
          state.myLessonPlans = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => toDate(b.submittedAt) - toDate(a.submittedAt));
          if (state.view === 'teacher') renderTeacher();
        }, err => console.error(err));
      }

      renderTeacher();
    }

      const tabs = [
        { id: 'home', icon: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>' },
        { id: 'daily', icon: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>' },
        { id: 'lesson_plans', icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>' },
        { id: 'stats', icon: '<path d="M18 20V10M12 20V4M6 20v-6"/>' },

    function renderTeacher() {
      const active = state.myAttendances.find(a => a.state === 'active');
      let body = '';
      if (state.teacherTab === 'lesson_plans') body = renderTeacherLessonPlans();
      else if (state.teacherTab === 'stats') body = renderTeacherStats();
      else if (state.teacherTab === 'history') body = renderTeacherHistory();
      else if (state.teacherTab === 'daily') body = renderTeacherDaily();
      else body = renderTeacherHome(active);
      document.getElementById('app').innerHTML = `${headerHtml()}<main class="main">${body}</main>${teacherTabBar()}`;
      bindHeaderEvents();
      document.querySelectorAll('[data-ttab]').forEach(b => b.onclick = () => { state.teacherTab = b.dataset.ttab; renderTeacher(); });
      document.querySelectorAll('[data-attend]').forEach(b => { b.onclick = () => handleAttend(b.dataset.attend, b); });
      document.querySelectorAll('[data-end]').forEach(b => { b.onclick = () => handleEnd(b.dataset.end, b); });
      
      const btnDailyIn = document.getElementById('btn-daily-in');
      if (btnDailyIn) btnDailyIn.onclick = () => handleDailySignIn(btnDailyIn);
      const btnDailyOut = document.getElementById('btn-daily-out');
      if (btnDailyOut) btnDailyOut.onclick = () => handleDailySignOut(btnDailyOut);
      if (state.teacherTab === 'lesson_plans') bindLessonPlanEvents();
    }

    function renderTeacherHome(active) {
      const now = Date.now();
      const todaySessions = state.cpds.filter(c => {
        const d = toDate(c.startTime); if (!d) return false;
        const s = new Date(d); s.setHours(0,0,0,0);
        const e = new Date(d); e.setHours(23,59,59,999);
        return now >= s.getTime() && now <= e.getTime();
      }).sort((a, b) => (toDate(a.startTime)?.getTime() || 0) - (toDate(b.startTime)?.getTime() || 0));
      const upcomingSessions = state.cpds.filter(c => cpdStatus(c) === 'upcoming' || cpdStatus(c) === 'ongoing').sort((a, b) => (toDate(a.startTime)?.getTime() || 0) - (toDate(b.startTime)?.getTime() || 0));
      const nextUpcoming = upcomingSessions[0];

      let hero;
      if (active) {
        const liveCpd = state.cpds.find(c => c.id === active.cpdId);
        let distanceLine = '';
        if (active.liveLat != null && liveCpd) {
          const d = distanceMeters(active.liveLat, active.liveLng, liveCpd.venueLat, liveCpd.venueLng);
          distanceLine = ` · ${Math.round(d)}m from venue`;
        }
        hero = `<div class="t-hero t-hero-active"><h1><span class="status-pulse"></span>${t('currently_attending')}</h1><p><strong style="color:#fff">${escapeHtml(active.cpdTitle)}</strong>${distanceLine ? `<br><span style="font-size:12px">${distanceLine.trim()}</span>` : ''}</p><button data-end="${active.id}" class="btn btn-danger" style="font-size:17px; padding:20px;">■ ${t('end')}</button></div>`;
      } else if (nextUpcoming && cpdStatus(nextUpcoming) === 'ongoing') {
        hero = `<div class="t-hero"><h1>🟢 ${t('live')}</h1><p><strong style="color:#fff">${escapeHtml(nextUpcoming.title)}</strong> · ${fmtTime(nextUpcoming.startTime)} – ${fmtTime(nextUpcoming.endTime)}</p><button data-attend="${nextUpcoming.id}" class="btn btn-primary" style="font-size:17px; padding:20px;">▶ ${t('attend')}</button></div>`;
      } else if (nextUpcoming) {
        const start = toDate(nextUpcoming.startTime).getTime();
        const diffMs = start - now;
        const diffH = Math.floor(diffMs / 3600000);
        const diffM = Math.floor((diffMs % 3600000) / 60000);
        const diffD = Math.floor(diffH / 24);
        let countdown = '';
        if (diffD > 0) countdown = `in ${diffD}d ${diffH % 24}h`;
        else if (diffH > 0) countdown = `in ${diffH}h ${diffM}m`;
        else countdown = `in ${diffM}m`;
        hero = `<div class="t-hero"><h1>📅 ${t('next_session')}</h1><p><strong style="color:#fff">${escapeHtml(nextUpcoming.title)}</strong><br>${fmtTime(nextUpcoming.startTime)} · ${countdown}</p></div>`;
      } else {
        hero = `<div class="t-hero"><h1>☕ ${t('no_sessions_today')}</h1><p>${t('ready')}</p></div>`;
      }

      const todayCards = todaySessions.length > 0 ? `<div class="section-title">${t('today')}</div>${todaySessions.map(c => teacherSessionCard(c, active)).join('')}` : '';
      const upcomingNonToday = upcomingSessions.filter(c => {
        const d = toDate(c.startTime); if (!d) return false;
        const s = new Date(d); s.setHours(0,0,0,0);
        return s.getTime() > now;
      }).slice(0, 5);
      const upcomingCards = upcomingNonToday.length > 0 ? `<div class="section-title">${t('upcoming')}</div>${upcomingNonToday.map(c => teacherSessionCard(c, active)).join('')}` : '';
      let emptyBlock = '';
      if (!todayCards && !upcomingCards) emptyBlock = proEmptyHtml();

      return `${greetingCardHtml()}${hero}${todayCards}${upcomingCards}${emptyBlock}`;
    }

    /* ==================== DAILY TAB ==================== */
    function renderTeacherDaily() {
      const today = todayLocalDateKey();
      const daily = state.todayDaily;
      const now = new Date();
      
      const schoolStartH = Math.floor(state.settings.startTime / 60);
      const schoolStartM = state.settings.startTime % 60;
      const schoolEndH = Math.floor(state.settings.endTime / 60);
      const schoolEndM = state.settings.endTime % 60;
      const schoolStartStr = `${String(schoolStartH).padStart(2,'0')}:${String(schoolStartM).padStart(2,'0')} AM`;
      const schoolEndStr = `${String(schoolEndH > 12 ? schoolEndH-12 : schoolEndH).padStart(2,'0')}:${String(schoolEndM).padStart(2,'0')} PM`;

      let todayCard = '';
      if (!daily) {
        todayCard = `<div class="daily-card">
          <h2>🏫 ${t('daily_title')}</h2>
          <p>${t('daily_sub')} School starts at ${schoolStartStr} and ends at ${schoolEndStr}.</p>
          <button id="btn-daily-in" class="btn btn-present">📍 ${t('daily_sign_in')}</button>
        </div>`;
      } else if (daily.state === 'in') {
        todayCard = `<div class="daily-card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px">
            <h2>🏫 ${t('daily_signed_in')}</h2>
            <span class="badge badge-live">Active</span>
          </div>
          <div class="daily-times">
            <div class="daily-time-box">
              <div class="lbl">${t('daily_sign_in')}</div>
              <div class="val">${fmtTime(daily.signInAt)}</div>
              ${daily.lateMinutes > 0 ? `<span class="badge badge-late">${t('daily_late')} ${formatMins(daily.lateMinutes)}</span>` : ''}
            </div>
          </div>
          <p style="font-size:12px; margin-bottom:12px; color:#10b981; text-align:center;">✓ ${t('daily_verified_in')}</p>
          <button id="btn-daily-out" class="btn btn-departure">🚪 ${t('daily_sign_out')}</button>
        </div>`;
      } else {
        todayCard = `<div class="daily-card signed-out">
          <h2>✅ ${t('daily_signed_out')}</h2>
          <div class="daily-times">
            <div class="daily-time-box">
              <div class="lbl">${t('daily_sign_in')}</div>
              <div class="val">${fmtTime(daily.signInAt)}</div>
              ${daily.lateMinutes > 0 ? `<span class="badge badge-late">${t('daily_late')} ${formatMins(daily.lateMinutes)}</span>` : ''}
            </div>
            <div class="daily-time-box">
              <div class="lbl">${t('daily_sign_out')}</div>
              <div class="val">${fmtTime(daily.signOutAt)}</div>
              ${daily.earlyLeaveMinutes > 0 ? `<span class="badge badge-absent">${t('daily_early_leave')} ${formatMins(daily.earlyLeaveMinutes)}</span>` : ''}
            </div>
          </div>
          <p style="font-size:12px; color:#38bdf8; text-align:center;">✓ ${t('daily_verified_out')}</p>
        </div>`;
      }

      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const monthRecords = state.myDailyRecords.filter(r => new Date(r.date + 'T00:00:00') >= monthStart);
      
      let lateCount = 0, earlyLeaveCount = 0;
      let totalArrivalMs = 0, totalArrivalCount = 0;
      let totalDepartureMs = 0, totalDepartureCount = 0;

      monthRecords.forEach(r => {
        if (r.lateMinutes > 0) lateCount++;
        if (r.earlyLeaveMinutes > 0) earlyLeaveCount++;
        if (r.signInAt) { totalArrivalMs += getMinutesSinceMidnight(toDate(r.signInAt)); totalArrivalCount++; }
        if (r.signOutAt) { totalDepartureMs += getMinutesSinceMidnight(toDate(r.signOutAt)); totalDepartureCount++; }
      });

      const avgInMin = totalArrivalCount > 0 ? Math.round(totalArrivalMs / totalArrivalCount) : 0;
      const avgOutMin = totalDepartureCount > 0 ? Math.round(totalDepartureMs / totalDepartureCount) : 0;
      
      const formatClock = (m) => {
        if (m === 0) return '—';
        const h = Math.floor(m / 60); const min = m % 60;
        const ampm = h >= 12 ? 'PM' : 'AM'; const h12 = h % 12 || 12;
        return `${h12}:${String(min).padStart(2,'0')} ${ampm}`;
      };

      const analyticsHtml = `
        <div class="analytics-grid" style="margin-top:24px">
          <div class="analytics-card"><div class="val" style="color:var(--cyan)">${monthRecords.length}</div><div class="lbl">${t('daily_stat_present')}</div></div>
          <div class="analytics-card"><div class="val" style="color:#fbbf24">${lateCount}</div><div class="lbl">${t('daily_late')}</div></div>
          <div class="analytics-card"><div class="val" style="color:var(--lime)">${formatClock(avgInMin)}</div><div class="lbl">${t('daily_stat_avg_in')}</div></div>
          <div class="analytics-card"><div class="val" style="color:var(--orange)">${formatClock(avgOutMin)}</div><div class="lbl">${t('daily_stat_avg_out')}</div></div>
        </div>
      `;

      const currentDay = now.getDay() === 0 ? 7 : now.getDay();
      const monday = new Date(now); monday.setDate(now.getDate() - currentDay + 1);
      const weekDays = Array.from({length: 7}, (_, i) => {
        const d = new Date(monday); d.setDate(monday.getDate() + i);
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const rec = state.myDailyRecords.find(r => r.date === key);
        return { key, label: d.toLocaleDateString([], { weekday: 'short' }), present: !!rec, isToday: key === today, isWeekend: d.getDay() === 0 || d.getDay() === 6 };
      });

      const chartBars = weekDays.map(d => {
        if (d.isWeekend && !d.present) return `<div class="chart-col"><div class="chart-bar absent" style="height:4px;opacity:0.3"></div><div class="chart-label" style="opacity:0.5">${d.label}</div></div>`;
        const h = d.present ? 100 : 4;
        return `<div class="chart-col"><div class="chart-val">${d.present ? '✓' : '✗'}</div><div class="chart-bar ${d.present ? 'active' : 'absent'}" style="height: ${h}%"></div><div class="chart-label" style="${d.isToday ? 'color:var(--cyan);font-weight:900' : ''}">${d.label}</div></div>`;
      }).join('');

      const chartHtml = `<div class="chart-container" style="margin-top:24px"><h3>${t('daily_weekly_trend')}</h3><div class="chart-bars">${chartBars}</div></div>`;

      const recentHistory = state.myDailyRecords.slice(0, 10).map(r => {
        const isLate = r.lateMinutes > 0; const isEarly = r.earlyLeaveMinutes > 0;
        const signOut = toDate(r.signOutAt);
        return `<div class="hist-item">
          <div class="hist-info"><h4>${new Date(r.date).toLocaleDateString([], { weekday: 'short', day: '2-digit', month: 'short' })}</h4><p>In: ${fmtTime(r.signInAt)} &nbsp;|&nbsp; Out: ${signOut ? fmtTime(r.signOutAt) : '—'}</p></div>
          <div style="display:flex; gap:4px; flex-direction:column; align-items:flex-end;">
            ${isLate ? `<span class="badge badge-late">Late ${formatMins(r.lateMinutes)}</span>` : ''}
            ${isEarly ? `<span class="badge badge-absent">Left Early ${formatMins(r.earlyLeaveMinutes)}</span>` : ''}
            ${!isLate && !isEarly ? `<span class="badge badge-verified">On Time</span>` : ''}
          </div>
        </div>`;
      }).join('');

      return `${todayCard}${analyticsHtml}${chartHtml}<div class="section-title" style="margin-top:24px;">Recent History</div>${recentHistory || `<div class="empty"><strong>No recent records</strong></div>`}`;
    }

    function bindLessonPlanEvents() {
      const form = document.getElementById('lp-form');
      if (!form) return;

      form.onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-submit-lp');
        const fileInput = document.getElementById('lp-file');
        const file = fileInput.files[0];
        const title = form.elements.title.value.trim();

        if (!file || !title) return;
        if (file.size > 2 * 1024 * 1024) { toast('File too large. Max 2MB.', 'error'); return; }

        btn.disabled = true; btn.textContent = t('lp_uploading');

        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const base64 = reader.result;
            await addDoc(collection(db, 'lesson_plans'), {
              teacherId: state.user.uid,
              teacherName: state.profile?.fullName || state.user.email,
              title: title,
              fileName: file.name,
              fileType: file.type,
              fileBase64: base64,
              submittedAt: serverTimestamp()
            });
            form.reset();
            toast('Lesson plan submitted!', 'success');
          } catch (err) {
            toast(err.message, 'error');
          } finally {
            btn.disabled = false; btn.textContent = t('lp_submit');
          }
        };
        reader.readAsDataURL(file);
      };
    }

    window.openLessonPlanPreview = (planId) => {
      const plan = state.myLessonPlans.find(lp => lp.id === planId);
      if (!plan || !plan.fileBase64) { toast('No file attached.', 'warn'); return; }

      const modal = document.createElement('div');
      modal.className = 'lp-preview-modal open';
      modal.innerHTML = `
        <div class="lp-preview-container">
          <div class="lp-preview-header">
            <h3>${escapeHtml(plan.title)}</h3>
            <button class="lp-preview-close" onclick="this.closest('.lp-preview-modal').remove()">✕</button>
          </div>
          <div class="lp-preview-body">
            <iframe src="${plan.fileBase64}" type="${plan.fileType}"></iframe>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      modal.onclick = e => { if (e.target === modal) modal.remove(); };
    };

    window.deleteLessonPlan = async (planId) => {
      if (!confirm(t('lp_delete_confirm'))) return;
      try {
        await deleteDoc(doc(db, 'lesson_plans', planId));
        toast('Lesson plan deleted.', 'success');
      } catch (err) { toast(err.message, 'error'); }
    };

    function teacherSessionCard(cpd, active) {
      const myAtt = state.myAttendances.find(a => a.cpdId === cpd.id);
      const status = myAtt?.state === 'active' ? 'live' : myAtt?.state === 'ended' ? 'ended' : cpdStatus(cpd);
      const isLive = status === 'live'; const isEnded = status === 'ended';
      let badge = '';
      if (status === 'live') badge = `<span class="badge badge-live">● ${t('live')}</span>`;
      else if (status === 'ongoing') badge = `<span class="badge badge-live">● ${t('ongoing')}</span>`;
      else if (status === 'upcoming') badge = `<span class="badge badge-upcoming">${t('upcoming')}</span>`;
      else if (status === 'ended') badge = myAtt?.verified ? `<span class="badge badge-verified">✓ ${t('verified')}</span>` : `<span class="badge badge-flagged">⚠ ${t('flagged')}</span>`;

      let action = '';
      if (isLive) action = `<button data-end="${myAtt.id}" class="btn btn-danger" style="font-size:15px">■ ${t('end')}</button>`;
      else if (isEnded) action = '';
      else if (myAtt) action = `<div style="padding:10px; text-align:center; font-size:13px; color:var(--muted)">✓ ${t('verified')}</div>`;
      else if (status === 'ongoing') {
        if (active) action = `<button disabled class="btn btn-ghost" style="font-size:13px">${t('finish_current')}</button>`;
        else action = `<button data-attend="${cpd.id}" class="btn btn-primary">▶ ${t('attend')}</button>`;
      } else if (status === 'upcoming') action = `<button disabled class="btn btn-ghost">${t('not_started')}</button>`;
      else if (status === 'ended') action = `<button disabled class="btn btn-ghost">${t('ended')}</button>`;

      return `<div class="t-session-card ${isLive ? 'live' : ''} ${isEnded ? 'ended' : ''}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;"><h3 style="flex:1">${escapeHtml(cpd.title)}</h3>${badge}</div>
        <div class="t-session-meta">
          <span>⏰ ${fmtTime(cpd.startTime)} – ${fmtTime(cpd.endTime)}</span>
          <span>📍 ${escapeHtml(cpd.venueName)}</span>
          ${cpd.facilitator ? `<span>👤 ${escapeHtml(cpd.facilitator)}</span>` : ''}
        </div>
        ${action}
      </div>`;
    }

    function renderTeacherStats() {
      const ended = state.myAttendances.filter(a => a.state === 'ended');
      const verified = state.myAttendances.filter(a => a.verified).length;
      const totalSessions = ended.length;
      const verifiedRate = totalSessions > 0 ? Math.round(verified / totalSessions * 100) : 0;
      const totalMinutes = ended.reduce((s, a) => {
        const s1 = toDate(a.attendedAt)?.getTime(); const e1 = toDate(a.endedAt)?.getTime();
        if (s1 && e1) return s + Math.max(0, (e1 - s1) / 60000); return s;
      }, 0);
      const totalHours = (totalMinutes / 60).toFixed(1);
      const now = new Date();
      const thisMonthCount = state.myAttendances.filter(a => {
        const ts = toDate(a.attendedAt)?.getTime();
        return ts && ts >= new Date(now.getFullYear(), now.getMonth(), 1).getTime();
      }).length;
      const months = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const start = d.getTime(); const end = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59).getTime();
        const count = state.myAttendances.filter(a => { const ts = toDate(a.attendedAt)?.getTime(); return ts && ts >= start && ts <= end; }).length;
        months.push({ label: d.toLocaleString('en', { month: 'short' }), count });
      }
      const maxCount = Math.max(1, ...months.map(m => m.count));
      const circ = 2 * Math.PI * 32; const dash = (verifiedRate / 100) * circ;
      return `<div class="stat-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
        <div class="stat-card" style="background:rgba(15,23,42,0.6);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center"><div class="val" style="font-size:26px;font-weight:900;color:#fff;line-height:1">${totalSessions}</div><div class="lbl" style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:6px">${t('sessions_attended')}</div></div>
        <div class="stat-card" style="background:rgba(15,23,42,0.6);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center"><div class="val" style="font-size:26px;font-weight:900;color:#fff;line-height:1">${totalHours}h</div><div class="lbl" style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:6px">${t('total_hours')}</div></div>
        <div class="stat-card" style="background:rgba(15,23,42,0.6);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center"><div class="val" style="font-size:26px;font-weight:900;color:#fff;line-height:1">${thisMonthCount}</div><div class="lbl" style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:6px">${t('this_month')}</div></div>
        <div class="stat-card" style="background:rgba(15,23,42,0.6);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center"><div class="val" style="font-size:26px;font-weight:900;color:#fff;line-height:1">${verifiedRate}%</div><div class="lbl" style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:6px">${t('verified_rate')}</div></div>
      </div>
      <div class="ring-card" style="background:rgba(15,23,42,0.6);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:20px"><svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="32" stroke="rgba(255,255,255,0.08)" stroke-width="8" fill="none"/><circle cx="40" cy="40" r="32" stroke="url(#teacherGrad)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${dash} ${circ}" transform="rotate(-90 40 40)"/></svg><div class="ring-info"><h3 style="font-size:14px;font-weight:800;color:#fff;margin:0 0 6px">${t('verified_rate')}</h3><p style="font-size:12px;color:var(--muted);margin:0">${verified} / ${totalSessions} ${t('verified').toLowerCase()}</p></div></div>
      <div class="chart-card" style="background:rgba(15,23,42,0.6);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px"><h3 style="font-size:14px;font-weight:800;color:#fff;margin:0 0 16px">${t('sessions_this_month')}</h3><div class="bars" style="display:flex;align-items:flex-end;gap:6px;height:100px">${months.map(m => {
        const h = m.count === 0 ? 4 : Math.max(8, Math.round((m.count / maxCount) * 100));
        return `<div class="bar-wrap" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div class="bar-count" style="font-size:10px;color:#cbd5e1;font-weight:800">${m.count || ''}</div><div class="bar" style="height:${h}px;width:100%;background:linear-gradient(180deg,var(--cyan),var(--purple));border-radius:4px 4px 0 0;min-height:4px"></div><div class="bar-lbl" style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase">${m.label}</div></div>`;
      }).join('')}</div></div>`;
    }

    function renderTeacherHistory() {
      const ended = state.myAttendances.filter(a => a.state === 'ended').sort((a, b) => (toDate(b.attendedAt)?.getTime() || 0) - (toDate(a.attendedAt)?.getTime() || 0));
      if (ended.length === 0) return `<div class="empty" style="margin-top:40px"><strong>${t('no_history')}</strong><span>${t('ready')}</span></div>`;
      const groups = {};
      ended.forEach(a => {
        const d = toDate(a.attendedAt); if (!d) return;
        const key = d.toLocaleString('en', { month: 'long', year: 'numeric' });
        if (!groups[key]) groups[key] = [];
        groups[key].push(a);
      });
      return `<div class="section-title">${t('attendance_history')}</div>` + Object.entries(groups).map(([month, list]) => `
        <div class="hist-month">${month}</div>
        ${list.map(a => {
          const s1 = toDate(a.attendedAt)?.getTime(); const e1 = toDate(a.endedAt)?.getTime();
          const mins = (s1 && e1) ? Math.round((e1 - s1) / 60000) : 0;
          const durStr = formatMins(mins);
          const badge = a.verified ? `<span class="badge badge-verified">✓ ${t('verified')}</span>` : `<span class="badge badge-flagged">⚠ ${t('flagged')}</span>`;
          return `<div class="hist-item"><div class="hist-info"><h4>${escapeHtml(a.cpdTitle)}</h4><p>${fmtDate(a.attendedAt)} · ${fmtTime(a.attendedAt)} → ${fmtTime(a.endedAt)} · ${durStr}</p></div>${badge}</div>`;
        }).join('')}`).join('');
    }

    /* ==================== HANDLERS ==================== */
    async function handleDailySignIn(btn) {
      btn.disabled = true; btn.innerHTML = `<span class="spin" style="width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block"></span> Verifying Location...`;
      
      try {
        const pos = await getPositionOnce();
        const dist = distanceMeters(pos.lat, pos.lng, SCHOOL_LAT, SCHOOL_LNG);
        
        if (dist > SCHOOL_RADIUS) {
          toast(`You are ${Math.round(dist)}m away. You must be within ${SCHOOL_RADIUS}m of the school to sign in. Please return to school.`, 'error');
          btn.disabled = false; btn.innerHTML = `📍 ${t('daily_sign_in')}`;
          return;
        }

        // GPS passed, now verify Face (Auto-enrolls if first time)
        btn.innerHTML = `<span class="spin" style="width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block"></span> Scanning Face...`;
        const selfieBase64 = await verifyFace();
        if (!selfieBase64) {
          btn.disabled = false; btn.innerHTML = `📍 ${t('daily_sign_in')}`;
          return;
        }

        btn.innerHTML = `<span class="spin" style="width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block"></span> Saving...`;
        const todayKey = todayLocalDateKey();
        const dailyId = `${state.user.uid}_${todayKey}`;
        
        const now = new Date();
        const currentMins = getMinutesSinceMidnight(now);
        const lateMinutes = Math.max(0, currentMins - state.settings.startTime);

        await setDoc(doc(db, 'daily_attendance', dailyId), {
          teacherId: state.user.uid,
          teacherName: state.profile?.fullName || state.user.email,
          teacherEmail: state.user.email,
          date: todayKey,
          signInAt: serverTimestamp(),
          signInLat: pos.lat, signInLng: pos.lng, signInDistanceMeters: dist,
          lateMinutes: lateMinutes,
          signOutAt: null, signOutLat: null, signOutLng: null, signOutDistanceMeters: null, earlyLeaveMinutes: 0,
          state: 'in', verified: true,
          selfieIn: selfieBase64,
          createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        });
        
        toast('Arrival recorded! Have a great day.', 'success');
        showThankYouModal(true);
      } catch (err) {
        toast(err.message || 'GPS Error', 'error');
        btn.disabled = false; btn.innerHTML = `📍 ${t('daily_sign_in')}`;
      }
    }

    async function handleDailySignOut(btn) {
      btn.disabled = true; btn.innerHTML = `<span class="spin" style="width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block"></span> Verifying Location...`;
      
      try {
        const pos = await getPositionOnce();
        const dist = distanceMeters(pos.lat, pos.lng, SCHOOL_LAT, SCHOOL_LNG);
        
        if (dist > SCHOOL_RADIUS) {
          toast(`You are ${Math.round(dist)}m away. You must be within ${SCHOOL_RADIUS}m of the school to sign out. Please return to school.`, 'error');
          btn.disabled = false; btn.innerHTML = `🚪 ${t('daily_sign_out')}`;
          return;
        }

        // GPS passed, now verify Face
        btn.innerHTML = `<span class="spin" style="width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block"></span> Scanning Face...`;
        const selfieBase64 = await verifyFace();
        if (!selfieBase64) {
          btn.disabled = false; btn.innerHTML = `🚪 ${t('daily_sign_out')}`;
          return;
        }

        btn.innerHTML = `<span class="spin" style="width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block"></span> Saving...`;
        const todayKey = todayLocalDateKey();
        const dailyId = `${state.user.uid}_${todayKey}`;
        
        const now = new Date();
        const currentMins = getMinutesSinceMidnight(now);
        const earlyLeaveMinutes = Math.max(0, state.settings.endTime - currentMins);

        await updateDoc(doc(db, 'daily_attendance', dailyId), {
          signOutAt: serverTimestamp(),
          signOutLat: pos.lat, signOutLng: pos.lng, signOutDistanceMeters: dist,
          earlyLeaveMinutes: earlyLeaveMinutes,
          state: 'out',
          selfieOut: selfieBase64,
          updatedAt: serverTimestamp()
        });
        
        toast('Departure recorded! Safe travels.', 'success');
      } catch (err) {
        toast(err.message || 'GPS Error', 'error');
        btn.disabled = false; btn.innerHTML = `🚪 ${t('daily_sign_out')}`;
      }
    }

    async function handleAttend(cpdId, btn) {
      const cpd = state.cpds.find(c => c.id === cpdId); if (!cpd) return;
      if (state.myAttendances.some(a => a.state === 'active')) { toast(t('finish_current'), 'warn'); return; }
      btn.disabled = true;
      btn.innerHTML = `<span class="spin" style="width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block"></span> ${t('locating')}`;
      try {
        const pos = await getPositionOnce();
        const dist = distanceMeters(pos.lat, pos.lng, cpd.venueLat, cpd.venueLng);
        const status = dist <= cpd.radiusMeters ? 'near' : 'far';

        // Face verify for CPD too
        btn.innerHTML = `<span class="spin" style="width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block"></span> Scanning Face...`;
        const selfieBase64 = await verifyFace();
        if (!selfieBase64) {
          btn.disabled = false; btn.innerHTML = `▶ ${t('attend')}`;
          return;
        }

        await addDoc(collection(db, 'attendance'), {
          cpdId, cpdTitle: cpd.title, teacherId: state.user.uid,
          teacherName: state.profile?.fullName || state.user.email,
          teacherEmail: state.user.email,
          teacherPhotoURL: state.user.photoURL || state.profile?.photoURL || null,
          attendedAt: serverTimestamp(), attendedLat: pos.lat, attendedLng: pos.lng,
          attendedDistanceMeters: dist, attendedStatus: status,
          liveLat: pos.lat, liveLng: pos.lng, liveAccuracy: pos.accuracy, liveUpdatedAt: serverTimestamp(),
          state: 'active', verified: false, selfieIn: selfieBase64,
        });
        toast('Attendance recorded!', 'success');
      } catch (err) {
        toast(err.message || 'GPS Error', 'error');
        btn.disabled = false; btn.innerHTML = `▶ ${t('attend')}`;
      }
    }

    async function handleEnd(attId, btn) {
      const att = state.myAttendances.find(a => a.id === attId);
      const cpd = state.cpds.find(c => c.id === att?.cpdId);
      if (!att || !cpd) return;
      btn.disabled = true;
      btn.innerHTML = `<span class="spin" style="width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block"></span> ${t('finalizing')}`;
      try {
        const pos = await getPositionOnce();
        const dist = distanceMeters(pos.lat, pos.lng, cpd.venueLat, cpd.venueLng);
        const status = dist <= cpd.radiusMeters ? 'near' : 'far';
        
        // Face verify for CPD end
        btn.innerHTML = `<span class="spin" style="width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block"></span> Scanning Face...`;
        const selfieBase64 = await verifyFace();
        if (!selfieBase64) {
          btn.disabled = false; btn.innerHTML = `■ ${t('end')}`;
          return;
        }

        const verified = att.attendedStatus === 'near' && status === 'near';
        await updateDoc(doc(db, 'attendance', att.id), {
          endedAt: serverTimestamp(), endedLat: pos.lat, endedLng: pos.lng,
          endedDistanceMeters: dist, endedStatus: status, state: 'ended', verified,
          selfieOut: selfieBase64,
        });
        clearWatch();
        toast(verified ? t('verified') : t('flagged'), verified ? 'success' : 'warn');
        showThankYouModal(false);
      } catch (err) {
        toast(err.message || 'GPS Error', 'error');
        btn.disabled = false; btn.innerHTML = `■ ${t('end')}`;
      }
    }

    function ensureWatchForActive() {
      const active = state.myAttendances.find(a => a.state === 'active');
      if (!active) { clearWatch(); return; }
      if (state.watchingFor === active.id) return;
      clearWatch(); state.watchingFor = active.id;
      state.watchId = navigator.geolocation.watchPosition(
        pos => { updateDoc(doc(db, 'attendance', active.id), { liveLat: pos.coords.latitude, liveLng: pos.coords.longitude, liveAccuracy: pos.coords.accuracy, liveUpdatedAt: serverTimestamp() }).catch(() => {}); },
        () => {},
        { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
      );
    }

    /* ==================== BOOT ==================== */
    document.getElementById('app').innerHTML = `
      <div class="loader">
        <img src="${LOGO_URL}" alt="Logo" style="width:100px;height:100px;object-fit:contain" />
        <div class="loader-ring"></div>
      </div>`;
  </script>
</body>
</html>
