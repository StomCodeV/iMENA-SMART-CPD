    function bindHeaderEvents() {
      const modal = document.getElementById('profile-modal');
      const btnProfile = document.getElementById('btn-profile');
      const btnLogout = document.getElementById('btn-logout');
      const btnDeleteFace = document.getElementById('btn-delete-face');
      const btnEnrollFace = document.getElementById('btn-enroll-face');
      if (btnProfile) btnProfile.onclick = () => modal.classList.add('open');
      if (modal) modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };
      if (btnLogout) btnLogout.onclick = () => { if (confirm(t('msg_sign_out'))) signOut(auth); };
      if (btnDeleteFace) btnDeleteFace.onclick = () => { modal.classList.remove('open'); deleteFace(); };
      if (btnEnrollFace) btnEnrollFace.onclick = async () => {
        modal.classList.remove('open');
        const enrolled = await ensureFaceEnrollment();
        if (enrolled) toast('Face enrolled successfully!', 'success');
      };
    }

    /* ==================== TEACHER ROUTER ==================== */
    function goTeacher() {
      state.view = 'teacher';
      if (!state.subCpds) state.subCpds = onSnapshot(collection(db, 'cpds'),
        snap => { state.cpds = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (state.view === 'teacher') renderTeacher(); },
        err => console.error(err));

      if (!state.subMine && state.user) {
        const q = query(collection(db, 'attendance'), where('teacherId', '==', state.user.uid));
        state.subMine = onSnapshot(q,
          snap => { state.myAttendances = snap.docs.map(d => ({ id: d.id, ...d.data() })); ensureWatchForActive(); if (state.view === 'teacher') renderTeacher(); },
          err => console.error(err));
      }

      if (!state.subSettings) {
        state.subSettings = onSnapshot(doc(db, 'settings', 'attendance'), snap => {
          if (snap.exists()) {
            const d = snap.data();
            state.settings = {
              startTime: d.startTime ? parseInt(d.startTime.split(':')[0])*60 + parseInt(d.startTime.split(':')[1]) : 480,
              endTime: d.endTime ? parseInt(d.endTime.split(':')[0])*60 + parseInt(d.endTime.split(':')[1]) : 1020
            };
          }
          if (state.view === 'teacher') renderTeacher();
        });
      }

      const todayKey = todayLocalDateKey();
      const dailyId = `${state.user.uid}_${todayKey}`;
      if (!state.subDaily) {
        onSnapshot(doc(db, 'daily_attendance', dailyId), snap => {
          state.todayDaily = snap.exists() ? { id: snap.id, ...snap.data() } : null;
          if (state.view === 'teacher') renderTeacher();
        }, err => console.error(err));

        const q = query(collection(db, 'daily_attendance'), where('teacherId', '==', state.user.uid));
        state.subDaily = onSnapshot(q, snap => {
          state.myDailyRecords = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.date || '').localeCompare(a.date || ''));
          if (state.view === 'teacher') renderTeacher();
        }, err => console.error(err));
      }

      if (!state.subLessonPlans) {
        const q = query(collection(db, 'lesson_plans'), where('teacherId', '==', state.user.uid));
        state.subLessonPlans = onSnapshot(q, snap => {
          state.myLessonPlans = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          if (state.view === 'teacher') renderTeacher();
        }, err => console.error(err));
      }

      ensureFeedbackSub();
      renderTeacher();
    }

    function teacherTabBar() {
      const tabs = [
        { id: 'home', icon: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>' },
        { id: 'daily', icon: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>' },
        { id: 'lesson_plans', icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>' },
        { id: 'stats', icon: '<path d="M18 20V10M12 20V4M6 20v-6"/>' },
        { id: 'history', icon: '<path d="M12 8v4l3 3M3.05 11a9 9 0 1 1 .5 4M3 4v5h5"/>' },
        { id: 'feedback', icon: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' }
      ];
      const unread = state.feedbackThread?.unreadByTeacher || 0;
      return `<nav class="tab-bar">${tabs.map(tb => `
        <button class="tab-btn ${state.teacherTab === tb.id ? 'active' : ''}" data-ttab="${tb.id}">
          <svg viewBox="0 0 24 24">${tb.icon}</svg>
          ${t(tb.id)}
          ${tb.id === 'feedback' && unread > 0 ? `<span class="tab-badge">${unread > 9 ? '9+' : unread}</span>` : ''}
        </button>`).join('')}</nav>`;
    }

    function renderTeacher() {
      // Soft render for feedback: dedicated listeners already patch #fb-messages /
      // the tab badge directly, so a full teardown here would blow away whatever
      // the teacher is mid-typing and restart every message's entrance animation
      // every time an unrelated collection (cpds, attendance, settings...) updates.
      if (state.teacherTab === 'feedback' && state.view === 'teacher' && document.getElementById('chat-wrap')) {
        return;
      }
      const active = state.myAttendances.find(a => a.state === 'active');
      let body = '';
      if (state.teacherTab === 'lesson_plans') body = renderTeacherLessonPlans();
      else if (state.teacherTab === 'stats') body = renderTeacherStats();
      else if (state.teacherTab === 'history') body = renderTeacherHistory();
      else if (state.teacherTab === 'daily') body = renderTeacherDaily();
      else if (state.teacherTab === 'feedback') body = renderTeacherFeedback();
      else body = renderTeacherHome(active);
      const mainClass = state.teacherTab === 'lesson_plans' ? 'main main-wide' : 'main';
      document.getElementById('app').innerHTML = `${headerHtml()}<main class="${mainClass}">${body}</main>${teacherTabBar()}`;
      bindHeaderEvents();
      document.querySelectorAll('[data-ttab]').forEach(b => b.onclick = () => { state.teacherTab = b.dataset.ttab; renderTeacher(); });
      document.querySelectorAll('[data-attend]').forEach(b => { b.onclick = () => handleAttend(b.dataset.attend, b); });
      document.querySelectorAll('[data-end]').forEach(b => { b.onclick = () => handleEnd(b.dataset.end, b); });

      const btnDailyIn = document.getElementById('btn-daily-in');
      if (btnDailyIn) btnDailyIn.onclick = () => handleDailySignIn(btnDailyIn);
      const btnDailyOut = document.getElementById('btn-daily-out');
      if (btnDailyOut) btnDailyOut.onclick = () => handleDailySignOut(btnDailyOut);
      if (state.teacherTab === 'lesson_plans') bindLessonPlanEvents();
      if (state.teacherTab === 'feedback') bindFeedbackEvents();
    }

    function renderTeacherHome(active) {
      const now = Date.now();
      const todaySessions = state.cpds.filter(c => {
        const d = toDate(c.startTime); if (!d) return false;
        const s = new Date(d); s.setHours(0,0,0,0);
        const e = new Date(d); e.setHours(23,59,59,999);
        return now >= s.getTime() && now <= e.getTime();
      }).sort((a, b) => (toDate(a.startTime)?.getTime() || 0) - (toDate(b.startTime)?.getTime() || 0));
      const upcomingSessions = state.cpds.filter(c => cpdStatus(c) === 'upcoming' || cpdStatus(c) === 'ongoing').sort((a, b) => (toDate(a.startTime)?.getTime() || 0) - (toDate(b.startTime)?.getTime() || 0));
      const nextUpcoming = upcomingSessions[0];

      let hero;
      if (active) {
        const liveCpd = state.cpds.find(c => c.id === active.cpdId);
        let distanceLine = '';
        if (active.liveLat != null && liveCpd) {
          const d = distanceMeters(active.liveLat, active.liveLng, liveCpd.venueLat, liveCpd.venueLng);
          distanceLine = `${Math.round(d)}m from venue`;
        }
        hero = `<div class="t-hero t-hero-active"><h1><span class="status-pulse"></span>${t('currently_attending')}</h1><p><strong style="color:#fff">${escapeHtml(active.cpdTitle || '')}</strong>${distanceLine ? `<br><span style="font-size:12px">${distanceLine}</span>` : ''}</p><button data-end="${active.id}" class="btn btn-danger" style="font-size:17px; padding:20px;">■ ${t('end')}</button></div>`;
      } else if (nextUpcoming && cpdStatus(nextUpcoming) === 'ongoing') {
        hero = `<div class="t-hero"><h1>🟢 ${t('live')}</h1><p><strong style="color:#fff">${escapeHtml(nextUpcoming.title)}</strong> · ${fmtTime(nextUpcoming.startTime)} – ${fmtTime(nextUpcoming.endTime)}</p><button data-attend="${nextUpcoming.id}" class="btn btn-primary" style="font-size:17px; padding:20px;">▶ ${t('attend')}</button></div>`;
      } else if (nextUpcoming) {
        const start = toDate(nextUpcoming.startTime).getTime();
        const diffMs = start - now;
        const diffH = Math.floor(diffMs / 3600000);
        const diffM = Math.floor((diffMs % 3600000) / 60000);
        const diffD = Math.floor(diffH / 24);
        let countdown = '';
        if (diffD > 0) countdown = `in ${diffD}d ${diffH % 24}h`;
        else if (diffH > 0) countdown = `in ${diffH}h ${diffM}m`;
        else countdown = `in ${diffM}m`;
        hero = `<div class="t-hero"><h1>📅 ${t('next_session')}</h1><p><strong style="color:#fff">${escapeHtml(nextUpcoming.title)}</strong><br>${fmtTime(nextUpcoming.startTime)} · ${countdown}</p></div>`;
      } else {
        hero = `<div class="t-hero"><h1>☕ ${t('no_sessions_today')}</h1><p>${t('ready')}</p></div>`;
      }

      const todayCards = todaySessions.length > 0 ? `<div class="section-title">${t('today')}</div>${todaySessions.map(c => teacherSessionCard(c, active)).join('')}` : '';
      const upcomingNonToday = upcomingSessions.filter(c => {
        const d = toDate(c.startTime); if (!d) return false;
        const s = new Date(d); s.setHours(0,0,0,0);
        return s.getTime() > now;
      }).slice(0, 5);
      const upcomingCards = upcomingNonToday.length > 0 ? `<div class="section-title">${t('upcoming')}</div>${upcomingNonToday.map(c => teacherSessionCard(c, active)).join('')}` : '';
      let emptyBlock = '';
      if (!todayCards && !upcomingCards) emptyBlock = proEmptyHtml();

      return `${greetingCardHtml()}${hero}${todayCards}${upcomingCards}${emptyBlock}`;
    }

    function teacherSessionCard(c, active) {
      const status = cpdStatus(c);
      const hasAttended = state.myAttendances.some(a => a.cpdId === c.id && a.state === 'completed');
      const isActive = active && active.cpdId === c.id;
      let badge, action = '';
      if (status === 'ongoing') {
        badge = `<span class="badge badge-live">● ${t('live')}</span>`;
        if (isActive) {
          action = `<button data-end="${active.id}" class="btn btn-danger" style="margin-top:12px;">■ ${t('end')}</button>`;
        } else if (!hasAttended) {
          action = `<button data-attend="${c.id}" class="btn btn-primary" style="margin-top:12px;">▶ ${t('attend')}</button>`;
        } else {
          action = `<span class="badge badge-verified">✓ ${t('verified')}</span>`;
        }
      } else if (status === 'upcoming') {
        badge = `<span class="badge badge-upcoming">${t('upcoming')}</span>`;
      } else {
        badge = hasAttended
          ? `<span class="badge badge-verified">✓ ${t('verified')}</span>`
          : `<span class="badge badge-ended">${t('ended')}</span>`;
      }
      const cls = isActive ? 'live' : (status === 'ended' ? 'ended' : '');
      return `<div class="t-session-card ${cls}">
        <h3>${escapeHtml(c.title || 'CPD Session')}</h3>
        <div class="t-session-meta">
          ${badge}
          <span>🕐 ${fmtTime(c.startTime)} – ${fmtTime(c.endTime)}</span>
          ${c.venueName ? `<span>📍 ${escapeHtml(c.venueName)}</span>` : ''}
        </div>
        ${action}
      </div>`;
    }

    /* ==================== DAILY TAB ==================== */
    function renderTeacherDaily() {
      const today = todayLocalDateKey();
      const daily = state.todayDaily;
      const now = new Date();

      const schoolStartH = Math.floor(state.settings.startTime / 60);
      const schoolStartM = state.settings.startTime % 60;
      const schoolEndH = Math.floor(state.settings.endTime / 60);
      const schoolEndM = state.settings.endTime % 60;
      const schoolStartStr = `${String(schoolStartH).padStart(2,'0')}:${String(schoolStartM).padStart(2,'0')}`;
      const schoolEndStr = `${String(schoolEndH).padStart(2,'0')}:${String(schoolEndM).padStart(2,'0')}`;

      let todayCard;
      if (!daily) {
        todayCard = `<div class="daily-card">
          <h2>🏫 ${t('daily_title')}</h2>
          <p>${t('daily_sub')} School starts at ${schoolStartStr} and ends at ${schoolEndStr}.</p>
          <button id="btn-daily-in" class="btn btn-present">📍 ${t('daily_sign_in')}</button>
        </div>`;
      } else if (daily.state === 'in') {
        todayCard = `<div class="daily-card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px">
            <h2>🏫 ${t('daily_signed_in')}</h2>
            <span class="badge badge-live">Active</span>
          </div>
          <div class="daily-times">
            <div class="daily-time-box">
              <div class="lbl">${t('daily_sign_in')}</div>
              <div class="val">${fmtTime(daily.signInAt)}</div>
              ${daily.lateMinutes > 0 ? `<span class="badge badge-late">${t('daily_late')} ${formatMins(daily.lateMinutes)}</span>` : ''}
            </div>
          </div>
          <p style="font-size:12px; margin-bottom:12px; color:#10b981; text-align:center;">✓ ${t('daily_verified_in')}</p>
          <button id="btn-daily-out" class="btn btn-departure">🚪 ${t('daily_sign_out')}</button>
        </div>`;
      } else {
        todayCard = `<div class="daily-card signed-out">
          <h2>✅ ${t('daily_signed_out')}</h2>
          <div class="daily-times">
            <div class="daily-time-box">
              <div class="lbl">${t('daily_sign_in')}</div>
              <div class="val">${fmtTime(daily.signInAt)}</div>
              ${daily.lateMinutes > 0 ? `<span class="badge badge-late">${t('daily_late')} ${formatMins(daily.lateMinutes)}</span>` : ''}
            </div>
            <div class="daily-time-box">
              <div class="lbl">${t('daily_sign_out')}</div>
              <div class="val">${fmtTime(daily.signOutAt)}</div>
              ${daily.earlyLeaveMinutes > 0 ? `<span class="badge badge-absent">${t('daily_early_leave')} ${formatMins(daily.earlyLeaveMinutes)}</span>` : ''}
            </div>
          </div>
          <p style="font-size:12px; color:#38bdf8; text-align:center;">✓ ${t('daily_verified_out')}</p>
        </div>`;
      }

      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const monthRecords = state.myDailyRecords.filter(r => new Date(r.date + 'T00:00:00') >= monthStart);
      let lateCount = 0, earlyLeaveCount = 0;
      let totalArrivalMs = 0, totalArrivalCount = 0;
      let totalDepartureMs = 0, totalDepartureCount = 0;
      monthRecords.forEach(r => {
        if (r.lateMinutes > 0) lateCount++;
        if (r.earlyLeaveMinutes > 0) earlyLeaveCount++;
        if (r.signInAt) { totalArrivalMs += getMinutesSinceMidnight(toDate(r.signInAt)); totalArrivalCount++; }
        if (r.signOutAt) { totalDepartureMs += getMinutesSinceMidnight(toDate(r.signOutAt)); totalDepartureCount++; }
      });
      const avgInMin = totalArrivalCount > 0 ? Math.round(totalArrivalMs / totalArrivalCount) : 0;
      const avgOutMin = totalDepartureCount > 0 ? Math.round(totalDepartureMs / totalDepartureCount) : 0;
      const formatClock = (m) => {
        if (m === 0) return '—';
        const h = Math.floor(m / 60); const min = m % 60;
        const ampm = h >= 12 ? 'PM' : 'AM'; const h12 = h % 12 || 12;
        return `${h12}:${String(min).padStart(2,'0')} ${ampm}`;
      };
      const analyticsHtml = `
        <div class="analytics-grid" style="margin-top:24px">
          <div class="analytics-card"><div class="val" style="color:var(--cyan)">${monthRecords.length}</div><div class="lbl">${t('daily_stat_present')}</div></div>
          <div class="analytics-card"><div class="val" style="color:#fbbf24">${lateCount}</div><div class="lbl">${t('daily_late')}</div></div>
          <div class="analytics-card"><div class="val" style="color:var(--lime)">${formatClock(avgInMin)}</div><div class="lbl">${t('daily_stat_avg_in')}</div></div>
          <div class="analytics-card"><div class="val" style="color:var(--orange)">${formatClock(avgOutMin)}</div><div class="lbl">${t('daily_stat_avg_out')}</div></div>
        </div>`;

      const currentDay = now.getDay() === 0 ? 7 : now.getDay();
      const monday = new Date(now); monday.setDate(now.getDate() - currentDay + 1);
      const weekDays = Array.from({length: 7}, (_, i) => {
        const d = new Date(monday); d.setDate(monday.getDate() + i);
        const key = dateKeyOf(d);
        const rec = state.myDailyRecords.find(r => r.date === key);
        return { key, label: d.toLocaleDateString([], { weekday: 'short' }), present: !!rec, isToday: key === today, isWeekend: d.getDay() === 0 || d.getDay() === 6 };
      });
      const chartBars = weekDays.map(d => {
        if (d.isWeekend && !d.present) return `<div class="chart-col"><div class="chart-bar absent" style="height:4px;opacity:0.3"></div><div class="chart-label" style="opacity:0.5">${d.label}</div></div>`;
        const h = d.present ? 100 : 4;
        return `<div class="chart-col"><div class="chart-val">${d.present ? '✓' : '✗'}</div><div class="chart-bar ${d.present ? 'active' : 'absent'}" style="height: ${h}%"></div><div class="chart-label" style="${d.isToday ? 'color:var(--cyan);font-weight:900' : ''}">${d.label}</div></div>`;
      }).join('');
      const chartHtml = `<div class="chart-container" style="margin-top:24px"><h3>${t('daily_weekly_trend')}</h3><div class="chart-bars">${chartBars}</div></div>`;

      const recentHistory = state.myDailyRecords.slice(0, 10).map(r => {
        const isLate = r.lateMinutes > 0; const isEarly = r.earlyLeaveMinutes > 0;
        const signOut = toDate(r.signOutAt);
        return `<div class="hist-item">
          <div class="hist-info"><h4>${new Date(r.date + 'T00:00:00').toLocaleDateString([], { weekday: 'short', day: '2-digit', month: 'short' })}</h4><p>In: ${fmtTime(r.signInAt)} &nbsp;|&nbsp; Out: ${signOut ? fmtTime(r.signOutAt) : '—'}</p></div>
          <div style="display:flex; gap:4px; flex-direction:column; align-items:flex-end;">
            ${isLate ? `<span class="badge badge-late">Late ${formatMins(r.lateMinutes)}</span>` : ''}
            ${isEarly ? `<span class="badge badge-absent">Left Early ${formatMins(r.earlyLeaveMinutes)}</span>` : ''}
            ${!isLate && !isEarly ? `<span class="badge badge-verified">On Time</span>` : ''}
          </div>
        </div>`;
      }).join('');

      return `${todayCard}${analyticsHtml}${chartHtml}<div class="section-title" style="margin-top:24px;">Recent History</div>${recentHistory || `<div class="empty"><strong>No recent records</strong></div>`}`;
    }

    /* ==================== STATS ==================== */
    function renderTeacherStats() {
      const completed = state.myAttendances.filter(a => a.state === 'completed' && a.endTime && a.startTime);
      let totalMs = 0;
      completed.forEach(a => {
        const s = toDate(a.startTime)?.getTime();
        const e = toDate(a.endTime)?.getTime();
        if (s && e) totalMs += (e - s);
      });
      const totalHours = (totalMs / 3600000).toFixed(1);
      const verified = completed.filter(a => a.verifiedOut).length;
      const verifiedRate = completed.length > 0 ? Math.round((verified / completed.length) * 100) : 0;
      const now = new Date();
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const thisMonth = state.myAttendances.filter(a => {
        const d = toDate(a.startTime);
        return d && d >= monthStart;
      }).length;

      const months = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const next = new Date(now.getFullYear(), now.getMonth() - i + 1, 1);
        const count = state.myAttendances.filter(a => {
          const tt = toDate(a.startTime);
          return tt && tt >= d && tt < next;
        }).length;
        months.push({ label: d.toLocaleDateString([], { month: 'short' }), count });
      }
      const maxCount = Math.max(1, ...months.map(m => m.count));
      const chartBars = months.map(m => `
        <div class="chart-col">
          <div class="chart-val">${m.count}</div>
          <div class="chart-bar ${m.count > 0 ? 'active' : ''}" style="height:${(m.count / maxCount) * 100}%"></div>
          <div class="chart-label">${m.label}</div>
        </div>`).join('');

      return `
        <h1 style="font-size:22px;font-weight:900;margin:0 0 16px;color:#fff;">${t('stats')}</h1>
        <div class="analytics-grid" style="grid-template-columns: 1fr 1fr;">
          <div class="analytics-card"><div class="val" style="color:var(--cyan)">${completed.length}</div><div class="lbl">${t('sessions_attended')}</div></div>
          <div class="analytics-card"><div class="val" style="color:var(--lime)">${totalHours}</div><div class="lbl">${t('total_hours')}</div></div>
          <div class="analytics-card"><div class="val" style="color:var(--purple)">${verifiedRate}%</div><div class="lbl">${t('verified_rate')}</div></div>
          <div class="analytics-card"><div class="val" style="color:var(--orange)">${thisMonth}</div><div class="lbl">${t('this_month')}</div></div>
        </div>
        <div class="chart-container">
          <h3>${t('sessions_this_month')}</h3>
          <div class="chart-bars">${chartBars}</div>
        </div>`;
    }

    /* ==================== HISTORY ==================== */
    function renderTeacherHistory() {
      const completed = state.myAttendances
        .filter(a => a.state === 'completed')
        .sort((a, b) => (toDate(b.startTime)?.getTime() || 0) - (toDate(a.startTime)?.getTime() || 0));
      if (completed.length === 0) {
        return `<h1 style="font-size:22px;font-weight:900;margin:0 0 16px;color:#fff;">${t('history')}</h1>
          <div class="empty"><strong>${t('no_history')}</strong></div>`;
      }
      const byMonth = {};
      completed.forEach(a => {
        const d = toDate(a.startTime);
        if (!d) return;
        const key = d.toLocaleDateString([], { month: 'long', year: 'numeric' });
        (byMonth[key] = byMonth[key] || []).push(a);
      });
      let html = `<h1 style="font-size:22px;font-weight:900;margin:0 0 16px;color:#fff;">${t('attendance_history')}</h1>`;
      for (const [month, items] of Object.entries(byMonth)) {
        html += `<div class="hist-month">${escapeHtml(month)}</div>`;
        items.forEach(a => {
          const s = toDate(a.startTime), e = toDate(a.endTime);
          let dur = '—';
          if (s && e) dur = formatMins(Math.round((e - s) / 60000));
          const badge = a.verifiedOut
            ? `<span class="badge badge-verified">${t('verified')}</span>`
            : `<span class="badge badge-flagged">${t('flagged')}</span>`;
          html += `<div class="hist-item">
            <div class="hist-info">
              <h4>${escapeHtml(a.cpdTitle || 'CPD Session')}</h4>
              <p>${fmtDate(a.startTime)} · ${fmtTime(a.startTime)} – ${e ? fmtTime(a.endTime) : '—'} · ${dur}</p>
            </div>
            ${badge}
          </div>`;
        });
      }
      return html;
    }

    /* ==================== LESSON PLANS ==================== */
    function renderTeacherLessonPlans() {
      const year = state.lpCalYear, month = state.lpCalMonth;
      const first = new Date(year, month, 1);
      const last = new Date(year, month + 1, 0);
      const daysInMonth = last.getDate();
      const startDow = first.getDay();
      const monthLabel = first.toLocaleDateString([], { month: 'long', year: 'numeric' });

      const plansByDay = {};
      state.myLessonPlans.forEach(p => {
        let dateKey = p.forDate;
        if (!dateKey) {
          const d = toDate(p.submittedAt);
          if (d) dateKey = dateKeyOf(d);
        }
        if (!dateKey) return;
        (plansByDay[dateKey] = plansByDay[dateKey] || []).push(p);
      });

      const todayKey = todayLocalDateKey();
      let cells = '';
      for (let i = 0; i < startDow; i++) cells += `<div class="cal-day empty"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const has = !!plansByDay[key];
        const weekend = isWeekend(key);
        const cls = ['cal-day', has ? 'has-plan' : '', weekend ? 'weekend' : '', key === todayKey ? 'today' : '', key === state.lpCalSelected ? 'selected' : ''].filter(Boolean).join(' ');
        cells += `<div class="${cls}" data-lp-date="${key}">${d}</div>`;
      }

      const now = new Date();
      const dow = now.getDay() === 0 ? 7 : now.getDay();
      const monday = new Date(now); monday.setDate(now.getDate() - dow + 1);
      const weekdays = Array.from({length: 5}, (_, i) => {
        const d = new Date(monday); d.setDate(monday.getDate() + i);
        const key = dateKeyOf(d);
        const plans = plansByDay[key] || [];
        const has = plans.length > 0;
        const isToday = key === todayKey;
        const isPast = key < todayKey;
        let pillClass = '', statusIcon = '';
        if (has) { pillClass = 'ok'; statusIcon = '✓'; }
        else if (isPast) { pillClass = 'missed'; statusIcon = '✗'; }
        else { pillClass = 'pending'; statusIcon = '·'; }
        if (isToday) pillClass += ' today';
        return `<div class="week-pill ${pillClass}">
          <div class="day">${shortDayName(key)}</div>
          <div class="status">${statusIcon}</div>
        </div>`;
      }).join('');

      let detailHtml = '';
      if (state.lpCalSelected) {
        const selectedPlans = plansByDay[state.lpCalSelected] || [];
        const dayLabel = new Date(state.lpCalSelected + 'T00:00:00').toLocaleDateString([], { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
        const selWeekend = isWeekend(state.lpCalSelected);
        const isPast = state.lpCalSelected < todayKey;
        const canUpload = !selWeekend && !isPast;
        let notice = '';
        if (selWeekend) notice = `<div style="padding:10px 12px; border-radius:10px; background:rgba(148,163,184,0.1); border:1px solid rgba(148,163,184,0.3); color:var(--muted); font-size:12px; margin-bottom:10px;">🗓 ${t('lp_weekend_blocked')}</div>`;
        else if (isPast && selectedPlans.length === 0) notice = `<div style="padding:10px 12px; border-radius:10px; background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.3); color:#f87171; font-size:12px; margin-bottom:10px;">Past day — no plan was submitted.</div>`;
        detailHtml = `
          <div class="section-title" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <span>${escapeHtml(dayLabel)}</span>
            ${canUpload ? `<button id="btn-upload-lp" style="background:rgba(104,228,224,0.15);border:1px solid var(--cyan);color:var(--cyan);padding:6px 12px;border-radius:8px;font-size:11px;font-weight:800;">+ ${t('lp_upload')}</button>` : ''}
          </div>
          ${notice}
          ${selectedPlans.length === 0
            ? `<div class="empty"><strong>${t('lp_no_plans')}</strong></div>`
            : `<div class="lp-grid">${selectedPlans.map(p => `
                <div class="lp-card">
                  <h4>${escapeHtml(p.title || p.fileName || 'Untitled')}</h4>
                  <p>📎 ${escapeHtml(p.fileName || 'file')} · ${fmtTime(p.submittedAt)}</p>
                  <div class="lp-actions">
                    <button class="view" data-lp-view="${p.id}">👁 ${t('lp_preview')}</button>
                    <button class="del" data-lp-del="${p.id}">${t('lp_delete')}</button>
                  </div>
                </div>`).join('')}</div>`}`;
      } else {
        detailHtml = `<div class="empty"><strong>${t('lp_no_plan_selected')}</strong></div>`;
      }

      return `
        <h1 style="font-size:22px;font-weight:900;margin:0 0 6px;color:#fff;text-shadow:0 0 20px rgba(0,255,204,0.35);">${t('lp_title')}</h1>
        <p style="font-size:12px;color:#94a3b8;margin:0 0 16px">${t('lp_sub')}</p>
        <div class="cal-wrap">
          <div style="font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">${t('lp_this_week')}</div>
          <div class="week-strip">${weekdays}</div>
          <div class="cal-header" style="margin-top:16px;">
            <div class="cal-title">${escapeHtml(monthLabel)}</div>
            <div class="cal-nav">
              <button data-lp-cal-prev>‹</button>
              <button data-lp-cal-today style="width:auto;padding:0 10px;font-size:11px;">Today</button>
              <button data-lp-cal-next>›</button>
            </div>
          </div>
          <div class="cal-grid">
            ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d, i) => `<div class="cal-dow ${i === 0 || i === 6 ? 'weekend' : ''}">${d}</div>`).join('')}
            ${cells}
          </div>
          <div class="cal-legend">
            <span><i class="dot-submitted"></i> Plan submitted</span>
            <span><i class="dot-pending"></i> Pending</span>
            <span><i class="dot-weekend"></i> Weekend</span>
          </div>
        </div>
        ${detailHtml}
        <div id="lp-preview-modal" class="lp-preview-modal">
          <div class="lp-preview-container">
            <div class="lp-preview-header">
              <h3 id="lp-preview-title">Lesson Plan</h3>
              <div style="display:flex;align-items:center;">
                <a id="lp-preview-dl" class="lp-preview-dl" href="#" target="_blank" rel="noopener" download>Download</a>
                <button class="lp-preview-close" id="lp-preview-close">✕</button>
              </div>
            </div>
            <div class="lp-preview-body" id="lp-preview-body"></div>
          </div>
        </div>
        <div id="lp-upload-modal" class="lp-preview-modal">
          <div class="lp-preview-container" style="max-width:440px;height:auto;background:#0f172a;padding:24px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
              <h3 id="lp-upload-date-label" style="color:#fff;font-size:16px;font-weight:900;margin:0;"></h3>
              <button id="lp-upload-close" class="lp-preview-close">✕</button>
            </div>
            <form id="lp-form">
              <input type="text" name="title" placeholder="Plan Title (e.g. Week 1 - Mathematics)" required style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:rgba(0,0,0,0.3); color:#fff; margin-bottom:12px;" />
              <input type="file" name="file" required accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" class="lp-file-input" id="lp-file" style="display:block; width:100%; padding:12px; border-radius:12px; background:rgba(0,0,0,0.3); border:1px dashed var(--line); color:#fff; margin-bottom:12px; cursor:pointer;" />
              <div style="font-size:11px;color:var(--muted);margin-bottom:12px;">PDF, DOCX, JPG, PNG · Max 700 KB</div>
              <button type="submit" id="btn-submit-lp" class="btn btn-primary" style="padding:14px; font-size:15px;">${t('lp_submit')}</button>
            </form>
          </div>
        </div>`;
    }

    function bindLessonPlanEvents() {
      document.querySelectorAll('[data-lp-cal-prev]').forEach(b => b.onclick = () => { state.lpCalMonth--; if (state.lpCalMonth < 0) { state.lpCalMonth = 11; state.lpCalYear--; } renderTeacher(); });
      document.querySelectorAll('[data-lp-cal-next]').forEach(b => b.onclick = () => { state.lpCalMonth++; if (state.lpCalMonth > 11) { state.lpCalMonth = 0; state.lpCalYear++; } renderTeacher(); });
      document.querySelectorAll('[data-lp-cal-today]').forEach(b => b.onclick = () => {
        const n = new Date(); state.lpCalYear = n.getFullYear(); state.lpCalMonth = n.getMonth();
        state.lpCalSelected = todayLocalDateKey(); renderTeacher();
      });
      document.querySelectorAll('[data-lp-date]').forEach(el => el.onclick = () => { state.lpCalSelected = el.dataset.lpDate; renderTeacher(); });
      document.querySelectorAll('[data-lp-view]').forEach(el => el.onclick = (e) => {
        e.stopPropagation();
        const plan = state.myLessonPlans.find(p => p.id === el.dataset.lpView);
        if (plan) openLessonPlanPreview(plan);
      });
      document.querySelectorAll('[data-lp-del]').forEach(el => el.onclick = (e) => { e.stopPropagation(); deleteLessonPlan(el.dataset.lpDel); });
      const btnUpload = document.getElementById('btn-upload-lp');
      if (btnUpload) btnUpload.onclick = openUploadModal;
      const uClose = document.getElementById('lp-upload-close');
      const uModal = document.getElementById('lp-upload-modal');
      if (uClose) uClose.onclick = closeUploadModal;
      if (uModal) uModal.onclick = (e) => { if (e.target === uModal) closeUploadModal(); };
      const form = document.getElementById('lp-form');
      if (form) form.onsubmit = submitLessonPlan;
      const pModal = document.getElementById('lp-preview-modal');
      if (pModal) {
        pModal.onclick = (e) => { if (e.target === pModal) closeLessonPlanPreview(); };
        const pClose = document.getElementById('lp-preview-close');
        if (pClose) pClose.onclick = closeLessonPlanPreview;
      }
    }

    function openUploadModal() {
      if (state.lpCalSelected && isWeekend(state.lpCalSelected)) { toast(t('lp_weekend_blocked'), 'warn'); return; }
      if (state.lpCalSelected && state.lpCalSelected < todayLocalDateKey()) { toast('Cannot upload a plan for a past date.', 'warn'); return; }
      const m = document.getElementById('lp-upload-modal');
      if (!m) return;
      const label = document.getElementById('lp-upload-date-label');
      if (label && state.lpCalSelected) {
        label.textContent = `${t('lp_upload_for')} ${new Date(state.lpCalSelected + 'T00:00:00').toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' })}`;
      }
      m.classList.add('open');
    }
    function closeUploadModal() { const m = document.getElementById('lp-upload-modal'); if (m) m.classList.remove('open'); }

    async function submitLessonPlan(e) {
      e.preventDefault();
      const form = e.target;
      const btn = document.getElementById('btn-submit-lp');
      const fileInput = document.getElementById('lp-file');
      const file = fileInput.files[0];
      const title = form.elements.title.value.trim();
      if (!file || !title) return;
      if (state.lpCalSelected && isWeekend(state.lpCalSelected)) { toast(t('lp_weekend_blocked'), 'error'); return; }
      if (file.size > LP_MAX_BYTES) { toast(`File too large (${(file.size/1024/1024).toFixed(1)}MB). Max ${(LP_MAX_BYTES/1024/1024).toFixed(0)}MB.`, 'error'); return; }
      btn.disabled = true; btn.textContent = t('lp_uploading');
      try {
        const forDate = state.lpCalSelected || todayLocalDateKey();
        // Upload to Firebase Storage so the file becomes a real shareable link —
        // admin and the teacher can both open/preview it without downloading,
        // instead of the old approach of embedding the whole file as base64 in Firestore.
        const safeName = file.name.replace(/[^\w.\-]+/g, '_');
        const path = `lesson_plans/${state.user.uid}/${Date.now()}_${safeName}`;
        const sRef = storageRef(storage, path);
        await uploadBytes(sRef, file, { contentType: file.type || 'application/octet-stream' });
        const fileUrl = await getDownloadURL(sRef);

        await addDoc(collection(db, 'lesson_plans'), {
          teacherId: state.user.uid,
          teacherName: state.profile?.fullName || state.user.email,
          title: title,
          fileName: file.name,
          fileType: file.type,
          fileUrl,
          storagePath: path,
          submittedAt: serverTimestamp(),
          forDate
        });
        form.reset();
        closeUploadModal();
        toast('Lesson plan submitted!', 'success');
      } catch (err) {
        console.error(err);
        toast(err.message || 'Upload failed.', 'error');
      } finally {
        btn.disabled = false; btn.textContent = t('lp_submit');
      }
    }

    /* ==================== LESSON PLAN PREVIEW (inline, no forced download) ==================== */
    function openLessonPlanPreview(plan) {
      if (!plan) return;
      const modal   = document.getElementById('lp-preview-modal');
      const titleEl = document.getElementById('lp-preview-title');
      const bodyEl  = document.getElementById('lp-preview-body');
      const dlBtn   = document.getElementById('lp-preview-dl');
      if (!modal || !bodyEl) return;

      // fileUrl (Firebase Storage link) is the current format; fileBase64/fileData
      // are kept only so lesson plans submitted before this change still open.
      const src      = plan.fileUrl || plan.fileBase64 || plan.fileData;
      const mime     = plan.fileType || '';
      const fileName = plan.fileName || 'file';
      const lower    = fileName.toLowerCase();
      const isHttpUrl = /^https?:\/\//i.test(src || '');

      titleEl.textContent = plan.title || fileName;

      if (src) {
        dlBtn.href = src; dlBtn.download = fileName; dlBtn.style.display = '';
      } else {
        dlBtn.style.display = 'none';
      }

      bodyEl.innerHTML = '';
      if (!src) {
        bodyEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#cbd5e1;">No file attached.</div>';
        modal.classList.add('open');
        return;
      }

      const isPdf   = mime === 'application/pdf' || lower.endsWith('.pdf');
      const isImage = mime.startsWith('image/') || /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(lower);
      const isDocx  = mime === 'application/msword' ||
                      mime === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' ||
                      /\.(docx?|rtf)$/i.test(lower);

      if (isImage) {
        bodyEl.innerHTML = `
          <div style="height:100%;display:flex;align-items:center;justify-content:center;background:#0b1220;padding:8px;">
            <img src="${escapeHtml(src)}" alt="${escapeHtml(fileName)}" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,0.4);" />
          </div>`;
        modal.classList.add('open');
        return;
      }

      if (isPdf) {
        modal.classList.add('open');
        renderPdfInline(bodyEl, src);
        return;
      }

      if (isDocx && isHttpUrl) {
        // Microsoft's Office viewer renders the doc from its real URL — no download needed.
        const viewerUrl = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(src)}`;
        bodyEl.innerHTML = `<iframe src="${escapeHtml(viewerUrl)}" style="width:100%;height:100%;border:none;background:#fff;" title="${escapeHtml(fileName)}"></iframe>`;
        modal.classList.add('open');
        return;
      }

      bodyEl.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;color:#cbd5e1;background:#0b1220;">
          <div style="font-size:42px;line-height:1;">📄</div>
          <div style="font-size:15px;color:#fff;font-weight:700;">${escapeHtml(fileName)}</div>
          <div style="font-size:13px;max-width:340px;line-height:1.6;">This file type can't be previewed inline. Download to view the full contents.</div>
          <a href="${escapeHtml(src)}" download="${escapeHtml(fileName)}" style="padding:12px 18px;border-radius:10px;background:#0ea5e9;color:#fff;font-weight:700;text-decoration:none;">Download file</a>
        </div>`;
      modal.classList.add('open');
    }
    function closeLessonPlanPreview() {
      const m = document.getElementById('lp-preview-modal'); if (!m) return;
      m.classList.remove('open');
      setTimeout(() => { const b = document.getElementById('lp-preview-body'); if (b) b.innerHTML = ''; }, 320);
    }
    async function deleteLessonPlan(planId) {
      if (!confirm(t('lp_delete_confirm'))) return;
      try {
        await deleteDoc(doc(db, 'lesson_plans', planId));
        toast('Lesson plan deleted.', 'success');
      } catch (err) { toast(err.message, 'error'); }
    }

    /* ==================== FEEDBACK CHAT ==================== */
    async function ensureFeedbackSub() {
      if (!state.user) return;
      const uid = state.user.uid;
      const threadRef = doc(db, 'feedback_threads', uid);

      if (!state.subFeedbackThread) {
        try {
          const snap = await getDoc(threadRef);
          if (!snap.exists()) {
            await setDoc(threadRef, {
              teacherId: uid,
              teacherName: state.profile?.fullName || state.user.displayName || '',
              teacherEmail: state.user.email || '',
              lastMessage: '', lastMessageAt: null, lastSenderRole: '',
              unreadByAdmin: 0, unreadByTeacher: 0
            });
          }
        } catch (e) { console.warn('[feedback init]', e); }

        state.subFeedbackThread = onSnapshot(threadRef, s => {
          state.feedbackThread = s.exists() ? { id: s.id, ...s.data() } : null;
          document.querySelectorAll('[data-ttab="feedback"]').forEach(btn => {
            const existing = btn.querySelector('.tab-badge');
            if (existing) existing.remove();
            const unread = state.feedbackThread?.unreadByTeacher || 0;
            if (unread > 0) {
              const b = document.createElement('span');
              b.className = 'tab-badge';
              b.textContent = unread > 9 ? '9+' : unread;
              btn.appendChild(b);
            }
          });
          if (state.teacherTab === 'feedback') renderTeacherChatMessages();
        }, err => console.error('[feedback thread]', err));
      }

      if (!state.subFeedbackMsgs) {
        state.subFeedbackMsgs = onSnapshot(
          query(collection(db, 'feedback_threads', uid, 'messages'), orderBy('createdAt', 'asc')),
          snap => {
            const serverMessages = snap.docs.map(d => ({ id: d.id, ...d.data() }));

            /* Match optimistic messages against server docs (by sender + text),
               tracking consumed SERVER ids so one server message can't satisfy
               more than one pending optimistic bubble. */
            const consumedServerIds = new Set();
            state.feedbackMessages.filter(m => m._pending).forEach(opt => {
              const match = serverMessages.find(s =>
                s.fromUid === opt.fromUid && s.text === opt.text && !consumedServerIds.has(s.id)
              );
              if (match) { consumedServerIds.add(match.id); opt._matched = true; }
            });
            const stillPending = state.feedbackMessages.filter(m => m._pending && !m._matched);

            state.feedbackMessages = [...serverMessages, ...stillPending].sort((a, b) => {
              const ta = toDate(a.createdAt)?.getTime() || 0;
              const tb = toDate(b.createdAt)?.getTime() || 0;
              return ta - tb;
            });

            /* Delivery ack for admin messages */
            snap.docChanges().forEach(change => {
              if (change.type !== 'added') return;
              const msg = change.doc.data();
              if (msg.fromRole !== 'admin') return;
              if (msg.deliveredAt) return;
              updateDoc(doc(db, 'feedback_threads', uid, 'messages', change.doc.id), {
                deliveredAt: serverTimestamp(),
                deliveredByUid: uid
              }).catch(() => {});
            });

            if (state.teacherTab === 'feedback') {
              const box = document.getElementById('fb-messages');
              const nearBottom = box ? (box.scrollHeight - box.scrollTop - box.clientHeight) < 80 : true;
              renderTeacherChatMessages();
              if (box && nearBottom) box.scrollTop = box.scrollHeight;
            }
          },
          err => console.error('[feedback msgs]', err)
        );
      }
    }

    function renderTeacherFeedback() {
      return `
        <h1 style="font-size:22px;font-weight:900;margin:0 0 6px;color:#fff;">${t('fb_title')}</h1>
        <p style="font-size:13px;color:var(--muted);margin:0 0 16px;">${t('fb_sub')}</p>
        <div class="chat-wrap" id="chat-wrap">
          <div class="chat-head">
            <div class="ch-icon">A</div>
            <div class="ch-text">
              <h3>${t('fb_admin_name')}</h3>
              <p><span class="online-dot"></span>${t('fb_admin_sub')}</p>
            </div>
          </div>
          <div id="fb-messages"></div>
          <form id="fb-send-form" class="chat-form">
            <input id="fb-send-input" class="input" placeholder="${t('fb_placeholder')}" autocomplete="off" />
            <button type="submit" class="btn btn-primary" aria-label="${t('fb_send')}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
          <button class="scroll-bottom-btn" id="fb-scroll-bottom" aria-label="Scroll to latest">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>`;
    }

    function msgStatusIcon(m) {
      if (m.fromRole !== 'teacher') return '';
      if (m._pending) return '<span class="msg-status pending">⏱</span>';
      if (m.readAt) return '<span class="msg-status seen">✓✓</span>';
      if (m.deliveredAt) return '<span class="msg-status">✓✓</span>';
      return '<span class="msg-status">✓</span>';
    }

    function renderTeacherChatMessages() {
      const box = document.getElementById('fb-messages');
      if (!box) return;

      if (state.teacherTab === 'feedback' && !document.hidden) markAdminMessagesAsRead();

      if (state.feedbackMessages.length === 0) {
        box.innerHTML = `<div class="chat-empty">${t('fb_empty')}</div>`;
        const sbtn = document.getElementById('fb-scroll-bottom');
        if (sbtn) sbtn.classList.remove('show');
        return;
      }

      const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
      let html = '';
      let lastDateKey = '', lastFromRole = '', lastFromUid = '';

      state.feedbackMessages.forEach(m => {
        const d = toDate(m.createdAt);

        if (d) {
          const key = d.toDateString();
          if (key !== lastDateKey) {
            const isToday = d.toDateString() === new Date().toDateString();
            const label = isToday ? t('today') : d.toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' });
            html += `<div class="msg-date-sep"><span>${label}</span></div>`;
            lastDateKey = key;
            lastFromRole = '';
            lastFromUid = '';
          }
        }

        const mine = m.fromRole === 'teacher';
        const grouped = m.fromRole === lastFromRole && m.fromUid === lastFromUid;
        html += `<div class="msg-row ${mine ? 'mine' : 'theirs'} ${grouped ? 'grouped' : ''}">
          <div class="msg-bubble">${escapeHtml(m.text || '')}</div>
          <div class="msg-meta">${fmtTime(m.createdAt)} ${msgStatusIcon(m)}</div>
        </div>`;
        lastFromRole = m.fromRole;
        lastFromUid  = m.fromUid;
      });

      box.innerHTML = html;
      if (nearBottom) box.scrollTop = box.scrollHeight;
      updateScrollBottomButton();
    }

    function updateScrollBottomButton() {
      const box = document.getElementById('fb-messages');
      const btn = document.getElementById('fb-scroll-bottom');
      if (!box || !btn) return;
      const dist = box.scrollHeight - box.scrollTop - box.clientHeight;
      btn.classList.toggle('show', dist > 120);
    }

    async function markAdminMessagesAsRead() {
      if (!state.user) return;
      const uid = state.user.uid;
      const unread = state.feedbackMessages.filter(m => m.fromRole === 'admin' && m.id && !m.readAt);
      const unreadCounter = state.feedbackThread?.unreadByTeacher || 0;
      if (unread.length === 0 && unreadCounter === 0) return;

      await Promise.all(unread.map(m =>
        updateDoc(doc(db, 'feedback_threads', uid, 'messages', m.id), { readAt: serverTimestamp() }).catch(() => {})
      ));
      if (unreadCounter > 0) {
        updateDoc(doc(db, 'feedback_threads', uid), { unreadByTeacher: 0 }).catch(() => {});
      }
    }

    function bindFeedbackEvents() {
      const form  = document.getElementById('fb-send-form');
      const input = document.getElementById('fb-send-input');
      const box   = document.getElementById('fb-messages');
      const sbtn  = document.getElementById('fb-scroll-bottom');

      if (form && input) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const text = input.value.trim();
          if (!text) return;
          input.value = '';
          await sendTeacherMessage(text);
        };
      }

      if (sbtn && box) {
        sbtn.onclick = () => { box.scrollTop = box.scrollHeight; sbtn.classList.remove('show'); };
      }

      if (box) {
        box.onscroll = updateScrollBottomButton;
        box.scrollTop = box.scrollHeight;
        updateScrollBottomButton();
      }

      renderTeacherChatMessages();
    }

    async function sendTeacherMessage(text) {
      if (!text) return;
      const uid = state.user.uid;
      const tempId = `tmp_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
      const optimistic = {
        id: tempId, _pending: true,
        fromRole: 'teacher', fromUid: uid, text,
        createdAt: new Date(), deliveredAt: null, readAt: null
      };

      state.feedbackMessages.push(optimistic);
      const box = document.getElementById('fb-messages');
      renderTeacherChatMessages();
      if (box) box.scrollTop = box.scrollHeight;

      try {
        await addDoc(collection(db, 'feedback_threads', uid, 'messages'), {
          fromRole: 'teacher',
          fromUid: uid,
          text,
          teacherName: state.profile?.fullName || '',
          createdAt: serverTimestamp()
        });
        await updateDoc(doc(db, 'feedback_threads', uid), {
          lastMessage: text,
          lastMessageAt: serverTimestamp(),
          lastSenderRole: 'teacher',
          unreadByAdmin: increment(1)
        });
      } catch (err) {
        console.error('[send message]', err);
        toast(err?.message ? `${t('fb_send_fail')} (${err.message})` : t('fb_send_fail'), 'error');
        state.feedbackMessages = state.feedbackMessages.filter(m => m.id !== tempId);
        renderTeacherChatMessages();
      }
    }

    /* ==================== ATTEND / END ==================== */
    async function handleAttend(cpdId, btn) {
      const cpd = state.cpds.find(c => c.id === cpdId);
      if (!cpd) return toast('Session not found', 'error');
      if (state.myAttendances.find(a => a.state === 'active')) return toast(t('finish_current'), 'warn');

      const orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spin">◐</span> ${t('locating')}`;
      try {
        const pos = await getPositionOnce();
        const radius = cpd.radius || SCHOOL_RADIUS;
        const dist = distanceMeters(pos.lat, pos.lng, cpd.venueLat, cpd.venueLng);
        if (dist > radius) throw new Error(`You must be at the venue (${Math.round(dist)}m away, max ${radius}m).`);

        btn.innerHTML = `<span class="spin">◐</span> Verifying face...`;
        const selfie = await verifyFace();
        if (!selfie) { btn.disabled = false; btn.innerHTML = orig; return; }

        btn.innerHTML = `<span class="spin">◐</span> ${t('finalizing')}`;
        await addDoc(collection(db, 'attendance'), {
          teacherId: state.user.uid,
          teacherName: state.profile?.fullName || state.user.email,
          cpdId: cpd.id,
          cpdTitle: cpd.title,
          state: 'active',
          startTime: serverTimestamp(),
          startLat: pos.lat,
          startLng: pos.lng,
          liveLat: pos.lat,
          liveLng: pos.lng,
          selfie,
          verifiedIn: true
        });
        toast('Attendance recorded!', 'success');
        ensureWatchForActive();
      } catch (err) {
        toast(err.message || 'Attendance failed.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = orig;
      }
    }

    async function handleEnd(attId, btn) {
      const att = state.myAttendances.find(a => a.id === attId);
      if (!att) return;
      const cpd = state.cpds.find(c => c.id === att.cpdId);
      if (!cpd) return toast('Session not found', 'error');

      const orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spin">◐</span> ${t('locating')}`;
      try {
        const pos = await getPositionOnce();
        const radius = cpd.radius || SCHOOL_RADIUS;
        const dist = distanceMeters(pos.lat, pos.lng, cpd.venueLat, cpd.venueLng);
        if (dist > radius) throw new Error(`You must be at the venue to end (${Math.round(dist)}m away).`);

        btn.innerHTML = `<span class="spin">◐</span> Verifying face...`;
        const selfie = await verifyFace();
        if (!selfie) { btn.disabled = false; btn.innerHTML = orig; return; }

        btn.innerHTML = `<span class="spin">◐</span> ${t('finalizing')}`;
        await updateDoc(doc(db, 'attendance', att.id), {
          state: 'completed',
          endTime: serverTimestamp(),
          endLat: pos.lat,
          endLng: pos.lng,
          selfieOut: selfie,
          verifiedOut: true
        });
        clearWatch();
        showThankYouModal(false);
      } catch (err) {
        toast(err.message || 'End failed.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = orig;
      }
    }

    function ensureWatchForActive() {
      const active = state.myAttendances.find(a => a.state === 'active');
      if (!active) { clearWatch(); return; }
      if (state.watchingFor === active.id) return;
      clearWatch();
      state.watchingFor = active.id;
      state.watchId = navigator.geolocation.watchPosition(
        pos => {
          updateDoc(doc(db, 'attendance', active.id), {
            liveLat: pos.coords.latitude,
            liveLng: pos.coords.longitude,
            lastLiveAt: serverTimestamp()
          }).catch(() => {});
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 30000 }
      );
    }

    /* ==================== DAILY SIGN IN / OUT ==================== */
    async function handleDailySignIn(btn) {
      const orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spin">◐</span> ${t('locating')}`;
      try {
        const pos = await getPositionOnce();
        const dist = distanceMeters(pos.lat, pos.lng, SCHOOL_LAT, SCHOOL_LNG);
        if (dist > SCHOOL_RADIUS) throw new Error(`${t('daily_out_of_range')} (${Math.round(dist)}m)`);

        btn.innerHTML = `<span class="spin">◐</span> Verifying face...`;
        const selfie = await verifyFace();
        if (!selfie) { btn.disabled = false; btn.innerHTML = orig; return; }

        const today = todayLocalDateKey();
        const nowMins = getMinutesSinceMidnight(new Date());
        const lateMinutes = Math.max(0, nowMins - state.settings.startTime);

        await setDoc(doc(db, 'daily_attendance', `${state.user.uid}_${today}`), {
          teacherId: state.user.uid,
          teacherName: state.profile?.fullName || state.user.email,
          date: today,
          state: 'in',
          signInAt: serverTimestamp(),
          signInLat: pos.lat,
          signInLng: pos.lng,
          signInSelfie: selfie,
          lateMinutes,
          verifiedIn: true
        });
        toast('Signed in!', 'success');
        showThankYouModal(true);
      } catch (err) {
        toast(err.message || 'Sign-in failed.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = orig;
      }
    }

    async function handleDailySignOut(btn) {
      const orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spin">◐</span> ${t('locating')}`;
      try {
        const pos = await getPositionOnce();
        const dist = distanceMeters(pos.lat, pos.lng, SCHOOL_LAT, SCHOOL_LNG);
        if (dist > SCHOOL_RADIUS) throw new Error(`${t('daily_out_of_range')} (${Math.round(dist)}m)`);

        btn.innerHTML = `<span class="spin">◐</span> Verifying face...`;
        const selfie = await verifyFace();
        if (!selfie) { btn.disabled = false; btn.innerHTML = orig; return; }

        const today = todayLocalDateKey();
        const nowMins = getMinutesSinceMidnight(new Date());
        const earlyLeaveMinutes = Math.max(0, state.settings.endTime - nowMins);

        await updateDoc(doc(db, 'daily_attendance', `${state.user.uid}_${today}`), {
          state: 'out',
          signOutAt: serverTimestamp(),
          signOutLat: pos.lat,
          signOutLng: pos.lng,
          signOutSelfie: selfie,
          earlyLeaveMinutes,
          verifiedOut: true
        });
        toast('Signed out!', 'success');
        showThankYouModal(true);
      } catch (err) {
        toast(err.message || 'Sign-out failed.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = orig;
      }
    }
  </script>
