<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#071B33" />
  <title>iMENA Smart Attendance — Admin</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/zBDCZhCb/i-MENA-Smart-CPD-Badge.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
  <style>
    :root { --cyan: #00ffcc; }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; color: #e2e8f0; -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; background: #0a0f1e; }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }

    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse at 20% 10%, rgba(0,136,255,0.18), transparent 45%), radial-gradient(ellipse at 80% 60%, rgba(0,255,204,0.12), transparent 50%), linear-gradient(180deg, #050e2a 0%, #0a1a3a 50%, #050e2a 100%);
    }
    #bg-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; display: block; background: transparent; opacity: 0; transition: opacity 0.8s ease; }
    #bg-canvas.ready { opacity: 1; }
    #app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    .header { position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; gap: 8px; background: rgba(10,15,30,0.72); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-bottom: 1px solid rgba(255,255,255,0.06); padding-top: max(10px, env(safe-area-inset-top)); }
    .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .header-logo { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }
    .header-title { font-size: 14px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .header-title span { display: block; font-size: 9px; color: #00ffcc; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .avatar-btn { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; border: 2px solid #00ffcc; padding: 0; background: #fff; flex-shrink: 0; }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .profile-modal { position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .profile-modal.open { opacity: 1; pointer-events: auto; }
    .profile-card { background: #1e293b; color: #fff; border-radius: 24px; padding: 24px; width: 100%; max-width: 340px; text-align: center; transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    .profile-modal.open .profile-card { transform: translateY(0); }
    .profile-img { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 16px; border: 3px solid #00ffcc; object-fit: cover; }
    .profile-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .profile-email { font-size: 13px; color: #94a3b8; margin-bottom: 12px; word-break: break-all; }
    .profile-role { display: inline-block; padding: 6px 12px; border-radius: 99px; background: rgba(0,255,204,0.15); color: #00ffcc; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 20px; }
    .profile-actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-home, .btn-logout { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; }
    .btn-home { background: rgba(255,255,255,0.05); color: #fff; }
    .btn-logout { background: rgba(239,68,68,0.15); color: #f87171; }

    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px 20px; border-radius: 14px; font-size: 15px; font-weight: 800; transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s; min-height: 48px; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg,#00ffcc,#0088ff); color: #0a0f1e; box-shadow: 0 6px 20px rgba(0,255,204,0.3); }
    .btn-danger { background: linear-gradient(135deg,#ef4444,#dc2626); color: #fff; box-shadow: 0 6px 20px rgba(239,68,68,0.35); }
    .btn-ghost { background: rgba(255,255,255,0.06); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); }

    .input, select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(148,163,184,0.25); background: rgba(15,23,42,0.6); font-size: 15px; margin-bottom: 12px; color: #e2e8f0; appearance: none; }
    .input:focus, select:focus { outline: none; border-color: #00ffcc; box-shadow: 0 0 0 4px rgba(0,255,204,0.15); }

    .main { flex: 1; padding: 18px 14px calc(80px + env(safe-area-inset-bottom)); max-width: 800px; margin: 0 auto; width: 100%; }
    .main.main-wide { max-width: 1400px; }

    .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; z-index: 90; background: rgba(10,15,30,0.85); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-top: 1px solid rgba(255,255,255,0.08); padding-bottom: env(safe-area-inset-bottom); }
    .tab-btn { flex: 1; padding: 10px 2px; color: #64748b; font-size: 8.5px; font-weight: 700; text-align: center; transition: color 0.2s; text-transform: uppercase; letter-spacing: 0.02em; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; overflow: hidden; text-overflow: ellipsis; position: relative; }
    .tab-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
    .tab-btn.active { color: #00ffcc; filter: drop-shadow(0 0 8px rgba(0,255,204,0.5)); }
    .tab-btn .tab-badge { position: absolute; top: 6px; right: calc(50% - 18px); background: #ef4444; color: #fff; font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 99px; min-width: 16px; }

    .a-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .a-stat { background: rgba(15,23,42,0.55); backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(0,255,204,0.2); border-radius: 14px; padding: 14px; text-align: center; }
    .a-stat .val { font-size: 24px; font-weight: 900; color: #fff; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(0,255,204,0.35); }
    .a-stat .lbl { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-top: 6px; letter-spacing: 0.05em; }

    .a-session-card { background: rgba(15,23,42,0.55); backdrop-filter: blur(18px); border: 1px solid rgba(0,255,204,0.18); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .a-session-card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .a-session-card h3 { font-size: 15px; color: #fff; margin: 4px 0 4px; word-break: break-word; }
    .a-session-card p { font-size: 12px; color: #94a3b8; margin: 0; }
    .a-session-card .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .a-session-card .actions .btn { padding: 8px 12px; font-size: 12px; min-height: auto; width: auto; }

    .section-title { font-size: 13px; font-weight: 800; color: #94a3b8; margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 0.06em; padding-left: 4px; display: flex; justify-content: space-between; align-items: center; }
    .section-title:first-child { margin-top: 0; }

    .filter-tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab { padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,0.05); color: #94a3b8; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
    .filter-tab.active { background: rgba(0,255,204,0.12); color: #00ffcc; border-color: rgba(0,255,204,0.3); }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
    .badge-live { background: rgba(16,185,129,0.18); color: #34d399; border: 1px solid rgba(16,185,129,0.35); }
    .badge-upcoming { background: rgba(148,163,184,0.15); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.2); }
    .badge-ended { background: rgba(148,163,184,0.1); color: #94a3b8; border: 1px solid rgba(148,163,184,0.15); }
    .badge-verified { background: rgba(14,165,233,0.18); color: #38bdf8; border: 1px solid rgba(14,165,233,0.35); }
    .badge-flagged { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .badge-absent { background: rgba(239,68,68,0.18); color: #f87171; border: 1px solid rgba(239,68,68,0.35); }
    .badge-out { background: rgba(56,189,248,0.18); color: #38bdf8; border: 1px solid rgba(56,189,248,0.35); }
    .badge-late { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .badge-missing { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); }
    .badge-type { background: rgba(139,92,246,0.15); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.35); }

    .past-stats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .past-stat { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: rgba(255,255,255,0.06); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.08); }
    .past-stat.ok { color: #38bdf8; border-color: rgba(56,189,248,0.28); background: rgba(56,189,248,0.1); }

    .cal-wrap { background: rgba(15,23,42,0.72); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .cal-title { font-size: 16px; font-weight: 800; color: #fff; }
    .cal-nav { display: flex; gap: 6px; }
    .cal-nav button { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.06); color: #cbd5e1; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .cal-nav button:active { transform: scale(0.95); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow { text-align: center; font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; padding: 6px 0; }
    .cal-day { aspect-ratio: 1; border-radius: 8px; background: rgba(255,255,255,0.03); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #cbd5e1; cursor: pointer; position: relative; transition: background 0.15s; }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.has-cpd { background: rgba(139,92,246,0.18); border: 1px solid rgba(139,92,246,0.4); color: #fff; }
    .cal-day.has-cpd::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: #8b5cf6; }
    .cal-day.has-cpd.past-only { background: rgba(56,189,248,0.14); border-color: rgba(56,189,248,0.42); }
    .cal-day.has-cpd.past-only::after { background: #38bdf8; }
    .cal-day.has-cpd.live-day { background: rgba(16,185,129,0.18); border-color: rgba(16,185,129,0.45); }
    .cal-day.has-cpd.live-day::after { background: #10b981; }
    .cal-day.today { border: 2px solid #06b6d4; }
    .cal-day.selected { background: linear-gradient(135deg,#ec4899,#8b5cf6); color: #fff; border-color: transparent; }
    .cal-day.selected::after { background: #fff; }
    .cal-day:active:not(.empty) { transform: scale(0.94); }
    .cal-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08); }
    .cal-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #94a3b8; font-weight: 600; }
    .cal-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .cal-legend .dot-ended { background: #38bdf8; box-shadow: 0 0 8px rgba(56,189,248,0.5); }
    .cal-legend .dot-live { background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.5); }
    .cal-legend .dot-upcoming { background: #8b5cf6; box-shadow: 0 0 8px rgba(139,92,246,0.5); }

    .form-card { background: rgba(15,23,42,0.72); backdrop-filter: blur(20px); border: 1px solid rgba(0,255,204,0.22); border-radius: 20px; padding: 20px; }
    .form-card label { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.05em; }
    .form-card h2 { font-size: 20px; font-weight: 900; color: #fff; margin: 0 0 6px; }
    .form-card .sub { font-size: 13px; color: #94a3b8; margin: 0 0 20px; }
    .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { padding: 8px 14px; border-radius: 10px; background: rgba(0,255,204,0.08); border: 1px solid rgba(0,255,204,0.3); color: #00ffcc; font-size: 12px; font-weight: 700; }
    .chip:active { transform: scale(0.96); }
    .chip.active { background: #00ffcc; color: #0a0f1e; }
    .chip-neutral { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); color: #cbd5e1; }
    .summary-line { background: rgba(0,0,0,0.4); border: 1px dashed rgba(0,255,204,0.35); border-radius: 12px; padding: 12px 14px; margin: 14px 0 16px; font-size: 13px; color: #cbd5e1; line-height: 1.5; }
    .summary-line strong { color: #00ffcc; }

    .map-card { background: rgba(15,23,42,0.72); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
    .map-card h3 { font-size: 14px; font-weight: 800; color: #fff; margin: 0 0 12px; }
    .detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .detail-table th { text-align: left; padding: 10px 8px; font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); letter-spacing: 0.05em; }
    .detail-table td { padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.06); vertical-align: middle; color: #cbd5e1; }
    .att-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 2px solid rgba(0,255,204,0.3); }
    .att-name { display: flex; align-items: center; gap: 10px; }

    .greet-card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; margin-bottom: 16px; border-radius: 20px; position: relative; overflow: hidden; background: rgba(15,23,42,0.72); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); border: 1px solid rgba(0,255,204,0.25); }
    .greet-card::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(135deg, rgba(0,255,204,0.09), rgba(0,136,255,0.09)); }
    .greet-emoji { font-size: 34px; line-height: 1; flex-shrink: 0; animation: greetFloat 4s ease-in-out infinite; }
    @keyframes greetFloat { 50% { transform: translateY(-4px) rotate(5deg); } }
    .greet-text { min-width: 0; }
    .greet-text h2 { font-size: 18px; font-weight: 900; margin: 0 0 4px; color: #fff; letter-spacing: -0.02em; line-height: 1.25; }
    .greet-text p { font-size: 12.5px; color: #94a3b8; margin: 0; line-height: 1.5; }

    .empty { text-align: center; padding: 40px 20px; color: #64748b; font-size: 14px; background: rgba(15,23,42,0.55); border-radius: 16px; border: 1px dashed rgba(255,255,255,0.08); }
    .empty strong { display: block; color: #94a3b8; font-size: 15px; margin-bottom: 6px; }

    .skeleton { animation: skeletonShimmer 1.5s ease-in-out infinite; background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.10), rgba(255,255,255,0.04)); background-size: 200% 100%; border-radius: 14px; }
    @keyframes skeletonShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-line { height: 16px; margin-bottom: 10px; }
    .skel-card { height: 80px; margin-bottom: 12px; }
    .skel-header { height: 44px; width: 60%; margin-bottom: 20px; }

    #toast-root { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
    .toast { padding: 14px 16px; border-radius: 14px; font-weight: 700; text-align: center; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.35); animation: slideUp 0.3s ease; }
    .toast.success { background: linear-gradient(135deg,#10b981,#06b6d4); }
    .toast.error { background: linear-gradient(135deg,#ef4444,#dc2626); }
    .toast.warn { background: linear-gradient(135deg,#f59e0b,#d97706); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loader { position: fixed; inset: 0; background: #0a0f1e; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #fff; }
    .loader-ring { width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(0,217,255,0.2); border-top-color: #00D9FF; animation: spin 1s linear infinite; }

    .t-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .t-stat { background: rgba(15,23,42,0.55); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 14px; text-align: center; position: relative; overflow: hidden; }
    .t-stat.live { border-color: rgba(16,185,129,0.4); background: rgba(16,185,129,0.08); }
    .t-stat .val { font-size: 26px; font-weight: 900; line-height: 1; color: #fff; }
    .t-stat.live .val { color: #34d399; text-shadow: 0 0 12px rgba(16,185,129,0.4); }
    .t-stat .lbl { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-top: 6px; letter-spacing: 0.05em; }

    .cat-filter-row { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; }
    .cat-filter-row::-webkit-scrollbar { display: none; }
    .cat-filter { padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,0.05); color: #94a3b8; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
    .cat-filter.active { background: rgba(0,255,204,0.12); color: #00ffcc; border-color: rgba(0,255,204,0.3); }

    .csv-btn-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .csv-btn { padding: 10px 14px; border-radius: 10px; background: rgba(0,255,204,0.12); border: 1px solid rgba(0,255,204,0.3); color: #00ffcc; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
    .csv-btn:active { transform: scale(0.97); }
    .csv-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .csv-btn.warn { background: rgba(139,92,246,0.12); border-color: rgba(139,92,246,0.35); color: #c4b5fd; }

    .teacher-search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(148,163,184,0.25); background: rgba(15,23,42,0.6); font-size: 14px; color: #e2e8f0; margin-bottom: 14px; }
    .teacher-search:focus { outline: none; border-color: #00ffcc; box-shadow: 0 0 0 4px rgba(0,255,204,0.15); }
    .teacher-search::placeholder { color: #64748b; }

    .ongoing-banner { padding: 12px 14px; margin-bottom: 14px; border-radius: 14px; background: linear-gradient(135deg, rgba(16,185,129,0.12), rgba(6,182,212,0.08)); border: 1px solid rgba(16,185,129,0.35); display: flex; align-items: center; gap: 10px; }
    .ongoing-banner .pulse { width: 10px; height: 10px; border-radius: 50%; background: #10b981; animation: pulseDot 1.5s ease-in-out infinite; flex-shrink: 0; }
    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    const bgEngine = {
      renderer: null, adminScene: null, active: false, clock: null, time: 0, inited: false,
      init() {
        if (this.inited) return;
        this.inited = true;
        if (skip3D) { document.getElementById('bg-canvas').style.display = 'none'; return; }
        try {
          this.renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: false, antialias: false, powerPreference: 'low-power' });
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobileDevice ? 1.2 : 1.8));
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.renderer.outputColorSpace = THREE.SRGBColorSpace;
          this.clock = new THREE.Clock();
          this.adminScene = this.build();
          window.addEventListener('resize', () => this.resize());
          this.active = true;
          setTimeout(() => document.getElementById('bg-canvas').classList.add('ready'), 100);
          this.animate();
        } catch (e) {
          console.warn('[bgEngine]', e);
          document.getElementById('bg-canvas').style.display = 'none';
        }
      },
      build() {
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x0a1a3a, 100, 550);
        const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 1500);
        camera.position.set(0, 12, 60); camera.lookAt(0, 8, -30);
        const skyMat = new THREE.ShaderMaterial({
          side: THREE.BackSide, depthWrite: false,
          uniforms: { uTime: { value: 0 }, uTop: { value: new THREE.Color(0x0a1a4a) }, uMid: { value: new THREE.Color(0x1a3a7a) }, uHorizon: { value: new THREE.Color(0x2a5a9a) }, uDeep: { value: new THREE.Color(0x050e2a) }, uGlow: { value: new THREE.Color(0x2a70c8) } },
          vertexShader: `varying vec3 vDir; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vDir=normalize(wp.xyz); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
          fragmentShader: `uniform float uTime; uniform vec3 uTop,uMid,uHorizon,uDeep,uGlow; varying vec3 vDir;
            void main(){ vec3 dir=normalize(vDir); float h=clamp(dir.y*0.5+0.5,0.0,1.0);
              vec3 col=mix(uDeep,uHorizon,smoothstep(0.32,0.55,h)); col=mix(col,uMid,smoothstep(0.55,0.78,h)); col=mix(col,uTop,smoothstep(0.78,1.0,h));
              gl_FragColor=vec4(col,1.0); }`
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(900, 32, 24), skyMat));
        scene.add(new THREE.HemisphereLight(0x4a80c8, 0x0a1028, 0.8));
        const nodes = [], nodePositions = [], nodeCount = isMobileDevice ? 24 : 40;
        const nodeGeo = new THREE.SphereGeometry(0.22, 6, 6);
        for (let i = 0; i < nodeCount; i++) {
          const mat = new THREE.MeshBasicMaterial({ color: 0x9ae0ff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
          const node = new THREE.Mesh(nodeGeo, mat);
          node.position.set((Math.random() - 0.5) * 80, 3 + Math.random() * 40, -30 - Math.random() * 200);
          node.userData = { phase: Math.random() * Math.PI * 2, baseScale: 0.7 + Math.random() * 0.8 };
          node.scale.setScalar(node.userData.baseScale);
          scene.add(node); nodes.push(node); nodePositions.push(node.position.clone());
        }
        return { scene, camera, skyMat, nodes, nodePositions };
      },
      resize() {
        if (!this.renderer) return;
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        if (this.adminScene) { this.adminScene.camera.aspect = window.innerWidth / window.innerHeight; this.adminScene.camera.updateProjectionMatrix(); }
      },
      animate() {
        if (!this.active) return;
        requestAnimationFrame(() => this.animate());
        if (document.hidden) { this.clock.getDelta(); return; }
        const dt = Math.min(this.clock.getDelta(), 0.05);
        this.time += dt * MOTION_SCALE;
        if (!this.adminScene) return;
        const s = this.adminScene;
        s.nodes.forEach((n, i) => {
          n.position.z += 6 * dt;
          if (n.position.z > 40) {
            n.position.z = -220 - Math.random() * 40;
            n.position.x = (Math.random() - 0.5) * 80;
            n.position.y = 3 + Math.random() * 40;
          }
          s.nodePositions[i].copy(n.position);
          const pulse = 0.7 + Math.sin(this.time * 2.0 + n.userData.phase) * 0.5;
          n.scale.setScalar(n.userData.baseScale * (0.85 + pulse * 0.45));
        });
        s.skyMat.uniforms.uTime.value = this.time;
        s.camera.position.x = Math.sin(this.time * 0.2) * 3;
        s.camera.position.y = 12 + Math.sin(this.time * 0.1) * 1;
        s.camera.lookAt(Math.sin(this.time * 0.15) * 2, 8, -30);
        this.renderer.render(s.scene, s.camera);
      }
    };

    function buildTeacherStatusMap() {

      state.allAttendances.forEach(a => {

        if (!entry.lastAttended || attTime > (toDate(entry.lastAttended)?.getTime() || 0)) {

    function downloadCSV(filename, rows) {
      const csv = '\uFEFF' + rows.map(row => row.map(cell => {
        const v = String(cell ?? '');
        return '"' + v.replace(/"/g, '""') + '"';
      }).join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = filename; link.style.display = 'none';
      document.body.appendChild(link); link.click();
      setTimeout(() => { document.body.removeChild(link); URL.revokeObjectURL(url); }, 100);
    }

      const h = new Date().getHours();
      const fullName = state.profile?.fullName || state.user?.displayName || state.user?.email || 'Friend';
      const name = (fullName.split(/[\s@]/)[0] || 'Friend');
      let emoji, greetings;
      if (h >= 5 && h < 11) { emoji = '☀️'; greetings = ['Good morning','Hello','Hey','Welcome back','Rise and shine']; }
      else if (h >= 11 && h < 14) { emoji = '🍽️'; greetings = ['Have a good lunch','Hello','Hey','Good day']; }
      else if (h >= 14 && h < 18) { emoji = '🌤️'; greetings = ['Good afternoon','Hello','Hey','Welcome back']; }
      else if (h >= 18 && h < 22) { emoji = '🌆'; greetings = ['Good evening','Hello','Hey','Welcome']; }
      else { emoji = '🌙'; greetings = ['Good night','Hello','Hey','Working late']; }
      return { name, emoji, greeting: pickDaily(greetings, 'greet'), sub: pickDaily(ADMIN_SUBLINES, 'adminsub') };
    }
    function greetingCardHtml() {
      const g = getGreetingInfo();
      return `<div class="greet-card"><div class="greet-emoji">${g.emoji}</div><div class="greet-text"><h2>${escapeHtml(g.greeting)}, ${escapeHtml(g.name)}</h2><p>${escapeHtml(g.sub)}</p></div></div>`;
    }

    /* ==================== AUTH ==================== */
    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.replace('index.html'); return; }
      state.user = user;
      document.getElementById('app').innerHTML = renderSkeleton();
      try {
        const ref = doc(db, 'users', user.uid);
        const snap = await getDoc(ref);
        if (!snap.exists()) { window.location.replace('index.html'); return; }
        state.profile = snap.data();
        if (user.photoURL && state.profile.photoURL !== user.photoURL) {
          updateDoc(ref, { photoURL: user.photoURL }).catch(() => {});
          state.profile.photoURL = user.photoURL;
        }
      } catch (err) { console.error('[profile]', err); window.location.replace('index.html'); return; }
      if (state.profile.role !== 'admin') { window.location.replace('teacher.html'); return; }
      state.loading = false;
      goAdmin();
      ensureLessonPlanPreviewShell();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (window.requestIdleCallback) requestIdleCallback(() => bgEngine.init(), { timeout: 1500 });
          else setTimeout(() => bgEngine.init(), 200);
        });
      });
    });

    function renderSkeleton() {
      return `${headerHtmlSkeleton()}<main class="main"><div class="skeleton skel-header"></div><div class="skeleton skel-card" style="height:64px"></div><div class="a-stat-grid"><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div></div><div class="skeleton skel-line" style="width:40%"></div><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div></main>`;
    }
    function headerHtmlSkeleton() {
      return `<header class="header"><div class="header-left"><div class="skeleton" style="width:34px;height:34px;border-radius:8px"></div><div class="skeleton" style="width:140px;height:20px;border-radius:6px"></div></div></header>`;
    }

    /* ==================== HEADER ==================== */
    function headerHtml() {
      const name = state.profile?.fullName || state.user?.displayName || 'User';
      const src = avatarUrlFor(state.user?.photoURL || state.profile?.photoURL, name, 128);
      const fallback = avatarUrlFor(null, name, 128);
      return `
        <header class="header">
          <div class="header-left">
            <img src="${LOGO_URL}" class="header-logo" alt="Logo" />
            <div class="header-title">iMENA SMART ATTENDANCE<span>${t('admin')} Portal</span></div>
          </div>
          <div class="header-right">
            <button class="avatar-btn" id="btn-profile" aria-label="Profile">
              <img src="${escapeHtml(src)}" alt="Profile" onerror="this.onerror=null;this.src='${escapeHtml(fallback)}';" />
            </button>
          </div>
        </header>
        <div class="profile-modal" id="profile-modal">
          <div class="profile-card">
            <img src="${escapeHtml(src)}" class="profile-img" alt="Profile" onerror="this.onerror=null;this.src='${escapeHtml(fallback)}';" />
            <div class="profile-name">${escapeHtml(name)}</div>
            <div class="profile-email">${escapeHtml(state.user?.email || '')}</div>
            <div class="profile-role">${t('admin')}</div>
            <div class="profile-actions">
              <a href="index.html" class="btn-home">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-5a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 001 1h3a1 1 0 001-1V10"/></svg>
                ${t('home')}
              </a>
              <button class="btn-logout" id="btn-logout">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                ${t('logout')}
              </button>
            </div>
          </div>
        </div>`;
    }
    function bindHeaderEvents() {
      const modal = document.getElementById('profile-modal');
      const btnProfile = document.getElementById('btn-profile');
      const btnLogout = document.getElementById('btn-logout');
      if (btnProfile) btnProfile.onclick = () => modal.classList.add('open');
      if (modal) modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };
      if (btnLogout) btnLogout.onclick = () => { if (confirm(t('msg_sign_out'))) signOut(auth); };
    }

    /* ==================== ROUTER ==================== */
    function handleDataUpdate() {
      if (state.view === 'admin' && state.adminTab !== 'new_cpd') renderAdmin();
      else if (state.view === 'teacher-detail') renderTeacherDetail();
      else if (state.view === 'cpd-detail') renderCpdDetail();
    }

    function goAdmin() {
      state.view = 'admin';
      state.teacherDetailName = null;
      if (!state.subCpds) state.subCpds = onSnapshot(collection(db, 'cpds'),
        snap => { state.cpds = snap.docs.map(d => ({ id: d.id, ...d.data() })); handleDataUpdate(); },
        err => console.error(err));
      if (!state.subAllAtt) state.subAllAtt = onSnapshot(collection(db, 'attendance'),
        snap => { state.allAttendances = snap.docs.map(d => ({ id: d.id, ...d.data() })); handleDataUpdate(); },
        err => console.error(err));
      if (!state.subTeachers) state.subTeachers = onSnapshot(collection(db, 'teachers'),
        snap => { state.teachers = snap.docs.map(d => ({ id: d.id, ...d.data() })); handleDataUpdate(); },
        err => console.error(err));
      if (!state.subSettings) state.subSettings = onSnapshot(doc(db, 'settings', 'attendance'), snap => {
        if (snap.exists()) {
          const d = snap.data();
          state.settings = {
            startTime: d.startTime || '08:00',
            endTime: d.endTime || '17:00',
            schoolRadius: d.schoolRadius || 150
          };
        }
        handleDataUpdate();
      });
      if (!state.subLessonPlans) state.subLessonPlans = onSnapshot(collection(db, 'lesson_plans'),
        snap => { state.lessonPlans = snap.docs.map(d => ({ id: d.id, ...d.data() })); handleDataUpdate(); },
        err => console.error(err));
      if (!state.subFeedback) state.subFeedback = onSnapshot(collection(db, 'feedback_threads'),
        snap => {
          state.feedbackThreads = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (b.lastMessageAt?.toMillis?.() || 0) - (a.lastMessageAt?.toMillis?.() || 0));
          if (state.adminTab === 'feedback' && state.view === 'admin') renderAdmin();
        },
        err => console.error('[feedback]', err));
      renderAdmin();
    }

    function adminTabBar() {
      const tabs = [
        { id: 'overview', label: 'Overview', icon: '<path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-5a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 001 1h3a1 1 0 001-1V10"/>' },
        { id: 'daily', label: 'Daily', icon: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>' },
        { id: 'teachers', label: 'Teachers', icon: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>' },
        { id: 'sessions', label: 'Sessions', icon: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>' },
        { id: 'lesson_plans', label: 'Lessons', icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>' },
        { id: 'feedback', label: 'Feedback', icon: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' }
      ];
      const unread = state.feedbackThreads.reduce((s, t) => s + (t.unreadByAdmin || 0), 0);
      return `<nav class="tab-bar">${tabs.map(tb => `
        <button class="tab-btn ${state.adminTab === tb.id ? 'active' : ''}" data-atab="${tb.id}">
          <svg viewBox="0 0 24 24">${tb.icon}</svg>
          ${tb.label}
          ${tb.id === 'feedback' && unread > 0 ? `<span class="tab-badge">${unread > 9 ? '9+' : unread}</span>` : ''}
        </button>`).join('')}</nav>`;
    }

    function renderAdmin() {
      let body = '';
      if (state.adminTab === 'sessions') body = renderAdminSessions();
      else if (state.adminTab === 'lesson_plans') body = renderAdminLessonPlans();
      else if (state.adminTab === 'new_cpd') body = renderAdminNew();
      else if (state.adminTab === 'teachers') body = renderAdminTeachers();
      else if (state.adminTab === 'daily') body = renderAdminDaily();
      else if (state.adminTab === 'feedback') body = renderAdminFeedback();
      else body = renderAdminOverview();
      const mainClass = ['teachers', 'daily', 'lesson_plans', 'feedback'].includes(state.adminTab) ? 'main main-wide' : 'main';
      document.getElementById('app').innerHTML = `${headerHtml()}<main class="${mainClass}">${body}</main>${state.adminTab === 'new_cpd' ? '' : adminTabBar()}`;
      bindHeaderEvents();
      document.querySelectorAll('[data-atab]').forEach(b => b.onclick = () => {
        state.adminTab = b.dataset.atab;
        state.calSelectedDay = null;
        if (state.adminTab === 'daily' || state.adminTab === 'teachers') ensureDailySub();
        renderAdmin();
      });
      const btnTopNew = document.getElementById('btn-top-new');
      if (btnTopNew) btnTopNew.onclick = () => { state.adminTab = 'new_cpd'; renderAdmin(); };
      document.querySelectorAll('[data-open-cpd]').forEach(el => { el.onclick = () => goCpdDetail(el.dataset.openCpd); });
      document.querySelectorAll('[data-del-cpd]').forEach(el => {
        el.onclick = async () => {
          if (!confirm(t('msg_delete'))) return;
          try { await deleteDoc(doc(db, 'cpds', el.dataset.delCpd)); toast('Deleted.', 'success'); }
          catch (err) { toast(err.message, 'error'); }
        };
      });
      document.querySelectorAll('[data-filter]').forEach(b => { b.onclick = () => { state.adminSessionFilter = b.dataset.filter; renderAdmin(); }; });
      if (state.adminTab === 'teachers') bindTeachersEvents();
      if (state.adminTab === 'new_cpd') bindAdminNewEvents();
      if (state.adminTab === 'daily') bindDailyEvents();
      if (state.adminTab === 'lesson_plans') bindLessonPlanEvents();
      if (state.adminTab === 'feedback') bindAdminFeedbackEvents();
    }

    /* ==================== OVERVIEW ==================== */
    function renderAdminOverview() {
      const list = state.cpds;
      const now = Date.now();
      const ongoing = list.filter(c => cpdStatus(c) === 'ongoing');
      const upcoming = list.filter(c => cpdStatus(c) === 'upcoming').sort((a, b) => (toDate(a.startTime)?.getTime() || 0) - (toDate(b.startTime)?.getTime() || 0));
      const nextSession = upcoming[0];
      const liveNow = ongoing.length;
      let nextStr = '—';
      if (nextSession) {
        const d = toDate(nextSession.startTime);
        if (d) {
          const diffMs = d.getTime() - now;
          const diffH = Math.floor(diffMs / 3600000);
          const diffM = Math.floor((diffMs % 3600000) / 60000);
          nextStr = diffH > 0 ? `${diffH}h ${diffM}m` : `${diffM}m`;
        }
      }
      const ongoingCards = ongoing.map(c => `
        <div class="a-session-card"><div class="row">
          <div style="flex:1;min-width:0"><div><span class="badge badge-live">● ${t('live')}</span><span class="badge badge-type">${escapeHtml(c.type || 'CPD')}</span></div><h3>${escapeHtml(c.title)}</h3><p>${fmtTime(c.startTime)} – ${fmtTime(c.endTime)} · ${escapeHtml(c.venueName || '')}</p></div>
          <div class="actions"><button data-open-cpd="${c.id}" class="btn btn-primary">${t('open')}</button></div>
        </div></div>`).join('');
      const upcomingCards = upcoming.slice(0, 4).map(c => `
        <div class="a-session-card"><div class="row">
          <div style="flex:1;min-width:0"><div><span class="badge badge-upcoming">${t('upcoming')}</span><span class="badge badge-type">${escapeHtml(c.type || 'CPD')}</span></div><h3>${escapeHtml(c.title)}</h3><p>${fmtDateTime(c.startTime)} · ${escapeHtml(c.venueName || '')}</p></div>
          <div class="actions"><button data-open-cpd="${c.id}" class="btn btn-primary">${t('open')}</button></div>
        </div></div>`).join('');
      const endedList = list.filter(c => cpdStatus(c) === 'ended').sort((a, b) => (toDate(b.startTime)?.getTime() || 0) - (toDate(a.startTime)?.getTime() || 0)).slice(0, 4);
      const endedCards = endedList.map(c => {
        const atts = state.allAttendances.filter(a => a.cpdId === c.id);
        const total = atts.length;
        const verified = atts.filter(a => a.verified).length;
        return `
        <div class="a-session-card"><div class="row">
          <div style="flex:1;min-width:0"><div><span class="badge badge-ended">${t('ended')}</span><span class="badge badge-type">${escapeHtml(c.type || 'CPD')}</span></div><h3>${escapeHtml(c.title)}</h3><p>${fmtDateTime(c.startTime)} · ${escapeHtml(c.venueName || '')}</p>
            <div class="past-stats"><span class="past-stat">👥 ${total} ${t('attendees')}</span><span class="past-stat ok">✓ ${verified} ${t('verified')}</span></div>
          </div>
          <div class="actions"><button data-open-cpd="${c.id}" class="btn btn-primary">${t('open')}</button></div>
        </div></div>`;
      }).join('');
      return `
        ${greetingCardHtml()}
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
          <h1 style="font-size:22px;font-weight:900;margin:0;color:#fff;text-shadow:0 0 20px rgba(0,255,204,0.35);">${t('admin_title')}</h1>
          <button id="btn-top-new" class="btn btn-primary" style="width:auto; padding: 10px 16px; font-size: 13px;">+ New Event</button>
        </div>
        <div class="a-stat-grid">
          <div class="a-stat"><div class="val" style="color:#00ffcc">${liveNow}</div><div class="lbl">${t('stat_live_now')}</div></div>
          <div class="a-stat"><div class="val">${list.length}</div><div class="lbl">${t('stat_total')}</div></div>
          <div class="a-stat"><div class="val" style="color:#a855f7">${upcoming.length}</div><div class="lbl">${t('stat_upcoming')}</div></div>
          <div class="a-stat"><div class="val" style="color:#fbbf24;font-size:18px">${nextStr}</div><div class="lbl">${t('stat_next_session')}</div></div>
        </div>
        ${ongoing.length > 0 ? `<div class="section-title">${t('ongoing')}</div>${ongoingCards}` : ''}
        ${upcoming.length > 0 ? `<div class="section-title">${t('upcoming')}</div>${upcomingCards}` : ''}
        ${endedList.length > 0 ? `<div class="section-title">${t('past_sessions')}</div>${endedCards}` : ''}
        ${list.length === 0 ? `<div class="empty" style="margin-top:20px"><strong>${t('all_sessions')}</strong><span>${t('create_sub')}</span></div>` : ''}
      `;
    }

    /* ==================== SESSIONS ==================== */
    function renderAdminSessions() {
      const filter = state.adminSessionFilter;
      let list = state.cpds.slice();
      if (filter !== 'all') list = list.filter(c => cpdStatus(c) === filter);
      list.sort((a, b) => (toDate(b.startTime)?.getTime() || 0) - (toDate(a.startTime)?.getTime() || 0));

      const cards = list.map(c => {
        const st = cpdStatus(c);
        const stBadge = st === 'ongoing' ? 'badge-live' : st === 'upcoming' ? 'badge-upcoming' : 'badge-ended';
        const stLabel = st === 'ongoing' ? t('live') : st === 'upcoming' ? t('upcoming') : t('ended');
        const atts = state.allAttendances.filter(a => a.cpdId === c.id);
        return `<div class="a-session-card">
          <div class="row">
            <div style="flex:1;min-width:0">
              <div><span class="badge ${stBadge}">${stLabel}</span><span class="badge badge-type">${escapeHtml(c.type || 'CPD')}</span></div>
              <h3>${escapeHtml(c.title)}</h3>
              <p>${fmtDateTime(c.startTime)} · ${escapeHtml(c.venueName || '')}</p>
              <div class="past-stats"><span class="past-stat">👥 ${atts.length} ${t('attendees')}</span></div>
            </div>
            <div class="actions">
              <button data-open-cpd="${c.id}" class="btn btn-primary">${t('open')}</button>
              <button data-del-cpd="${c.id}" class="btn btn-ghost" style="color:#f87171;">${t('delete')}</button>
            </div>
          </div>
        </div>`;
      }).join('');

      return `
        <h1 style="font-size:22px;font-weight:900;color:#fff;margin:0 0 16px;">${t('all_sessions')}</h1>
        <div class="filter-tabs">
          ${['all','ongoing','upcoming','ended'].map(f => `<button class="filter-tab ${filter === f ? 'active' : ''}" data-filter="${f}">${f === 'all' ? 'All' : f === 'ongoing' ? t('ongoing') : f === 'upcoming' ? t('upcoming') : t('ended')}</button>`).join('')}
        </div>
        ${list.length === 0 ? `<div class="empty"><strong>No sessions</strong><span>Create one with the + button on Overview.</span></div>` : cards}
      `;
    }

    /* ==================== DAILY TAB ==================== */
    function ensureDailySub() {
      if (state.subDaily) return;
      state.subDaily = onSnapshot(collection(db, 'daily_attendance'),
        snap => {
          state.dailyRecords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          if (state.adminTab === 'daily' || state.adminTab === 'teachers') renderAdmin();
        },
        err => { console.error('[daily]', err); toast('Could not load daily records.', 'error'); }
      );
    }

    function renderAdminDaily() {
      ensureDailySub();
      const date = state.dailyDate;
      const todayKey = todayLocalDateKey();
      const isPast = date < todayKey;

      const dayRecords = state.dailyRecords.filter(r => r.date === date);
      const recByKey = new Map();
      dayRecords.forEach(r => recByKey.set(normalizeName(r.teacherName), r));

      let presentCount = 0, inCount = 0, outCount = 0, absentCount = 0, lateCount = 0, earlyLeaveCount = 0;
      (state.teachers || []).forEach(tc => {
        const r = recByKey.get(normalizeName(tc.name));
        if (!r || !r.signInAt) { absentCount++; return; }
        presentCount++;
        if (r.state === 'in') inCount++; else outCount++;
        if (r.lateMinutes > 0) lateCount++;
        if (r.earlyLeaveMinutes > 0) earlyLeaveCount++;
      });

      const last7Days = Array.from({length: 7}, (_, i) => shiftDateKey(todayKey, i - 6));
      const chartData = last7Days.map(d => {
        const dayRecs = state.dailyRecords.filter(r => r.date === d && r.signInAt);
        return { date: d, label: new Date(d + 'T00:00:00').toLocaleDateString([], { weekday: 'short' }), count: dayRecs.length };
      });
      const maxChartVal = Math.max(...chartData.map(d => d.count), 1);

      const chartHtml = `
        <div class="chart-card">
          <div class="chart-title"><span>${t('weekly_trend')}</span><span style="color:#00ffcc">${(state.teachers||[]).length} ${t('total_staff')}</span></div>
          <div class="chart-bars">
            ${chartData.map(d => {
              const heightPct = (d.count / maxChartVal) * 100;
              const isActive = d.date === date;
              return `<div class="chart-col"><div class="chart-val">${d.count}</div><div class="chart-bar ${isActive ? 'active' : ''}" style="height: ${Math.max(heightPct, 4)}%"></div><div class="chart-label" style="${isActive ? 'color:#00ffcc' : ''}">${d.label}</div></div>`;
            }).join('')}
          </div>
        </div>
      `;

      const statCards = isPast ? `
        <div class="a-stat"><div class="val" style="color:#34d399">${presentCount}</div><div class="lbl">${t('daily_present')}</div></div>
        <div class="a-stat"><div class="val" style="color:#fbbf24">${lateCount}</div><div class="lbl">${t('daily_late')}</div></div>
        <div class="a-stat"><div class="val" style="color:#f87171">${earlyLeaveCount}</div><div class="lbl">Early Leave</div></div>
        <div class="a-stat"><div class="val" style="color:#f87171">${absentCount}</div><div class="lbl">${t('daily_absent')}</div></div>
      ` : `
        <div class="a-stat"><div class="val" style="color:#34d399">${inCount}</div><div class="lbl">${t('daily_in_school')}</div></div>
        <div class="a-stat"><div class="val" style="color:#38bdf8">${outCount}</div><div class="lbl">${t('daily_signed_out')}</div></div>
        <div class="a-stat"><div class="val" style="color:#fbbf24">${lateCount}</div><div class="lbl">${t('daily_late')}</div></div>
        <div class="a-stat"><div class="val" style="color:#f87171">${absentCount}</div><div class="lbl">${t('daily_not_arrived')}</div></div>
      `;

      const dateObj = new Date(date + 'T00:00:00');
      const dateLabel = dateObj.toLocaleDateString([], { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

      const groups = { Nursery: [], Primary: [], Secondary: [] };
      (state.teachers || []).forEach(tc => {
        const r = recByKey.get(normalizeName(tc.name));
        if (groups[tc.category]) groups[tc.category].push({ teacher: tc, record: r });
      });

      const renderRow = (item) => {
        const { teacher, record } = item;
        let statusClass = 'absent';
        let badgeHtml = `<span class="badge badge-absent">${t('daily_absent')}</span>`;
        let timesLine = '';
        let avatarHtml = `<div class="daily-avatar-init">${initialsOf(teacher.name)}</div>`;
        let photoThumbs = '';

        if (record && record.signInAt) {
          const signIn = toDate(record.signInAt);
          const signOut = toDate(record.signOutAt);
          const isLate = record.lateMinutes > 0;
          const isEarly = record.earlyLeaveMinutes > 0;

          if (record.selfieIn) {
            avatarHtml = `<img src="${record.selfieIn}" class="daily-avatar-img" onclick="window._showPhoto('${record.selfieIn}')" />`;
          }
          if (record.selfieIn) photoThumbs += `<img src="${record.selfieIn}" class="photo-thumb" onclick="window._showPhoto('${record.selfieIn}')" title="Arrival Photo" />`;
          if (record.selfieOut) photoThumbs += `<img src="${record.selfieOut}" class="photo-thumb" onclick="window._showPhoto('${record.selfieOut}')" title="Departure Photo" />`;

          timesLine = `<span>In: <strong>${signIn ? signIn.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—'}</strong></span>`;
          if (signOut) {
            timesLine += `<span>Out: <strong>${signOut.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</strong></span>`;
          }

          if (record.state === 'in') {
            statusClass = 'in-school';
            badgeHtml = `<span class="badge badge-live">${t('daily_in_school')}</span>`;
            if (isLate) badgeHtml += `<span class="badge badge-late">${t('daily_late')} ${formatMins(record.lateMinutes)}</span>`;
          } else {
            statusClass = 'signed-out';
            badgeHtml = `<span class="badge badge-out">${t('daily_signed_out')}</span>`;
            if (isLate) badgeHtml += `<span class="badge badge-late">${t('daily_late')}</span>`;
            if (isEarly) badgeHtml += `<span class="badge badge-absent">Early ${formatMins(record.earlyLeaveMinutes)}</span>`;
          }
        }

        return `<div class="daily-row ${statusClass}">
          <div class="daily-avatar-block">
            ${avatarHtml}
            <div class="daily-info">
              <div class="daily-name">${escapeHtml(teacher.name)}</div>
              <div class="daily-times">${timesLine}</div>
            </div>
          </div>
          <div class="daily-badges">
            ${badgeHtml}
            ${photoThumbs ? `<div style="display:flex;gap:4px;margin-top:4px;">${photoThumbs}</div>` : ''}
          </div>
        </div>`;
      };

      const catBlocks = CATEGORIES.map(cat => {
        const items = groups[cat];
        if (!items || items.length === 0) return '';
        return `<div class="section-title" style="color:${CAT_COLOR[cat]};">${cat} <span style="color:#94a3b8;font-weight:600;">(${items.length})</span></div>
          ${items.map(renderRow).join('')}`;
      }).join('');

      return `
        <h1 style="font-size:22px;font-weight:900;color:#fff;margin:0 0 4px;">${t('daily_title')}</h1>
        <p style="font-size:13px;color:#94a3b8;margin:0 0 16px;">${t('daily_sub')}</p>
        <div class="daily-date-nav">
          <button class="nav-btn" id="daily-prev">‹</button>
          <input type="date" class="input date-input" id="daily-date-input" value="${date}" />
          <button class="nav-btn" id="daily-next">›</button>
          <button class="today-btn" id="daily-today">${t('daily_today')}</button>
        </div>
        <div class="daily-date-label">${dateLabel}</div>
        <div class="a-stat-grid">${statCards}</div>
        ${chartHtml}
        <div class="csv-btn-row">
          <button class="csv-btn" id="daily-download">📥 ${t('daily_download')}</button>
        </div>
        ${catBlocks || `<div class="empty"><strong>${t('daily_no_records')}</strong></div>`}
      `;
    }

    /* ==================== TEACHERS TAB ==================== */
    function renderAdminTeachers() {
      const statusMap = buildTeacherStatusMap();
      const search = state.teacherSearch.trim().toUpperCase();
      const catFilter = state.teacherCatFilter;
      const now = Date.now();

      const filtered = (state.teachers || []).filter(tc => {
        if (catFilter !== 'all' && tc.category !== catFilter) return false;
        if (search && !tc.name.toUpperCase().includes(search)) return false;
        return true;
      });

      const inCpd = [], inSchool = [], absent = [];
      filtered.forEach(tc => {
        const entry = statusMap.get(normalizeName(tc.name));
        if (entry?.active) inCpd.push({ teacher: tc, entry });
        else {
          // Check today's daily attendance
          const todayRec = state.dailyRecords.find(r => r.date === todayLocalDateKey() && normalizeName(r.teacherName) === normalizeName(tc.name));
          if (todayRec && todayRec.state === 'in') inSchool.push({ teacher: tc, dailyRec: todayRec });
          else absent.push({ teacher: tc, entry });
        }
      });

        let subLine = teacher.category || '—';
        if (kind === 'cpd' && item.entry?.active) {
          const cpd = state.cpds.find(c => c.id === item.entry.active.cpdId);
          subLine = '● ' + escapeHtml(cpd?.title || 'In event');
        } else if (kind === 'school' && item.dailyRec) {
          subLine = '● Signed in ' + fmtTime(item.dailyRec.signInAt);
        } else if (kind === 'absent' && item.entry?.lastAttended) {
          subLine = 'Last: ' + fmtDate(item.entry.lastAttended);
        } else {
          subLine = 'Not marked today';
        }
        return `<div class="teacher-row ${kind === 'cpd' || kind === 'school' ? 'live' : 'absent-row'}" data-teacher-name="${escapeHtml(teacher.name)}">

            <div class="teacher-name">${escapeHtml(teacher.name)}</div>
            <div class="teacher-sub-line"><span class="status-dot ${dotClass}"></span>${subLine}</div>
          </div>
        </div>`;

      return `

        <div class="cat-filter-row">
          <button class="cat-filter ${catFilter === 'all' ? 'active' : ''}" data-cat="all">${t('all_categories')}</button>
          ${CATEGORIES.map(c => `<button class="cat-filter ${catFilter === c ? 'active' : ''}" data-cat="${c}">${c}</button>`).join('')}

        <div class="csv-btn-row">
          <button class="csv-btn" id="csv-current">📥 ${t('download_current')}</button>

        <div class="teacher-columns">
          <div class="teacher-column">
            <div class="tc-head"><h3 style="color:#34d399;">${t('in_cpd_label')}</h3><span class="cnt">${inCpd.length}</span></div>

          <div class="teacher-column">
            <div class="tc-head"><h3 style="color:#38bdf8;">${t('stat_in_school')}</h3><span class="cnt">${inSchool.length}</span></div>
            ${inSchool.map(i => renderTeacherRow(i, 'school')).join('') || `<div style="text-align:center;color:#64748b;font-size:11px;padding:16px;">None</div>`}

    /* ==================== TEACHER DETAIL ==================== */
    function goTeacherDetail() {
      state.view = 'teacher-detail';
      renderTeacherDetail();

    function renderTeacherDetail() {
      const name = state.teacherDetailName;
      if (!name) { goAdmin(); return; }
      const teacher = (state.teachers || []).find(tc => normalizeName(tc.name) === normalizeName(name));
      const atts = state.allAttendances.filter(a => normalizeName(a.teacherName) === normalizeName(name));
      const ended = atts.filter(a => a.state === 'ended');
      const verified = atts.filter(a => a.verified).length;
      const totalMinutes = ended.reduce((s, a) => {
        const s1 = toDate(a.attendedAt)?.getTime();
        const e1 = toDate(a.endedAt)?.getTime();
        return (s1 && e1) ? s + Math.max(0, (e1 - s1) / 60000) : s;
      }, 0);

      const history = atts.slice().sort((a, b) => (toDate(b.attendedAt)?.getTime() || 0) - (toDate(a.attendedAt)?.getTime() || 0)).map(a => `
        <div class="hist-item">
          <div class="hist-info">
            <h4>${escapeHtml(a.cpdTitle || 'CPD')}</h4>
            <p>${fmtDateTime(a.attendedAt)}${a.endedAt ? ' · Ended ' + fmtTime(a.endedAt) : ''}</p>
          </div>
          ${a.verified ? `<span class="badge badge-verified">✓</span>` : `<span class="badge badge-flagged">⚠</span>`}
        </div>`).join('');

      document.getElementById('app').innerHTML = `${headerHtml()}<main class="main">

        <p style="font-size:13px;color:#94a3b8;margin:0 0 20px;">${escapeHtml(teacher?.category || '—')} · ${escapeHtml(teacher?.gender || '—')}</p>
        <div class="td-stats">
          <div class="td-stat"><div class="val">${ended.length}</div><div class="lbl">${t('total_cpds')}</div></div>
          <div class="td-stat"><div class="val">${(totalMinutes/60).toFixed(1)}h</div><div class="lbl">${t('total_hours')}</div></div>
          <div class="td-stat"><div class="val" style="color:#38bdf8">${verified}</div><div class="lbl">${t('verified')}</div></div>
          <div class="td-stat"><div class="val" style="color:#fbbf24">${atts.length - verified}</div><div class="lbl">${t('flagged')}</div></div>
        </div>
        <div class="section-title">${t('sessions_history')}</div>
        ${history || `<div class="empty"><strong>${t('no_sessions_yet')}</strong></div>`}
      </main>`;
      bindHeaderEvents();
      const back = document.getElementById('btn-back-teachers');
      if (back) back.onclick = () => { state.view = 'admin'; state.teacherDetailName = null; renderAdmin(); };
    }

      atts.forEach(a => {
        const key = normalizeName(a.teacherName);
        const existing = attByKey.get(key);
        if (!existing || (a.state === 'active' && existing.state !== 'active')) attByKey.set(key, a);
      });
      const rows = (state.teachers || []).map(tc => {
        const a = attByKey.get(normalizeName(tc.name));

      }).filter(r => r.att);
      const absentCount = (state.teachers || []).length - rows.length;

      const table = rows.map(r => `
        <tr>
          <td><div class="att-name">${avatarImgTag(r.att.selfie, r.teacher.name, 32)}<span>${escapeHtml(r.teacher.name)}</span></div></td>
          <td>${fmtTime(r.att.attendedAt)}</td>
          <td>${r.att.endedAt ? fmtTime(r.att.endedAt) : '<span class="badge badge-live">Active</span>'}</td>

          <div class="a-stat"><div class="val" style="color:#38bdf8">${rows.filter(r => r.att.verified).length}</div><div class="lbl">${t('verified')}</div></div>
          <div class="a-stat"><div class="val" style="color:#fbbf24">${rows.filter(r => r.att.state === 'active').length}</div><div class="lbl">Live</div></div>
          <div class="a-stat"><div class="val" style="color:#f87171">${absentCount}</div><div class="lbl">Absent</div></div>
        </div>
        <div class="csv-btn-row">
          <button class="csv-btn" id="cpd-download">📥 ${t('download_this')}</button>
        </div>
        <div class="map-card">
          <h3>${t('record')}</h3>
          <div style="overflow-x:auto;">
            <table class="detail-table">
              <thead><tr><th>${t('t_teacher')}</th><th>${t('t_attended')}</th><th>${t('t_ended')}</th><th>${t('t_status')}</th></tr></thead>
              <tbody>${table || `<tr><td colspan="4" style="text-align:center;color:#64748b;padding:30px;">${t('no_att')}</td></tr>`}</tbody>
            </table>
          </div>
        </div>
      </main>`;
      bindHeaderEvents();
      const back = document.getElementById('btn-back');
      if (back) back.onclick = () => { state.view = 'admin'; renderAdmin(); };

      if (dl) dl.onclick = () => downloadSessionCSV(cpd);

    function bindAdminNewEvents() {
      const back = document.getElementById('btn-cancel-new');
      if (back) back.onclick = () => { state.adminTab = 'overview'; renderAdmin(); };
      let pickedLat = null, pickedLng = null;
      const locLine = document.getElementById('cpd-loc-line');
      const btnUseLoc = document.getElementById('btn-use-loc');
      if (btnUseLoc) btnUseLoc.onclick = async () => {
        try {
          toast('Getting your location…', 'info');
          const pos = await getPositionOnce();
          pickedLat = pos.lat; pickedLng = pos.lng;
          locLine.textContent = `${pickedLat.toFixed(5)}, ${pickedLng.toFixed(5)} (accuracy ${Math.round(pos.accuracy)}m)`;
        } catch (e) { toast(e.message, 'error'); }
      };
      const btnCreate = document.getElementById('btn-create-cpd');

        const title = (document.getElementById('cpd-title').value || '').trim();
        const theme = (document.getElementById('cpd-theme').value || '').trim();
        const startVal = document.getElementById('cpd-start').value;
        const endVal = document.getElementById('cpd-end').value;
        const facilitator = (document.getElementById('cpd-facilitator').value || '').trim();
        const type = document.getElementById('cpd-type').value;
        const venue = (document.getElementById('cpd-venue').value || '').trim();

        if (!startVal || !endVal) { toast('Start and end times required.', 'warn'); return; }
        const startDate = new Date(startVal);
        const endDate = new Date(endVal);
        if (endDate <= startDate) { toast('End must be after start.', 'warn'); return; }
        btnCreate.disabled = true; btnCreate.textContent = t('btn_creating');
        try {
          await addDoc(collection(db, 'cpds'), {
            title, theme, facilitator, type, venueName: venue,
            startTime: startDate,
            endTime: endDate,
            lat: pickedLat ?? DEFAULT_LAT,
            lng: pickedLng ?? DEFAULT_LNG,
            venueLat: pickedLat ?? DEFAULT_LAT,
            venueLng: pickedLng ?? DEFAULT_LNG,
            radiusMeters: 150,
            createdAt: serverTimestamp(),
            createdBy: state.user.uid
          });
          toast(t('msg_create'), 'success');
          state.adminTab = 'overview';
          renderAdmin();

          console.error(e);

    /* ==================== LESSON PLANS (grouped by day) ==================== */
    function renderAdminLessonPlans() {
      const todayKey = todayLocalDateKey();
      const plansByDay = {};
      state.lessonPlans.forEach(p => {
        let key = p.forDate;
        if (!key) {
          const d = toDate(p.submittedAt);
          if (d) key = dateKeyOf(d);
        }
        if (!key) return;
        (plansByDay[key] = plansByDay[key] || []).push(p);
      });

      const todaysPlans = plansByDay[todayKey] || [];
      const submittedTeacherIds = new Set(todaysPlans.map(p => p.teacherId));
      const missingToday = (state.teachers || []).filter(t => !submittedTeacherIds.has(t.id));
      const dayKeys = Object.keys(plansByDay).sort((a, b) => b.localeCompare(a));

      const renderCard = (p) => {
        const teacher = (state.teachers || []).find(t => t.id === p.teacherId);
        return `<div class="lp-card submitted" data-lp-id="${p.id}">
          <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;">
            <h4>${escapeHtml(p.title || p.fileName || 'Untitled')}</h4>
            <span class="badge badge-verified" style="font-size:9px;flex-shrink:0;">✓ Submitted</span>
          </div>
          <p>${escapeHtml(p.teacherName || teacher?.name || 'Unknown')} · ${escapeHtml(teacher?.category || '—')}</p>
          <div class="lp-meta">
            <span>📎 ${escapeHtml(p.fileName || 'file')}</span>
            <span>${fmtTime(p.submittedAt)}</span>
          </div>
          <div style="margin-top:8px;font-size:11px;color:#00ffcc;font-weight:700;">👁 Tap to preview</div>
        </div>`;
      };

      const daySections = dayKeys.map(key => {
        const plans = plansByDay[key];
        const dateObj = new Date(key + 'T00:00:00');
        const label = key === todayKey
          ? '📅 Today'
          : dateObj.toLocaleDateString([], { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
        return `<div class="section-title" style="display:flex;justify-content:space-between;">
          <span>${label}</span><span style="color:#00ffcc;">${plans.length} plan${plans.length === 1 ? '' : 's'}</span>
        </div>
        <div class="lp-grid">${plans.map(renderCard).join('')}</div>`;
      }).join('');

      const todaySummary = `<div class="a-stat-grid">
        <div class="a-stat"><div class="val" style="color:#34d399">${todaysPlans.length}</div><div class="lbl">Submitted Today</div></div>
        <div class="a-stat"><div class="val" style="color:#f87171">${missingToday.length}</div><div class="lbl">Missing Today</div></div>
        <div class="a-stat"><div class="val">${state.lessonPlans.length}</div><div class="lbl">Total Plans</div></div>
        <div class="a-stat"><div class="val">${dayKeys.length}</div><div class="lbl">Active Days</div></div>
      </div>`;

      const missingSection = missingToday.length > 0 ? `
        <div class="section-title" style="color:#f87171;">⚠ Missing Today (${missingToday.length})</div>
        <div class="lp-grid">
          ${missingToday.map(tc => `<div class="lp-card missing">
            <h4>${escapeHtml(tc.name)}</h4>
            <p>${escapeHtml(tc.category || '—')}</p>
            <div class="lp-meta"><span style="color:#f87171;">No plan submitted</span></div>
          </div>`).join('')}
        </div>` : '';

      return `
        <h1 style="font-size:22px;font-weight:900;color:#fff;margin:0 0 8px;">${t('lp_title')}</h1>
        <p style="color:#94a3b8;font-size:13px;margin:0 0 16px;">${t('lp_sub')}</p>
        ${todaySummary}
        ${missingSection}
        ${daySections || `<div class="empty"><strong>No lesson plans yet</strong><span>Teacher submissions will appear grouped by date.</span></div>`}
      `;
    }

    function bindLessonPlanEvents() {
      ensureLessonPlanPreviewShell();
      document.querySelectorAll('[data-lp-id]').forEach(el => {
        el.onclick = () => {
          const plan = state.lessonPlans.find(p => p.id === el.dataset.lpId);
          if (plan) openLessonPlanPreview(plan);
        };
      });
    }

    /* ==================== LESSON PLAN PREVIEW ==================== */
    function _lpSource(plan) {
      return {
        url: plan.fileUrl || plan.url || plan.fileLink,
        data: plan.fileData || plan.fileBase64 || plan.dataUrl,
        name: plan.fileName || plan.name || '',
        mime: plan.fileType || plan.mimeType || ''
      };
    }
    function _guessMime(plan) {
      const { name, mime, url } = _lpSource(plan);
      if (mime) return mime;
      const n = (name || url || '').toLowerCase();
      if (n.endsWith('.pdf')) return 'application/pdf';
      if (/\.(png|jpe?g|gif|webp|bmp|svg)$/.test(n)) return 'image/*';
      if (n.endsWith('.docx')) return 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
      if (n.endsWith('.doc')) return 'application/msword';
      return '';
    }
    function _normalizePreviewUrl(url) {
      if (!url) return url;
      const m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
      if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
      const d = url.match(/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/([^/]+)/);
      if (d) return `https://docs.google.com/${d[1]}/d/${d[2]}/preview`;
      return url;
    }

    function ensureLessonPlanPreviewShell() {
      if (document.getElementById('lp-preview-modal')) return;
      const div = document.createElement('div');
      div.id = 'lp-preview-modal';
      div.className = 'lp-preview-modal';
      div.innerHTML = `
        <div class="lp-preview-container">
          <div class="lp-preview-header">
            <h3 id="lp-preview-title">Lesson Plan</h3>
            <div style="display:flex;gap:8px;align-items:center;">
              <a id="lp-preview-download" class="lp-preview-close" href="#" target="_blank" rel="noopener" title="Download" style="width:auto;padding:0 12px;font-size:12px;font-weight:700;">Download</a>
              <button class="lp-preview-close" id="lp-preview-close" aria-label="Close">✕</button>
            </div>
          </div>
          <div class="lp-preview-body" id="lp-preview-body"></div>
        </div>`;
      document.body.appendChild(div);
      div.addEventListener('click', (e) => { if (e.target === div) closeLessonPlanPreview(); });
      document.getElementById('lp-preview-close').onclick = closeLessonPlanPreview;
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLessonPlanPreview(); });
    }

    function closeLessonPlanPreview() {
      const m = document.getElementById('lp-preview-modal');
      if (!m) return;
      m.classList.remove('open');
      setTimeout(() => {
        const b = document.getElementById('lp-preview-body');
        if (b) b.innerHTML = '';
      }, 320);
    }

    function openLessonPlanPreview(plan) {
      ensureLessonPlanPreviewShell();
      const { url, data, name } = _lpSource(plan);
      const mime = _guessMime(plan);
      const title = plan.title || name || 'Lesson Plan';
      const teacherLine = plan.teacherName ? ` — ${plan.teacherName}` : '';
      document.getElementById('lp-preview-title').textContent = title + teacherLine;

      const dlBtn = document.getElementById('lp-preview-download');
      const src = data || url;
      if (src) {
        dlBtn.href = data ? data : _normalizePreviewUrl(url);
        dlBtn.style.display = '';
        if (name) dlBtn.setAttribute('download', name);
      } else { dlBtn.style.display = 'none'; }

      const body = document.getElementById('lp-preview-body');
      body.innerHTML = '';

      if (!src) {
        body.innerHTML = `<div class="fallback"><div>No file attached to this lesson plan.</div></div>`;
      } else if (mime === 'application/pdf' || (!mime && /\.pdf(\?|$)/i.test(url || ''))) {
        const pdfSrc = data ? data : _normalizePreviewUrl(url);
        body.innerHTML = `<object data="${escapeHtml(pdfSrc)}#toolbar=1&navpanes=0" type="application/pdf">
          <iframe src="${escapeHtml(pdfSrc)}#toolbar=1&navpanes=0"></iframe>
          <div class="fallback"><div>Your browser can't inline PDFs.</div><a href="${escapeHtml(pdfSrc)}" target="_blank" rel="noopener">Open in new tab</a></div>
        </object>`;
      } else if (mime.startsWith('image/') || /\.(png|jpe?g|gif|webp|bmp|svg)(\?|$)/i.test(url || name || '')) {
        body.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;background:#0b1220;">
          <img src="${escapeHtml(src)}" alt="Lesson plan" />
        </div>`;
      } else if (url && /docs\.google\.com|drive\.google\.com/.test(url)) {
        body.innerHTML = `<iframe src="${escapeHtml(_normalizePreviewUrl(url))}"></iframe>`;
      } else if (url && /\.(docx?|pptx?|xlsx?)$/i.test(name || url)) {
        const viewer = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
        body.innerHTML = `<iframe src="${escapeHtml(viewer)}"></iframe>`;
      } else {
        body.innerHTML = `<iframe src="${escapeHtml(src)}"></iframe>`;
      }
      document.getElementById('lp-preview-modal').classList.add('open');
    }

    /* ==================== FEEDBACK (admin inbox) ==================== */
    function renderAdminFeedback() {
      const threads = state.feedbackThreads;
      const activeId = state.feedbackActiveThreadId;
      const active = threads.find(t => t.id === activeId) || null;

      const list = threads.length === 0
        ? `<div class="empty"><strong>${t('fb_no_threads')}</strong><span>${t('fb_no_threads_sub')}</span></div>`
        : threads.map(th => {
            const isActive = th.id === activeId;
            const unread = (th.unreadByAdmin || 0) > 0;
            const preview = (th.lastMessage || 'No message yet').slice(0, 60);
            const when = th.lastMessageAt?.toDate
              ? th.lastMessageAt.toDate().toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })
              : '';
            return `<div class="fb-thread-row ${isActive ? 'active' : ''}" data-fb-thread="${th.id}">
              <div class="fb-thread-avatar">${escapeHtml(initialsOf(th.teacherName || '?'))}</div>
              <div class="fb-thread-info">
                <div class="fb-thread-name">${escapeHtml(th.teacherName || 'Teacher')}</div>
                <div class="fb-thread-preview">${escapeHtml(preview)}</div>
              </div>
              <div class="fb-thread-meta">
                <span class="fb-thread-time">${escapeHtml(when)}</span>
                ${unread ? `<span class="badge badge-live" style="font-size:9px;">NEW</span>` : ''}
              </div>
            </div>`;
          }).join('');

      const chatPanel = active
        ? `<div class="chart-card" style="display:flex;flex-direction:column;height:60vh;padding:0;">
            <div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px;">
              <div class="fb-thread-avatar">${escapeHtml(initialsOf(active.teacherName || '?'))}</div>
              <div>
                <div style="font-weight:800;color:#fff;font-size:14px;">${escapeHtml(active.teacherName || 'Teacher')}</div>
                <div style="font-size:11px;color:#94a3b8;">${escapeHtml(active.teacherEmail || '')}</div>
              </div>
            </div>
            <div id="fb-messages" style="flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,0.2);">
              <div style="text-align:center;color:#64748b;font-size:12px;padding:20px;">Loading…</div>
            </div>
            <form id="fb-reply-form" style="display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,0.08);">
              <input id="fb-reply-input" class="input" style="margin:0;flex:1;" placeholder="${t('fb_reply_placeholder')}" autocomplete="off" />
              <button type="submit" class="btn btn-primary" style="width:auto;padding:12px 18px;min-height:44px;">${t('fb_send')}</button>
            </form>
          </div>`
        : `<div class="empty"><strong>${t('fb_select_thread')}</strong><span>${t('fb_select_sub')}</span></div>`;

      return `
        <h1 style="font-size:22px;font-weight:900;color:#fff;margin:0 0 16px;">${t('fb_title')}</h1>
        <div class="cpd-split">
          <div class="cpd-col not-attended" style="padding:14px;">
            <div class="cpd-col-head">
              <h3 style="color:#00ffcc;">${t('fb_inbox')}</h3>
              <span class="cnt">${threads.length}</span>
            </div>
            ${list}
          </div>
          <div style="min-width:0;">${chatPanel}</div>
        </div>`;
    }

    function renderAdminFeedbackMessages(msgs) {
      const box = document.getElementById('fb-messages');
      if (!box) return;
      if (msgs.length === 0) {
        box.innerHTML = `<div style="text-align:center;color:#64748b;font-size:12px;padding:20px;">${t('fb_no_messages')}</div>`;
        return;
      }
      box.innerHTML = msgs.map(m => {
        const mine = m.fromRole === 'admin';
        const when = toDate(m.createdAt)?.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) || '';
        return `<div style="display:flex;flex-direction:column;align-items:${mine ? 'flex-end' : 'flex-start'};gap:2px;">
          <div style="max-width:75%;padding:8px 12px;border-radius:${mine ? '14px 14px 4px 14px' : '14px 14px 14px 4px'};
                      background:${mine ? 'linear-gradient(135deg,#00ffcc,#0088ff)' : 'rgba(255,255,255,0.08)'};
                      color:${mine ? '#0a0f1e' : '#e2e8f0'};font-size:13px;line-height:1.4;word-wrap:break-word;">
            ${escapeHtml(m.text)}
          </div>
          <div style="font-size:10px;color:#64748b;">${escapeHtml(when)}</div>
        </div>`;
      }).join('');
      box.scrollTop = box.scrollHeight;
    }

    function subscribeAdminThreadMessages(tid) {
      if (state.subFeedbackMsgs) { state.subFeedbackMsgs(); state.subFeedbackMsgs = null; }
      state.subFeedbackMsgs = onSnapshot(
        query(collection(db, 'feedback_threads', tid, 'messages'), orderBy('createdAt', 'asc')),
        snap => renderAdminFeedbackMessages(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
        err => console.error('[fb msgs]', err)
      );
    }

    function bindAdminFeedbackEvents() {
      document.querySelectorAll('[data-fb-thread]').forEach(el => {
        el.onclick = () => {
          const tid = el.dataset.fbThread;
          state.feedbackActiveThreadId = tid;
          updateDoc(doc(db, 'feedback_threads', tid), { unreadByAdmin: 0 }).catch(() => {});
          subscribeAdminThreadMessages(tid);
          renderAdmin();
        };
      });

      if (state.feedbackActiveThreadId && !state.subFeedbackMsgs) {
        subscribeAdminThreadMessages(state.feedbackActiveThreadId);
      }

      const form = document.getElementById('fb-reply-form');
      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const input = document.getElementById('fb-reply-input');
          const text = (input.value || '').trim();
          if (!text || !state.feedbackActiveThreadId) return;
          input.value = '';
          const tid = state.feedbackActiveThreadId;
          try {
            await addDoc(collection(db, 'feedback_threads', tid, 'messages'), {
              fromUid: state.user.uid, fromRole: 'admin', text, createdAt: serverTimestamp()
            });
            await updateDoc(doc(db, 'feedback_threads', tid), {
              lastMessage: text, lastMessageAt: serverTimestamp(),
              lastSenderRole: 'admin', unreadByTeacher: increment(1), unreadByAdmin: 0
            });
          } catch (err) {
            console.error(err);
            toast(t('fb_send_fail') + ' ' + err.message, 'error');
          }
        };
      }
    }

    /* ==================== PHOTO VIEWER ==================== */
    window._showPhoto = (src) => {
      if (!src) return;
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;padding:20px;cursor:pointer;';
      overlay.innerHTML = `<img src="${src}" style="max-width:100%;max-height:90vh;object-fit:contain;border-radius:12px;" />`;
      overlay.onclick = () => overlay.remove();
      document.body.appendChild(overlay);
    };
  </script>
</body>
</html>
