    /* ==================== LESSON PREVIEW ==================== */
    function ensureLessonPlanPreviewShell() {
      if (document.getElementById('lp-preview-modal')) return;
      const modal = document.createElement('div');
      modal.id = 'lp-preview-modal';
      modal.className = 'lp-preview-modal';
      modal.innerHTML = `<div class="lp-preview-container">
        <div class="lp-preview-header"><h3 id="lp-preview-title">Lesson Plan</h3><div style="display:flex;align-items:center;"><a id="lp-preview-dl" class="btn" style="width:auto;padding:0 12px;height:32px;font-size:12px;background:rgba(0,255,204,0.15);color:#00ffcc;text-decoration:none;display:flex;align-items:center;border-radius:8px;margin-right:8px;" href="#" target="_blank" rel="noopener" download>Download</a><button class="lp-preview-close" id="lp-preview-close">✕</button></div></div>
        <div class="lp-preview-body" id="lp-preview-body"></div>
      </div>`;
      document.body.appendChild(modal);
      modal.onclick = (e) => { if (e.target === modal) closeLessonPlanPreview(); };
      modal.querySelector('#lp-preview-close').onclick = closeLessonPlanPreview;
    }
    function openLessonPlanPreview(plan) {
      if (!plan) return;
      ensureLessonPlanPreviewShell();
      const modal = document.getElementById('lp-preview-modal');
      const titleEl = document.getElementById('lp-preview-title');
      const bodyEl = document.getElementById('lp-preview-body');
      const dlBtn = document.getElementById('lp-preview-dl');
      // fileUrl (Firebase Storage link) is the current format; fileBase64/fileData
      // are kept only so lesson plans submitted before this change still open.
      const src = plan.fileUrl || plan.fileBase64 || plan.fileData;
      const mime = plan.fileType || '';
      const fileName = plan.fileName || 'file';
      const lower = fileName.toLowerCase();
      const isHttpUrl = /^https?:\/\//i.test(src || '');
      titleEl.textContent = `${plan.title || fileName} · ${plan.teacherName || ''}`;
      if (src) { dlBtn.href = src; dlBtn.download = fileName; dlBtn.style.display = ''; }
      else { dlBtn.style.display = 'none'; }
      bodyEl.innerHTML = '';
      const isPdf = mime === 'application/pdf' || /\.pdf$/i.test(lower);
      const isImage = mime.startsWith('image/') || /\.(png|jpe?g|gif|webp)$/i.test(lower);
      const isDocx = mime === 'application/msword' ||
                     mime === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' ||
                     /\.(docx?|rtf)$/i.test(lower);
      if (!src) {
        bodyEl.innerHTML = `<div class="fallback"><div>${t('lp_no_file')}</div></div>`;
      } else if (isPdf) {
        bodyEl.innerHTML = `<object data="${escapeHtml(src)}" type="application/pdf"><iframe src="${escapeHtml(src)}"></iframe><div class="fallback"><div>Your browser can't inline this PDF.</div><a href="${escapeHtml(src)}" target="_blank">Open in new tab</a></div></object>`;
      } else if (isImage) {
        bodyEl.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;background:#0b1220;"><img src="${escapeHtml(src)}" alt="Lesson plan" /></div>`;
      } else if (isDocx && isHttpUrl) {
        // Microsoft's Office viewer renders the doc straight from its real URL — no download needed.
        const viewerUrl = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(src)}`;
        bodyEl.innerHTML = `<iframe src="${escapeHtml(viewerUrl)}" style="width:100%;height:100%;border:none;background:#fff;" title="${escapeHtml(fileName)}"></iframe>`;
      } else if (isHttpUrl) {
        bodyEl.innerHTML = `<iframe src="${escapeHtml(src)}"></iframe>`;
      } else {
        bodyEl.innerHTML = `<div class="fallback"><div>This file type can't be previewed inline.</div><a href="${escapeHtml(src)}" target="_blank">Open in new tab</a></div>`;
      }
      modal.classList.add('open');
    }
    function closeLessonPlanPreview() {
      const m = document.getElementById('lp-preview-modal');
      if (!m) return;
      m.classList.remove('open');
      setTimeout(() => { const b = document.getElementById('lp-preview-body'); if (b) b.innerHTML = ''; }, 320);
    }

    /* ==================== NEW CPD ==================== */
    let newCpdMap = null, newCpdMarker = null;
    function renderAdminNew() {
      const now = new Date();
      const startVal = toLocalInputValue(now);
      const endVal = toLocalInputValue(new Date(now.getTime() + 60 * 60000));
      return `<h1 style="font-size:22px;font-weight:900;color:#fff;margin:0 0 16px;">${t('create_title')}</h1>
        <div class="form-card">
          <p class="sub">${t('create_sub')}</p>
          <form id="new-cpd-form">
            <label>${t('form_title')}</label>
            <input class="input" name="title" required placeholder="e.g. Digital Literacy Workshop" />
            <label>${t('form_theme')}</label>
            <input class="input" name="theme" placeholder="Optional theme" />
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
              <div><label>${t('form_start')}</label><input class="input" type="datetime-local" name="startTime" value="${startVal}" required /></div>
              <div><label>${t('form_end')}</label><input class="input" type="datetime-local" name="endTime" value="${endVal}" required /></div>
            </div>
            <div class="chip-row"><button type="button" class="chip chip-neutral" id="chip-now">⏱ Now</button><button type="button" class="chip chip-neutral" id="chip-1h">+1 hour</button></div>
            <label>${t('form_facilitator')}</label>
            <input class="input" name="facilitator" placeholder="Facilitator name" />
            <label>${t('form_type')}</label>
            <select name="type"><option>CPD</option><option>Training</option><option>Workshop</option><option>Meeting</option></select>
            <label>${t('form_venue')}</label>
            <input class="input" name="venueName" placeholder="e.g. School Library" />
            <label>${t('form_map')}</label>
            <div class="map-card"><div id="cpd-map"></div></div>
            <input type="hidden" name="venueLat" id="venue-lat" value="${DEFAULT_LAT}" />
            <input type="hidden" name="venueLng" id="venue-lng" value="${DEFAULT_LNG}" />
            <div class="chip-row"><button type="button" class="chip chip-neutral" id="chip-use-loc">📍 Use my location</button></div>
            <div class="summary-line" id="coords-summary">Venue: <strong id="coords-text">${DEFAULT_LAT.toFixed(5)}, ${DEFAULT_LNG.toFixed(5)}</strong> · Tap map to adjust</div>
            <button type="submit" class="btn btn-primary" id="btn-create-cpd">${t('btn_create')}</button>
            <button type="button" class="btn btn-ghost" id="btn-cancel-cpd" style="margin-top:10px;">Cancel</button>
          </form>
        </div>`;
    }

    function bindAdminNewEvents() {
      const form = document.getElementById('new-cpd-form');
      if (!form) return;
      const cancelBtn = document.getElementById('btn-cancel-cpd');
      if (cancelBtn) cancelBtn.onclick = () => { state.adminTab = 'overview'; renderAdmin(); };

      const startInp = form.elements.startTime;
      const endInp = form.elements.endTime;
      const chipNow = document.getElementById('chip-now');
      const chip1h = document.getElementById('chip-1h');
      if (chipNow) chipNow.onclick = () => { const n = new Date(); startInp.value = toLocalInputValue(n); endInp.value = toLocalInputValue(new Date(n.getTime() + 3600000)); };
      if (chip1h) chip1h.onclick = () => { const s = new Date(startInp.value); endInp.value = toLocalInputValue(new Date(s.getTime() + 3600000)); };

      const latInp = document.getElementById('venue-lat');
      const lngInp = document.getElementById('venue-lng');
      const coordsText = document.getElementById('coords-text');
      const useLoc = document.getElementById('chip-use-loc');
      if (useLoc) useLoc.onclick = async () => {
        try {
          const pos = await getPositionOnce();
          latInp.value = pos.lat; lngInp.value = pos.lng;
          coordsText.textContent = `${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}`;
          if (newCpdMap) newCpdMap.setView([pos.lat, pos.lng], 17);
          if (newCpdMarker) newCpdMarker.setLatLng([pos.lat, pos.lng]);
        } catch (err) { toast(err.message, 'error'); }
      };

      // Init map
      const mapEl = document.getElementById('cpd-map');
      if (mapEl && !newCpdMap) {
        try {
          newCpdMap = L.map('cpd-map').setView([DEFAULT_LAT, DEFAULT_LNG], 16);
          addSatelliteBase(newCpdMap);
          newCpdMarker = L.marker([DEFAULT_LAT, DEFAULT_LNG], { draggable: true }).addTo(newCpdMap);
          newCpdMap.on('click', e => {
            latInp.value = e.latlng.lat; lngInp.value = e.latlng.lng;
            coordsText.textContent = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
            newCpdMarker.setLatLng(e.latlng);
          });
          newCpdMarker.on('dragend', e => {
            const ll = e.target.getLatLng();
            latInp.value = ll.lat; lngInp.value = ll.lng;
            coordsText.textContent = `${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;
          });
          setTimeout(() => newCpdMap.invalidateSize(), 100);
        } catch (e) { console.warn('[map]', e); }
      }

      form.onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-create-cpd');
        btn.disabled = true; btn.textContent = t('btn_creating');
        try {
          const fd = new FormData(form);
          const startDT = new Date(fd.get('startTime'));
          const endDT = new Date(fd.get('endTime'));
          if (endDT <= startDT) throw new Error('End time must be after start time.');
          await addDoc(collection(db, 'cpds'), {
            title: fd.get('title').toString().trim(),
            theme: fd.get('theme')?.toString().trim() || '',
            startTime: startDT,
            endTime: endDT,
            facilitator: fd.get('facilitator')?.toString().trim() || '',
            type: fd.get('type')?.toString() || 'CPD',
            venueName: fd.get('venueName')?.toString().trim() || '',
            venueLat: parseFloat(latInp.value) || DEFAULT_LAT,
            venueLng: parseFloat(lngInp.value) || DEFAULT_LNG,
            createdAt: serverTimestamp(),
            createdBy: state.user.uid
          });
          toast('Event created!', 'success');
          newCpdMap = null; newCpdMarker = null;
          state.adminTab = 'sessions';
          renderAdmin();
        } catch (err) { toast(err.message || 'Failed to create event.', 'error'); btn.disabled = false; btn.textContent = t('btn_create'); }
      };
    }

    /* ==================== CPD DETAIL ==================== */
    function goCpdDetail(cpdId) {
      state.selectedCpdId = cpdId;
      state.view = 'cpd-detail';
      const cpd = state.cpds.find(c => c.id === cpdId);
      state.selectedCpd = cpd || null;
      if (state.subDetail) { try { state.subDetail(); } catch {} state.subDetail = null; }
      state.subDetail = onSnapshot(doc(db, 'cpds', cpdId), snap => { if (snap.exists()) { state.selectedCpd = { id: snap.id, ...snap.data() }; if (state.view === 'cpd-detail') renderCpdDetail(); } });
      if (state.subDetailAtt) { try { state.subDetailAtt(); } catch {} state.subDetailAtt = null; }
      state.subDetailAtt = onSnapshot(query(collection(db, 'attendance'), where('cpdId', '==', cpdId)),
        snap => { state.cpdAttendances = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (state.view === 'cpd-detail') renderCpdDetail(); },
        err => console.error(err));
      renderCpdDetail();
    }

    function renderCpdDetail() {
      const cpd = state.selectedCpd;
      if (!cpd) { state.view = 'admin'; renderAdmin(); return; }
      const atts = state.cpdAttendances;
      const attByKey = new Map();
      atts.forEach(a => { const key = normalizeName(a.teacherName); const ex = attByKey.get(key); if (!ex || (a.state === 'active' && ex.state !== 'active')) attByKey.set(key, a); });
      const attended = (state.teachers || []).filter(tc => attByKey.has(normalizeName(tc.name))).map(tc => ({ teacher: tc, att: attByKey.get(normalizeName(tc.name)) }));
      const notAttended = (state.teachers || []).filter(tc => !attByKey.has(normalizeName(tc.name)));

      const attRow = ({ teacher, att }) => {
        const verified = att.verified;
        return `<div class="teacher-row ${att.state === 'active' ? 'live' : ''}">
          <div class="teacher-avatar">${initialsOf(teacher.name)}</div>
          <div class="teacher-info"><div class="teacher-name">${escapeHtml(teacher.name)}</div><div class="teacher-sub-line">${fmtDateTime(att.attendedAt)}${att.state === 'active' ? ' · Live' : ''}</div></div>
          <div class="teacher-actions">
            ${verified ? `<span class="badge badge-verified">✓</span>` : `<span class="badge badge-flagged">⚠</span>`}
            <button class="teacher-action-btn" data-verify-att="${att.id}" data-verify-val="${verified ? 'false' : 'true'}" title="${verified ? 'Unverify' : 'Verify'}">${verified ? '↺' : '✓'}</button>
          </div>
        </div>`;
      };
      const notAttRow = (teacher) => `<div class="teacher-row absent-row"><div class="teacher-avatar">${initialsOf(teacher.name)}</div><div class="teacher-info"><div class="teacher-name">${escapeHtml(teacher.name)}</div><div class="teacher-sub-line">Did not attend</div></div></div>`;

      const mapAtts = atts.filter(a => a.attendedLat != null && a.attendedLng != null);
      const mapHtml = `<div class="map-card"><h3>Attendee Map</h3><div id="detail-map"></div></div>`;

      document.getElementById('app').innerHTML = `${headerHtml()}<main class="main main-wide">
        <button class="btn btn-ghost" id="cd-back" style="width:auto; padding:8px 14px; margin-bottom:16px;">‹ ${t('back')}</button>
        <div class="a-session-card" style="margin-bottom:16px;">
          <div><span class="badge badge-${cpdStatus(cpd) === 'ongoing' ? 'live' : cpdStatus(cpd) === 'upcoming' ? 'upcoming' : 'ended'}">${cpdStatus(cpd) === 'ongoing' ? t('live') : cpdStatus(cpd) === 'upcoming' ? t('upcoming') : t('ended')}</span><span class="badge badge-type">${escapeHtml(cpd.type || 'CPD')}</span></div>
          <h3 style="margin:8px 0 6px;">${escapeHtml(cpd.title)}</h3>
          <p>${fmtDateTime(cpd.startTime)} – ${fmtDateTime(cpd.endTime)} · ${escapeHtml(cpd.venueName || '')}${cpd.facilitator ? ' · ' + escapeHtml(cpd.facilitator) : ''}</p>
        </div>
        <div class="csv-btn-row"><button class="csv-btn" id="cd-download">📥 ${t('csv_download')}</button></div>
        ${mapHtml}
        <div class="cpd-split">
          <div class="cpd-col attended"><div class="cpd-col-head"><h3>${t('t_attended')}</h3><span class="cnt">${attended.length}</span></div>${attended.length ? attended.map(attRow).join('') : `<div style="text-align:center;color:#64748b;font-size:12px;padding:16px;">${t('no_att')}</div>`}</div>
          <div class="cpd-col not-attended"><div class="cpd-col-head"><h3>Did not attend</h3><span class="cnt">${notAttended.length}</span></div>${notAttended.length ? notAttended.map(notAttRow).join('') : `<div style="text-align:center;color:#64748b;font-size:12px;padding:16px;">Everyone attended</div>`}</div>
        </div>
      </main>${adminTabBar()}`;
      bindHeaderEvents();
      const back = document.getElementById('cd-back');
      if (back) back.onclick = () => { state.view = 'admin'; state.selectedCpdId = null; state.selectedCpd = null; if (state.subDetail) { try { state.subDetail(); } catch {} state.subDetail = null; } if (state.subDetailAtt) { try { state.subDetailAtt(); } catch {} state.subDetailAtt = null; } renderAdmin(); };
      document.querySelectorAll('[data-atab]').forEach(b => b.onclick = () => { state.view = 'admin'; state.adminTab = b.dataset.atab; renderAdmin(); });
      const dl = document.getElementById('cd-download');
      if (dl) dl.onclick = () => downloadSessionCSV(cpd);
      document.querySelectorAll('[data-verify-att]').forEach(b => b.onclick = async () => {
        const attId = b.dataset.verifyAtt; const val = b.dataset.verifyVal === 'true';
        try { await updateDoc(doc(db, 'attendance', attId), { verified: val }); toast(val ? 'Verified' : 'Unverified', 'success'); }
        catch (err) { toast(err.message, 'error'); }
      });
      // Init map
      if (mapAtts.length > 0) {
        setTimeout(() => {
          try {
            const map = L.map('detail-map').setView([cpd.venueLat || DEFAULT_LAT, cpd.venueLng || DEFAULT_LNG], 16);
            addSatelliteBase(map);
            if (cpd.venueLat) L.marker([cpd.venueLat, cpd.venueLng]).addTo(map).bindPopup('Venue');
            mapAtts.forEach(a => { L.circleMarker([a.attendedLat, a.attendedLng], { radius: 8, color: a.verified ? '#10b981' : '#fbbf24', fillOpacity: 0.7 }).addTo(map).bindPopup(escapeHtml(a.teacherName || '')); });
            setTimeout(() => map.invalidateSize(), 100);
          } catch (e) { console.warn('[map]', e); }
        }, 100);
      }
    }

    /* ==================== FEEDBACK (WhatsApp-style) ==================== */
    function renderAdminInboxList() {
      const search = (state.adminInboxSearch || '').toLowerCase().trim();
      const threads = state.feedbackThreads;
      const filtered = search ? threads.filter(t => (t.teacherName || '').toLowerCase().includes(search)) : threads;
      if (filtered.length === 0) return `<div class="fb-inbox-empty"><strong>${search ? 'No matches' : t('fb_no_threads')}</strong><span>${search ? 'Try a different name' : t('fb_no_threads_sub')}</span></div>`;
      return filtered.map(t => {
        const unread = t.unreadByAdmin || 0;
        const lastAt = toDate(t.lastMessageAt);
        const timeStr = lastAt ? formatRelativeTime(lastAt) : '';
        const preview = t.lastMessage || 'No messages yet';
        return `<div class="fb-thread-row ${state.feedbackActiveThreadId === t.id ? 'active' : ''}" data-thread-uid="${t.id}">
          <div class="fb-thread-avatar">${initialsOf(t.teacherName || 'T')}</div>
          <div class="fb-thread-info">
            <div class="fb-thread-name">${escapeHtml(t.teacherName || 'Teacher')}</div>
            <div class="fb-thread-preview">${escapeHtml(preview)}</div>
          </div>
          <div class="fb-thread-meta">
            <div class="fb-thread-time">${escapeHtml(timeStr)}</div>
            ${unread > 0 ? `<div class="fb-thread-badge">${unread > 9 ? '9+' : unread}</div>` : ''}
          </div>
        </div>`;
      }).join('');
    }

    function updateAdminInboxList() {
      const list = document.getElementById('fb-inbox-list');
      if (!list) return;
      list.innerHTML = renderAdminInboxList();
      document.querySelectorAll('[data-thread-uid]').forEach(el => { el.onclick = () => selectAdminThread(el.dataset.threadUid); });
    }

    function updateAdminTabBadge() {
      const total = state.feedbackThreads.reduce((s, t) => s + (t.unreadByAdmin || 0), 0);
      const btn = document.querySelector('[data-atab="feedback"]');
      if (!btn) return;
      const existing = btn.querySelector('.tab-badge');
      if (existing) existing.remove();
      if (total > 0) {
        const b = document.createElement('span');
        b.className = 'tab-badge';
        b.textContent = total > 9 ? '9+' : total;
        btn.appendChild(b);
      }
    }

    function renderAdminChatMessages() {
      const box = document.getElementById('fb-messages');
      if (!box) return;
      if (state.feedbackMessages.length === 0) { box.innerHTML = `<div class="fb-chat-empty">${t('fb_no_messages')}</div>`; return; }
      const wasNearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
      let html = '', lastDate = null;
      state.feedbackMessages.forEach(m => {
        const d = toDate(m.createdAt);
        if (d) { const key = dateKeyOf(d); if (key !== lastDate) { html += `<div class="msg-date-sep"><span>${escapeHtml(dayLabelForDate(key))}</span></div>`; lastDate = key; } }
        const mine = m.fromRole === 'admin';
        const time = d ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        let statusIcon = '';
        if (mine) {
          if (m.readAt) statusIcon = '<span class="msg-status seen">✓✓</span>';
          else if (m.deliveredAt) statusIcon = '<span class="msg-status">✓✓</span>';
          else statusIcon = '<span class="msg-status">✓</span>';
        }
        html += `<div class="msg-row ${mine ? 'mine' : 'theirs'}"><div class="msg-bubble">${escapeHtml(m.text || '')}</div><div class="msg-meta">${escapeHtml(time)} ${statusIcon}</div></div>`;
      });
      box.innerHTML = html;
      if (wasNearBottom) box.scrollTop = box.scrollHeight;
    }

    function updateAdminChatArea() {
      const container = document.getElementById('fb-chat-content');
      if (!container) return;
      if (!state.feedbackActiveThreadId) {
        container.innerHTML = `<div class="fb-chat-empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:64px;height:64px;opacity:0.25;margin-bottom:16px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <h3>${t('fb_select_thread')}</h3><p>${t('fb_select_sub')}</p>
        </div>`;
        return;
      }
      const thread = state.feedbackThreads.find(t => t.id === state.feedbackActiveThreadId);
      const name = thread?.teacherName || 'Teacher';
      const email = thread?.teacherEmail || '';
      container.innerHTML = `<div class="fb-chat-header">
        <button class="fb-chat-back" id="fb-chat-back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:20px;height:20px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
        <div class="fb-chat-avatar">${initialsOf(name)}</div>
        <div class="fb-chat-info"><h3>${escapeHtml(name)}</h3><p>${escapeHtml(email)}</p></div>
      </div>
      <div id="fb-messages"></div>
      <form class="fb-chat-form" id="fb-chat-form">
        <input class="fb-chat-input" id="fb-chat-input" placeholder="${t('fb_reply_placeholder')}" autocomplete="off" />
        <button type="submit" class="fb-chat-send" aria-label="${t('fb_send')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
      </form>`;
      const backBtn = document.getElementById('fb-chat-back');
      if (backBtn) backBtn.onclick = () => { const ws = document.getElementById('fb-workspace'); if (ws) ws.classList.remove('mobile-chat-open'); state.feedbackActiveThreadId = null; ensureAdminThreadSub(null); updateAdminChatArea(); document.querySelectorAll('.fb-thread-row').forEach(el => el.classList.remove('active')); };
      const form = document.getElementById('fb-chat-form');
      if (form) form.onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('fb-chat-input');
        const text = (input.value || '').trim();
        if (!text || !state.feedbackActiveThreadId) return;
        input.value = '';
        try {
          await addDoc(collection(db, 'feedback_threads', state.feedbackActiveThreadId, 'messages'), {
            fromUid: state.user.uid, fromRole: 'admin', text,
            createdAt: serverTimestamp(),
            deliveredAt: null, deliveredByUid: null, readAt: null, readByUid: null
          });
          await updateDoc(doc(db, 'feedback_threads', state.feedbackActiveThreadId), {
            lastMessage: text, lastMessageAt: serverTimestamp(), lastSenderRole: 'admin', unreadByTeacher: increment(1)
          });
        } catch (err) { console.error('[send]', err); toast(t('fb_send_fail'), 'error'); }
      };
      renderAdminChatMessages();
    }

    async function markAdminMessageDelivered(teacherUid, msgId) {
      try { await updateDoc(doc(db, 'feedback_threads', teacherUid, 'messages', msgId), { deliveredAt: serverTimestamp(), deliveredByUid: state.user.uid }); }
      catch (err) { console.warn('[deliver]', err.code || err.message); }
    }

    async function markAdminMessagesRead(teacherUid) {
      const unread = state.feedbackMessages.filter(m => m.fromRole === 'teacher' && !m.readAt && !failedReadAttempts.has(m.id));
      const thread = state.feedbackThreads.find(t => t.id === teacherUid);
      const threadUnread = thread && thread.unreadByAdmin > 0;
      if (unread.length === 0 && !threadUnread) return;
      try {
        const ops = unread.map(m => updateDoc(doc(db, 'feedback_threads', teacherUid, 'messages', m.id), { readAt: serverTimestamp(), readByUid: state.user.uid }));
        if (threadUnread) ops.push(updateDoc(doc(db, 'feedback_threads', teacherUid), { unreadByAdmin: 0 }));
        await Promise.all(ops);
      } catch (err) { unread.forEach(m => failedReadAttempts.add(m.id)); console.warn('[mark read]', err.code || err.message); }
    }

    function ensureAdminThreadSub(teacherUid) {
      if (state.subFeedbackMsgs) { try { state.subFeedbackMsgs(); } catch {} state.subFeedbackMsgs = null; }
      state.feedbackMessages = [];
      if (!teacherUid) return;
      state.subFeedbackMsgs = onSnapshot(
        query(collection(db, 'feedback_threads', teacherUid, 'messages'), orderBy('createdAt', 'asc')),
        snap => {
          state.feedbackMessages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          snap.docChanges().forEach(change => {
            if (change.type !== 'added') return;
            const msg = change.doc.data();
            if (msg.fromRole !== 'teacher') return;
            if (msg.deliveredAt) return;
            if (msg.fromUid === state.user.uid) return;
            markAdminMessageDelivered(teacherUid, change.doc.id);
          });
          renderAdminChatMessages();
          if (state.feedbackActiveThreadId === teacherUid && !document.hidden) markAdminMessagesRead(teacherUid);
        },
        err => console.error('[admin msgs]', err)
      );
    }

    function selectAdminThread(teacherUid) {
      state.feedbackActiveThreadId = teacherUid;
      ensureAdminThreadSub(teacherUid);
      updateAdminChatArea();
      document.querySelectorAll('.fb-thread-row').forEach(el => el.classList.toggle('active', el.dataset.threadUid === teacherUid));
      if (window.innerWidth < 768) { const ws = document.getElementById('fb-workspace'); if (ws) ws.classList.add('mobile-chat-open'); }
    }

    function renderAdminFeedback() {
      return `<div class="fb-workspace" id="fb-workspace">
        <aside class="fb-inbox-pane">
          <div class="fb-inbox-header">
            <h2>${t('fb_inbox')}</h2>
            <input class="fb-inbox-search" id="fb-inbox-search" placeholder="Search teachers…" autocomplete="off" value="${escapeHtml(state.adminInboxSearch || '')}" />
          </div>
          <div class="fb-inbox-list" id="fb-inbox-list">${renderAdminInboxList()}</div>
        </aside>
        <section class="fb-chat-pane"><div id="fb-chat-content"></div></section>
      </div>`;
    }

    function bindAdminFeedbackEvents() {
      const search = document.getElementById('fb-inbox-search');
      if (search) search.oninput = (e) => { state.adminInboxSearch = e.target.value; updateAdminInboxList(); };
      document.querySelectorAll('[data-thread-uid]').forEach(el => el.onclick = () => selectAdminThread(el.dataset.threadUid));
      if (state.feedbackActiveThreadId) ensureAdminThreadSub(state.feedbackActiveThreadId);
      updateAdminChatArea();
    }
  </script>
</body>
</html>
