<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#071B33" />
  <title>iMENA Smart Attendance — Admin</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/zBDCZhCb/i-MENA-Smart-CPD-Badge.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
  <style>
    :root { --cyan: #00ffcc; }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; color: #e2e8f0; -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; background: #0a0f1e; }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }
    body::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 20% 10%, rgba(0,136,255,0.18), transparent 45%), radial-gradient(ellipse at 80% 60%, rgba(0,255,204,0.12), transparent 50%), linear-gradient(180deg, #050e2a 0%, #0a1a3a 50%, #050e2a 100%); }
    #bg-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; display: block; background: transparent; opacity: 0; transition: opacity 0.8s ease; }
    #bg-canvas.ready { opacity: 1; }
    #app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    .header { position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; gap: 8px; background: rgba(10,15,30,0.72); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-bottom: 1px solid rgba(255,255,255,0.06); padding-top: max(10px, env(safe-area-inset-top)); }
    .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .header-logo { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }
    .header-title { font-size: 14px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .header-title span { display: block; font-size: 9px; color: #00ffcc; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .avatar-btn { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; border: 2px solid #00ffcc; padding: 0; background: #fff; flex-shrink: 0; }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .profile-modal { position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .profile-modal.open { opacity: 1; pointer-events: auto; }
    .profile-card { background: #1e293b; color: #fff; border-radius: 24px; padding: 24px; width: 100%; max-width: 340px; text-align: center; transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    .profile-modal.open .profile-card { transform: translateY(0); }
    .profile-img { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 16px; border: 3px solid #00ffcc; object-fit: cover; }
    .profile-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .profile-email { font-size: 13px; color: #94a3b8; margin-bottom: 12px; word-break: break-all; }
    .profile-role { display: inline-block; padding: 6px 12px; border-radius: 99px; background: rgba(0,255,204,0.15); color: #00ffcc; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 20px; }
    .profile-actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-home, .btn-logout { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; }
    .btn-home { background: rgba(255,255,255,0.05); color: #fff; }
    .btn-logout { background: rgba(239,68,68,0.15); color: #f87171; }

    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px 20px; border-radius: 14px; font-size: 15px; font-weight: 800; transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s; min-height: 48px; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg,#00ffcc,#0088ff); color: #0a0f1e; box-shadow: 0 6px 20px rgba(0,255,204,0.3); }
    .btn-danger { background: linear-gradient(135deg,#ef4444,#dc2626); color: #fff; box-shadow: 0 6px 20px rgba(239,68,68,0.35); }
    .btn-ghost { background: rgba(255,255,255,0.06); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); }

    .input, select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(148,163,184,0.25); background: rgba(15,23,42,0.6); font-size: 15px; margin-bottom: 12px; color: #e2e8f0; appearance: none; }
    .input:focus, select:focus { outline: none; border-color: #00ffcc; box-shadow: 0 0 0 4px rgba(0,255,204,0.15); }

    .main { flex: 1; padding: 18px 14px calc(80px + env(safe-area-inset-bottom)); max-width: 800px; margin: 0 auto; width: 100%; }
    .main.main-wide { max-width: 1400px; }

    .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; z-index: 90; background: rgba(10,15,30,0.85); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-top: 1px solid rgba(255,255,255,0.08); padding-bottom: env(safe-area-inset-bottom); }
    .tab-btn { flex: 1; padding: 10px 2px; color: #64748b; font-size: 8.5px; font-weight: 700; text-align: center; transition: color 0.2s; text-transform: uppercase; letter-spacing: 0.02em; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; overflow: hidden; text-overflow: ellipsis; position: relative; }
    .tab-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
    .tab-btn.active { color: #00ffcc; filter: drop-shadow(0 0 8px rgba(0,255,204,0.5)); }
    .tab-btn .tab-badge { position: absolute; top: 6px; right: calc(50% - 18px); background: #ef4444; color: #fff; font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 99px; min-width: 16px; }

    .a-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .a-stat { background: rgba(15,23,42,0.55); backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(0,255,204,0.2); border-radius: 14px; padding: 14px; text-align: center; }
    .a-stat .val { font-size: 24px; font-weight: 900; color: #fff; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(0,255,204,0.35); }
    .a-stat .lbl { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-top: 6px; letter-spacing: 0.05em; }

    .a-session-card { background: rgba(15,23,42,0.55); backdrop-filter: blur(18px); border: 1px solid rgba(0,255,204,0.18); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .a-session-card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .a-session-card h3 { font-size: 15px; color: #fff; margin: 4px 0 4px; word-break: break-word; }
    .a-session-card p { font-size: 12px; color: #94a3b8; margin: 0; }
    .a-session-card .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .a-session-card .actions .btn { padding: 8px 12px; font-size: 12px; min-height: auto; width: auto; }

    .section-title { font-size: 13px; font-weight: 800; color: #94a3b8; margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 0.06em; padding-left: 4px; display: flex; justify-content: space-between; align-items: center; }
    .section-title:first-child { margin-top: 0; }

    .filter-tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab { padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,0.05); color: #94a3b8; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
    .filter-tab.active { background: rgba(0,255,204,0.12); color: #00ffcc; border-color: rgba(0,255,204,0.3); }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
    .badge-live { background: rgba(16,185,129,0.18); color: #34d399; border: 1px solid rgba(16,185,129,0.35); }
    .badge-upcoming { background: rgba(148,163,184,0.15); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.2); }
    .badge-ended { background: rgba(148,163,184,0.1); color: #94a3b8; border: 1px solid rgba(148,163,184,0.15); }
    .badge-verified { background: rgba(14,165,233,0.18); color: #38bdf8; border: 1px solid rgba(14,165,233,0.35); }
    .badge-flagged { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .badge-absent { background: rgba(239,68,68,0.18); color: #f87171; border: 1px solid rgba(239,68,68,0.35); }
    .badge-out { background: rgba(56,189,248,0.18); color: #38bdf8; border: 1px solid rgba(56,189,248,0.35); }
    .badge-late { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .badge-missing { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); }
    .badge-type { background: rgba(139,92,246,0.15); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.35); }

    .past-stats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .past-stat { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: rgba(255,255,255,0.06); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.08); }
    .past-stat.ok { color: #38bdf8; border-color: rgba(56,189,248,0.28); background: rgba(56,189,248,0.1); }

    .cal-wrap { background: rgba(15,23,42,0.72); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .cal-title { font-size: 16px; font-weight: 800; color: #fff; }
    .cal-nav { display: flex; gap: 6px; align-items: center; }
    .cal-nav button { min-width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.06); color: #cbd5e1; font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 0 10px; }
    .cal-nav button:active { transform: scale(0.95); }

    /* ==================== ANALYTICS ==================== */
    .an-filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .an-range-chip { padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,0.05); color: #94a3b8; font-size: 12px; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
    .an-range-chip.active { background: rgba(0,255,204,0.12); color: #00ffcc; border-color: rgba(0,255,204,0.3); }
    .an-custom-dates { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .an-custom-dates input[type="date"] { padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(148,163,184,0.25); background: rgba(15,23,42,0.6); color: #e2e8f0; font-size: 12px; }
    .an-kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
    @media (min-width: 700px) { .an-kpi-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 1100px) { .an-kpi-grid { grid-template-columns: repeat(6, 1fr); } }
    .an-charts-row { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 18px; }
    @media (min-width: 900px) { .an-charts-row { grid-template-columns: 1fr 1.4fr; } }
    .an-chart-card { background: rgba(15,23,42,0.6); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 16px; }
    .an-chart-card h3 { font-size: 13px; font-weight: 800; color: #e2e8f0; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    .an-chart-card .an-chart-wrap { position: relative; height: 220px; }
    .an-chart-empty { display: flex; align-items: center; justify-content: center; height: 220px; color: #64748b; font-size: 12px; text-align: center; padding: 0 20px; }
    .an-perf-section { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 8px; }
    @media (min-width: 900px) { .an-perf-section { grid-template-columns: 1fr 1fr; } }
    .an-perf-card { background: rgba(15,23,42,0.55); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 14px; }
    .an-perf-card h3 { font-size: 13px; font-weight: 800; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.04em; }
    .an-perf-card.top h3 { color: #34d399; }
    .an-perf-card.follow h3 { color: #fbbf24; }
    .an-perf-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .an-perf-row:last-child { border-bottom: none; }
    .an-perf-name { font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; width: 86px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .an-perf-figs { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; min-width: 0; }
    .an-perf-fig { font-size: 10.5px; color: #94a3b8; white-space: nowrap; }
    .an-perf-fig strong { color: #cbd5e1; font-weight: 800; }
    .an-perf-reasons { font-size: 10.5px; color: #fbbf24; flex: 1; min-width: 0; }
    .an-empty-note { font-size: 12px; color: #64748b; padding: 10px 2px; }

    .form-card { background: rgba(15,23,42,0.72); backdrop-filter: blur(20px); border: 1px solid rgba(0,255,204,0.22); border-radius: 20px; padding: 20px; }
    .form-card label { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.05em; }
    .form-card h2 { font-size: 20px; font-weight: 900; color: #fff; margin: 0 0 6px; }
    .form-card .sub { font-size: 13px; color: #94a3b8; margin: 0 0 20px; }
    .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { padding: 8px 14px; border-radius: 10px; background: rgba(0,255,204,0.08); border: 1px solid rgba(0,255,204,0.3); color: #00ffcc; font-size: 12px; font-weight: 700; }
    .chip:active { transform: scale(0.96); }
    .chip.active { background: #00ffcc; color: #0a0f1e; }
    .chip-neutral { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); color: #cbd5e1; }
    .summary-line { background: rgba(0,0,0,0.4); border: 1px dashed rgba(0,255,204,0.35); border-radius: 12px; padding: 12px 14px; margin: 14px 0 16px; font-size: 13px; color: #cbd5e1; line-height: 1.5; }
    .summary-line strong { color: #00ffcc; }

    .map-card { background: rgba(15,23,42,0.72); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
    .map-card h3 { font-size: 14px; font-weight: 800; color: #fff; margin: 0 0 12px; }
    #cpd-map, #detail-map { height: 240px; border-radius: 12px; overflow: hidden; }

    .detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .detail-table th { text-align: left; padding: 10px 8px; font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); letter-spacing: 0.05em; }
    .detail-table td { padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.06); vertical-align: middle; color: #cbd5e1; }
    .att-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 2px solid rgba(0,255,204,0.3); }
    .att-name { display: flex; align-items: center; gap: 10px; }

    .greet-card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; margin-bottom: 16px; border-radius: 20px; position: relative; overflow: hidden; background: rgba(15,23,42,0.72); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); border: 1px solid rgba(0,255,204,0.25); }
    .greet-card::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(135deg, rgba(0,255,204,0.09), rgba(0,136,255,0.09)); }
    .greet-emoji { font-size: 34px; line-height: 1; flex-shrink: 0; animation: greetFloat 4s ease-in-out infinite; }
    @keyframes greetFloat { 50% { transform: translateY(-4px) rotate(5deg); } }
    .greet-text { min-width: 0; }
    .greet-text h2 { font-size: 18px; font-weight: 900; margin: 0 0 4px; color: #fff; letter-spacing: -0.02em; line-height: 1.25; }
    .greet-text p { font-size: 12.5px; color: #94a3b8; margin: 0; line-height: 1.5; }

    .empty { text-align: center; padding: 40px 20px; color: #64748b; font-size: 14px; background: rgba(15,23,42,0.55); border-radius: 16px; border: 1px dashed rgba(255,255,255,0.08); }
    .empty strong { display: block; color: #94a3b8; font-size: 15px; margin-bottom: 6px; }

    .skeleton { animation: skeletonShimmer 1.5s ease-in-out infinite; background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.10), rgba(255,255,255,0.04)); background-size: 200% 100%; border-radius: 14px; }
    @keyframes skeletonShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-line { height: 16px; margin-bottom: 10px; }
    .skel-card { height: 80px; margin-bottom: 12px; }
    .skel-header { height: 44px; width: 60%; margin-bottom: 20px; }

    #toast-root { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
    .toast { padding: 14px 16px; border-radius: 14px; font-weight: 700; text-align: center; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.35); animation: slideUp 0.3s ease; }
    .toast.success { background: linear-gradient(135deg,#10b981,#06b6d4); }
    .toast.error { background: linear-gradient(135deg,#ef4444,#dc2626); }
    .toast.warn { background: linear-gradient(135deg,#f59e0b,#d97706); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loader { position: fixed; inset: 0; background: #0a0f1e; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #fff; }
    .loader-ring { width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(0,217,255,0.2); border-top-color: #00D9FF; animation: spin 1s linear infinite; }

    .t-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .t-stat { background: rgba(15,23,42,0.55); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 14px; text-align: center; position: relative; overflow: hidden; }
    .t-stat.live { border-color: rgba(16,185,129,0.4); background: rgba(16,185,129,0.08); }
    .t-stat .val { font-size: 26px; font-weight: 900; line-height: 1; color: #fff; }
    .t-stat.live .val { color: #34d399; text-shadow: 0 0 12px rgba(16,185,129,0.4); }
    .t-stat .lbl { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-top: 6px; letter-spacing: 0.05em; }

    .cat-filter-row { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; }
    .cat-filter-row::-webkit-scrollbar { display: none; }
    .cat-filter { padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,0.05); color: #94a3b8; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
    .cat-filter.active { background: rgba(0,255,204,0.12); color: #00ffcc; border-color: rgba(0,255,204,0.3); }

    .csv-btn-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .csv-btn { padding: 10px 14px; border-radius: 10px; background: rgba(0,255,204,0.12); border: 1px solid rgba(0,255,204,0.3); color: #00ffcc; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }

          rows.push([n, tc.name, tc.gender, tc.category, a.cpdTitle || '', cpd?.type || 'CPD', cpd?.facilitator || '', toDate(a.attendedAt)?.toLocaleString() || '', a.attendedDistanceMeters != null ? a.attendedDistanceMeters.toFixed(0) : '', a.verified ? 'Yes' : 'No']);
        }
      });

      downloadCSV(`Event-Attendees-${new Date().toISOString().slice(0,10)}.csv`, rows);

    function downloadHistoricCSV() {

      state.allAttendances.slice().sort((a, b) => (toDate(b.attendedAt)?.getTime() || 0) - (toDate(a.attendedAt)?.getTime() || 0)).forEach((a, i) => {

        rows.push([i+1, a.teacherName || '', a.teacherEmail || '', schoolT?.category || '—', a.cpdTitle || '', cpd?.type || 'CPD', cpd?.facilitator || '', start?.toLocaleDateString() || '', start?.toLocaleTimeString() || '', end?.toLocaleTimeString() || '', dur, a.attendedDistanceMeters != null ? a.attendedDistanceMeters.toFixed(0) : '', a.verified ? 'Verified' : (a.state === 'active' ? 'Live' : 'Flagged')]);

    function dayHash(salt) { const d = new Date(); const uid = state.user?.uid || 'guest'; const key = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}|${uid}|${salt || ''}`; let h = 0; for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0; return h; }
    function pickDaily(list, salt) { return list[dayHash(salt) % list.length]; }

      else if (h >= 14 && h < 18) { emoji = '🌤️'; greetings = ['Good afternoon','Hello','Hey','Welcome back']; }

      else { emoji = '🌙'; greetings = ['Good night','Hello','Hey','Working late']; }
      return { name, emoji, greeting: pickDaily(greetings, 'greet'), sub: pickDaily(ADMIN_SUBLINES, 'adminsub') };

    /* ==================== ANALYTICS ==================== */
    function analyticsRangeKeys() {
      const todayKey = todayLocalDateKey();
      let startKey, endKey, label;
      if (state.analyticsRange === 'today') { startKey = todayKey; endKey = todayKey; label = t('an_range_today'); }
      else if (state.analyticsRange === 'week') {
        const wd = getWeekDates(todayKey);
        startKey = dateKeyOf(wd[0]); endKey = todayKey; label = t('an_range_week');
      } else if (state.analyticsRange === 'month') {
        const d = new Date(); const first = new Date(d.getFullYear(), d.getMonth(), 1);
        startKey = dateKeyOf(first); endKey = todayKey; label = t('an_range_month');
      } else {
        startKey = state.analyticsCustomStart || todayKey; endKey = state.analyticsCustomEnd || todayKey;
        if (endKey > todayKey) endKey = todayKey;
        if (startKey > endKey) startKey = endKey;
        label = t('an_range_custom');
      }
      return { startKey, endKey, label };
    }

    function workingDayKeysBetween(startKey, endKey) {
      const out = [];
      let cursor = startKey, guard = 0;
      while (cursor <= endKey && guard < 400) {
        const dow = new Date(cursor + 'T00:00:00').getDay();
        if (dow !== 0 && dow !== 6) out.push(cursor);
        cursor = shiftDateKey(cursor, 1);
        guard++;
      }
      return out;
    }

    function computeTodaySnapshot() {
      const todayKey = todayLocalDateKey();
      const teachers = state.teachers || [];
      const recByKey = new Map();
      state.dailyRecords.filter(r => r.date === todayKey).forEach(r => recByKey.set(normalizeName(r.teacherName), r));
      let absent = 0, late = 0, signedOut = 0, inSchool = 0;
      teachers.forEach(tc => {
        const r = recByKey.get(normalizeName(tc.name));
        if (!r || !r.signInAt) { absent++; return; }
        if (r.lateMinutes > 0) { late++; return; }
        if (r.state === 'in') inSchool++; else signedOut++;
      });
      return { absent, late, signedOut, inSchool, total: teachers.length };
    }

    function computeRangeKPIs(startKey, endKey) {
      const teachers = state.teachers || [];
      const workingDays = workingDayKeysBetween(startKey, endKey);
      const totalTeachers = teachers.length;
      const todayKey = todayLocalDateKey();
      let presentSlots = 0, lateSlots = 0, missingSignouts = 0;
      workingDays.forEach(dk => {
        const recByKey = new Map();
        state.dailyRecords.filter(r => r.date === dk).forEach(r => recByKey.set(normalizeName(r.teacherName), r));
        teachers.forEach(tc => {
          const r = recByKey.get(normalizeName(tc.name));
          if (r && r.signInAt) {
            presentSlots++;
            if (r.lateMinutes > 0) lateSlots++;
            if (!r.signOutAt && dk < todayKey) missingSignouts++;
          }
        });
      });
      const expectedSlots = workingDays.length * totalTeachers;
      const attendancePct = expectedSlots > 0 ? Math.round(presentSlots / expectedSlots * 100) : 0;

      let lessonsSubmitted = 0, lessonsMissing = 0;
      workingDays.forEach(dk => {
        teachers.forEach(tc => {
          const s = getPlanStatus(tc, dk).status;
          if (s === 'submitted') lessonsSubmitted++;
          else if (s === 'missed') lessonsMissing++;
        });
      });

      const cpdsInRange = (state.cpds || []).filter(c => {
        const dk = dateKeyOf(toDate(c.startTime) || new Date(0));
        return dk >= startKey && dk <= endKey && cpdStatus(c) === 'ended';
      });
      const cpdAttInRange = (state.allAttendances || []).filter(a => cpdsInRange.some(c => c.id === a.cpdId));
      const cpdVerified = cpdAttInRange.filter(a => a.verified).length;
      const unreadFeedback = (state.feedbackThreads || []).reduce((s, th) => s + (th.unreadByAdmin || 0), 0);

      return { workingDays, totalTeachers, attendancePct, lateSlots, missingSignouts, lessonsSubmitted, lessonsMissing, cpdCompleted: cpdsInRange.length, cpdVerified, unreadFeedback };
    }

    function computeTeacherPerformance(workingDays) {
      const teachers = state.teachers || [];
      const todayKey = todayLocalDateKey();
      const pastWorkingDays = workingDays.filter(dk => dk <= todayKey);
      const cpdsInRangeIds = new Set((state.cpds || []).filter(c => cpdStatus(c) === 'ended').map(c => c.id));
      return teachers.map(tc => {
        const norm = normalizeName(tc.name);
        let recorded = 0, onTime = 0, late = 0, missingSignout = 0;
        pastWorkingDays.forEach(dk => {
          const rec = state.dailyRecords.find(r => r.date === dk && normalizeName(r.teacherName) === norm);
          if (rec && rec.signInAt) {
            recorded++;
            if (rec.lateMinutes > 0) late++; else onTime++;
            if (!rec.signOutAt && dk < todayKey) missingSignout++;
          }
        });
        let lessonsSubmitted = 0;
        pastWorkingDays.forEach(dk => { if (getPlanStatus(tc, dk).status === 'submitted') lessonsSubmitted++; });
        const lessonsExpected = pastWorkingDays.length;

        const cpdAtt = (state.allAttendances || []).filter(a => normalizeName(a.teacherName) === norm && cpdsInRangeIds.has(a.cpdId));
        const cpdVerified = cpdAtt.filter(a => a.verified).length;
        const cpdEligible = cpdsInRangeIds.size;

        const attendancePct = pastWorkingDays.length > 0 ? recorded / pastWorkingDays.length : null;
        const onTimePct = recorded > 0 ? onTime / recorded : null;
        const lessonPct = lessonsExpected > 0 ? lessonsSubmitted / lessonsExpected : null;
        const cpdPct = cpdEligible > 0 ? cpdVerified / cpdEligible : null;
        const pctsAvailable = [attendancePct, onTimePct, lessonPct, cpdPct].filter(p => p !== null);
        const sortScore = pctsAvailable.length > 0 ? pctsAvailable.reduce((a,b) => a+b, 0) / pctsAvailable.length : null;

        const reasons = [];
        if (late >= 3) reasons.push(`${late} late arrivals`);
        if (missingSignout >= 2) reasons.push(`${missingSignout} missing sign-outs`);
        if (lessonsExpected > 0 && (lessonsExpected - lessonsSubmitted) >= 2) reasons.push(`${lessonsExpected - lessonsSubmitted} lesson plans missing`);
        if (cpdEligible >= 2 && cpdPct !== null && cpdPct < 0.5) reasons.push(`low CPD participation`);

        return { teacher: tc, recorded, workingDaysCount: pastWorkingDays.length, onTime, late, missingSignout, lessonsSubmitted, lessonsExpected, cpdVerified, cpdEligible, attendancePct, onTimePct, lessonPct, cpdPct, sortScore, reasons };
      });
    }

    function computeTrendSeries(workingDays) {
      const teachers = state.teachers || [];
      const total = teachers.length || 1;
      const labels = [], attendancePctArr = [], lessonPctArr = [];
      workingDays.forEach(dk => {
        const recByKey = new Map();
        state.dailyRecords.filter(r => r.date === dk).forEach(r => recByKey.set(normalizeName(r.teacherName), r));
        let present = 0;
        teachers.forEach(tc => { const r = recByKey.get(normalizeName(tc.name)); if (r && r.signInAt) present++; });
        let submitted = 0;
        teachers.forEach(tc => { if (getPlanStatus(tc, dk).status === 'submitted') submitted++; });
        labels.push(new Date(dk + 'T00:00:00').toLocaleDateString([], { day: '2-digit', month: 'short' }));
        attendancePctArr.push(Math.round(present / total * 100));
        lessonPctArr.push(Math.round(submitted / total * 100));
      });
      return { labels, attendancePctArr, lessonPctArr };
    }

      const followHtml = followUp.length > 0 ? followUp.map(p => `<div class="an-perf-row">

        </div>
        <div class="an-perf-section">

    /* ==================== OVERVIEW ==================== */
    function renderAdminOverview() {
      const list = state.cpds;
      const now = Date.now();

      }

      const upcomingCards = upcoming.slice(0,4).map(c => `<div class="a-session-card"><div class="row"><div style="flex:1;min-width:0"><div><span class="badge badge-upcoming">${t('upcoming')}</span><span class="badge badge-type">${escapeHtml(c.type || 'CPD')}</span></div><h3>${escapeHtml(c.title)}</h3><p>${fmtDateTime(c.startTime)} · ${escapeHtml(c.venueName || '')}</p></div><div class="actions"><button data-open-cpd="${c.id}" class="btn btn-primary">${t('open')}</button></div></div></div>`).join('');
      const endedList = list.filter(c => cpdStatus(c) === 'ended').sort((a,b) => (toDate(b.startTime)?.getTime() || 0) - (toDate(a.startTime)?.getTime() || 0)).slice(0, 4);
      const endedCards = endedList.map(c => {

        const total = atts.length, verified = atts.filter(a => a.verified).length;
        return `<div class="a-session-card"><div class="row"><div style="flex:1;min-width:0"><div><span class="badge badge-ended">${t('ended')}</span><span class="badge badge-type">${escapeHtml(c.type || 'CPD')}</span></div><h3>${escapeHtml(c.title)}</h3><p>${fmtDateTime(c.startTime)} · ${escapeHtml(c.venueName || '')}</p><div class="past-stats"><span class="past-stat">👥 ${total} ${t('attendees')}</span><span class="past-stat ok">✓ ${verified} ${t('verified')}</span></div></div><div class="actions"><button data-open-cpd="${c.id}" class="btn btn-primary">${t('open')}</button></div></div></div>`;

      return `${greetingCardHtml()}

          <div class="a-stat"><div class="val" style="color:#a855f7">${upcoming.length}</div><div class="lbl">${t('stat_upcoming')}</div></div>
          <div class="a-stat"><div class="val" style="color:#fbbf24;font-size:18px">${nextStr}</div><div class="lbl">${t('stat_next_session')}</div></div>
        </div>
        ${ongoing.length > 0 ? `<div class="section-title">${t('ongoing')}</div>${ongoingCards}` : ''}
        ${upcoming.length > 0 ? `<div class="section-title">${t('upcoming')}</div>${upcomingCards}` : ''}
        ${endedList.length > 0 ? `<div class="section-title">${t('past_sessions')}</div>${endedCards}` : ''}

    function renderAdminSessions() {

        snap => { state.dailyRecords = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (state.adminTab === 'daily' || state.adminTab === 'teachers' || state.adminTab === 'overview') renderAdmin(); },

    function renderAdminDaily() {
      ensureDailySub();
      const date = state.dailyDate;
      const todayKey = todayLocalDateKey();
      const isPast = date < todayKey;
      const dayRecords = state.dailyRecords.filter(r => r.date === date);
      const recByKey = new Map(); dayRecords.forEach(r => recByKey.set(normalizeName(r.teacherName), r));
      let presentCount = 0, inCount = 0, outCount = 0, absentCount = 0, lateCount = 0, earlyLeaveCount = 0;
      (state.teachers || []).forEach(tc => {
        const r = recByKey.get(normalizeName(tc.name));
        if (!r || !r.signInAt) { absentCount++; return; }
        presentCount++;
        if (r.state === 'in') inCount++; else outCount++;
        if (r.lateMinutes > 0) lateCount++;
        if (r.earlyLeaveMinutes > 0) earlyLeaveCount++;
      });
      const last7Days = Array.from({length: 7}, (_, i) => shiftDateKey(todayKey, i - 6));
      const chartData = last7Days.map(d => {
        const dayRecs = state.dailyRecords.filter(r => r.date === d && r.signInAt);
        return { date: d, label: new Date(d + 'T00:00:00').toLocaleDateString([], { weekday: 'short' }), count: dayRecs.length };
      });
      const maxChartVal = Math.max(...chartData.map(d => d.count), 1);

      const statCards = isPast
        ? `<div class="a-stat"><div class="val" style="color:#34d399">${presentCount}</div><div class="lbl">${t('daily_present')}</div></div>
           <div class="a-stat"><div class="val" style="color:#fbbf24">${lateCount}</div><div class="lbl">${t('daily_late')}</div></div>
           <div class="a-stat"><div class="val" style="color:#f87171">${earlyLeaveCount}</div><div class="lbl">Early Leave</div></div>
           <div class="a-stat"><div class="val" style="color:#f87171">${absentCount}</div><div class="lbl">${t('daily_absent')}</div></div>`
        : `<div class="a-stat"><div class="val" style="color:#34d399">${inCount}</div><div class="lbl">${t('daily_in_school')}</div></div>
           <div class="a-stat"><div class="val" style="color:#38bdf8">${outCount}</div><div class="lbl">${t('daily_signed_out')}</div></div>
           <div class="a-stat"><div class="val" style="color:#fbbf24">${lateCount}</div><div class="lbl">${t('daily_late')}</div></div>
           <div class="a-stat"><div class="val" style="color:#f87171">${absentCount}</div><div class="lbl">${t('daily_not_arrived')}</div></div>`;
      const dateLabel = new Date(date + 'T00:00:00').toLocaleDateString([], { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
      const groups = { Nursery: [], Primary: [], Secondary: [] };
      (state.teachers || []).forEach(tc => { const r = recByKey.get(normalizeName(tc.name)); if (groups[tc.category]) groups[tc.category].push({ teacher: tc, record: r }); });

          if (record.selfieIn) { avatarHtml = `<img src="${record.selfieIn}" class="daily-avatar-img" onclick="window._showPhoto('${record.selfieIn}')" />`; photoThumbs += `<img src="${record.selfieIn}" class="photo-thumb" onclick="window._showPhoto('${record.selfieIn}')" title="Arrival" />`; }
          if (record.selfieOut) photoThumbs += `<img src="${record.selfieOut}" class="photo-thumb" onclick="window._showPhoto('${record.selfieOut}')" title="Departure" />`;

          if (signOut) timesLine += `<span>Out: <strong>${signOut.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</strong></span>`;

    function bindDailyEvents() {

    /* ==================== TEACHERS TAB ==================== */
    function renderAdminTeachers() {
      ensureDailySub();
      const date = todayLocalDateKey();
      const dayRecords = state.dailyRecords.filter(r => r.date === date);
      const recByKey = new Map(); dayRecords.forEach(r => recByKey.set(normalizeName(r.teacherName), r));
      const activeCPDByName = new Map();
      state.allAttendances.forEach(a => { if (a.state === 'active') activeCPDByName.set(normalizeName(a.teacherName), a); });

      const groups = { inCpd: [], inSchool: [], notIn: [] };
      let inCpdCnt = 0, inSchoolCnt = 0, outCnt = 0, absentCnt = 0;
      (state.teachers || []).forEach(tc => {
        const key = normalizeName(tc.name);
        const rec = recByKey.get(key);
        const cpdAtt = activeCPDByName.get(key);
        const cat = tc.category || 'Primary';
        if (state.teacherCatFilter !== 'all' && cat !== state.teacherCatFilter) return;
        if (state.teacherSearch && !tc.name.toLowerCase().includes(state.teacherSearch.toLowerCase())) return;
        if (cpdAtt) { groups.inCpd.push({ teacher: tc, record: rec, cpdAtt }); inCpdCnt++; }
        else if (rec && rec.state === 'in' && rec.signInAt) { groups.inSchool.push({ teacher: tc, record: rec }); inSchoolCnt++; }
        else if (rec && rec.signOutAt) { groups.notIn.push({ teacher: tc, record: rec }); outCnt++; }
        else { groups.notIn.push({ teacher: tc, record: rec }); absentCnt++; }
      });

      const renderTeacherRow = ({ teacher, record, cpdAtt }) => {
        const isLive = !!(cpdAtt || (record && record.state === 'in' && record.signInAt));
        const isAbsent = !record || !record.signInAt;
        const cls = ['teacher-row', isLive ? 'live' : '', isAbsent && !cpdAtt ? 'absent-row' : ''].filter(Boolean).join(' ');
        const dotClass = cpdAtt ? 'in-cpd' : (record && record.state === 'in' ? 'in-school' : (record && record.signOutAt ? 'signed-out' : 'absent'));
        const sub = cpdAtt ? `In: ${escapeHtml(cpdAtt.cpdTitle || 'CPD')}` : (record && record.signInAt ? `In: ${fmtTime(record.signInAt)}${record.state === 'out' ? ` · Out: ${fmtTime(record.signOutAt)}` : ''}` : 'Not arrived');
        return `<div class="${cls}" data-teacher-name="${escapeHtml(teacher.name)}">
          <div class="teacher-avatar">${initialsOf(teacher.name)}</div>
          <div class="teacher-info">
            <div class="teacher-name">${escapeHtml(teacher.name)}</div>
            <div class="teacher-sub-line"><span class="status-dot ${dotClass}"></span>${sub}</div>
          </div>
        </div>`;
      };

      const col = (title, items, color) => `<div class="teacher-column">
        <div class="tc-head"><h3 style="color:${color};">${title}</h3><span class="cnt">${items.length}</span></div>
        ${items.length === 0 ? `<div style="text-align:center;color:#64748b;font-size:11px;padding:16px;">—</div>` : items.map(renderTeacherRow).join('')}
      </div>`;

      const noMatch = (groups.inCpd.length + groups.inSchool.length + groups.notIn.length) === 0;

      return `<h1 style="font-size:22px;font-weight:900;color:#fff;margin:0 0 16px;">${t('teachers_title')}</h1>
        <div class="t-stats">
          <div class="t-stat live"><div class="val">${inCpdCnt}</div><div class="lbl">${t('stat_in_cpd')}</div></div>
          <div class="t-stat live"><div class="val">${inSchoolCnt}</div><div class="lbl">${t('stat_in_school')}</div></div>
          <div class="t-stat"><div class="val" style="color:#38bdf8">${outCnt}</div><div class="lbl">${t('stat_signed_out')}</div></div>
          <div class="t-stat"><div class="val" style="color:#f87171">${absentCnt}</div><div class="lbl">${t('stat_absent')}</div></div>
        </div>
        <input type="text" class="teacher-search" id="teacher-search" placeholder="${t('search_teacher_placeholder')}" value="${escapeHtml(state.teacherSearch)}" />
        <div class="cat-filter-row">
          ${[{id:'all',label:t('all_categories')},{id:'Nursery',label:t('nursery')},{id:'Primary',label:t('primary')},{id:'Secondary',label:t('secondary')}].map(f => `<button class="cat-filter ${state.teacherCatFilter === f.id ? 'active' : ''}" data-tcat="${f.id}">${f.label}</button>`).join('')}
        </div>
        <div class="csv-btn-row">
          <button class="csv-btn" id="btn-dl-current">📥 ${t('download_current')}</button>
          <button class="csv-btn warn" id="btn-dl-history">📥 ${t('download_history')}</button>
        </div>
        ${noMatch ? `<div class="empty"><strong>${t('no_teachers_match')}</strong></div>` : `<div class="teacher-columns">${col(t('stat_in_cpd'), groups.inCpd, '#34d399')}${col(t('stat_in_school'), groups.inSchool, '#34d399')}${col(t('stat_signed_out'), groups.notIn, '#94a3b8')}</div>`}`;
    }

    function renderTeacherDetail() {

      if (!name) { state.view = 'admin'; renderAdmin(); return; }
      const schoolT = findSchoolTeacher(name);
      const teacherUid = schoolT?.id || null;

      // Attendance from CPD records
      const cpdAtt = state.allAttendances.filter(a => normalizeName(a.teacherName) === normalizedName)
        .sort((a,b) => (toDate(b.attendedAt)?.getTime() || 0) - (toDate(a.attendedAt)?.getTime() || 0));
      // Daily attendance
      const dailyAtt = state.dailyRecords.filter(r => normalizeName(r.teacherName) === normalizedName)
        .sort((a,b) => b.date.localeCompare(a.date));
      // Lesson plans by teacherId or by name fallback
      const lessonPlans = state.lessonPlans.filter(lp => lp.teacherId === teacherUid || normalizeName(lp.teacherName) === normalizedName);

      const endedCpd = cpdAtt.filter(a => a.state === 'ended');
      const verifiedCpd = cpdAtt.filter(a => a.verified);
      const totalHours = endedCpd.reduce((s, a) => {
        const s1 = toDate(a.attendedAt)?.getTime(); const e1 = toDate(a.endedAt)?.getTime();
        return s1 && e1 ? s + Math.max(0, (e1 - s1) / 3600000) : s;

      const thisMonthStart = new Date(); thisMonthStart.setDate(1); thisMonthStart.setHours(0,0,0,0);
      const thisMonthCpd = cpdAtt.filter(a => (toDate(a.attendedAt)?.getTime() || 0) >= thisMonthStart.getTime()).length;
      const verifiedPct = endedCpd.length > 0 ? Math.round(verifiedCpd.length / endedCpd.length * 100) : 0;

      const cpdHistoryHtml = cpdAtt.slice(0, 20).map(a => {

        return `<div class="hist-item"><div class="hist-info"><h4>${escapeHtml(a.cpdTitle || 'CPD Session')}</h4><p>${start ? start.toLocaleDateString([], { day: '2-digit', month: 'short' }) : '—'} · ${dur}</p></div>${a.verified ? `<span class="badge badge-verified">✓</span>` : `<span class="badge badge-flagged">⚠</span>`}</div>`;
      }).join('');

      const lpHistoryHtml = lessonPlans.slice(0, 10).map(lp => `<div class="hist-item"><div class="hist-info"><h4>${escapeHtml(lp.title || lp.fileName || 'Untitled')}</h4><p>${lp.forDate ? new Date(lp.forDate + 'T00:00:00').toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' }) : '—'}</p></div><span class="badge badge-verified">Submitted</span></div>`).join('');

      document.getElementById('app').innerHTML = `${headerHtml()}<main class="main main-wide">
        <button class="btn btn-ghost" id="td-back" style="width:auto; padding:8px 14px; margin-bottom:16px;">‹ ${t('back_to_teachers')}</button>
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:20px; flex-wrap:wrap;">
          <div class="teacher-avatar" style="width:56px;height:56px;font-size:20px;">${initialsOf(name)}</div>
          <div style="min-width:0;">
            <h1 style="font-size:20px;font-weight:900;color:#fff;margin:0;">${escapeHtml(name)}</h1>
            <p style="font-size:12px;color:#94a3b8;margin:4px 0 0;">${escapeHtml(schoolT?.category || 'Teacher')}</p>
          </div>
        </div>
        <div class="td-stats">
          <div class="td-stat"><div class="val" style="color:#34d399">${presentDays}</div><div class="lbl">${t('daily_present')}</div></div>
          <div class="td-stat"><div class="val" style="color:#fbbf24">${lateDays}</div><div class="lbl">${t('daily_late')}</div></div>
          <div class="td-stat"><div class="val">${endedCpd.length}</div><div class="lbl">${t('td_sessions')}</div></div>
          <div class="td-stat"><div class="val" style="color:#00ffcc">${thisMonthCpd}</div><div class="lbl">${t('td_this_month')}</div></div>
        </div>
        <div class="section-title">${t('td_history')}</div>
        ${dailyHistoryHtml || `<div class="empty"><strong>${t('td_no_history')}</strong></div>`}
        <div class="section-title">${t('td_cpd_history')}</div>
        ${cpdHistoryHtml || `<div class="empty"><strong>${t('td_no_history')}</strong></div>`}
        <div class="section-title">Lesson Plans</div>
        ${lpHistoryHtml || `<div class="empty"><strong>${t('td_no_history')}</strong></div>`}
      </main>${adminTabBar()}`;

      const backBtn = document.getElementById('td-back');

    /* ==================== LESSON PLANS (5-DAY CALENDAR) ==================== */
    function getWeekDates(refDate) {
      const d = new Date(refDate);
      const dow = d.getDay() === 0 ? 7 : d.getDay();
      const monday = new Date(d);
      monday.setDate(d.getDate() - dow + 1);
      return Array.from({length: 5}, (_, i) => {
        const day = new Date(monday); day.setDate(monday.getDate() + i); return day;
      });
    }

    function getPlanStatus(teacher, dateKey) {
      const norm = normalizeName(teacher.name);
      const plan = state.lessonPlans.find(p => {
        const match = (p.teacherId && p.teacherId === teacher.id) || normalizeName(p.teacherName) === norm;
        if (!match) return false;
        if (p.forDate === dateKey) return true;
        if (!p.forDate) {
          const subDate = dateKeyOf(toDate(p.submittedAt));
          return subDate === dateKey;
        }
        return false;
      });
      if (plan) return { status: 'submitted', plan };
      const todayKey = todayLocalDateKey();
      if (dateKey < todayKey) return { status: 'missed' };
      if (dateKey > todayKey) return { status: 'pending' };
      // today
      const now = new Date();
      const [endH, endM] = (state.settings.lessonDeadline || DEFAULT_LESSON_DEADLINE).split(':').map(Number);
      const deadlineMins = endH * 60 + endM;
      const nowMins = now.getHours() * 60 + now.getMinutes();
      if (nowMins >= deadlineMins) return { status: 'missed' };
      return { status: 'pending' };
    }

    function renderAdminLessonPlans() {
      const todayKey = todayLocalDateKey();
      const weekDates = getWeekDates(state.calSelectedDay || todayKey);
      const weekKeys = weekDates.map(d => dateKeyOf(d));
      const weekLabel = `${weekDates[0].toLocaleDateString([], { day: '2-digit', month: 'short' })} – ${weekDates[4].toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' })}`;

      const dayCards = weekDates.map((dateObj, i) => {
        const key = weekKeys[i];
        const weekday = dateObj.toLocaleDateString([], { weekday: 'short' });
        const dayNum = dateObj.toLocaleDateString([], { day: '2-digit', month: 'short' });
        const teachers = state.teachers || [];
        let submitted = 0, missed = 0, pending = 0;
        teachers.forEach(tc => {
          const s = getPlanStatus(tc, key);
          if (s.status === 'submitted') submitted++;
          else if (s.status === 'missed') missed++;
          else pending++;
        });
        const total = teachers.length;
        const pct = total > 0 ? Math.round(submitted / total * 100) : 0;
        const isSelected = key === state.calSelectedDay;
        const isToday = key === todayKey;
        const cls = ['lp-week-day', isSelected ? 'selected' : '', isToday ? 'today' : ''].filter(Boolean).join(' ');
        return `<div class="${cls}" data-lp-day="${key}">
          <div class="lp-week-day-header">${weekday}</div>
          <div class="lp-week-day-date">${dayNum}</div>
          <div class="lp-week-day-stats">
            <span class="ok">${submitted}</span>
            <span class="${missed > 0 ? 'miss' : 'pend'}">${missed > 0 ? missed : pending}</span>
          </div>
          <div class="lp-week-day-bar"><div class="lp-week-day-bar-fill" style="width: ${pct}%"></div></div>
        </div>`;
      }).join('');

      // Selected day detail
      const selKey = state.calSelectedDay || todayKey;
      const selLabel = new Date(selKey + 'T00:00:00').toLocaleDateString([], { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
      let teachersForDay = (state.teachers || []).map(tc => ({ teacher: tc, info: getPlanStatus(tc, selKey) }));
      // filter
      if (state.lpFilter === 'submitted') teachersForDay = teachersForDay.filter(x => x.info.status === 'submitted');
      else if (state.lpFilter === 'missing') teachersForDay = teachersForDay.filter(x => x.info.status !== 'submitted');
      // sort: missing first, then by name
      teachersForDay.sort((a, b) => {
        const order = { missed: 0, pending: 1, submitted: 2 };
        const diff = order[a.info.status] - order[b.info.status];
        if (diff !== 0) return diff;
        return a.teacher.name.localeCompare(b.teacher.name);
      });

      const cardsHtml = teachersForDay.map(({ teacher, info }) => {
        const cls = info.status === 'submitted' ? 'lp-card submitted' : info.status === 'missed' ? 'lp-card missing' : 'lp-card pending';
        const statusBadge = info.status === 'submitted' ? `<span class="badge badge-verified">${t('submitted')}</span>` : info.status === 'missed' ? `<span class="badge badge-absent">${t('missed')}</span>` : `<span class="badge badge-late">${t('pending')}</span>`;
        if (info.status === 'submitted') {
          return `<div class="${cls}" data-lp-preview-id="${info.plan.id}">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
              <h4>${escapeHtml(teacher.name)}</h4>
              ${statusBadge}
            </div>
            <p>📎 ${escapeHtml(info.plan.title || info.plan.fileName || 'Untitled')}</p>
            <div class="lp-meta">
              <span>${fmtDateTime(info.plan.submittedAt)}</span>
              <button class="lp-preview-btn" data-lp-preview-id="${info.plan.id}">${t('lp_preview')}</button>
            </div>
          </div>`;
        }
        return `<div class="${cls}">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <h4>${escapeHtml(teacher.name)}</h4>
            ${statusBadge}
          </div>
          <p>${info.status === 'missed' ? t('lp_not_submitted') : 'Awaiting submission…'}</p>
          <div class="lp-meta"><span>${escapeHtml(teacher.category || '')}</span></div>
        </div>`;
      }).join('');

      return `<h1 style="font-size:22px;font-weight:900;color:#fff;margin:0 0 4px;">${t('lp_title')}</h1>
        <p style="font-size:13px;color:#94a3b8;margin:0 0 16px;">${t('lp_sub')}</p>
        <div class="cal-wrap">
          <div class="cal-header">
            <div class="cal-title">${t('lp_this_week')} · ${escapeHtml(weekLabel)}</div>
            <div class="cal-nav">
              <button id="lp-prev-week">‹</button>
              <button id="lp-today-week">Today</button>
              <button id="lp-next-week">›</button>
            </div>
          </div>
          <div class="lp-week-strip">${dayCards}</div>
          <div style="font-size:11px;color:#64748b;margin-top:12px;">${t('lp_weekend_note')}</div>
        </div>
        <div class="section-title" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <span>${escapeHtml(selLabel)}</span>
          <div class="filter-tabs" style="margin:0;">
            ${[{id:'all',l:t('lp_all')},{id:'submitted',l:t('lp_submitted')},{id:'missing',l:t('lp_missing')}].map(f => `<button class="filter-tab ${state.lpFilter === f.id ? 'active' : ''}" data-lpf="${f.id}">${f.l}</button>`).join('')}
          </div>
        </div>
        ${cardsHtml ? `<div class="lp-grid">${cardsHtml}</div>` : `<div class="empty"><strong>No teachers match this filter.</strong></div>`}
      `;
    }
