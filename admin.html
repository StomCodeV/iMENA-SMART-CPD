<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#071B33" />
  <title>Admin Portal — iMENA Smart Attendance</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/zBDCZhCb/i-MENA-Smart-CPD-Badge.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; color: #e2e8f0; -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; background: #0a0f1e; }
    button, input, select { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }

    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse at 20% 10%, rgba(0,136,255,0.18), transparent 45%), radial-gradient(ellipse at 80% 60%, rgba(0,255,204,0.12), transparent 50%), linear-gradient(180deg, #050e2a 0%, #0a1a3a 50%, #050e2a 100%);
    }
    #bg-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; display: block; background: transparent; opacity: 0; transition: opacity 0.8s ease; }
    #bg-canvas.ready { opacity: 1; }
    #app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    .header { position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; gap: 8px; background: rgba(10,15,30,0.72); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-bottom: 1px solid rgba(255,255,255,0.06); padding-top: max(10px, env(safe-area-inset-top)); }
    .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .header-logo { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }
    .header-title { font-size: 14px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .header-title span { display: block; font-size: 9px; color: #00ffcc; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .avatar-btn { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; border: 2px solid #00ffcc; padding: 0; background: #fff; flex-shrink: 0; }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .profile-modal { position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .profile-modal.open { opacity: 1; pointer-events: auto; }
    .profile-card { background: #1e293b; color: #fff; border-radius: 24px; padding: 24px; width: 100%; max-width: 340px; text-align: center; transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    .profile-modal.open .profile-card { transform: translateY(0); }
    .profile-img { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 16px; border: 3px solid #00ffcc; object-fit: cover; }
    .profile-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .profile-email { font-size: 13px; color: #94a3b8; margin-bottom: 12px; word-break: break-all; }
    .profile-role { display: inline-block; padding: 6px 12px; border-radius: 99px; background: rgba(0,255,204,0.15); color: #00ffcc; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 20px; }
    .profile-actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-home, .btn-logout { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; }
    .btn-home { background: rgba(255,255,255,0.05); color: #fff; }
    .btn-logout { background: rgba(239,68,68,0.15); color: #f87171; }

    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px 20px; border-radius: 14px; font-size: 15px; font-weight: 800; transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s; min-height: 48px; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg,#00ffcc,#0088ff); color: #0a0f1e; box-shadow: 0 6px 20px rgba(0,255,204,0.3); }
    .btn-danger { background: linear-gradient(135deg,#ef4444,#dc2626); color: #fff; box-shadow: 0 6px 20px rgba(239,68,68,0.35); }
    .btn-ghost { background: rgba(255,255,255,0.06); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); }

    .input, select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(148,163,184,0.25); background: rgba(15,23,42,0.6); font-size: 15px; margin-bottom: 12px; color: #e2e8f0; appearance: none; }
    .input:focus, select:focus { outline: none; border-color: #00ffcc; box-shadow: 0 0 0 4px rgba(0,255,204,0.15); }

    .main { flex: 1; padding: 18px 14px calc(80px + env(safe-area-inset-bottom)); max-width: 800px; margin: 0 auto; width: 100%; }
    .main.main-wide { max-width: 1400px; }

    .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; z-index: 90; background: rgba(10,15,30,0.85); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-top: 1px solid rgba(255,255,255,0.08); padding-bottom: env(safe-area-inset-bottom); }
    .tab-btn { flex: 1; padding: 10px 0; color: #64748b; font-size: 8.5px; font-weight: 700; text-align: center; transition: color 0.2s; text-transform: uppercase; letter-spacing: 0.02em; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .tab-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
    .tab-btn.active { color: #00ffcc; filter: drop-shadow(0 0 8px rgba(0,255,204,0.5)); }

    .a-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .a-stat { background: rgba(15,23,42,0.55); backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(0,255,204,0.2); border-radius: 14px; padding: 14px; text-align: center; }
    .a-stat .val { font-size: 24px; font-weight: 900; color: #fff; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(0,255,204,0.35); }
    .a-stat .lbl { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-top: 6px; letter-spacing: 0.05em; }

    .a-session-card { background: rgba(15,23,42,0.55); backdrop-filter: blur(18px); border: 1px solid rgba(0,255,204,0.18); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .a-session-card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .a-session-card h3 { font-size: 15px; color: #fff; margin: 4px 0 4px; word-break: break-word; }
    .a-session-card p { font-size: 12px; color: #94a3b8; margin: 0; }
    .a-session-card .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .a-session-card .actions .btn { padding: 8px 12px; font-size: 12px; min-height: auto; width: auto; }

    .section-title { font-size: 13px; font-weight: 800; color: #94a3b8; margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 0.06em; padding-left: 4px; }
    .section-title:first-child { margin-top: 0; }

    .filter-tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab { padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,0.05); color: #94a3b8; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
    .filter-tab.active { background: rgba(0,255,204,0.12); color: #00ffcc; border-color: rgba(0,255,204,0.3); }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
    .badge-live { background: rgba(16,185,129,0.18); color: #34d399; border: 1px solid rgba(16,185,129,0.35); }
    .badge-upcoming { background: rgba(148,163,184,0.15); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.2); }
    .badge-ended { background: rgba(148,163,184,0.1); color: #94a3b8; border: 1px solid rgba(148,163,184,0.15); }
    .badge-verified { background: rgba(14,165,233,0.18); color: #38bdf8; border: 1px solid rgba(14,165,233,0.35); }
    .badge-flagged { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .badge-absent { background: rgba(239,68,68,0.18); color: #f87171; border: 1px solid rgba(239,68,68,0.35); }
    .badge-out { background: rgba(56,189,248,0.18); color: #38bdf8; border: 1px solid rgba(56,189,248,0.35); }
    .badge-late { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .badge-missing { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); }
    .badge-type { background: rgba(139,92,246,0.15); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.35); }

    .past-stats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .past-stat { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: rgba(255,255,255,0.06); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.08); }
    .past-stat.ok { color: #38bdf8; border-color: rgba(56,189,248,0.28); background: rgba(56,189,248,0.1); }

    .cal-wrap { background: rgba(15,23,42,0.72); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .cal-title { font-size: 16px; font-weight: 800; color: #fff; }
    .cal-nav { display: flex; gap: 6px; }
    .cal-nav button { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.06); color: #cbd5e1; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .cal-nav button:active { transform: scale(0.95); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow { text-align: center; font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; padding: 6px 0; }
    .cal-day { aspect-ratio: 1; border-radius: 8px; background: rgba(255,255,255,0.03); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #cbd5e1; cursor: pointer; position: relative; transition: background 0.15s; }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.has-cpd { background: rgba(139,92,246,0.18); border: 1px solid rgba(139,92,246,0.4); color: #fff; }
    .cal-day.has-cpd::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: #8b5cf6; }
    .cal-day.has-cpd.past-only { background: rgba(56,189,248,0.14); border-color: rgba(56,189,248,0.42); }
    .cal-day.has-cpd.past-only::after { background: #38bdf8; }
    .cal-day.has-cpd.live-day { background: rgba(16,185,129,0.18); border-color: rgba(16,185,129,0.45); }
    .cal-day.has-cpd.live-day::after { background: #10b981; }
    .cal-day.today { border: 2px solid #06b6d4; }
    .cal-day.selected { background: linear-gradient(135deg,#ec4899,#8b5cf6); color: #fff; border-color: transparent; }
    .cal-day.selected::after { background: #fff; }
    .cal-day:active:not(.empty) { transform: scale(0.94); }
    .cal-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08); }
    .cal-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #94a3b8; font-weight: 600; }
    .cal-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .cal-legend .dot-ended { background: #38bdf8; box-shadow: 0 0 8px rgba(56,189,248,0.5); }
    .cal-legend .dot-live { background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.5); }
    .cal-legend .dot-upcoming { background: #8b5cf6; box-shadow: 0 0 8px rgba(139,92,246,0.5); }

    .form-card { background: rgba(15,23,42,0.72); backdrop-filter: blur(20px); border: 1px solid rgba(0,255,204,0.22); border-radius: 20px; padding: 20px; }
    .form-card label { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.05em; }
    .form-card h2 { font-size: 20px; font-weight: 900; color: #fff; margin: 0 0 6px; }
    .form-card .sub { font-size: 13px; color: #94a3b8; margin: 0 0 20px; }
    .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { padding: 8px 14px; border-radius: 10px; background: rgba(0,255,204,0.08); border: 1px solid rgba(0,255,204,0.3); color: #00ffcc; font-size: 12px; font-weight: 700; }
    .chip:active { transform: scale(0.96); }
    .chip.active { background: #00ffcc; color: #0a0f1e; }
    .chip-neutral { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); color: #cbd5e1; }
    .summary-line { background: rgba(0,0,0,0.4); border: 1px dashed rgba(0,255,204,0.35); border-radius: 12px; padding: 12px 14px; margin: 14px 0 16px; font-size: 13px; color: #cbd5e1; line-height: 1.5; }
    .summary-line strong { color: #00ffcc; }

    .map-card { background: rgba(15,23,42,0.72); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
    .map-card h3 { font-size: 14px; font-weight: 800; color: #fff; margin: 0 0 12px; }
    .detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .detail-table th { text-align: left; padding: 10px 8px; font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); letter-spacing: 0.05em; }
    .detail-table td { padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.06); vertical-align: middle; color: #cbd5e1; }
    .att-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 2px solid rgba(0,255,204,0.3); }
    .att-name { display: flex; align-items: center; gap: 10px; }

    .greet-card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; margin-bottom: 16px; border-radius: 20px; position: relative; overflow: hidden; background: rgba(15,23,42,0.72); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); border: 1px solid rgba(0,255,204,0.25); }
    .greet-card::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(135deg, rgba(0,255,204,0.09), rgba(0,136,255,0.09)); }
    .greet-emoji { font-size: 34px; line-height: 1; flex-shrink: 0; animation: greetFloat 4s ease-in-out infinite; }
    @keyframes greetFloat { 50% { transform: translateY(-4px) rotate(5deg); } }
    .greet-text { min-width: 0; }
    .greet-text h2 { font-size: 18px; font-weight: 900; margin: 0 0 4px; color: #fff; letter-spacing: -0.02em; line-height: 1.25; }
    .greet-text p { font-size: 12.5px; color: #94a3b8; margin: 0; line-height: 1.5; }

    .empty { text-align: center; padding: 40px 20px; color: #64748b; font-size: 14px; background: rgba(15,23,42,0.55); border-radius: 16px; border: 1px dashed rgba(255,255,255,0.08); }
    .empty strong { display: block; color: #94a3b8; font-size: 15px; margin-bottom: 6px; }

    .skeleton { animation: skeletonShimmer 1.5s ease-in-out infinite; background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.10), rgba(255,255,255,0.04)); background-size: 200% 100%; border-radius: 14px; }
    @keyframes skeletonShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-line { height: 16px; margin-bottom: 10px; }
    .skel-card { height: 80px; margin-bottom: 12px; }
    .skel-header { height: 44px; width: 60%; margin-bottom: 20px; }

    #toast-root { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
    .toast { padding: 14px 16px; border-radius: 14px; font-weight: 700; text-align: center; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.35); animation: slideUp 0.3s ease; }
    .toast.success { background: linear-gradient(135deg,#10b981,#06b6d4); }
    .toast.error { background: linear-gradient(135deg,#ef4444,#dc2626); }
    .toast.warn { background: linear-gradient(135deg,#f59e0b,#d97706); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loader { position: fixed; inset: 0; background: #0a0f1e; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #fff; }
    .loader-ring { width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(0,217,255,0.2); border-top-color: #00D9FF; animation: spin 1s linear infinite; }

    .t-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .t-stat { background: rgba(15,23,42,0.55); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 14px; text-align: center; position: relative; overflow: hidden; }
    .t-stat.live { border-color: rgba(16,185,129,0.4); background: rgba(16,185,129,0.08); }
    .t-stat .val { font-size: 26px; font-weight: 900; line-height: 1; color: #fff; }
    .t-stat.live .val { color: #34d399; text-shadow: 0 0 12px rgba(16,185,129,0.4); }
    .t-stat .lbl { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-top: 6px; letter-spacing: 0.05em; }

    .cat-filter-row { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; }
    .cat-filter-row::-webkit-scrollbar { display: none; }
    .cat-filter { padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,0.05); color: #94a3b8; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
    .cat-filter.active { background: rgba(0,255,204,0.12); color: #00ffcc; border-color: rgba(0,255,204,0.3); }

    .csv-btn-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .csv-btn { padding: 10px 14px; border-radius: 10px; background: rgba(0,255,204,0.12); border: 1px solid rgba(0,255,204,0.3); color: #00ffcc; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
    .csv-btn:active { transform: scale(0.97); }
    .csv-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .csv-btn.warn { background: rgba(139,92,246,0.12); border-color: rgba(139,92,246,0.35); color: #c4b5fd; }

    .teacher-search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(148,163,184,0.25); background: rgba(15,23,42,0.6); font-size: 14px; color: #e2e8f0; margin-bottom: 14px; }
    .teacher-search:focus { outline: none; border-color: #00ffcc; box-shadow: 0 0 0 4px rgba(0,255,204,0.15); }
    .teacher-search::placeholder { color: #64748b; }

    .ongoing-banner { padding: 12px 14px; margin-bottom: 14px; border-radius: 14px; background: linear-gradient(135deg, rgba(16,185,129,0.12), rgba(6,182,212,0.08)); border: 1px solid rgba(16,185,129,0.35); display: flex; align-items: center; gap: 10px; }
    .ongoing-banner .pulse { width: 10px; height: 10px; border-radius: 50%; background: #10b981; animation: pulseDot 1.5s ease-in-out infinite; flex-shrink: 0; }
    .ongoing-banner .info { flex: 1; min-width: 0; }
    .ongoing-banner h4 { font-size: 13px; color: #fff; margin: 0 0 2px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ongoing-banner p { font-size: 11px; color: #94a3b8; margin: 0; }

    function formatMins(mins) {
      if (mins <= 0) return '0m';

      const m = mins % 60;

    /* ==================== BG ENGINE ==================== */
    const bgEngine = {
      renderer: null, adminScene: null, active: false, clock: null, time: 0, inited: false,
      init() {
        if (this.inited) return;
        this.inited = true;
        if (skip3D) { document.getElementById('bg-canvas').style.display = 'none'; return; }
        try {
          this.renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: false, antialias: false, powerPreference: 'low-power' });
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobileDevice ? 1.2 : 1.8));
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.renderer.outputColorSpace = THREE.SRGBColorSpace;
          this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
          this.renderer.toneMappingExposure = 1.0;
          this.clock = new THREE.Clock();
          this.adminScene = this.build();
          window.addEventListener('resize', () => this.resize());
          this.active = true;
          setTimeout(() => document.getElementById('bg-canvas').classList.add('ready'), 100);
          this.animate();
        } catch (e) {
          console.warn('[bgEngine]', e);
          document.getElementById('bg-canvas').style.display = 'none';
        }
      },
      build() {
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x0a1a3a, 100, 550);
        const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 1500);
        camera.position.set(0, 12, 60); camera.lookAt(0, 8, -30);
        const skyMat = new THREE.ShaderMaterial({
          side: THREE.BackSide, depthWrite: false,
          uniforms: { uTime: { value: 0 }, uTop: { value: new THREE.Color(0x0a1a4a) }, uMid: { value: new THREE.Color(0x1a3a7a) }, uHorizon: { value: new THREE.Color(0x2a5a9a) }, uDeep: { value: new THREE.Color(0x050e2a) }, uGlow: { value: new THREE.Color(0x2a70c8) } },
          vertexShader: `varying vec3 vDir; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vDir=normalize(wp.xyz); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
          fragmentShader: `uniform float uTime; uniform vec3 uTop,uMid,uHorizon,uDeep,uGlow; varying vec3 vDir;
            float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
            float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
            float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){v+=a*noise(p);p*=2.03;a*=0.5;} return v; }
            void main(){ vec3 dir=normalize(vDir); float h=clamp(dir.y*0.5+0.5,0.0,1.0);
              vec3 col=mix(uDeep,uHorizon,smoothstep(0.32,0.55,h)); col=mix(col,uMid,smoothstep(0.55,0.78,h)); col=mix(col,uTop,smoothstep(0.78,1.0,h));
              float cx=1.0-abs(dir.x); float hb=pow(1.0-abs(dir.y),12.0); col+=uGlow*pow(cx,3.0)*hb*0.7;
              if(dir.y>0.01){ float alt=1.0/max(dir.y,0.008); vec2 uv=dir.xz*alt*0.1+vec2(uTime*0.012,uTime*0.008); float clouds=smoothstep(0.52,0.78,fbm(uv)); float fade=smoothstep(0.01,0.2,dir.y)*(1.0-smoothstep(0.7,1.0,dir.y)); col=mix(col,col*1.35+vec3(0.1,0.2,0.35),clouds*0.35*fade); }
              gl_FragColor=vec4(col,1.0); }`
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(900, 48, 32), skyMat));
        scene.add(new THREE.HemisphereLight(0x4a80c8, 0x0a1028, 0.8));
        scene.add(new THREE.AmbientLight(0x3060a0, 0.4));

        const hexPanels = [];
        const hexCount = isMobileDevice ? 12 : 22;
        const hexRingGeo = new THREE.RingGeometry(1.6, 1.85, 6);
        const hexFillGeo = new THREE.CircleGeometry(1.6, 6);
        for (let i = 0; i < hexCount; i++) {
          const group = new THREE.Group();
          const ringMat = new THREE.MeshBasicMaterial({ color: 0x4ab8ff, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false });
          group.add(new THREE.Mesh(hexRingGeo, ringMat));
          const fillMat = new THREE.MeshBasicMaterial({ color: 0x2a70b8, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false });
          const fill = new THREE.Mesh(hexFillGeo, fillMat); fill.position.z = -0.001; group.add(fill);
          group.position.set((Math.random() - 0.5) * 90, 3 + Math.random() * 47, -30 - Math.random() * 200);
          group.lookAt(0, group.position.y, -20);
          group.rotation.z = Math.random() * Math.PI * 2;
          group.scale.setScalar(0.7 + Math.random() * 1.2);
          group.userData = { baseOpacity: 0.45 + Math.random() * 0.4, pulsePhase: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.25, driftPhase: Math.random() * Math.PI * 2, baseY: group.position.y };
          scene.add(group); hexPanels.push({ group, ringMat, fillMat });
        }
        const nodes = [];
        const nodePositions = [];
        const nodeCount = isMobileDevice ? 30 : 50;
        const nodeGeo = new THREE.SphereGeometry(0.22, 6, 6);
        for (let i = 0; i < nodeCount; i++) {
          const mat = new THREE.MeshBasicMaterial({ color: 0x9ae0ff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false });
          const node = new THREE.Mesh(nodeGeo, mat);
          node.position.set((Math.random() - 0.5) * 80, 3 + Math.random() * 40, -30 - Math.random() * 200);
          node.userData = { phase: Math.random() * Math.PI * 2, baseScale: 0.7 + Math.random() * 0.8 };
          node.scale.setScalar(node.userData.baseScale);
          scene.add(node); nodes.push(node); nodePositions.push(node.position.clone());
        }
        const edgePairs = [];
        for (let i = 0; i < nodePositions.length; i++) {
          for (let j = i + 1; j < nodePositions.length; j++) {
            if (nodePositions[i].distanceTo(nodePositions[j]) < 32 && Math.random() < 0.4) edgePairs.push([i, j]);
          }
        }
        const chosen = edgePairs.slice(0, isMobileDevice ? 30 : 55);
        const edgeBuffer = new Float32Array(chosen.length * 6);
        const lineGeo = new THREE.BufferGeometry();
        lineGeo.setAttribute('position', new THREE.BufferAttribute(edgeBuffer, 3));
        lineGeo.setDrawRange(0, 0);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x4ab8ff, transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending, depthWrite: false });
        scene.add(new THREE.LineSegments(lineGeo, lineMat));
        return { scene, camera, skyMat, hexPanels, nodes, nodePositions, edgePairs: chosen, lineGeo, lineMat };
      },
      resize() {
        if (!this.renderer) return;
        const w = window.innerWidth, h = window.innerHeight;
        this.renderer.setSize(w, h);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobileDevice ? 1.2 : 1.8));
        if (this.adminScene) { this.adminScene.camera.aspect = w / h; this.adminScene.camera.updateProjectionMatrix(); }
      },
      animate() {
        if (!this.active) return;
        requestAnimationFrame(() => this.animate());
        if (document.hidden) { this.clock.getDelta(); return; }
        const dt = Math.min(this.clock.getDelta(), 0.05);
        this.time += dt * MOTION_SCALE;
        const time = this.time;
        if (!this.adminScene) return;
        const s = this.adminScene;
        const scrollY = window.scrollY || 0;
        const docH = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        const scrollNorm = Math.min(1, scrollY / docH);
        const flowSpeed = 9.0 * (1 + scrollNorm * 1.8);
        s.hexPanels.forEach(h => {
          h.group.position.z += flowSpeed * dt;
          if (h.group.position.z > 40) {
            h.group.position.z = -220 - Math.random() * 40;
            h.group.position.x = (Math.random() - 0.5) * 90;
            h.group.position.y = 3 + Math.random() * 47;
            h.group.userData.baseY = h.group.position.y;
            h.group.lookAt(0, h.group.position.y, -20);
          }
          const pulse = 0.55 + Math.sin(time * 1.5 + h.group.userData.pulsePhase) * 0.4;
          h.ringMat.opacity = h.group.userData.baseOpacity * pulse;
          h.fillMat.opacity = 0.10 + pulse * 0.16;
          h.group.rotation.z += h.group.userData.rotSpeed * dt;
          h.group.position.y = h.group.userData.baseY + Math.sin(time * 0.6 + h.group.userData.driftPhase) * 1.8;
        });
        s.nodes.forEach((n, i) => {
          n.position.z += flowSpeed * 1.15 * dt;
          if (n.position.z > 40) {
            n.position.z = -220 - Math.random() * 40;
            n.position.x = (Math.random() - 0.5) * 80;
            n.position.y = 3 + Math.random() * 40;
          }
          s.nodePositions[i].copy(n.position);
          const pulse = 0.7 + Math.sin(time * 2.0 + n.userData.phase) * 0.5;
          n.scale.setScalar(n.userData.baseScale * (0.85 + pulse * 0.45));
          n.material.opacity = 0.5 + pulse * 0.5;
        });
        const edgeArr = s.lineGeo.attributes.position.array;
        let drawCount = 0;
        for (const pair of s.edgePairs) {
          const a = s.nodePositions[pair[0]], b = s.nodePositions[pair[1]];
          const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
          if (dx*dx + dy*dy + dz*dz > 2025) continue;
          if (a.z < -200 || b.z < -200 || a.z > 40 || b.z > 40) continue;
          edgeArr[drawCount*6] = a.x; edgeArr[drawCount*6+1] = a.y; edgeArr[drawCount*6+2] = a.z;
          edgeArr[drawCount*6+3] = b.x; edgeArr[drawCount*6+4] = b.y; edgeArr[drawCount*6+5] = b.z;
          drawCount++;
        }
        s.lineGeo.setDrawRange(0, drawCount * 2);
        s.lineGeo.attributes.position.needsUpdate = true;
        s.lineMat.opacity = 0.26 + Math.sin(time * 0.8) * 0.1;
        s.skyMat.uniforms.uTime.value = time;
        s.camera.position.x = Math.sin(time * 0.2) * 3 + Math.sin(scrollNorm * Math.PI * 2) * 3;
        s.camera.position.y = 12 + Math.sin(time * 0.1) * 1 - scrollNorm * 2.5;
        s.camera.lookAt(Math.sin(time * 0.15) * 2, 8 - scrollNorm * 3, -30 - scrollNorm * 15);
        this.renderer.render(s.scene, s.camera);
      }
    };

    /* ==================== UTILS ==================== */
    function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    function toDate(ts) { if (!ts) return null; if (ts.toDate) return ts.toDate(); if (ts instanceof Date) return ts; return new Date(ts); }
    function fmtTime(ts) { const d = toDate(ts); return d ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—'; }
    function fmtDate(ts) { const d = toDate(ts); return d ? d.toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' }) : '—'; }
    function fmtDateTime(ts) { const d = toDate(ts); return d ? d.toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—'; }
    function todayLocalDateKey() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    }
    function shiftDateKey(dateKey, deltaDays) {
      const d = new Date(dateKey + 'T00:00:00');
      d.setDate(d.getDate() + deltaDays);
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    }
    function avatarUrlFor(photoURL, name, size = 64) {
      if (photoURL && /^https?:\/\//.test(photoURL)) return photoURL;
      const q = encodeURIComponent((name || 'User').trim());
      return `https://ui-avatars.com/api/?name=${q}&background=00ffcc&color=071b33&size=${size}&bold=true`;
    }
    function avatarImgTag(photoURL, name, size = 32) {
      const initial = avatarUrlFor(photoURL, name, size * 2);
      const fallback = avatarUrlFor(null, name, size * 2);
      return `<img class="att-avatar" src="${escapeHtml(initial)}" onerror="this.onerror=null;this.src='${escapeHtml(fallback)}';" alt="${escapeHtml(name || 'User')}" loading="lazy" />`;
    }
    function getPositionOnce() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('Geolocation not supported.'));
        navigator.geolocation.getCurrentPosition(
          pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
          err => reject(new Error(err.code === 1 ? 'Location denied.' : 'GPS error.')),
          { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
        );
      });
    }
    function toast(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `toast ${type}`; el.textContent = msg;
      document.getElementById('toast-root').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 4000);
    }
    function toLocalInputValue(d) { const pad = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
    function cpdStatus(cpd) {
      const s = toDate(cpd.startTime)?.getTime(), e = toDate(cpd.endTime)?.getTime(), n = Date.now();
      if (!s || !e) return 'unknown';
      if (n < s - 15 * 60 * 1000) return 'upcoming';
      if (n > e) return 'ended';
      return 'ongoing';
    }
    function normalizeName(s) { return String(s || '').toUpperCase().replace(/\s+/g, ' ').replace(/[^A-Z ]/g, '').trim(); }
    function initialsOf(name) {
      const parts = String(name || '').trim().split(/\s+/);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }
    function timeAgo(ts) {
      const d = toDate(ts);
      if (!d) return '';
      const diff = Math.floor((Date.now() - d.getTime()) / 60000);
      if (diff < 1) return t('just_now');
      if (diff < 60) return `${diff}${t('min_ago')}`;
      if (diff < 1440) return `${Math.floor(diff / 60)}${t('hour_ago')}`;
      return `${Math.floor(diff / 1440)}${t('day_ago')}`;
    }
    function findSchoolTeacher(name) {
      const key = normalizeName(name);
      return (state.teachers || []).find(tc => normalizeName(tc.name) === key);
    }

    function buildTeacherStatusMap() {
      const map = new Map();
      (state.teachers || []).forEach(tc => {
        map.set(normalizeName(tc.name), { active: null, totalRecords: 0, lastAttended: null, teacher: tc });
      });
      state.allAttendances.forEach(a => {
        const key = normalizeName(a.teacherName);
        const entry = map.get(key);
        if (!entry) return;
        entry.totalRecords++;
        const attTime = toDate(a.attendedAt)?.getTime() || 0;
        if (!entry.lastAttended || attTime > (toDate(entry.lastAttended)?.getTime() || 0)) {
          entry.lastAttended = a.attendedAt;
        }
        if (a.state === 'active') {
          const curTime = entry.active ? (toDate(entry.active.attendedAt)?.getTime() || 0) : 0;
          if (!entry.active || attTime > curTime) entry.active = a;
        }
      });
      return map;
    }

    function buildTodayDailyMap() {
      const today = todayLocalDateKey();
      const map = new Map();
      state.dailyRecords.forEach(r => {
        if (r.date === today) map.set(normalizeName(r.teacherName), r);
      });
      return map;
    }

    /* ==================== CSV ==================== */
    function downloadCSV(filename, rows) {
      const csv = '\uFEFF' + rows.map(row => row.map(cell => {
        const v = String(cell ?? '');
        return '"' + v.replace(/"/g, '""') + '"';
      }).join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = filename; link.style.display = 'none';
      document.body.appendChild(link); link.click();
      setTimeout(() => { document.body.removeChild(link); URL.revokeObjectURL(url); }, 100);
    }
    function downloadCurrentCpdCSV() {
      const statusMap = buildTeacherStatusMap();
      const rows = [['#', 'Teacher', 'Gender', 'Category', 'Event Title', 'Type', 'Facilitator', 'Attended At', 'Distance (m)', 'Verified']];
      let n = 0;
      (state.teachers || []).forEach(tc => {
        const entry = statusMap.get(normalizeName(tc.name));
        if (entry?.active) {
          n++;
          const a = entry.active;
          const cpd = state.cpds.find(c => c.id === a.cpdId);
          rows.push([n, tc.name, tc.gender, tc.category, a.cpdTitle || '', cpd?.type || 'CPD', cpd?.facilitator || '', toDate(a.attendedAt)?.toLocaleString() || '', a.attendedDistanceMeters != null ? a.attendedDistanceMeters.toFixed(0) : '', a.verified ? 'Yes' : 'No']);
        }
      });
      if (n === 0) { toast('No teachers currently in an event.', 'warn'); return; }
      const date = new Date().toISOString().slice(0, 10);
      downloadCSV(`Event-Attendees-${date}.csv`, rows);
      toast(`Downloaded ${n} attendees`, 'success');
    }
    function downloadHistoricCSV() {
      if (state.allAttendances.length === 0) { toast('No attendance history yet.', 'warn'); return; }
      const rows = [['#', 'Teacher', 'Email', 'Category', 'Event Title', 'Type', 'Facilitator', 'Date', 'Attended At', 'Ended At', 'Duration (min)', 'Distance (m)', 'Status']];
      state.allAttendances.slice().sort((a, b) => (toDate(b.attendedAt)?.getTime() || 0) - (toDate(a.attendedAt)?.getTime() || 0)).forEach((a, i) => {
        const schoolT = findSchoolTeacher(a.teacherName);
        const cpd = state.cpds.find(c => c.id === a.cpdId);
        const start = toDate(a.attendedAt);
        const end = toDate(a.endedAt);
        const dur = (start && end) ? Math.round((end - start) / 60000) : '';
        rows.push([i + 1, a.teacherName || '', a.teacherEmail || '', schoolT?.category || '—', a.cpdTitle || '', cpd?.type || 'CPD', cpd?.facilitator || '', start?.toLocaleDateString() || '', start?.toLocaleTimeString() || '', end?.toLocaleTimeString() || '', dur, a.attendedDistanceMeters != null ? a.attendedDistanceMeters.toFixed(0) : '', a.verified ? 'Verified' : (a.state === 'active' ? 'Live' : 'Flagged')]);
      });
      const date = new Date().toISOString().slice(0, 10);
      downloadCSV(`Event-History-${date}.csv`, rows);
      toast(`Downloaded ${state.allAttendances.length} records`, 'success');
    }
    function downloadSessionCSV(cpd) {
      const atts = state.allAttendances.filter(a => a.cpdId === cpd.id);
      const attByKey = new Map();
      atts.forEach(a => {
        const key = normalizeName(a.teacherName);
        const existing = attByKey.get(key);
        if (!existing || (a.state === 'active' && existing.state !== 'active')) attByKey.set(key, a);
      });

      const rows = [['#', 'Teacher', 'Email', 'Category', 'Type', 'Facilitator', 'Status', 'Color', 'Attended At', 'Ended At', 'Duration (min)', 'Distance (m)', 'Verified']];

      let n = 0;
      (state.teachers || []).forEach(tc => {
        const a = attByKey.get(normalizeName(tc.name));
        if (!a) return;
        n++;
        const start = toDate(a.attendedAt);
        const end = toDate(a.endedAt);
        const dur = (start && end) ? Math.round((end - start) / 60000) : '';
        rows.push([
          n, tc.name, a.teacherEmail || '', tc.category, cpd.type || 'CPD', cpd.facilitator || '',
          'Attended', 'Green',
          start?.toLocaleString() || '', end?.toLocaleString() || '', dur,
          a.attendedDistanceMeters != null ? a.attendedDistanceMeters.toFixed(0) : '',
          a.verified ? 'Yes' : (a.state === 'active' ? 'Live' : 'No')
        ]);
      });

      let absentCount = 0;
      (state.teachers || []).forEach(tc => {
        if (attByKey.has(normalizeName(tc.name))) return;
        absentCount++;
        n++;
        rows.push([n, tc.name, '', tc.category, cpd.type || 'CPD', cpd.facilitator || '', 'Did Not Attend', 'Red', '', '', '', '', '']);
      });

      if (n === 0) { toast('No teachers to export.', 'warn'); return; }
      const safeTitle = (cpd.title || 'session').replace(/[^a-z0-9]/gi, '_').slice(0, 40);
      const date = (toDate(cpd.startTime) || new Date()).toISOString().slice(0, 10);
      downloadCSV(`Event-${safeTitle}-${date}.csv`, rows);
      toast(`Downloaded ${n} records`, 'success');
    }
    function downloadDailyCSV() {
      const date = state.dailyDate;
      const dayRecords = state.dailyRecords.filter(r => r.date === date);
      const recByKey = new Map();
      dayRecords.forEach(r => recByKey.set(normalizeName(r.teacherName), r));

      const rows = [['#', 'Teacher', 'Category', 'Date', 'Sign In', 'Sign Out', 'Status', 'Color', 'Late (min)', 'Early Leave (min)', 'In Dist (m)', 'Out Dist (m)', 'Verified']];

      let n = 0;
      (state.teachers || []).forEach(tc => {
        const r = recByKey.get(normalizeName(tc.name));
        if (!r || !r.signInAt) return;
        n++;
        const signIn = toDate(r.signInAt);
        const signOut = toDate(r.signOutAt);
        let status;
        if (r.state === 'in') status = r.lateMinutes > 0 ? 'In School (Late)' : 'In School';
        else status = r.lateMinutes > 0 ? 'Signed Out (Late)' : 'Signed Out';
        rows.push([n, tc.name, tc.category, date,
          signIn?.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) || '',
          signOut?.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) || '',
          status, 'Green', r.lateMinutes > 0 ? formatMins(r.lateMinutes) : '0',
          r.earlyLeaveMinutes > 0 ? formatMins(r.earlyLeaveMinutes) : '0',
          r.signInDistanceMeters != null ? r.signInDistanceMeters.toFixed(0) : '',
          r.signOutDistanceMeters != null ? r.signOutDistanceMeters.toFixed(0) : '',
          r.verified ? 'Yes' : 'No'
        ]);
      });

      let absent = 0;
      (state.teachers || []).forEach(tc => {
        if (recByKey.has(normalizeName(tc.name))) return;
        absent++;
        n++;
        rows.push([n, tc.name, tc.category, date, '', '', 'Absent', 'Red', '', '', '', '', '']);
      });

      if (n === 0) { toast('No teachers to export.', 'warn'); return; }
      downloadCSV(`Daily-Attendance-${date}.csv`, rows);
      toast(`Downloaded ${n} records`, 'success');
    }

    /* ==================== GREETINGS ==================== */
    const ADMIN_SUBLINES = [
      'Thanks for leading the way — your team appreciates you.',
      'Your guidance keeps iMENA moving forward.',
      'Great leaders build great teachers.',
      "You're making a real difference, one session at a time.",
      'Proud of the work you do behind the scenes.'
    ];
    function dayHash(salt) {
      const d = new Date();
      const uid = state.user?.uid || 'guest';
      const key = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}|${uid}|${salt || ''}`;
      let h = 0;
      for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
      return h;
    }
    function pickDaily(list, salt) { return list[dayHash(salt) % list.length]; }
    function getGreetingInfo() {
      const h = new Date().getHours();
      const fullName = state.profile?.fullName || state.user?.displayName || state.user?.email || 'Friend';
      const name = (fullName.split(/[\s@]/)[0] || 'Friend');
      let slot, greetings, emoji;
      if (h >= 5 && h < 11) { slot = 'morning'; emoji = '☀️'; greetings = ['Good morning','Hello','Hey','Welcome back','Rise and shine','Top of the morning']; }
      else if (h >= 11 && h < 14) { slot = 'lunch'; emoji = '🍽️'; greetings = ['Have a good lunch','Hello','Hey','Good day','Enjoy your lunch']; }
      else if (h >= 14 && h < 18) { slot = 'afternoon'; emoji = '🌤️'; greetings = ['Good afternoon','Hello','Hey','Welcome back','Good day']; }
      else if (h >= 18 && h < 22) { slot = 'evening'; emoji = '🌆'; greetings = ['Good evening','Hello','Hey','Welcome','Nice to see you']; }
      else { slot = 'night'; emoji = '🌙'; greetings = ['Good night','Hello','Hey','Working late','Welcome']; }
      return { name, slot, emoji, greeting: pickDaily(greetings, 'greet'), sub: pickDaily(ADMIN_SUBLINES, 'adminsub') };
    }
    function greetingCardHtml() {
      const g = getGreetingInfo();
      return `<div class="greet-card"><div class="greet-emoji">${g.emoji}</div><div class="greet-text"><h2>${escapeHtml(g.greeting)}, ${escapeHtml(g.name)}</h2><p>${escapeHtml(g.sub)}</p></div></div>`;
    }

    /* ==================== AUTH ==================== */
    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.replace('index.html'); return; }
      state.user = user;
      document.getElementById('app').innerHTML = renderSkeleton();
      try {
        const ref = doc(db, 'users', user.uid);
        const snap = await getDoc(ref);
        if (!snap.exists()) { window.location.replace('index.html'); return; }
        state.profile = snap.data();
        if (user.photoURL && state.profile.photoURL !== user.photoURL) {
          updateDoc(ref, { photoURL: user.photoURL }).catch(() => {});
          state.profile.photoURL = user.photoURL;
        }
      } catch (err) { console.error('[profile]', err); window.location.replace('index.html'); return; }
      if (state.profile.role !== 'admin') { window.location.replace('teacher.html'); return; }
      state.loading = false;
      goAdmin();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (window.requestIdleCallback) requestIdleCallback(() => bgEngine.init(), { timeout: 1500 });
          else setTimeout(() => bgEngine.init(), 200);
        });
      });
    });

    function renderSkeleton() {
      return `${headerHtmlSkeleton()}<main class="main"><div class="skeleton skel-header"></div><div class="skeleton skel-card" style="height:64px"></div><div class="a-stat-grid"><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div></div><div class="skeleton skel-line" style="width:40%"></div><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div></main>`;
    }
    function headerHtmlSkeleton() {
      return `<header class="header"><div class="header-left"><div class="skeleton" style="width:34px;height:34px;border-radius:8px"></div><div class="skeleton" style="width:140px;height:20px;border-radius:6px"></div></div></header>`;
    }

      const fallback = avatarUrlFor(null, name, 128);
      return `

                ${t('home')}
              </a>
              <button class="btn-logout" id="btn-logout">

    function bindHeaderEvents() {
      const modal = document.getElementById('profile-modal');
      const btnProfile = document.getElementById('btn-profile');
      const btnLogout = document.getElementById('btn-logout');
      if (btnProfile) btnProfile.onclick = () => modal.classList.add('open');
      if (modal) modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };

    /* ==================== ROUTER ==================== */
    function handleDataUpdate() {
      if (state.view === 'admin' && state.adminTab !== 'new_cpd') renderAdmin();
      else if (state.view === 'teacher-detail') renderTeacherDetail();
      else if (state.view === 'cpd-detail') renderCpdDetail();
    }

    function goAdmin() {
      state.view = 'admin';
      state.teacherDetailName = null;
      if (!state.subCpds) state.subCpds = onSnapshot(collection(db, 'cpds'),
        snap => { state.cpds = snap.docs.map(d => ({ id: d.id, ...d.data() })); handleDataUpdate(); },
        err => console.error(err));
      if (!state.subAllAtt) state.subAllAtt = onSnapshot(collection(db, 'attendance'),
        snap => { state.allAttendances = snap.docs.map(d => ({ id: d.id, ...d.data() })); handleDataUpdate(); },
        err => console.error(err));
      if (!state.subTeachers) state.subTeachers = onSnapshot(collection(db, 'teachers'),
        snap => { state.teachers = snap.docs.map(d => ({ id: d.id, ...d.data() })); handleDataUpdate(); },
        err => console.error(err));
      if (!state.subSettings) state.subSettings = onSnapshot(doc(db, 'settings', 'attendance'), snap => {
        if (snap.exists()) {
          const d = snap.data();
          state.settings = { 
            startTime: d.startTime || '08:00', 
            endTime: d.endTime || '17:00',
            schoolRadius: d.schoolRadius || 150
          };
        }
        handleDataUpdate();
      });

        { id: 'overview', icon: '<path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-5a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 001 1h3a1 1 0 001-1V10"/>' },
        { id: 'daily', icon: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>' },
        { id: 'teachers', icon: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>' },
        { id: 'sessions', icon: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>' },
        { id: 'calendar', icon: '<path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>' },

    function renderAdmin() {
      let body = '';
      if (state.adminTab === 'sessions') body = renderAdminSessions();
      else if (state.adminTab === 'calendar') body = renderAdminCalendar();
      else if (state.adminTab === 'new_cpd') body = renderAdminNew();
      else if (state.adminTab === 'teachers') body = renderAdminTeachers();
      else if (state.adminTab === 'daily') body = renderAdminDaily();
      else body = renderAdminOverview();

      document.querySelectorAll('[data-atab]').forEach(b => b.onclick = () => {

    function renderAdminOverview() {
      const list = state.cpds;
      const now = Date.now();
      const ongoing = list.filter(c => cpdStatus(c) === 'ongoing');
      const upcoming = list.filter(c => cpdStatus(c) === 'upcoming').sort((a, b) => (toDate(a.startTime)?.getTime() || 0) - (toDate(b.startTime)?.getTime() || 0));
      const nextSession = upcoming[0];
      const liveNow = ongoing.length;
      let nextStr = '—';
      if (nextSession) {
        const d = toDate(nextSession.startTime);
        if (d) {
          const diffMs = d.getTime() - now;
          const diffH = Math.floor(diffMs / 3600000);
          const diffM = Math.floor((diffMs % 3600000) / 60000);
          nextStr = diffH > 0 ? `${diffH}h ${diffM}m` : `${diffM}m`;
        }
      }
      const ongoingCards = ongoing.map(c => `
        <div class="a-session-card"><div class="row">
          <div style="flex:1;min-width:0"><div><span class="badge badge-live">● ${t('live')}</span><span class="badge badge-type">${c.type || 'CPD'}</span></div><h3>${escapeHtml(c.title)}</h3><p>${fmtTime(c.startTime)} – ${fmtTime(c.endTime)} · ${escapeHtml(c.venueName)}</p></div>
          <div class="actions"><button data-open-cpd="${c.id}" class="btn btn-primary">${t('open')}</button></div>
        </div></div>`).join('');
      const upcomingCards = upcoming.slice(0, 4).map(c => `
        <div class="a-session-card"><div class="row">
          <div style="flex:1;min-width:0"><div><span class="badge badge-upcoming">${t('upcoming')}</span><span class="badge badge-type">${c.type || 'CPD'}</span></div><h3>${escapeHtml(c.title)}</h3><p>${fmtDateTime(c.startTime)} · ${escapeHtml(c.venueName)}</p></div>
          <div class="actions"><button data-open-cpd="${c.id}" class="btn btn-primary">${t('open')}</button></div>
        </div></div>`).join('');
      const endedList = list.filter(c => cpdStatus(c) === 'ended').sort((a, b) => (toDate(b.startTime)?.getTime() || 0) - (toDate(a.startTime)?.getTime() || 0)).slice(0, 4);
      const endedCards = endedList.map(c => {
        const atts = state.allAttendances.filter(a => a.cpdId === c.id);
        const total = atts.length;
        const verified = atts.filter(a => a.verified).length;
        return `
        <div class="a-session-card"><div class="row">
          <div style="flex:1;min-width:0"><div><span class="badge badge-ended">${t('ended')}</span><span class="badge badge-type">${c.type || 'CPD'}</span></div><h3>${escapeHtml(c.title)}</h3><p>${fmtDateTime(c.startTime)} · ${escapeHtml(c.venueName)}</p>
            <div class="past-stats"><span class="past-stat">👥 ${total} ${t('attendees')}</span><span class="past-stat ok">✓ ${verified} ${t('verified')}</span></div>
          </div>
          <div class="actions"><button data-open-cpd="${c.id}" class="btn btn-primary">${t('open')}</button></div>
        </div></div>`;
      }).join('');
      return `
        ${greetingCardHtml()}
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
          <h1 style="font-size:22px;font-weight:900;margin:0;color:#fff;text-shadow:0 0 20px rgba(0,255,204,0.35);">${t('admin_title')}</h1>
          <button id="btn-top-new" class="btn btn-primary" style="width:auto; padding: 10px 16px; font-size: 13px;">+ ${t('New')}</button>
        </div>
        <div class="a-stat-grid">
          <div class="a-stat"><div class="val" style="color:#00ffcc">${liveNow}</div><div class="lbl">${t('stat_live_now')}</div></div>
          <div class="a-stat"><div class="val">${list.length}</div><div class="lbl">${t('stat_total')}</div></div>
          <div class="a-stat"><div class="val" style="color:#a855f7">${upcoming.length}</div><div class="lbl">${t('stat_upcoming')}</div></div>
          <div class="a-stat"><div class="val" style="color:#fbbf24;font-size:18px">${nextStr}</div><div class="lbl">${t('stat_next_session')}</div></div>
        </div>
        ${ongoing.length > 0 ? `<div class="section-title">${t('ongoing')}</div>${ongoingCards}` : ''}
        ${upcoming.length > 0 ? `<div class="section-title">${t('upcoming')}</div>${upcomingCards}` : ''}
        ${endedList.length > 0 ? `<div class="section-title">${t('past_sessions')}</div>${endedCards}` : ''}
        ${list.length === 0 ? `<div class="empty" style="margin-top:20px"><strong>${t('all_sessions')}</strong><span>${t('create_sub')}</span></div>` : ''}
      `;
    }

    /* ==================== DAILY ATTENDANCE TAB ==================== */
    function ensureDailySub() {
      if (state.subDaily) return;
      const q = query(collection(db, 'daily_attendance'));
      state.subDaily = onSnapshot(q,
        snap => {
          state.dailyRecords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          if (state.adminTab === 'daily' || state.adminTab === 'teachers') renderAdmin();
        },
        err => { console.error('[daily]', err); toast('Could not load daily records.', 'error'); }
      );
    }

    function renderAdminDaily() {
      ensureDailySub();
      const date = state.dailyDate;
      const todayKey = todayLocalDateKey();
      const isPast = date < todayKey;
      const isFuture = date > todayKey;

      const dayRecords = state.dailyRecords.filter(r => r.date === date);
      const recByKey = new Map();
      dayRecords.forEach(r => recByKey.set(normalizeName(r.teacherName), r));

      let presentCount = 0, inCount = 0, outCount = 0, absentCount = 0, lateCount = 0, missingOutCount = 0, earlyLeaveCount = 0;
      (state.teachers || []).forEach(tc => {
        const r = recByKey.get(normalizeName(tc.name));
        if (!r || !r.signInAt) { absentCount++; return; }
        presentCount++;
        if (r.state === 'in') inCount++; else outCount++;
        if (r.lateMinutes > 0) lateCount++;
        if (r.earlyLeaveMinutes > 0) earlyLeaveCount++;
        if (isPast && r.state === 'in') missingOutCount++;
      });

      const last7Days = Array.from({length: 7}, (_, i) => shiftDateKey(todayKey, i - 6));
      const chartData = last7Days.map(d => {
        const dayRecs = state.dailyRecords.filter(r => r.date === d && r.signInAt);
        return { date: d, label: new Date(d + 'T00:00:00').toLocaleDateString([], { weekday: 'short' }), count: dayRecs.length };
      });
      const maxChartVal = Math.max(...chartData.map(d => d.count), 1);

      const chartHtml = `
        <div class="chart-card">
          <div class="chart-title"><span>${t('weekly_trend')}</span><span style="color:#00ffcc">${(state.teachers||[]).length} ${t('total_staff')}</span></div>
          <div class="chart-bars">
            ${chartData.map(d => {
              const heightPct = (d.count / maxChartVal) * 100;
              const isActive = d.date === date;
              return `<div class="chart-col"><div class="chart-val">${d.count}</div><div class="chart-bar ${isActive ? 'active' : ''}" style="height: ${Math.max(heightPct, 4)}%"></div><div class="chart-label" style="${isActive ? 'color:#00ffcc' : ''}">${d.label}</div></div>`;
            }).join('')}
          </div>
        </div>
      `;

      const statCards = isPast ? `
        <div class="a-stat"><div class="val" style="color:#34d399">${presentCount}</div><div class="lbl">${t('daily_present')}</div></div>
        <div class="a-stat"><div class="val" style="color:#fbbf24">${lateCount}</div><div class="lbl">${t('daily_late')}</div></div>
        <div class="a-stat"><div class="val" style="color:#f87171">${earlyLeaveCount}</div><div class="lbl">Early Leave</div></div>
        <div class="a-stat"><div class="val" style="color:#f87171">${absentCount}</div><div class="lbl">${t('daily_absent')}</div></div>
      ` : `
        <div class="a-stat"><div class="val" style="color:#34d399">${inCount}</div><div class="lbl">${t('daily_in_school')}</div></div>
        <div class="a-stat"><div class="val" style="color:#38bdf8">${outCount}</div><div class="lbl">${t('daily_signed_out')}</div></div>
        <div class="a-stat"><div class="val" style="color:#fbbf24">${lateCount}</div><div class="lbl">${t('daily_late')}</div></div>
        <div class="a-stat"><div class="val" style="color:#f87171">${absentCount}</div><div class="lbl">${t('daily_not_arrived')}</div></div>
      `;

      const dateObj = new Date(date + 'T00:00:00');
      const dateLabel = dateObj.toLocaleDateString([], { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

      const groups = { Nursery: [], Primary: [], Secondary: [] };
      (state.teachers || []).forEach(tc => {
        const r = recByKey.get(normalizeName(tc.name));
        if (groups[tc.category]) groups[tc.category].push({ teacher: tc, record: r });
      });

      const renderRow = (item) => {
        const { teacher, record } = item;
        let statusClass = 'absent';
        let badgeHtml = `<span class="badge badge-absent">${t('daily_absent')}</span>`;
        let timesLine = '';
        let avatarHtml = `<div class="daily-avatar-init">${initialsOf(teacher.name)}</div>`;

        if (record && record.signInAt) {
          const signIn = toDate(record.signInAt);
          const signOut = toDate(record.signOutAt);
          const isLate = record.lateMinutes > 0;
          const isEarly = record.earlyLeaveMinutes > 0;

          if (record.selfieIn) {
            avatarHtml = `<img src="${record.selfieIn}" class="daily-avatar-img" title="Arrival Selfie" onclick="showFullPhoto('${record.selfieIn}')" />`;
          }

          timesLine = `<span>In: <strong>${signIn ? signIn.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—'}</strong> ${record.signInDistanceMeters ? `(📍${Math.round(record.signInDistanceMeters)}m)` : ''}</span>`;
          if (signOut) {
            timesLine += `<span>Out: <strong>${signOut.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</strong> ${record.signOutDistanceMeters ? `(📍${Math.round(record.signOutDistanceMeters)}m)` : ''}</span>`;
          }

          if (record.state === 'in') {
            if (isPast) { statusClass = 'missing-out'; badgeHtml = `<span class="badge badge-missing">${t('daily_missing_out')}</span>`; }
            else { statusClass = 'in-school'; badgeHtml = `<span class="badge badge-live">● ${t('daily_in_school')}</span>`; }
          } else { statusClass = 'signed-out'; badgeHtml = `<span class="badge badge-out">${t('daily_signed_out')}</span>`; }
          
          if (isLate) badgeHtml += `<span class="badge badge-late">Late ${formatMins(record.lateMinutes)}</span>`;
          if (isEarly) badgeHtml += `<span class="badge badge-absent">Early ${formatMins(record.earlyLeaveMinutes)}</span>`;
        }

        return `<div class="daily-row ${statusClass}">
          <div class="daily-avatar-block">${avatarHtml}</div>
          <div class="daily-info">
            <div class="daily-name">${escapeHtml(teacher.name)}</div>
            <div class="daily-times">${timesLine || 'No check-in'}</div>
          </div>
          <div class="daily-badges">${badgeHtml}</div>
        </div>`;
      };

      const groupsHtml = CATEGORIES.map(cat => {
        const items = groups[cat] || [];
        const presentInCat = items.filter(x => x.record && x.record.signInAt).length;
        return `<div class="teacher-column">
          <div class="tc-head"><h3 style="color:${CAT_COLOR[cat]}">${t(cat.toLowerCase())}</h3><span class="cnt">${presentInCat}/${items.length}</span></div>
          ${items.length === 0 ? `<div class="empty" style="border:none;background:transparent;padding:10px;">No teachers</div>` : items.map(renderRow).join('')}
        </div>`;
      }).join('');

      return `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
          <div>
            <h1 style="font-size:22px;font-weight:900;margin:0 0 6px;color:#fff;text-shadow:0 0 20px rgba(0,255,204,0.35);">${t('daily_title')}</h1>
            <p style="font-size:12px;color:#94a3b8;margin:0">${t('daily_sub')}</p>
          </div>
          <button id="btn-edit-settings" class="btn btn-primary" style="width:auto; padding: 10px 16px; font-size: 13px;">⚙️ ${t('school_settings')}</button>
        </div>

        ${chartHtml}

        <div class="daily-date-nav">
          <button class="nav-btn" id="daily-prev" aria-label="${t('daily_prev')}">‹</button>
          <input type="date" class="input date-input" id="daily-date" value="${date}" max="${todayKey}" />
          <button class="nav-btn" id="daily-next" aria-label="${t('daily_next')}" ${date >= todayKey ? 'disabled style="opacity:0.4"' : ''}>›</button>
          <button class="today-btn" id="daily-today">${t('daily_today')}</button>
        </div>
        <div class="daily-date-label">${dateLabel}</div>

        <div class="a-stat-grid">${statCards}</div>

        <div class="csv-btn-row">
          <button class="csv-btn" id="btn-daily-csv">📥 ${t('daily_download')}</button>
        </div>

        ${dayRecords.length === 0 && !isFuture ? `<div class="empty" style="margin-bottom:14px"><strong>${t('daily_no_records')}</strong></div>` : ''}

        <div class="teacher-columns">
          ${groupsHtml}
        </div>
      `;
    }

    function bindDailyEvents() {
      const prev = document.getElementById('daily-prev');
      const next = document.getElementById('daily-next');
      const today = document.getElementById('daily-today');
      const dateInput = document.getElementById('daily-date');
      const btnCsv = document.getElementById('btn-daily-csv');
      const btnSettings = document.getElementById('btn-edit-settings');

      if (prev) prev.onclick = () => { state.dailyDate = shiftDateKey(state.dailyDate, -1); renderAdminDaily(); };
      if (next) next.onclick = () => { const newDate = shiftDateKey(state.dailyDate, 1); if (newDate > todayLocalDateKey()) return; state.dailyDate = newDate; renderAdminDaily(); };
      if (today) today.onclick = () => { state.dailyDate = todayLocalDateKey(); renderAdminDaily(); };
      if (dateInput) dateInput.onchange = (e) => { const v = e.target.value; if (!v) return; state.dailyDate = v > todayLocalDateKey() ? todayLocalDateKey() : v; renderAdminDaily(); };
      if (btnCsv) btnCsv.onclick = () => downloadDailyCSV();
      
      if (btnSettings) {
        btnSettings.onclick = () => {
          const modal = document.createElement('div');
          modal.className = 'profile-modal open';
          modal.innerHTML = `
            <div class="profile-card" style="text-align:left; max-width: 340px;">
              <h2 style="font-size:20px;font-weight:900;margin-bottom:16px;">School Settings</h2>
              <form id="settings-form">
                <label style="font-size:11px;color:#94a3b8;font-weight:700;text-transform:uppercase;">Official Start Time</label>
                <input type="time" name="startTime" required class="input" style="margin-bottom:16px;" value="${state.settings.startTime}" />
                
                <label style="font-size:11px;color:#94a3b8;font-weight:700;text-transform:uppercase;">Official End Time</label>
                <input type="time" name="endTime" required class="input" style="margin-bottom:16px;" value="${state.settings.endTime}" />
                
                <label style="font-size:11px;color:#94a3b8;font-weight:700;text-transform:uppercase;">${t('radius_label')}</label>
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
                  <input type="range" name="schoolRadius" min="50" max="500" step="10" value="${state.settings.schoolRadius || 150}" style="flex:1; accent-color:#00ffcc; cursor:pointer;" oninput="this.nextElementSibling.innerText = this.value + 'm'" />
                  <span style="font-weight:800; font-size:14px; color:#00ffcc; min-width:45px; text-align:right;">${state.settings.schoolRadius || 150}m</span>
                </div>

                <div style="display:flex; gap:10px;">
                  <button type="button" class="btn btn-ghost" id="cancel-settings" style="flex:1">Cancel</button>
                  <button type="submit" class="btn btn-primary" id="save-settings" style="flex:1">Save</button>
                </div>
              </form>
            </div>`;
          document.body.appendChild(modal);
          modal.onclick = e => { if (e.target === modal) modal.remove(); };
          modal.querySelector('#cancel-settings').onclick = () => modal.remove();
          modal.querySelector('#settings-form').onsubmit = async (e) => {
            e.preventDefault();
            const form = e.target; const btn = modal.querySelector('#save-settings');
            btn.disabled = true; btn.textContent = 'Saving...';
            try {
              await setDoc(doc(db, 'settings', 'attendance'), {
                startTime: form.elements.startTime.value,
                endTime: form.elements.endTime.value,
                schoolRadius: parseInt(form.elements.schoolRadius.value)
              }, { merge: true });
              modal.remove(); toast('School settings updated!', 'success');
            } catch (err) { toast(err.message, 'error'); btn.disabled = false; btn.textContent = 'Save'; }
          };
        };
      }
    }

    /* ==================== TEACHERS TAB ==================== */
    function renderAdminTeachers() {
      ensureDailySub();
      const statusMap = buildTeacherStatusMap();
      const todayMap = buildTodayDailyMap();
      const ongoingSessions = state.cpds.filter(c => cpdStatus(c) === 'ongoing');

      let globalInCpd = 0, globalInSchool = 0;
      const byCatInCpd = { Nursery: 0, Primary: 0, Secondary: 0 };
      const byCatTotal = { Nursery: 0, Primary: 0, Secondary: 0 };
      (state.teachers || []).forEach(tc => {
        byCatTotal[tc.category] = (byCatTotal[tc.category] || 0) + 1;
        const entry = statusMap.get(normalizeName(tc.name));
        if (entry?.active) { globalInCpd++; byCatInCpd[tc.category]++; }
        else globalInSchool++;
      });

      const ongoingBanner = ongoingSessions.length > 0 ? `
        <div class="ongoing-banner">
          <div class="pulse"></div>
          <div class="info">
            <h4>${escapeHtml(ongoingSessions[0].title)}</h4>
            <p>${fmtTime(ongoingSessions[0].startTime)} – ${fmtTime(ongoingSessions[0].endTime)} · ${escapeHtml(ongoingSessions[0].venueName)}</p>
          </div>
          <div style="font-size:20px;font-weight:900;color:#34d399">${globalInCpd}</div>
        </div>` : '';

      return `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
          <div>
            <h1 style="font-size:22px;font-weight:900;margin:0 0 6px;color:#fff;text-shadow:0 0 20px rgba(0,255,204,0.35);">${t('teachers_title')}</h1>
            <p style="font-size:12px;color:#94a3b8;margin:0">${(state.teachers || []).length} Teachers · ${byCatTotal.Nursery || 0} ${t('nursery')} · ${byCatTotal.Primary || 0} ${t('primary')} · ${byCatTotal.Secondary || 0} ${t('secondary')}</p>
          </div>
          <button id="btn-add-teacher" class="btn btn-primary" style="width:auto; padding: 10px 16px; font-size: 13px;">+ Add Teacher</button>
        </div>

        ${ongoingBanner}

        <div class="t-stats">
          <div class="t-stat live"><div class="val">${globalInCpd}</div><div class="lbl">${t('stat_in_cpd')}</div></div>
          <div class="t-stat"><div class="val">${globalInSchool}</div><div class="lbl">${t('stat_in_school')}</div></div>
          <div class="t-stat"><div class="val" style="color:#f472b6">${byCatInCpd.Nursery}/${byCatTotal.Nursery || 0}</div><div class="lbl">${t('nursery')}</div></div>
          <div class="t-stat"><div class="val" style="color:#c4b5fd">${byCatInCpd.Primary}/${byCatTotal.Primary || 0}</div><div class="lbl">${t('primary')}</div></div>
        </div>

        <div class="csv-btn-row">
          <button class="csv-btn" id="btn-csv-current">📥 ${t('download_current')}</button>
          <button class="csv-btn warn" id="btn-csv-history">📥 ${t('download_history')}</button>
        </div>

        <div class="cat-filter-row">
          <button class="cat-filter ${state.teacherCatFilter === 'all' ? 'active' : ''}" data-catfilter="all">${t('all_categories')} · ${(state.teachers || []).length}</button>
          <button class="cat-filter ${state.teacherCatFilter === 'nursery' ? 'active' : ''}" data-catfilter="nursery">${t('nursery')} · ${byCatTotal.Nursery || 0}</button>
          <button class="cat-filter ${state.teacherCatFilter === 'primary' ? 'active' : ''}" data-catfilter="primary">${t('primary')} · ${byCatTotal.Primary || 0}</button>
          <button class="cat-filter ${state.teacherCatFilter === 'secondary' ? 'active' : ''}" data-catfilter="secondary">${t('secondary')} · ${byCatTotal.Secondary || 0}</button>
        </div>

        <input type="search" class="teacher-search" id="teacher-search" placeholder="${escapeHtml(t('search_teacher_placeholder'))}" value="${escapeHtml(state.teacherSearch)}" />

        ${(!state.teachers || state.teachers.length === 0) ? `
          <div class="empty" style="margin-bottom:16px">
            <strong>No teachers found</strong>
            <p style="margin-bottom:12px">Your database is empty. Click below to add the default 63 teachers.</p>
            <button class="btn btn-primary" id="btn-seed-teachers" style="width:auto;margin:0 auto;">Seed Default Teachers</button>
          </div>
        ` : ''}

        <div class="teacher-columns" id="teacher-lists">
          ${renderTeacherColumns(statusMap, todayMap)}
        </div>
      `;
    }

    function renderTeacherColumns(statusMap, todayMap) {
      const catFilter = state.teacherCatFilter;
      const search = state.teacherSearch.toLowerCase().trim();
      const byCat = { Nursery: [], Primary: [], Secondary: [] };
      (state.teachers || []).forEach(tc => {
        if (catFilter !== 'all' && tc.category.toLowerCase() !== catFilter) return;
        if (search && !tc.name.toLowerCase().includes(search)) return;
        const entry = statusMap.get(normalizeName(tc.name)) || { active: null, totalRecords: 0, lastAttended: null };
        const daily = todayMap.get(normalizeName(tc.name));
        if (byCat[tc.category]) byCat[tc.category].push({ teacher: tc, entry, daily });
      });

      return CATEGORIES.map(cat => {
        const items = byCat[cat];
        const inCpdCount = items.filter(x => x.entry?.active).length;
        const catClass = cat.toLowerCase();
        return `
          <div class="teacher-column">
            <div class="tc-head">
              <h3 style="color:${CAT_COLOR[cat]}">${t(catClass)}</h3>
              <span class="cnt">${inCpdCount}/${items.length}</span>
            </div>
            ${items.length === 0
              ? `<div class="cat-empty" style="padding:10px;text-align:center;font-size:11px;color:#64748b;">${t('no_teachers_match')}</div>`
              : items.map(x => teacherRowHtml(x, !!x.entry?.active)).join('')}
          </div>`;
      }).join('');
    }

    function teacherRowHtml(item, isLiveCpd) {
      const { teacher, entry, daily } = item;
      const initials = initialsOf(teacher.name);
      const genderStr = teacher.gender === 'MALE' ? t('male') : t('female');

      let dailyBadge = '';
      let rowClass = '';
      if (daily) {
        if (daily.state === 'in') { dailyBadge = `<span class="status-dot in-school" title="In School"></span>`; rowClass = 'live'; }
        else { dailyBadge = `<span class="status-dot signed-out" title="Signed Out"></span>`; }
      } else {
        dailyBadge = `<span class="status-dot absent" title="Absent Today"></span>`;
      }
      const cpdStatusDot = isLiveCpd ? `<span class="status-dot in-cpd" title="In CPD"></span>` : '';

      return `
        <div class="teacher-row ${rowClass}" data-teacher="${escapeHtml(teacher.name)}">
          <div style="display:flex; flex-direction:column; gap:2px; align-items:center;">
            ${cpdStatusDot}
            ${dailyBadge}
          </div>
          <div class="teacher-avatar">${initials}</div>
          <div class="teacher-info">
            <div class="teacher-name">${escapeHtml(teacher.name)}</div>
            <div class="teacher-sub-line">${genderStr} · ${daily ? (daily.state === 'in' ? 'In School' : 'Signed Out') : 'Absent Today'}</div>
          </div>
          <div class="teacher-actions">
            <button class="teacher-action-btn" data-edit-teacher="${teacher.id}" title="Edit Teacher" aria-label="Edit ${escapeHtml(teacher.name)}">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </button>
            <button class="teacher-action-btn danger" data-del-teacher="${teacher.id}" title="Remove Teacher" aria-label="Remove ${escapeHtml(teacher.name)}">
