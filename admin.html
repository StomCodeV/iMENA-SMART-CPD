    /* ==================== TEACHER DETAIL ==================== */
    function goTeacherDetail(name) {
      state.view = 'teacher-detail'; state.teacherDetailName = name; renderTeacherDetail();
    }

    function renderTeacherDetail() {
      const name = state.teacherDetailName;
      const teacher = (state.teachers || []).find(tc => normalizeName(tc.name) === normalizeName(name));
      if (!teacher) { state.view = 'admin'; state.adminTab = 'teachers'; renderAdmin(); return; }

      const myAtts = state.allAttendances.filter(a => normalizeName(a.teacherName) === normalizeName(name));
      const sorted = myAtts.slice().sort((a, b) => (toDate(b.attendedAt)?.getTime() || 0) - (toDate(a.attendedAt)?.getTime() || 0));
      const active = sorted.find(a => a.state === 'active');
      const ended = sorted.filter(a => a.state === 'ended');
      const verifiedCount = ended.filter(a => a.verified).length;
      const totalMinutes = ended.reduce((s, a) => {
        const start = toDate(a.attendedAt)?.getTime(); const end = toDate(a.endedAt)?.getTime();
        if (start && end) return s + Math.max(0, (end - start) / 60000); return s;
      }, 0);
      const totalHours = (totalMinutes / 60).toFixed(1);
      const verifiedRate = ended.length > 0 ? Math.round(verifiedCount / ended.length * 100) : 0;
      const now = new Date();
      const thisMonth = sorted.filter(a => { const ts = toDate(a.attendedAt)?.getTime(); return ts && ts >= new Date(now.getFullYear(), now.getMonth(), 1).getTime(); }).length;

      const catColor = CAT_COLOR[teacher.category];
      const genderStr = teacher.gender === 'MALE' ? t('male') : t('female');

      const groups = {};
      sorted.forEach(a => {
        const d = toDate(a.attendedAt); if (!d) return;
        const key = d.toLocaleString('en', { month: 'long', year: 'numeric' });
        if (!groups[key]) groups[key] = []; groups[key].push(a);
      });

      const historyHtml = sorted.length === 0
        ? `<div class="empty"><strong>${t('no_sessions_yet')}</strong></div>`
        : Object.entries(groups).map(([month, list]) => `
            <div class="hist-month">${month}</div>
            ${list.map(a => {
              const start = toDate(a.attendedAt)?.getTime(); const end = toDate(a.endedAt)?.getTime();
              const mins = (start && end) ? Math.round((end - start) / 60000) : 0;
              const durStr = formatMins(mins);
              const badge = a.state === 'active' ? `<span class="badge badge-live">${t('live')}</span>` : a.verified ? `<span class="badge badge-verified">✓ ${t('verified')}</span>` : `<span class="badge badge-flagged">⚠ ${t('flagged')}</span>`;
              return `<div class="hist-item"><div class="hist-info"><h4>${escapeHtml(a.cpdTitle || '—')}</h4><p>${fmtDate(a.attendedAt)} · ${fmtTime(a.attendedAt)}${a.endedAt ? ` → ${fmtTime(a.endedAt)} · ${durStr}` : ''}</p></div>${badge}</div>`;
            }).join('')}
          `).join('');

      const recentDaily = state.dailyRecords.filter(r => normalizeName(r.teacherName) === normalizeName(name)).sort((a,b) => b.date.localeCompare(a.date)).slice(0, 5);

      const dailyHtml = recentDaily.length === 0 ? '' : `
        <h3 style="font-size:13px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:0.06em;margin:24px 0 12px;padding-left:4px">Recent Daily Attendance</h3>
        ${recentDaily.map(r => {
          const isLate = r.lateMinutes > 0; const isEarly = r.earlyLeaveMinutes > 0;
          const signIn = toDate(r.signInAt); const signOut = toDate(r.signOutAt);
          let statusBadge = ''; if (r.state === 'in') statusBadge = `<span class="badge badge-live">In School</span>`; else statusBadge = `<span class="badge badge-out">Signed Out</span>`;
          return `<div class="hist-item">
            <div class="hist-info"><h4>${new Date(r.date).toLocaleDateString([], { weekday: 'short', day: '2-digit', month: 'short' })}</h4><p>In: ${signIn ? signIn.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '—'} | Out: ${signOut ? signOut.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '—'}</p></div>
            <div style="display:flex; gap:4px;">${isLate ? `<span class="badge badge-late">Late ${formatMins(r.lateMinutes)}</span>` : ''}${isEarly ? `<span class="badge badge-absent">Early ${formatMins(r.earlyLeaveMinutes)}</span>` : ''}${statusBadge}</div>
          </div>`;
        }).join('')}
      `;

      document.getElementById('app').innerHTML = `${headerHtml()}<main class="main">
        <button id="btn-back-teacher" class="btn btn-ghost" style="width:auto;padding:10px 14px;margin-bottom:14px;font-size:13px">← ${t('back_to_teachers')}</button>
        <div style="text-align:center;margin-bottom:24px">
          <div style="width:80px;height:80px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,#00ffcc,#0088ff);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#0a0f1e;box-shadow:0 8px 30px rgba(0,255,204,0.3)">${initialsOf(teacher.name)}</div>
          <h1 style="font-size:22px;font-weight:900;margin:0 0 6px;color:#fff;word-break:break-word">${escapeHtml(teacher.name)}</h1>
          <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center">
            <span style="font-size:11px;font-weight:800;padding:4px 12px;border-radius:99px;text-transform:uppercase;letter-spacing:0.05em;background:rgba(255,255,255,0.08);color:${catColor};border:1px solid ${catColor}55">${teacher.category}</span>
            <span style="font-size:13px;color:#94a3b8">${genderStr}</span>
          </div>
        </div>
        ${active ? `<div class="ongoing-banner"><div class="pulse"></div><div class="info"><h4>${escapeHtml(active.cpdTitle)}</h4><p>${t('in_cpd_label')} · ${fmtTime(active.attendedAt)}</p></div></div>` : ''}
        <div class="td-stats">
          <div class="td-stat"><div class="val">${sorted.length}</div><div class="lbl">${t('total_cpds')}</div></div>
          <div class="td-stat"><div class="val" style="color:#38bdf8">${totalHours}h</div><div class="lbl">${t('total_hours')}</div></div>
          <div class="td-stat"><div class="val" style="color:#10b981">${verifiedRate}%</div><div class="lbl">${t('verified_pct')}</div></div>
          <div class="td-stat"><div class="val" style="color:#fbbf24">${thisMonth}</div><div class="lbl">${t('this_month')}</div></div>
        </div>
        ${dailyHtml}
        <h3 style="font-size:13px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:0.06em;margin:24px 0 12px;padding-left:4px">${t('sessions_history')}</h3>
        ${historyHtml}
      </main>`;
      bindHeaderEvents();
      document.getElementById('btn-back-teacher').onclick = () => { state.view = 'admin'; state.teacherDetailName = null; state.adminTab = 'teachers'; renderAdmin(); };
    }

    /* ==================== CALENDAR ==================== */
    function renderAdminCalendar() {
      const year = state.calYear, month = state.calMonth;
      const firstDay = new Date(year, month, 1); const lastDay = new Date(year, month + 1, 0);
      const startWeekday = (firstDay.getDay() + 6) % 7; const daysInMonth = lastDay.getDate();
      const sessionsByDay = {};
      state.cpds.forEach(c => {
        const d = toDate(c.startTime); if (!d) return;
        if (d.getFullYear() === year && d.getMonth() === month) {
          const key = d.getDate(); if (!sessionsByDay[key]) sessionsByDay[key] = []; sessionsByDay[key].push(c);
        }
      });
      const today = new Date();
      const isToday = (day) => today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
      let grid = '';
      for (let i = 0; i < startWeekday; i++) grid += `<div class="cal-day empty"></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const sessions = sessionsByDay[day] || []; const classes = ['cal-day'];
        if (sessions.length > 0) {
          classes.push('has-cpd');
          const statuses = sessions.map(c => cpdStatus(c));
          if (statuses.some(s => s === 'ongoing')) classes.push('live-day');
          else if (statuses.every(s => s === 'ended')) classes.push('past-only');
        }
        if (isToday(day)) classes.push('today');
        if (state.calSelectedDay === day) classes.push('selected');
        grid += `<div class="${classes.join(' ')}" data-calday="${day}">${day}</div>`;
      }
      const monthName = firstDay.toLocaleString('en', { month: 'long', year: 'numeric' });
      let dayDetail = '';
      if (state.calSelectedDay) {
        const list = sessionsByDay[state.calSelectedDay] || [];
        const dayDate = new Date(year, month, state.calSelectedDay).toLocaleDateString([], { weekday: 'long', day: '2-digit', month: 'long' });
        dayDetail = `<div class="section-title">${dayDate}</div>`;
        if (list.length === 0) dayDetail += `<div class="empty"><strong>${t('no_sessions_day')}</strong></div>`;
        else dayDetail += list.map(c => adminSessionDayCard(c)).join('');
      }
      return `
        <h1 style="font-size:22px;font-weight:900;margin:0 0 16px;color:#fff;text-shadow:0 0 20px rgba(0,255,204,0.35);">${t('calendar')}</h1>
        <div class="cal-wrap">
          <div class="cal-header"><div class="cal-title">${monthName}</div><div class="cal-nav"><button data-calnav="-1">‹</button><button data-calnav="1">›</button></div></div>
          <div class="cal-grid">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d => `<div class="cal-dow">${d}</div>`).join('')}${grid}</div>
          <div class="cal-legend"><span><i class="dot-ended"></i> ${t('ended')}</span><span><i class="dot-live"></i> ${t('live')}</span><span><i class="dot-upcoming"></i> ${t('upcoming')}</span></div>
        </div>
        ${dayDetail}`;
    }
    function adminSessionDayCard(cpd) {
      const atts = state.allAttendances.filter(a => a.cpdId === cpd.id);
      const total = atts.length; const verified = atts.filter(a => a.verified).length;
      const st = cpdStatus(cpd);
      let badge = ''; if (st === 'ongoing') badge = `<span class="badge badge-live">● ${t('live')}</span>`; else if (st === 'upcoming') badge = `<span class="badge badge-upcoming">${t('upcoming')}</span>`; else badge = `<span class="badge badge-ended">${t('ended')}</span>`;
      return `<div class="a-session-card"><div class="row">
        <div style="flex:1;min-width:0"><div>${badge}<span class="badge badge-type">${cpd.type || 'CPD'}</span></div><h3>${escapeHtml(cpd.title)}</h3><p>${fmtTime(cpd.startTime)} – ${fmtTime(cpd.endTime)} · ${escapeHtml(cpd.venueName)}</p>
          <div class="past-stats"><span class="past-stat">👥 ${total} ${t('attendees')}</span><span class="past-stat ok">✓ ${verified} ${t('verified')}</span></div>
        </div>
        <div class="actions"><button data-open-cpd="${cpd.id}" class="btn btn-primary">${t('open')}</button></div>
      </div></div>`;
    }

            <input type="datetime-local" name="endTime" value="${endStr}" required class="input" style="color-scheme:dark" />
            
            <div class="summary-line" id="summary"><strong id="sum-title">—</strong> · <span id="sum-time">—</span> · <span id="sum-venue">GS St Etienne</span></div>
            
            <details style="margin-bottom:16px;background:rgba(0,0,0,0.35);padding:12px;border-radius:12px;border:1px solid rgba(0,255,204,0.15)">
              <summary style="font-size:13px;font-weight:700;color:#00ffcc;cursor:pointer">${t('form_map')}</summary>
              <div style="margin-top:12px">
                <label>${t('form_venue')}</label>
                <input name="venueName" value="GS St Etienne" class="input" />
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                  <input name="venueLat" value="${DEFAULT_LAT}" class="input" placeholder="Lat" inputmode="decimal" />
                  <input name="venueLng" value="${DEFAULT_LNG}" class="input" placeholder="Lng" inputmode="decimal" />
                </div>
                <button type="button" id="btn-use-location" class="chip" style="width:100%;margin-bottom:8px">📍 ${t('use_location')}</button>
                <div id="venue-map" style="height:200px;border-radius:12px;overflow:hidden;margin-top:4px"></div>
              </div>
            </details>
            <button type="submit" id="btn-save-cpd" class="btn btn-primary" style="padding:18px;font-size:16px">${t('btn_create')}</button>
          </form>
        </div>`;
    }

    function bindAdminNewEvents() {
      document.getElementById('btn-back').onclick = () => { state.adminTab = 'overview'; renderAdmin(); };
      const form = document.getElementById('cpd-form');
      const startInput = form.elements.startTime; const endInput = form.elements.endTime;
      const latInput = form.elements.venueLat; const lngInput = form.elements.venueLng;
      document.querySelectorAll('#duration-chips .chip').forEach(chip => {
        chip.onclick = () => {
          document.querySelectorAll('#duration-chips .chip').forEach(c => c.classList.remove('active')); chip.classList.add('active');
          const start = startInput.value ? new Date(startInput.value) : new Date();
          endInput.value = toLocalInputValue(new Date(start.getTime() + parseInt(chip.dataset.duration) * 60000));
          updateSummary();
        };
      });
      document.getElementById('btn-now').onclick = () => {
        const n = new Date(); n.setSeconds(0, 0); n.setMinutes(Math.ceil(n.getMinutes() / 5) * 5);
        startInput.value = toLocalInputValue(n);
        const active = document.querySelector('#duration-chips .chip.active'); const dur = active ? parseInt(active.dataset.duration) : 60;
        endInput.value = toLocalInputValue(new Date(n.getTime() + dur * 60000)); updateSummary();
      };
      function updateSummary() {
        const title = form.elements.title.value.trim() || '—'; const venue = form.elements.venueName.value.trim() || 'Venue';
        const s = startInput.value ? new Date(startInput.value) : null; const e = endInput.value ? new Date(endInput.value) : null;
        document.getElementById('sum-title').textContent = title;
        document.getElementById('sum-venue').textContent = venue;
        if (s && e) {
          const fmt = d => d.toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
          const mins = Math.round((e - s) / 60000);
          document.getElementById('sum-time').textContent = `${fmt(s)} → ${fmt(e)} (${mins} min)`;
        }
      }
      form.elements.title.addEventListener('input', updateSummary);
      form.elements.venueName.addEventListener('input', updateSummary);
      startInput.addEventListener('change', updateSummary);
      endInput.addEventListener('change', updateSummary);
      updateSummary();
      let mapInit = false;
      const details = form.querySelector('details');
      details.addEventListener('toggle', () => {
        if (details.open && !mapInit) {
          const map = L.map('venue-map', { zoomControl: false }).setView([parseFloat(latInput.value), parseFloat(lngInput.value)], 16);
          addSatelliteBase(map);
          const marker = L.marker([parseFloat(latInput.value), parseFloat(lngInput.value)]).addTo(map);
          L.circle([parseFloat(latInput.value), parseFloat(lngInput.value)], { radius: 100, color: '#00ffcc', fillOpacity: 0.2 }).addTo(map);
          map.on('click', e => { latInput.value = e.latlng.lat.toFixed(6); lngInput.value = e.latlng.lng.toFixed(6); marker.setLatLng(e.latlng); });
          mapInit = true; setTimeout(() => map.invalidateSize(), 100);
        }
      });
      document.getElementById('btn-use-location').onclick = async () => {
        try {
          const pos = await getPositionOnce();
          latInput.value = pos.lat.toFixed(6); lngInput.value = pos.lng.toFixed(6);
          toast('Location set.', 'success');
        } catch (err) { toast(err.message, 'error'); }
      };
      form.onsubmit = async ev => {
        ev.preventDefault();
        const btn = document.getElementById('btn-save-cpd'); const errEl = document.getElementById('form-error');
        errEl.style.display = 'none'; btn.disabled = true; btn.textContent = t('btn_creating');
        try {
          const fd = new FormData(form);
          const data = {
            type: String(fd.get('eventType') || 'CPD'),
            title: String(fd.get('title') || '').trim(),
            theme: String(fd.get('theme') || '').trim(),
            facilitator: String(fd.get('facilitator') || '').trim(),
            startTime: new Date(fd.get('startTime')),
            endTime: new Date(fd.get('endTime')),
            venueName: String(fd.get('venueName') || 'GS St Etienne').trim(),
            venueLat: Number(fd.get('venueLat')), venueLng: Number(fd.get('venueLng')),
            radiusMeters: 100, createdBy: state.user.uid, createdAt: serverTimestamp(),
          };
          if (!data.title) throw new Error('Title is required.');
          if (isNaN(data.venueLat) || isNaN(data.venueLng)) throw new Error('Invalid coordinates.');
          if (data.endTime <= data.startTime) throw new Error('End time must be after start time.');
          await addDoc(collection(db, 'cpds'), data);
          toast(t('msg_create'), 'success'); state.adminTab = 'overview'; goAdmin();
        } catch (err) {
          errEl.textContent = err.message; errEl.style.display = 'block';
          btn.disabled = false; btn.textContent = t('btn_create');
        }
      };
    }

    /* ==================== CPD DETAIL ==================== */
    function goCpdDetail(cpdId) {
      state.view = 'cpd-detail'; state.selectedCpdId = cpdId;
      state.selectedCpd = null; state.cpdAttendances = [];
      if (state.subDetail) { try { state.subDetail(); } catch {} }
      if (state.subDetailAtt) { try { state.subDetailAtt(); } catch {} }
      state.subDetail = onSnapshot(doc(db, 'cpds', cpdId),
        snap => { state.selectedCpd = snap.exists() ? { id: snap.id, ...snap.data() } : null; if (state.view === 'cpd-detail') renderCpdDetail(); },
        err => console.error(err));
      const q = query(collection(db, 'attendance'), where('cpdId', '==', cpdId));
      state.subDetailAtt = onSnapshot(q,
        snap => { state.cpdAttendances = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (state.view === 'cpd-detail') renderCpdDetail(); },
        err => console.error(err));
      renderCpdDetail();
    }

    function renderCpdDetail() {
      const cpd = state.selectedCpd; if (!cpd) return;
      const attByKey = new Map();
      state.cpdAttendances.forEach(a => {
        const key = normalizeName(a.teacherName); const existing = attByKey.get(key);
        if (!existing) attByKey.set(key, a); else if (a.state === 'active' && existing.state !== 'active') attByKey.set(key, a);
      });
      const inCpdList = []; const notInCpdList = [];
      (state.teachers || []).forEach(tc => {
        const att = attByKey.get(normalizeName(tc.name));
        if (att) inCpdList.push({ teacher: tc, attendance: att }); else notInCpdList.push({ teacher: tc });
      });
      const groupByCat = (arr) => {
        const g = { Nursery: [], Primary: [], Secondary: [] };
        arr.forEach(item => { if (g[item.teacher.category]) g[item.teacher.category].push(item); }); return g;
      };
      const inCpdGrouped = groupByCat(inCpdList); const notInCpdGrouped = groupByCat(notInCpdList);
      const catTotal = { Nursery: 0, Primary: 0, Secondary: 0 };
      (state.teachers || []).forEach(tc => { catTotal[tc.category]++; });

      const colHtml = (grouped, inCpd) => CATEGORIES.map(cat => {
        const items = grouped[cat]; const catClass = cat.toLowerCase(); const headLabel = t(catClass);
        return `<div class="cat-block"><div class="cat-block-head"><span class="cat-label ${catClass}">${headLabel}</span><span class="cat-count">${items.length}/${catTotal[cat]}</span></div><div class="cat-people">
          ${items.length === 0 ? `<div class="cat-empty">—</div>` : items.map(item => {
            if (inCpd) { const a = item.attendance; const liveTag = a.state === 'active' ? '· Live' : ''; return `<div class="person-chip"><span class="dot"></span><span class="nm">${escapeHtml(item.teacher.name)}</span><span class="meta">${fmtTime(a.attendedAt)}${liveTag}</span></div>`; }
            else { return `<div class="person-chip"><span class="dot"></span><span class="nm">${escapeHtml(item.teacher.name)}</span></div>`; }
          }).join('')}
        </div></div>`;
      }).join('');

      const colTotal = inCpdList.length + notInCpdList.length;
      const liveCount = inCpdList.filter(x => x.attendance.state === 'active').length;
      const verifiedCount = inCpdList.filter(x => x.attendance.verified).length;

      document.getElementById('app').innerHTML = `${headerHtml()}<main class="main">
        <button id="btn-back-admin" class="btn btn-ghost" style="width:auto;padding:10px 14px;margin-bottom:14px;font-size:13px">← ${t('back')}</button>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;flex-wrap:wrap">
          <div>
            <div style="display:flex; gap:6px; margin-bottom:4px;">
              <span class="badge badge-type">${cpd.type || 'CPD'}</span>
            </div>
            <h1 style="font-size:22px;font-weight:900;margin:0;color:#fff;word-break:break-word;text-shadow:0 0 20px rgba(0,255,204,0.3);">${escapeHtml(cpd.title)}</h1>
            ${cpd.facilitator ? `<p style="font-size:13px;color:#00ffcc;margin:4px 0 0;font-weight:600;">Facilitator: ${escapeHtml(cpd.facilitator)}</p>` : ''}
          </div>
          <button id="btn-export-session" class="csv-btn" style="flex-shrink:0">📥 ${t('download_this')}</button>
        </div>
        <p style="font-size:13px;color:#94a3b8;margin:0 0 20px">${escapeHtml(cpd.venueName)} · ${fmtDateTime(cpd.startTime)}</p>

        <div class="a-stat-grid">
          <div class="a-stat"><div class="val">${inCpdList.length}/${colTotal}</div><div class="lbl">${t('in_cpd_label')}</div></div>
          <div class="a-stat"><div class="val" style="color:#00ffcc">${liveCount}</div><div class="lbl">${t('live')}</div></div>
          <div class="a-stat"><div class="val" style="color:#38bdf8">${verifiedCount}</div><div class="lbl">${t('verified')}</div></div>
          <div class="a-stat"><div class="val" style="color:#94a3b8">${notInCpdList.length}</div><div class="lbl">${t('not_in_cpd_label')}</div></div>
        </div>

        <div class="map-card"><h3>📍 ${t('map')}</h3><div id="live-map" style="height:280px;border-radius:12px;overflow:hidden"></div></div>

        <div class="map-card"><h3>${t('record')}</h3>
          <div style="overflow-x:auto">
            <table class="detail-table">
              <thead><tr><th>${t('t_teacher')}</th><th>${t('t_attended')}</th><th>${t('t_ended')}</th><th>${t('t_status')}</th><th></th></tr></thead>
              <tbody>${state.cpdAttendances.length === 0 ? `<tr><td colspan="5" style="text-align:center;padding:28px;color:#94a3b8;font-size:13px">${t('no_att')}</td></tr>` : state.cpdAttendances.map(a => {
                const schoolT = findSchoolTeacher(a.teacherName); let status = '';
                if (!a.endedAt) status = `<span class="badge badge-live">${t('live')}</span>`;
                else if (a.verified) status = `<span class="badge badge-verified">✓ ${t('verified')}</span>`;
                else status = `<span class="badge badge-flagged">⚠ ${t('flagged')}</span>`;
                const approveBtn = (a.state === 'ended' && !a.verified) ? `<button class="btn btn-primary" style="width:auto;padding:6px 10px;font-size:11px;min-height:auto" onclick="approveAtt('${a.id}')">${t('approve')}</button>` : '';
                return `<tr><td><div class="att-name">${avatarImgTag(a.teacherPhotoURL, a.teacherName || 'User', 32)}<div style="min-width:0"><div style="color:#fff;font-size:13px;font-weight:700">${escapeHtml(a.teacherName || 'Unknown')}</div><div style="color:#94a3b8;font-size:11px">${schoolT ? schoolT.category : escapeHtml(a.teacherEmail || '')}</div></div></div></td><td style="font-size:12px">${fmtTime(a.attendedAt)}</td><td style="font-size:12px">${fmtTime(a.endedAt)}</td><td>${status}</td><td>${approveBtn}</td></tr>`;
              }).join('')}</tbody>
            </table>
          </div>
        </div>

        <h3 style="font-size:13px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:0.06em;margin:20px 0 12px;padding-left:4px;">${t('attendance_breakdown')}</h3>

        <div class="cpd-split">
          <div class="cpd-col attended"><div class="cpd-col-head"><h3>✓ ${t('currently_in_cpd')}</h3><span class="cnt">${inCpdList.length}/${colTotal}</span></div>${colHtml(inCpdGrouped, true)}</div>
          <div class="cpd-col not-attended"><div class="cpd-col-head"><h3>○ ${t('not_in_cpd_yet')}</h3><span class="cnt">${notInCpdList.length}/${colTotal}</span></div>${colHtml(notInCpdGrouped, false)}</div>
        </div>
      </main>`;

      bindHeaderEvents();
      document.getElementById('btn-back-admin').onclick = () => { state.view = 'admin'; goAdmin(); };
      document.getElementById('btn-export-session').onclick = () => downloadSessionCSV(cpd);
      window.approveAtt = async (attId) => {
        try { await updateDoc(doc(db, 'attendance', attId), { verified: true }); toast('Approved.', 'success'); }
        catch (err) { toast(err.message, 'error'); }
      };
      requestAnimationFrame(() => updateLiveMap(cpd));
    }

    function updateLiveMap(cpd) {
      const el = document.getElementById('live-map'); if (!el) return;
      if (state.liveMap && state.liveMapCpdId === cpd.id && document.body.contains(state.liveMap.getContainer())) {
        state.liveMap.eachLayer(layer => { if (layer instanceof L.Marker && layer._isTeacherMarker) state.liveMap.removeLayer(layer); });
      } else {
        if (state.liveMap) { try { state.liveMap.remove(); } catch {} }
        state.liveMap = L.map(el, { zoomControl: false }).setView([cpd.venueLat, cpd.venueLng], 17);
        addSatelliteBase(state.liveMap);
        L.circle([cpd.venueLat, cpd.venueLng], { radius: cpd.radiusMeters, color: '#00ffcc', fillColor: '#00ffcc', fillOpacity: 0.15, weight: 2 }).addTo(state.liveMap);
        const venueIcon = L.divIcon({ className: '', html: `<div style="background:#00ffcc;width:24px;height:24px;border-radius:50%;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`, iconSize: [24,24], iconAnchor: [12,12] });
        L.marker([cpd.venueLat, cpd.venueLng], { icon: venueIcon }).addTo(state.liveMap);
        state.liveMapCpdId = cpd.id; setTimeout(() => state.liveMap.invalidateSize(), 100);
      }
      state.cpdAttendances.forEach(a => {
        let lat, lng, color;
        if (a.state === 'active' && a.liveLat != null) { lat = a.liveLat; lng = a.liveLng; color = '#10b981'; }
        else if (a.endedLat != null) { lat = a.endedLat; lng = a.endedLng; color = a.verified ? '#0ea5e9' : '#f59e0b'; }
        else if (a.attendedLat != null) { lat = a.attendedLat; lng = a.attendedLng; color = '#ef4444'; }
        else return;
        const icon = L.divIcon({ className: '', html: `<div style="background:${color};width:16px;height:16px;border-radius:50%;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`, iconSize: [16,16], iconAnchor: [8,8] });
        const marker = L.marker([lat, lng], { icon }).addTo(state.liveMap); marker._isTeacherMarker = true;
      });
    }

    window.showFullPhoto = (base64) => {
      const modal = document.createElement('div');
      modal.className = 'profile-modal open';
      modal.innerHTML = `<div style="position:relative; max-width:90vw; max-height:90vh; display:flex; align-items:center; justify-content:center;"><img src="${base64}" style="max-width:100%; max-height:90vh; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,0.5);"/></div>`;
      document.body.appendChild(modal);
      modal.onclick = () => modal.remove();
    };

    /* ==================== BOOT ==================== */
    document.getElementById('app').innerHTML = `
      <div class="loader">
        <img src="${LOGO_URL}" alt="Logo" style="width:100px;height:100px;object-fit:contain" />
        <div class="loader-ring"></div>
      </div>`;
  </script>

</body>
