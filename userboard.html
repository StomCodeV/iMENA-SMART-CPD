    function renderAdminNew() {
      const now = new Date(); now.setSeconds(0, 0); now.setMinutes(Math.ceil(now.getMinutes() / 5) * 5);
      const startStr = toLocalInputValue(now);
      const endStr = toLocalInputValue(new Date(now.getTime() + 60 * 60 * 1000));

      return `
        <button id="btn-back" class="btn btn-ghost" style="width:auto;padding:10px 14px;margin-bottom:14px;font-size:13px;">← ${t('back')}</button>

        <div class="form-card">
          <h2>${t('create_title')}</h2>
          <p class="sub">${t('create_sub')}</p>

          <form id="cpd-form">
            <div id="form-error" style="display:none;margin-bottom:14px;padding:12px;background:rgba(239,68,68,0.25);color:#fca5a5;border-radius:12px;font-size:13px;font-weight:600"></div>

            <label>${t('form_title')}</label>
            <input name="title" required class="input" placeholder="e.g. Teaching Methodologies 2025" list="recent-titles" autocomplete="off" />
            <datalist id="recent-titles">${[...new Set(state.cpds.map(c => c.title).filter(Boolean))].slice(0, 8).map(tl => `<option value="${escapeHtml(tl)}">`).join('')}</datalist>

            <label>${t('form_theme')}</label>
            <input name="theme" class="input" placeholder="e.g. Modern classroom practices" />

            <label>${t('form_start')}</label>
            <div style="display:flex;gap:8px;margin-bottom:4px">
              <input type="datetime-local" name="startTime" value="${startStr}" required class="input" style="color-scheme:dark;margin-bottom:0" />
              <button type="button" id="btn-now" class="chip chip-neutral" style="flex-shrink:0">${t('quick_now')}</button>
            </div>

            <label style="margin-top:12px">${t('duration')} / ${t('form_end')}</label>
            <div class="chip-row" id="duration-chips">
              <button type="button" class="chip" data-duration="30">30 min</button>
              <button type="button" class="chip" data-duration="60">1 h</button>
              <button type="button" class="chip active" data-duration="120">2 h</button>
              <button type="button" class="chip" data-duration="240">4 h</button>
              <button type="button" class="chip" data-duration="480">Full day</button>
            </div>
            <input type="datetime-local" name="endTime" value="${endStr}" required class="input" style="color-scheme:dark" />

            <div class="summary-line" id="summary">
              <strong id="sum-title">—</strong> · <span id="sum-time">—</span> · <span id="sum-venue">GS St Etienne</span>
            </div>

            <details style="margin-bottom:16px;background:rgba(0,0,0,0.35);padding:12px;border-radius:12px;border:1px solid rgba(0,255,204,0.15)">
              <summary style="font-size:13px;font-weight:700;color:#00ffcc;cursor:pointer">${t('form_map')}</summary>
              <div style="margin-top:12px">
                <label>${t('form_venue')}</label>
                <input name="venueName" value="GS St Etienne" class="input" />
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                  <input name="venueLat" value="${DEFAULT_LAT}" class="input" placeholder="Lat" inputmode="decimal" />
                  <input name="venueLng" value="${DEFAULT_LNG}" class="input" placeholder="Lng" inputmode="decimal" />
                </div>
                <button type="button" id="btn-use-location" class="chip" style="width:100%;margin-bottom:8px">📍 ${t('use_location')}</button>
                <div id="venue-map" style="height:200px;border-radius:12px;overflow:hidden;margin-top:4px"></div>
              </div>
            </details>

            <button type="submit" id="btn-save-cpd" class="btn btn-primary" style="padding:18px;font-size:16px">${t('btn_create')}</button>
          </form>
        </div>`;
    }

    function bindAdminNewEvents() {
      document.getElementById('btn-back').onclick = () => { state.adminTab = 'overview'; renderAdmin(); };
      const form = document.getElementById('cpd-form');
      const startInput = form.elements.startTime;
      const endInput = form.elements.endTime;
      const latInput = form.elements.venueLat;
      const lngInput = form.elements.venueLng;

      document.querySelectorAll('#duration-chips .chip').forEach(chip => {
        chip.onclick = () => {
          document.querySelectorAll('#duration-chips .chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          const start = startInput.value ? new Date(startInput.value) : new Date();
          endInput.value = toLocalInputValue(new Date(start.getTime() + parseInt(chip.dataset.duration) * 60000));
          updateSummary();
        };
      });
      document.getElementById('btn-now').onclick = () => {
        const n = new Date(); n.setSeconds(0, 0); n.setMinutes(Math.ceil(n.getMinutes() / 5) * 5);
        startInput.value = toLocalInputValue(n);
        const active = document.querySelector('#duration-chips .chip.active');
        const dur = active ? parseInt(active.dataset.duration) : 60;
        endInput.value = toLocalInputValue(new Date(n.getTime() + dur * 60000));
        updateSummary();
      };
      function updateSummary() {
        const title = form.elements.title.value.trim() || '—';
        const venue = form.elements.venueName.value.trim() || 'Venue';
        const s = startInput.value ? new Date(startInput.value) : null;
        const e = endInput.value ? new Date(endInput.value) : null;
        document.getElementById('sum-title').textContent = title;
        document.getElementById('sum-venue').textContent = venue;
        if (s && e) {
          const fmt = d => d.toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
          const mins = Math.round((e - s) / 60000);
          document.getElementById('sum-time').textContent = `${fmt(s)} → ${fmt(e)} (${mins} min)`;
        }
      }
      form.elements.title.addEventListener('input', updateSummary);
      form.elements.venueName.addEventListener('input', updateSummary);
      startInput.addEventListener('change', updateSummary);
      endInput.addEventListener('change', updateSummary);
      updateSummary();

      let mapInit = false;
      const details = form.querySelector('details');
      details.addEventListener('toggle', () => {
        if (details.open && !mapInit) {
          const map = L.map('venue-map', { zoomControl: false }).setView([parseFloat(latInput.value), parseFloat(lngInput.value)], 16);
          addSatelliteBase(map);
          const marker = L.marker([parseFloat(latInput.value), parseFloat(lngInput.value)]).addTo(map);
          L.circle([parseFloat(latInput.value), parseFloat(lngInput.value)], { radius: 100, color: '#00ffcc', fillOpacity: 0.2 }).addTo(map);
          map.on('click', e => { latInput.value = e.latlng.lat.toFixed(6); lngInput.value = e.latlng.lng.toFixed(6); marker.setLatLng(e.latlng); });
          mapInit = true;
          setTimeout(() => map.invalidateSize(), 100);
        }
      });
      document.getElementById('btn-use-location').onclick = async () => {
        try {
          const pos = await getPositionOnce();
          latInput.value = pos.lat.toFixed(6);
          lngInput.value = pos.lng.toFixed(6);
          toast('Location set.', 'success');
        } catch (err) { toast(err.message, 'error'); }
      };
      form.onsubmit = async ev => {
        ev.preventDefault();
        const btn = document.getElementById('btn-save-cpd');
        const errEl = document.getElementById('form-error');
        errEl.style.display = 'none'; btn.disabled = true; btn.textContent = t('btn_creating');
        try {
          const fd = new FormData(form);
          const data = {
            title: String(fd.get('title') || '').trim(),
            theme: String(fd.get('theme') || '').trim(),
            startTime: new Date(fd.get('startTime')),
            endTime: new Date(fd.get('endTime')),
            venueName: String(fd.get('venueName') || 'GS St Etienne').trim(),
            venueLat: Number(fd.get('venueLat')),
            venueLng: Number(fd.get('venueLng')),
            radiusMeters: 100,
            createdBy: state.user.uid,
            createdAt: serverTimestamp(),
          };
          if (!data.title) throw new Error('Title is required.');
          if (isNaN(data.venueLat) || isNaN(data.venueLng)) throw new Error('Invalid coordinates.');
          if (data.endTime <= data.startTime) throw new Error('End time must be after start time.');
          await addDoc(collection(db, 'cpds'), data);
          toast(t('msg_create'), 'success');
          state.adminTab = 'overview'; goAdmin();
        } catch (err) {
          errEl.textContent = err.message; errEl.style.display = 'block';
          btn.disabled = false; btn.textContent = t('btn_create');
        }
      };
    }

    /* ==================== SESSION DETAIL ==================== */
    function goCpdDetail(cpdId) {
      state.view = 'cpd-detail'; state.selectedCpdId = cpdId;
      state.selectedCpd = null; state.cpdAttendances = [];
      if (state.subDetail) { try { state.subDetail(); } catch {} }
      if (state.subDetailAtt) { try { state.subDetailAtt(); } catch {} }
      state.subDetail = onSnapshot(doc(db, 'cpds', cpdId),
        snap => { state.selectedCpd = snap.exists() ? { id: snap.id, ...snap.data() } : null; if (state.view === 'cpd-detail') renderCpdDetail(); },
        err => console.error(err));
      const q = query(collection(db, 'attendance'), where('cpdId', '==', cpdId));
      state.subDetailAtt = onSnapshot(q,
        snap => { state.cpdAttendances = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (state.view === 'cpd-detail') renderCpdDetail(); },
        err => console.error(err));
      renderCpdDetail();
    }

    function renderCpdDetail() {
      const cpd = state.selectedCpd;
      if (!cpd) return;

      const rows = state.cpdAttendances.map(a => {
        let status = '';
        if (!a.endedAt) status = `<span class="badge badge-live">${t('live')}</span>`;
        else if (a.verified) status = `<span class="badge badge-verified">✓ ${t('verified')}</span>`;
        else status = `<span class="badge badge-flagged">⚠ ${t('flagged')}</span>`;
        const approveBtn = (a.state === 'ended' && !a.verified)
          ? `<button class="btn btn-primary" style="width:auto;padding:6px 10px;font-size:11px;min-height:auto" onclick="approveAtt('${a.id}')">${t('approve')}</button>`
          : '';
        return `<tr>
          <td><div class="att-name">${avatarImgTag(a.teacherPhotoURL, a.teacherName || 'User', 32)}<div style="min-width:0"><div style="color:#fff;font-size:13px;font-weight:700">${escapeHtml(a.teacherName || 'Unknown')}</div><div style="color:#94a3b8;font-size:11px">${escapeHtml(a.teacherEmail || '')}</div></div></div></td>
          <td style="font-size:12px">${fmtTime(a.attendedAt)}</td>
          <td style="font-size:12px">${fmtTime(a.endedAt)}</td>
          <td>${status}</td>
          <td>${approveBtn}</td>
        </tr>`;
      }).join('');

      const live = state.cpdAttendances.filter(a => a.state === 'active').length;
      const verified = state.cpdAttendances.filter(a => a.verified).length;

      document.getElementById('app').innerHTML = `${headerHtml()}<main class="main">
        <button id="btn-back-admin" class="btn btn-ghost" style="width:auto;padding:10px 14px;margin-bottom:14px;font-size:13px">← ${t('back')}</button>
        <h1 style="font-size:22px;font-weight:900;margin:0 0 6px;color:#fff;word-break:break-word;text-shadow:0 0 20px rgba(0,255,204,0.3)">${escapeHtml(cpd.title)}</h1>
        <p style="font-size:13px;color:#94a3b8;margin:0 0 20px">${escapeHtml(cpd.venueName)} · ${fmtDateTime(cpd.startTime)}</p>

        <div class="a-stat-grid">
          <div class="a-stat"><div class="val">${state.cpdAttendances.length}</div><div class="lbl">${t('attendees')}</div></div>
          <div class="a-stat"><div class="val" style="color:#00ffcc">${live}</div><div class="lbl">${t('live')}</div></div>
          <div class="a-stat"><div class="val" style="color:#38bdf8">${verified}</div><div class="lbl">${t('verified')}</div></div>
          <div class="a-stat"><div class="val" style="color:#fbbf24">${state.cpdAttendances.length - verified - live}</div><div class="lbl">${t('flagged')}</div></div>
        </div>

        <div class="map-card">
          <h3>📍 ${t('map')}</h3>
          <div id="live-map" style="height:280px;border-radius:12px;overflow:hidden"></div>
        </div>

        <div class="map-card">
          <h3>${t('record')}</h3>
          <div style="overflow-x:auto">
            <table class="detail-table">
              <thead><tr><th>${t('t_teacher')}</th><th>${t('t_attended')}</th><th>${t('t_ended')}</th><th>${t('t_status')}</th><th></th></tr></thead>
              <tbody>${rows || `<tr><td colspan="5" style="text-align:center;padding:28px;color:#94a3b8;font-size:13px">${t('no_att')}</td></tr>`}</tbody>
            </table>
          </div>
        </div>
      </main>`;

      bindHeaderEvents();
      document.getElementById('btn-back-admin').onclick = () => goAdmin();
      window.approveAtt = async (attId) => {
        try { await updateDoc(doc(db, 'attendance', attId), { verified: true }); toast('Approved.', 'success'); }
        catch (err) { toast(err.message, 'error'); }
      };
      requestAnimationFrame(() => updateLiveMap(cpd));
    }

    function updateLiveMap(cpd) {
      const el = document.getElementById('live-map'); if (!el) return;
      if (state.liveMap) { try { state.liveMap.remove(); } catch {} state.liveMap = null; }
      const map = L.map(el, { zoomControl: false }).setView([cpd.venueLat, cpd.venueLng], 17);
      addSatelliteBase(map);
      L.circle([cpd.venueLat, cpd.venueLng], { radius: cpd.radiusMeters, color: '#00ffcc', fillColor: '#00ffcc', fillOpacity: 0.15, weight: 2 }).addTo(map);
      const venueIcon = L.divIcon({ className: '', html: `<div style="background:#00ffcc;width:24px;height:24px;border-radius:50%;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`, iconSize: [24,24], iconAnchor: [12,12] });
      L.marker([cpd.venueLat, cpd.venueLng], { icon: venueIcon }).addTo(map);
      state.cpdAttendances.forEach(a => {
        let lat, lng, color;
        if (a.state === 'active' && a.liveLat != null) { lat = a.liveLat; lng = a.liveLng; color = '#10b981'; }
        else if (a.endedLat != null) { lat = a.endedLat; lng = a.endedLng; color = a.verified ? '#0ea5e9' : '#f59e0b'; }
        else if (a.attendedLat != null) { lat = a.attendedLat; lng = a.attendedLng; color = '#ef4444'; }
        else return;
        const icon = L.divIcon({ className: '', html: `<div style="background:${color};width:16px;height:16px;border-radius:50%;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`, iconSize: [16,16], iconAnchor: [8,8] });
        L.marker([lat, lng], { icon }).addTo(map);
      });
      state.liveMap = map;
      setTimeout(() => map.invalidateSize(), 100);
    }

    /* ==================== GPS TRACKING ==================== */
    function ensureWatchForActive() {
      const active = state.myAttendances.find(a => a.state === 'active');
      if (!active) { clearWatch(); return; }
      if (state.watchingFor === active.id) return;
      clearWatch();
      state.watchingFor = active.id;
      state.watchId = navigator.geolocation.watchPosition(
        pos => { updateDoc(doc(db, 'attendance', active.id), { liveLat: pos.coords.latitude, liveLng: pos.coords.longitude, liveAccuracy: pos.coords.accuracy, liveUpdatedAt: serverTimestamp() }).catch(() => {}); },
        () => {},
        { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
      );
    }

    /* ==================== BOOT ==================== */
    document.getElementById('app').innerHTML = `
      <div class="loader">
        <img src="https://i.postimg.cc/QMd5HYhd/i-MENA-Smart-CPD-Attendance-Logo.png" alt="Logo" style="width:100px;height:100px;object-fit:contain" />
        <div class="loader-ring"></div>
      </div>`;
  </script>
</body>
</html>
