<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#071B33" />
  <title>iMENA Smart CPD</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/268DpvQt/i-MENA-Smart-CPD-Badge.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e8f0; -webkit-font-smoothing: antialiased;
      min-height: 100vh; overflow-x: hidden; background: #0a0f1e;
    }
    button, input, textarea { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }

    #bg-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0; pointer-events: none; display: block;
      background: #0a0f1e;
    }
    #app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    /* ---- Header ---- */
    .header {
      position: sticky; top: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; gap: 8px;
      background: rgba(10, 15, 30, 0.72);
      backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: max(10px, env(safe-area-inset-top));
    }
    .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .header-logo { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }
    .header-title { font-size: 14px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .header-title span { display: block; font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
    .admin-mode .header-title span { color: #00ffcc; }
    .teacher-mode .header-title span {
      background: linear-gradient(90deg, #ec4899, #8b5cf6, #06b6d4);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }

    .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .avatar-btn {
      width: 38px; height: 38px; border-radius: 50%; overflow: hidden;
      border: 2px solid #0ea5e9; padding: 0; background: #fff; flex-shrink: 0;
    }
    .teacher-mode .avatar-btn { border-image: linear-gradient(135deg, #ec4899, #06b6d4) 1; border: 2px solid #8b5cf6; }
    .admin-mode .avatar-btn { border-color: #00ffcc; }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ---- Profile modal ---- */
    .profile-modal {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .profile-modal.open { opacity: 1; pointer-events: auto; }
    .profile-card {
      background: #1e293b; color: #fff; border-radius: 24px; padding: 24px;
      width: 100%; max-width: 340px; text-align: center;
      transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .profile-modal.open .profile-card { transform: translateY(0); }
    .profile-img { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 16px; border: 3px solid #0ea5e9; object-fit: cover; }
    .admin-mode .profile-img { border-color: #00ffcc; }
    .teacher-mode .profile-img { border-color: #8b5cf6; }
    .profile-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .profile-email { font-size: 13px; color: #94a3b8; margin-bottom: 12px; word-break: break-all; }
    .profile-role { display: inline-block; padding: 6px 12px; border-radius: 99px; background: rgba(139, 92, 246, 0.15); color: #c4b5fd; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 20px; }
    .admin-mode .profile-role { background: rgba(0, 255, 204, 0.15); color: #00ffcc; }
    .profile-actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-home, .btn-logout { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; }
    .btn-home { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .btn-logout { background: rgba(239, 68, 68, 0.15); color: #f87171; }

    /* ---- Buttons ---- */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 16px 20px; border-radius: 14px;
      font-size: 15px; font-weight: 800; transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
      min-height: 48px;
    }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #0ea5e9, #3b82f6); color: #fff; box-shadow: 0 6px 20px rgba(14, 165, 233, 0.35); }
    .teacher-mode .btn-primary { background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4); box-shadow: 0 6px 24px rgba(139, 92, 246, 0.4); }
    .admin-mode .btn-primary { background: linear-gradient(135deg, #00ffcc, #0088ff); color: #0a0f1e; box-shadow: 0 6px 20px rgba(0, 255, 204, 0.3); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; box-shadow: 0 6px 20px rgba(239, 68, 68, 0.35); }
    .btn-ghost { background: rgba(255, 255, 255, 0.06); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.1); }
    .admin-mode .btn-ghost { background: rgba(255, 255, 255, 0.06); color: #e2e8f0; }

    .input {
      width: 100%; padding: 14px; border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.6); font-size: 15px; margin-bottom: 12px;
      color: #e2e8f0;
    }
    .input:focus { outline: none; border-color: #8b5cf6; box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15); }
    .admin-mode .input:focus { border-color: #00ffcc; box-shadow: 0 0 0 4px rgba(0, 255, 204, 0.15); }

    /* ---- Main + tab bar ---- */
    .main {
      flex: 1; padding: 18px 14px calc(80px + env(safe-area-inset-bottom));
      max-width: 800px; margin: 0 auto; width: 100%;
    }
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; z-index: 90;
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-btn {
      flex: 1; padding: 10px 4px;
      color: #64748b; font-size: 10px; font-weight: 700;
      text-align: center; transition: color 0.2s;
      text-transform: uppercase; letter-spacing: 0.04em;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
    .tab-btn.active { color: #00ffcc; }
    .teacher-mode .tab-btn.active { color: #fff; }
    .teacher-mode .tab-btn.active svg {
      filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.6));
      stroke: url(#teacherGrad);
    }
    .admin-mode .tab-btn.active { color: #00ffcc; filter: drop-shadow(0 0 8px rgba(0, 255, 204, 0.5)); }

    /* ---- Teacher cards ---- */
    .t-hero {
      border-radius: 24px; padding: 24px 20px; margin-bottom: 20px;
      position: relative; overflow: hidden;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .t-hero::before {
      content: ''; position: absolute; inset: 0; padding: 1px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      border-radius: 24px; pointer-events: none; opacity: 0.7;
    }
    .t-hero-active::before {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      opacity: 1;
    }
    .t-hero h1 { font-size: 22px; font-weight: 900; margin: 0 0 8px; line-height: 1.2; color: #fff; }
    .t-hero p { font-size: 14px; color: #94a3b8; margin: 0 0 16px; line-height: 1.5; }
    .t-hero .status-pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10b981; margin-right: 6px; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); } 50% { opacity: 0.6; box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } }

    .t-session-card {
      border-radius: 20px; padding: 18px; margin-bottom: 12px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative; overflow: hidden;
      transition: transform 0.15s;
    }
    .t-session-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(180deg, #ec4899, #8b5cf6, #06b6d4);
      border-radius: 3px 0 0 3px;
    }
    .t-session-card.live::before { background: linear-gradient(180deg, #10b981, #06b6d4); }
    .t-session-card.ended::before { background: rgba(148, 163, 184, 0.3); }
    .t-session-card h3 { font-size: 17px; font-weight: 800; color: #fff; margin: 0 0 8px; line-height: 1.3; }
    .t-session-meta { font-size: 13px; color: #94a3b8; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .t-session-meta span { display: inline-flex; align-items: center; gap: 4px; }

    /* ---- Badges ---- */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
    .badge-live { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
    .badge-upcoming { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.2); }
    .badge-ended { background: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.15); }
    .badge-verified { background: rgba(14, 165, 233, 0.18); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.35); }
    .badge-flagged { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.35); }

    /* ---- Calendar ---- */
    .cal-wrap { background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .cal-title { font-size: 16px; font-weight: 800; color: #fff; }
    .cal-nav { display: flex; gap: 6px; }
    .cal-nav button { width: 32px; height: 32px; border-radius: 8px; background: rgba(255, 255, 255, 0.06); color: #cbd5e1; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .cal-nav button:active { transform: scale(0.95); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow { text-align: center; font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; padding: 6px 0; }
    .cal-day {
      aspect-ratio: 1; border-radius: 8px; background: rgba(255, 255, 255, 0.03);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; color: #cbd5e1;
      cursor: pointer; position: relative; transition: background 0.15s;
    }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.has-cpd { background: rgba(139, 92, 246, 0.18); border: 1px solid rgba(139, 92, 246, 0.4); color: #fff; }
    .cal-day.has-cpd::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: #8b5cf6; }
    .cal-day.today { border: 2px solid #06b6d4; }
    .cal-day.selected { background: linear-gradient(135deg, #ec4899, #8b5cf6); color: #fff; border-color: transparent; }
    .cal-day.selected::after { background: #fff; }
    .cal-day:active:not(.empty) { transform: scale(0.94); }

    /* ---- Stats ---- */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat-card {
      background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px; padding: 16px; text-align: center;
    }
    .stat-card .val { font-size: 26px; font-weight: 900; color: #fff; line-height: 1; font-variant-numeric: tabular-nums; }
    .stat-card .lbl { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-top: 6px; letter-spacing: 0.05em; }
    .stat-card.grad-pink .val { background: linear-gradient(135deg, #ec4899, #8b5cf6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-card.grad-cyan .val { background: linear-gradient(135deg, #06b6d4, #0ea5e9); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-card.grad-violet .val { background: linear-gradient(135deg, #8b5cf6, #ec4899); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-card.grad-green .val { background: linear-gradient(135deg, #10b981, #06b6d4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

    .ring-card { background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; margin-bottom: 16px; display: flex; align-items: center; gap: 20px; }
    .ring-card .ring-info { flex: 1; }
    .ring-card h3 { font-size: 14px; font-weight: 800; color: #fff; margin: 0 0 6px; }
    .ring-card p { font-size: 12px; color: #94a3b8; margin: 0; line-height: 1.5; }

    .chart-card { background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
    .chart-card h3 { font-size: 14px; font-weight: 800; color: #fff; margin: 0 0 16px; }
    .bars { display: flex; align-items: flex-end; gap: 6px; height: 100px; }
    .bars .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .bars .bar { width: 100%; background: linear-gradient(180deg, #ec4899, #8b5cf6); border-radius: 4px 4px 0 0; min-height: 4px; }
    .bars .bar-lbl { font-size: 9px; color: #94a3b8; font-weight: 700; text-transform: uppercase; }
    .bars .bar-count { font-size: 10px; color: #cbd5e1; font-weight: 800; }

    /* ---- History ---- */
    .hist-month { font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin: 20px 0 8px; padding-left: 4px; }
    .hist-month:first-child { margin-top: 0; }
    .hist-item { background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .hist-item .hist-info { flex: 1; min-width: 0; }
    .hist-item h4 { font-size: 14px; font-weight: 700; color: #fff; margin: 0 0 4px; }
    .hist-item p { font-size: 12px; color: #94a3b8; margin: 0; }

    /* ---- Admin cards ---- */
    .a-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .a-stat { background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 14px; padding: 14px; text-align: center; }
    .a-stat .val { font-size: 24px; font-weight: 900; color: #fff; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(0, 255, 204, 0.35); }
    .a-stat .lbl { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-top: 6px; letter-spacing: 0.05em; }

    .a-session-card { background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(18px); border: 1px solid rgba(0, 255, 204, 0.18); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .a-session-card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .a-session-card h3 { font-size: 15px; color: #fff; margin: 4px 0 4px; word-break: break-word; }
    .a-session-card p { font-size: 12px; color: #94a3b8; margin: 0; }
    .a-session-card .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .a-session-card .actions .btn { padding: 8px 12px; font-size: 12px; min-height: auto; width: auto; }

    .section-title { font-size: 13px; font-weight: 800; color: #94a3b8; margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 0.06em; padding-left: 4px; }
    .section-title:first-child { margin-top: 0; }

    .filter-tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab { padding: 8px 14px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); color: #94a3b8; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
    .filter-tab.active { background: rgba(0, 255, 204, 0.12); color: #00ffcc; border-color: rgba(0, 255, 204, 0.3); }

    /* ---- Create form ---- */
    .form-card { background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(20px); border: 1px solid rgba(0, 255, 204, 0.22); border-radius: 20px; padding: 20px; }
    .form-card label { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.05em; }
    .form-card h2 { font-size: 20px; font-weight: 900; color: #fff; margin: 0 0 6px; }
    .form-card .sub { font-size: 13px; color: #94a3b8; margin: 0 0 20px; }

    .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { padding: 8px 14px; border-radius: 10px; background: rgba(0, 255, 204, 0.08); border: 1px solid rgba(0, 255, 204, 0.3); color: #00ffcc; font-size: 12px; font-weight: 700; }
    .chip:active { transform: scale(0.96); }
    .chip.active { background: #00ffcc; color: #0a0f1e; }
    .chip-neutral { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.15); color: #cbd5e1; }

    .summary-line { background: rgba(0, 0, 0, 0.4); border: 1px dashed rgba(0, 255, 204, 0.35); border-radius: 12px; padding: 12px 14px; margin: 14px 0 16px; font-size: 13px; color: #cbd5e1; line-height: 1.5; }
    .summary-line strong { color: #00ffcc; }

    /* ---- Session detail ---- */
    .detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .detail-table th { text-align: left; padding: 10px 8px; font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid rgba(255, 255, 255, 0.1); letter-spacing: 0.05em; }
    .detail-table td { padding: 12px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); vertical-align: middle; color: #cbd5e1; }
    .att-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 2px solid rgba(0, 255, 204, 0.3); }
    .att-name { display: flex; align-items: center; gap: 10px; }

    /* ---- Toasts ---- */
    #toast-root { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
    .toast { padding: 14px 16px; border-radius: 14px; font-weight: 700; text-align: center; color: #fff; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); animation: slideUp 0.3s ease; }
    .toast.success { background: linear-gradient(135deg, #10b981, #06b6d4); }
    .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .toast.warn { background: linear-gradient(135deg, #f59e0b, #d97706); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loader { position: fixed; inset: 0; background: #0a0f1e; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #fff; }

              col += vec3(0.20, 0.75, 1.00) * exp(-d1 * d1 * 4.5) * 0.95;
              col += vec3(0.85, 0.35, 0.95) * exp(-d2 * d2 * 5.0) * 0.85;
              col += vec3(1.00, 0.55, 0.35) * exp(-d3 * d3 * 6.0) * 0.55;
              col += vec3(0.35, 0.95, 0.75) * exp(-d4 * d4 * 5.5) * 0.70;

              float r1 = sin((uvA.x * 1.4 + uvA.y * 1.2) * 3.0 + t * 2.2) * 0.5 + 0.5;
              float r2 = sin((uvA.x * -1.6 + uvA.y * 1.8) * 2.5 - t * 1.8 + 1.4) * 0.5 + 0.5;
              float r3 = sin((uvA.x * 2.2 + uvA.y * -0.8) * 2.0 + t * 2.7 + 3.1) * 0.5 + 0.5;
              col += vec3(0.55, 0.30, 0.95) * pow(r1, 6.0) * 0.25;
              col += vec3(0.15, 0.70, 0.95) * pow(r2, 6.0) * 0.25;
              col += vec3(0.95, 0.35, 0.70) * pow(r3, 8.0) * 0.20;

              float n = noise(uvA * 3.0 + vec2(t * 0.4, t * 0.3)) * 0.04;
              col += vec3(n);

              float vig = 1.0 - length(uv - 0.5) * 0.55;
              col *= vig;

              col = pow(col, vec3(0.92));

              gl_FragColor = vec4(col, 1.0);
            }
          `,
          depthTest: false, depthWrite: false
        });
        scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));
        return { scene, camera, uniforms, material };
      },

      /* ---- ADMIN: flowing tech sky ---- */
      buildAdminScene() {
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x0a1a3a, 100, 550);

        const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 1500);
        camera.position.set(0, 12, 60);
        camera.lookAt(0, 8, -30);

        const skyMat = new THREE.ShaderMaterial({
          side: THREE.BackSide, depthWrite: false,
          uniforms: {
            uTime: { value: 0 },
            uTop: { value: new THREE.Color(0x0a1a4a) },
            uMid: { value: new THREE.Color(0x1a3a7a) },
            uHorizon: { value: new THREE.Color(0x2a5a9a) },
            uDeep: { value: new THREE.Color(0x050e2a) },
            uGlow: { value: new THREE.Color(0x2a70c8) }
          },
          vertexShader: `varying vec3 vDir; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vDir=normalize(wp.xyz); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
          fragmentShader: `
            uniform float uTime; uniform vec3 uTop,uMid,uHorizon,uDeep,uGlow; varying vec3 vDir;
            float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
            float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
            float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){v+=a*noise(p);p*=2.03;a*=0.5;} return v; }
            void main(){
              vec3 dir=normalize(vDir);
              float h=clamp(dir.y*0.5+0.5,0.0,1.0);
              vec3 col=mix(uDeep,uHorizon,smoothstep(0.32,0.55,h));
              col=mix(col,uMid,smoothstep(0.55,0.78,h));
              col=mix(col,uTop,smoothstep(0.78,1.0,h));
              float cx=1.0-abs(dir.x); float hb=pow(1.0-abs(dir.y),12.0);
              col+=uGlow*pow(cx,3.0)*hb*0.7;
              if(dir.y>0.01){
                float alt=1.0/max(dir.y,0.008);
                vec2 uv=dir.xz*alt*0.1+vec2(uTime*0.012,uTime*0.008);
                float clouds=smoothstep(0.52,0.78,fbm(uv));
                float fade=smoothstep(0.01,0.2,dir.y)*(1.0-smoothstep(0.7,1.0,dir.y));
                col=mix(col,col*1.35+vec3(0.1,0.2,0.35),clouds*0.35*fade);
              }
              gl_FragColor=vec4(col,1.0);
            }`
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(900, 48, 32), skyMat));

        scene.add(new THREE.HemisphereLight(0x4a80c8, 0x0a1028, 0.8));
        scene.add(new THREE.AmbientLight(0x3060a0, 0.4));

        const hexPanels = [];
        const hexCount = isMobileDevice ? 20 : 32;
        const hexRingGeo = new THREE.RingGeometry(1.6, 1.85, 6);
        const hexFillGeo = new THREE.CircleGeometry(1.6, 6);
        for (let i = 0; i < hexCount; i++) {
          const group = new THREE.Group();
          const ringMat = new THREE.MeshBasicMaterial({ color: 0x4ab8ff, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false });
          group.add(new THREE.Mesh(hexRingGeo, ringMat));
          const fillMat = new THREE.MeshBasicMaterial({ color: 0x2a70b8, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false });
          const fill = new THREE.Mesh(hexFillGeo, fillMat); fill.position.z = -0.001; group.add(fill);
          group.position.set((Math.random() - 0.5) * 90, 3 + Math.random() * 47, -30 - Math.random() * 200);
          group.lookAt(0, group.position.y, -20);
          group.rotation.z = Math.random() * Math.PI * 2;
          group.scale.setScalar(0.7 + Math.random() * 1.2);
          group.userData = { baseOpacity: 0.45 + Math.random() * 0.4, pulsePhase: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.25, driftPhase: Math.random() * Math.PI * 2, baseY: group.position.y };
          scene.add(group);
          hexPanels.push({ group, ringMat, fillMat });
        }

        const nodes = [];
        const nodePositions = [];
        const nodeCount = isMobileDevice ? 50 : 80;
        const nodeGeo = new THREE.SphereGeometry(0.22, 6, 6);
        for (let i = 0; i < nodeCount; i++) {
          const mat = new THREE.MeshBasicMaterial({ color: 0x9ae0ff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false });
          const node = new THREE.Mesh(nodeGeo, mat);
          node.position.set((Math.random() - 0.5) * 80, 3 + Math.random() * 40, -30 - Math.random() * 200);
          node.userData = { phase: Math.random() * Math.PI * 2, baseScale: 0.7 + Math.random() * 0.8 };
          node.scale.setScalar(node.userData.baseScale);
          scene.add(node);
          nodes.push(node);
          nodePositions.push(node.position.clone());
        }

        const edgePairs = [];
        for (let i = 0; i < nodePositions.length; i++) {
          for (let j = i + 1; j < nodePositions.length; j++) {
            if (nodePositions[i].distanceTo(nodePositions[j]) < 32 && Math.random() < 0.4) edgePairs.push([i, j]);
          }
        }
        const chosen = edgePairs.slice(0, isMobileDevice ? 40 : 70);
        const edgeBuffer = new Float32Array(chosen.length * 6);
        const lineGeo = new THREE.BufferGeometry();
        lineGeo.setAttribute('position', new THREE.BufferAttribute(edgeBuffer, 3));
        lineGeo.setDrawRange(0, 0);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x4ab8ff, transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending, depthWrite: false });
        scene.add(new THREE.LineSegments(lineGeo, lineMat));

        return { scene, camera, skyMat, hexPanels, nodes, nodePositions, edgePairs: chosen, lineGeo, lineMat };
      },

      setMode(mode) { this.mode = mode; },

      resize() {
        if (!this.renderer) return;
        const w = window.innerWidth, h = window.innerHeight;
        this.renderer.setSize(w, h);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobileDevice ? 1.5 : 2));
        if (this.teacherScene) this.teacherScene.uniforms.uResolution.value.set(w, h);
        if (this.adminScene) { this.adminScene.camera.aspect = w / h; this.adminScene.camera.updateProjectionMatrix(); }
      },

      animate() {
        if (!this.active) return;
        this.animationId = requestAnimationFrame(() => this.animate());
        if (document.hidden) { this.clock.getDelta(); return; }
        const dt = Math.min(this.clock.getDelta(), 0.05);
        this.time += dt * MOTION_SCALE;
        const time = this.time;

        if (this.mode === 'admin' && this.adminScene) {
          const s = this.adminScene;
          const scrollY = window.scrollY || 0;
          const docH = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
          const scrollNorm = Math.min(1, scrollY / docH);
          const flowSpeed = 9.0 * (1 + scrollNorm * 1.8);

          s.hexPanels.forEach(h => {
            h.group.position.z += flowSpeed * dt;
            if (h.group.position.z > 40) {
              h.group.position.z = -220 - Math.random() * 40;
              h.group.position.x = (Math.random() - 0.5) * 90;
              h.group.position.y = 3 + Math.random() * 47;
              h.group.userData.baseY = h.group.position.y;
              h.group.lookAt(0, h.group.position.y, -20);
            }
            const pulse = 0.55 + Math.sin(time * 1.5 + h.group.userData.pulsePhase) * 0.4;
            h.ringMat.opacity = h.group.userData.baseOpacity * pulse;
            h.fillMat.opacity = 0.10 + pulse * 0.16;
            h.group.rotation.z += h.group.userData.rotSpeed * dt;
            h.group.position.y = h.group.userData.baseY + Math.sin(time * 0.6 + h.group.userData.driftPhase) * 1.8;
          });

          s.nodes.forEach((n, i) => {
            n.position.z += flowSpeed * 1.15 * dt;
            if (n.position.z > 40) {
              n.position.z = -220 - Math.random() * 40;
              n.position.x = (Math.random() - 0.5) * 80;
              n.position.y = 3 + Math.random() * 40;
            }
            s.nodePositions[i].copy(n.position);
            const pulse = 0.7 + Math.sin(time * 2.0 + n.userData.phase) * 0.5;
            n.scale.setScalar(n.userData.baseScale * (0.85 + pulse * 0.45));
            n.material.opacity = 0.5 + pulse * 0.5;
          });

          const edgeArr = s.lineGeo.attributes.position.array;
          let drawCount = 0;
          for (const pair of s.edgePairs) {
            const a = s.nodePositions[pair[0]], b = s.nodePositions[pair[1]];
            const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
            if (dx*dx + dy*dy + dz*dz > 2025) continue;
            if (a.z < -200 || b.z < -200 || a.z > 40 || b.z > 40) continue;
            edgeArr[drawCount*6] = a.x; edgeArr[drawCount*6+1] = a.y; edgeArr[drawCount*6+2] = a.z;
            edgeArr[drawCount*6+3] = b.x; edgeArr[drawCount*6+4] = b.y; edgeArr[drawCount*6+5] = b.z;
            drawCount++;
          }
          s.lineGeo.setDrawRange(0, drawCount * 2);
          s.lineGeo.attributes.position.needsUpdate = true;
          s.lineMat.opacity = 0.26 + Math.sin(time * 0.8) * 0.1;

          s.skyMat.uniforms.uTime.value = time;
          s.camera.position.x = Math.sin(time * 0.2) * 3 + Math.sin(scrollNorm * Math.PI * 2) * 3;
          s.camera.position.y = 12 + Math.sin(time * 0.1) * 1 - scrollNorm * 2.5;
          s.camera.lookAt(Math.sin(time * 0.15) * 2, 8 - scrollNorm * 3, -30 - scrollNorm * 15);

          this.renderer.render(s.scene, s.camera);
        } else if (this.teacherScene) {
          const s = this.teacherScene;
          s.uniforms.uTime.value = time;
          this.renderer.render(s.scene, s.camera);
        }
      }
    };

    /* ==================== UTILS ==================== */
    function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    function toDate(ts) { if (!ts) return null; if (ts.toDate) return ts.toDate(); if (ts instanceof Date) return ts; return new Date(ts); }
    function fmtTime(ts) { const d = toDate(ts); return d ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—'; }
    function fmtDateTime(ts) { const d = toDate(ts); return d ? d.toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—'; }
    function fmtDate(ts) { const d = toDate(ts); return d ? d.toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' }) : '—'; }
    function distanceMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000, toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function classify(m, r) { return m <= r ? 'near' : 'far'; }
    function avatarUrlFor(photoURL, name, size = 64) {
      if (photoURL && /^https?:\/\//.test(photoURL)) return photoURL;
      const q = encodeURIComponent((name || 'User').trim());
      return `https://ui-avatars.com/api/?name=${q}&background=8b5cf6&color=fff&size=${size}&bold=true`;
    }
    function avatarImgTag(photoURL, name, size = 32) {
      const initial = avatarUrlFor(photoURL, name, size * 2);
      const fallback = avatarUrlFor(null, name, size * 2);
      return `<img class="att-avatar" src="${escapeHtml(initial)}" onerror="this.onerror=null;this.src='${escapeHtml(fallback)}';" alt="${escapeHtml(name || 'User')}" loading="lazy" />`;
    }
    function getPositionOnce() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('Geolocation not supported.'));
        navigator.geolocation.getCurrentPosition(
          pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
          err => reject(new Error(err.code === 1 ? 'Location denied.' : 'GPS error.')),
          { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
        );
      });
    }
    function toast(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.getElementById('toast-root').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 4000);
    }
    function clearWatch() { if (state.watchId != null) { navigator.geolocation.clearWatch(state.watchId); state.watchId = null; state.watchingFor = null; } }
    function clearAllSubs() { ['subCpds','subMine','subDetail','subDetailAtt','subAllAtt'].forEach(k => { if (state[k]) { try { state[k](); } catch {} state[k] = null; } }); }
    function toLocalInputValue(d) { const pad = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
    function cpdStatus(cpd) {
      const s = toDate(cpd.startTime)?.getTime(), e = toDate(cpd.endTime)?.getTime(), n = Date.now();
      if (!s || !e) return 'unknown';
      if (n < s - 15 * 60 * 1000) return 'upcoming';
      if (n > e) return 'ended';
      return 'ongoing';
    }

    /* ==================== GREETINGS, THANKS & GOAT ==================== */
    const GREET_SUBLINES = {
      morning: ['Ready to make today count?', 'Fresh day, fresh ideas.', 'A bright start makes a bright day.'],
      lunch: ['Take a real break — you earned it.', 'Fuel up and keep going.', 'A little pause goes a long way.'],
      afternoon: ['Keep the momentum going.', "You're doing great — keep it up.", 'One step at a time.'],
      evening: ['Time to wind down a little.', 'Nice work today.', 'Evenings are for reflecting and recharging.'],
      night: ['Rest well — tomorrow is another day.', 'Late-night effort noted. Rest soon.', 'Sleep is part of the process.']
    };

    function dayHash(salt) {
      const d = new Date();
      const uid = state.user?.uid || 'guest';
      const key = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}|${uid}|${salt || ''}`;
      let h = 0;
      for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
      return h;
    }
    function pickDaily(list, salt) { return list[dayHash(salt) % list.length]; }

    function getGreetingInfo() {
      const h = new Date().getHours();
      const fullName = state.profile?.fullName || state.user?.displayName || state.user?.email || 'Friend';
      const name = (fullName.split(/[\s@]/)[0] || 'Friend');
      let slot, greetings, emoji;
      if (h >= 5 && h < 11) {
        slot = 'morning'; emoji = '☀️';
        greetings = ['Good morning', 'Hello', 'Hey', 'Welcome back', 'Rise and shine', 'Top of the morning'];
      } else if (h >= 11 && h < 14) {
        slot = 'lunch'; emoji = '🍽️';
        greetings = ['Have a good lunch', 'Hello', 'Hey', 'Good day', 'Enjoy your lunch'];
      } else if (h >= 14 && h < 18) {
        slot = 'afternoon'; emoji = '🌤️';
        greetings = ['Good afternoon', 'Hello', 'Hey', 'Welcome back', 'Good day'];
      } else if (h >= 18 && h < 22) {
        slot = 'evening'; emoji = '🌆';
        greetings = ['Good evening', 'Hello', 'Hey', 'Welcome', 'Nice to see you'];
      } else {
        slot = 'night'; emoji = '🌙';
        greetings = ['Good night', 'Hello', 'Hey', 'Working late', 'Welcome'];
      }
      return {
        name, slot, emoji,
        greeting: pickDaily(greetings, 'greet'),
        sub: pickDaily(GREET_SUBLINES[slot], 'sub')
      };
    }

    /* ==================== TEACHER ==================== */
    function goTeacher() {
      state.view = 'teacher';
      if (!state.subCpds) state.subCpds = onSnapshot(collection(db, 'cpds'),
        snap => { state.cpds = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (state.view === 'teacher') renderTeacher(); },
        err => console.error(err));
      if (!state.subMine && state.user) {
        const q = query(collection(db, 'attendance'), where('teacherId', '==', state.user.uid));
        state.subMine = onSnapshot(q,
          snap => { state.myAttendances = snap.docs.map(d => ({ id: d.id, ...d.data() })); ensureWatchForActive(); if (state.view === 'teacher') renderTeacher(); },
          err => console.error(err));
      }
      renderTeacher();
    }

    function teacherTabBar() {
      const tabs = [
        { id: 'home', icon: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>' },
        { id: 'calendar', icon: '<path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>' },
        { id: 'stats', icon: '<path d="M18 20V10M12 20V4M6 20v-6"/>' },
        { id: 'history', icon: '<path d="M12 8v4l3 3M3.05 11a9 9 0 1 1 .5 4M3 4v5h5"/>' }
      ];
      return `<nav class="tab-bar">${tabs.map(tb => `<button class="tab-btn ${state.teacherTab === tb.id ? 'active' : ''}" data-ttab="${tb.id}"><svg viewBox="0 0 24 24">${tb.icon}</svg>${t(tb.id)}</button>`).join('')}</nav>`;
    }

    function renderTeacher() {
      const active = state.myAttendances.find(a => a.state === 'active');
      let body = '';
      if (state.teacherTab === 'calendar') body = renderTeacherCalendar();
      else if (state.teacherTab === 'stats') body = renderTeacherStats();
      else if (state.teacherTab === 'history') body = renderTeacherHistory();
      else body = renderTeacherHome(active);

      document.getElementById('app').innerHTML = `${headerHtml()}<main class="main">${body}</main>${teacherTabBar()}`;
      bindHeaderEvents();
      document.querySelectorAll('[data-ttab]').forEach(b => b.onclick = () => { state.teacherTab = b.dataset.ttab; renderTeacher(); });
      document.querySelectorAll('[data-attend]').forEach(b => { b.onclick = () => handleAttend(b.dataset.attend, b); });
      document.querySelectorAll('[data-end]').forEach(b => { b.onclick = () => handleEnd(b.dataset.end, b); });
      document.querySelectorAll('[data-calday]').forEach(b => b.onclick = () => { state.calSelectedDay = b.dataset.calday; renderTeacher(); });
      document.querySelectorAll('[data-calnav]').forEach(b => b.onclick = () => {
        const delta = parseInt(b.dataset.calnav);
        let m = state.calMonth + delta, y = state.calYear;
        if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
        state.calMonth = m; state.calYear = y; state.calSelectedDay = null;
        renderTeacher();
      });
    }

    function renderTeacherHome(active) {
      const now = Date.now();
      const todaySessions = state.cpds.filter(c => {
        const d = toDate(c.startTime);
        if (!d) return false;
        const s = new Date(d); s.setHours(0,0,0,0);
        const e = new Date(d); e.setHours(23,59,59,999);
        return now >= s.getTime() && now <= e.getTime();
      }).sort((a, b) => (toDate(a.startTime)?.getTime() || 0) - (toDate(b.startTime)?.getTime() || 0));

      const upcomingSessions = state.cpds
        .filter(c => cpdStatus(c) === 'upcoming' || cpdStatus(c) === 'ongoing')
        .sort((a, b) => (toDate(a.startTime)?.getTime() || 0) - (toDate(b.startTime)?.getTime() || 0));

      const nextUpcoming = upcomingSessions[0];

      let hero;
      if (active) {
        const liveCpd = state.cpds.find(c => c.id === active.cpdId);
        let distanceLine = '';
        if (active.liveLat != null && liveCpd) {
          const d = distanceMeters(active.liveLat, active.liveLng, liveCpd.venueLat, liveCpd.venueLng);
          distanceLine = ` · ${Math.round(d)}m from venue`;
        }
        hero = `<div class="t-hero t-hero-active">
          <h1><span class="status-pulse"></span>${t('currently_attending')}</h1>
          <p><strong style="color:#fff">${escapeHtml(active.cpdTitle)}</strong>${distanceLine ? `<br><span style="font-size:12px">${distanceLine.trim()}</span>` : ''}</p>
          <button data-end="${active.id}" class="btn btn-danger" style="font-size:17px; padding:20px;">■ ${t('end')}</button>
        </div>`;
      } else if (nextUpcoming && cpdStatus(nextUpcoming) === 'ongoing') {
        hero = `<div class="t-hero">
          <h1>🟢 ${t('live')}</h1>
          <p><strong style="color:#fff">${escapeHtml(nextUpcoming.title)}</strong> · ${fmtTime(nextUpcoming.startTime)} – ${fmtTime(nextUpcoming.endTime)}</p>
          <button data-attend="${nextUpcoming.id}" class="btn btn-primary" style="font-size:17px; padding:20px;">▶ ${t('attend')}</button>
        </div>`;
      } else if (nextUpcoming) {
        const start = toDate(nextUpcoming.startTime).getTime();
        const diffMs = start - now;
        const diffH = Math.floor(diffMs / 3600000);
        const diffM = Math.floor((diffMs % 3600000) / 60000);
        const diffD = Math.floor(diffH / 24);
        let countdown = '';
        if (diffD > 0) countdown = `in ${diffD}d ${diffH % 24}h`;
        else if (diffH > 0) countdown = `in ${diffH}h ${diffM}m`;
        else countdown = `in ${diffM}m`;
        hero = `<div class="t-hero">
          <h1>📅 ${t('next_session')}</h1>
          <p><strong style="color:#fff">${escapeHtml(nextUpcoming.title)}</strong><br>${fmtTime(nextUpcoming.startTime)} · ${countdown}</p>
        </div>`;
      } else {
        hero = `<div class="t-hero">
          <h1>☕ ${t('no_sessions_today')}</h1>
          <p>${t('ready')}</p>
        </div>`;
      }

      const todayCards = todaySessions.length > 0
        ? `<div class="section-title">${t('today')}</div>${todaySessions.map(c => teacherSessionCard(c, active)).join('')}`
        : '';

      const upcomingNonToday = upcomingSessions.filter(c => {
        const d = toDate(c.startTime);
        if (!d) return false;
        const s = new Date(d); s.setHours(0,0,0,0);
        return s.getTime() > now;
      }).slice(0, 5);

      const upcomingCards = upcomingNonToday.length > 0
        ? `<div class="section-title">${t('upcoming')}</div>${upcomingNonToday.map(c => teacherSessionCard(c, active)).join('')}`
        : '';

      let emptyBlock = '';
      if (!todayCards && !upcomingCards) emptyBlock = goatEmptyHtml();

      return `${greetingCardHtml()}${hero}${todayCards}${upcomingCards}${emptyBlock}`;
    }

    function teacherSessionCard(cpd, active) {
      const myAtt = state.myAttendances.find(a => a.cpdId === cpd.id);
      const status = myAtt?.state === 'active' ? 'live' : myAtt?.state === 'ended' ? 'ended' : cpdStatus(cpd);
      const isLive = status === 'live';
      const isEnded = status === 'ended';
      let badge = '';
      if (status === 'live') badge = `<span class="badge badge-live">● ${t('live')}</span>`;
      else if (status === 'ongoing') badge = `<span class="badge badge-live">● ${t('ongoing')}</span>`;
      else if (status === 'upcoming') badge = `<span class="badge badge-upcoming">${t('upcoming')}</span>`;
      else if (status === 'ended') badge = myAtt?.verified ? `<span class="badge badge-verified">✓ ${t('verified')}</span>` : `<span class="badge badge-flagged">⚠ ${t('flagged')}</span>`;

      let action = '';
      if (isLive) {
        action = `<button data-end="${myAtt.id}" class="btn btn-danger" style="font-size:15px">■ ${t('end')}</button>`;
      } else if (isEnded) {
        action = '';
      } else if (myAtt) {
        action = `<div style="padding:10px; text-align:center; font-size:13px; color:#94a3b8">✓ ${t('verified')}</div>`;
      } else if (status === 'ongoing') {
        if (active) action = `<button disabled class="btn btn-ghost" style="font-size:13px">${t('finish_current')}</button>`;
        else action = `<button data-attend="${cpd.id}" class="btn btn-primary">▶ ${t('attend')}</button>`;
      } else if (status === 'upcoming') {
        action = `<button disabled class="btn btn-ghost">${t('not_started')}</button>`;
      } else if (status === 'ended') {
        action = `<button disabled class="btn btn-ghost">${t('ended')}</button>`;
      }

      return `<div class="t-session-card ${isLive ? 'live' : ''} ${isEnded ? 'ended' : ''}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;">
          <h3 style="flex:1">${escapeHtml(cpd.title)}</h3>
          ${badge}
        </div>
        <div class="t-session-meta">
          <span>⏰ ${fmtTime(cpd.startTime)} – ${fmtTime(cpd.endTime)}</span>
          <span>📍 ${escapeHtml(cpd.venueName)}</span>
        </div>
        ${action}
      </div>`;
    }

    function renderTeacherCalendar() {
      const year = state.calYear, month = state.calMonth;
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startWeekday = (firstDay.getDay() + 6) % 7;
      const daysInMonth = lastDay.getDate();

      const sessionsByDay = {};
      state.cpds.forEach(c => {
        const d = toDate(c.startTime);
        if (!d) return;
        if (d.getFullYear() === year && d.getMonth() === month) {
          const key = d.getDate();
          if (!sessionsByDay[key]) sessionsByDay[key] = [];
          sessionsByDay[key].push(c);
        }
      });

      const today = new Date();
      const isToday = (day) => today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;

      let grid = '';
      for (let i = 0; i < startWeekday; i++) grid += `<div class="cal-day empty"></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const hasCpd = !!sessionsByDay[day];
        const classes = ['cal-day'];
        if (hasCpd) classes.push('has-cpd');
        if (isToday(day)) classes.push('today');
        if (state.calSelectedDay === day) classes.push('selected');
        grid += `<div class="${classes.join(' ')}" data-calday="${day}">${day}</div>`;
      }

      const monthName = firstDay.toLocaleString('en', { month: 'long', year: 'numeric' });

      let dayDetail = '';
      if (state.calSelectedDay) {
        const list = sessionsByDay[state.calSelectedDay] || [];
        const dayDate = new Date(year, month, state.calSelectedDay).toLocaleDateString([], { weekday: 'long', day: '2-digit', month: 'long' });
        dayDetail = `<div class="section-title">${dayDate}</div>`;
        if (list.length === 0) {
          dayDetail += `<div class="empty"><strong>${t('no_sessions_day')}</strong></div>`;
        } else {
          const active = state.myAttendances.find(a => a.state === 'active');
          dayDetail += list.map(c => teacherSessionCard(c, active)).join('');
        }
      }

      return `
        <div class="cal-wrap">
          <div class="cal-header">
            <div class="cal-title">${monthName}</div>
            <div class="cal-nav">
              <button data-calnav="-1">‹</button>
              <button data-calnav="1">›</button>
            </div>
          </div>
          <div class="cal-grid">
            ${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
            ${grid}
          </div>
        </div>
        ${dayDetail}`;
    }

    function renderTeacherStats() {
      const ended = state.myAttendances.filter(a => a.state === 'ended');
      const verified = state.myAttendances.filter(a => a.verified).length;
      const totalSessions = ended.length;
      const verifiedRate = totalSessions > 0 ? Math.round(verified / totalSessions * 100) : 0;

      const totalMinutes = ended.reduce((s, a) => {
        const s1 = toDate(a.attendedAt)?.getTime();
        const e1 = toDate(a.endedAt)?.getTime();
        if (s1 && e1) return s + Math.max(0, (e1 - s1) / 60000);
        return s;
      }, 0);
      const totalHours = (totalMinutes / 60).toFixed(1);

      const now = new Date();
      const thisMonthCount = state.myAttendances.filter(a => {
        const t = toDate(a.attendedAt)?.getTime();
        return t && t >= new Date(now.getFullYear(), now.getMonth(), 1).getTime();
      }).length;

      const months = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const start = d.getTime();
        const end = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59).getTime();
        const count = state.myAttendances.filter(a => {
          const t = toDate(a.attendedAt)?.getTime();
          return t && t >= start && t <= end;
        }).length;
        months.push({ label: d.toLocaleString('en', { month: 'short' }), count });
      }
      const maxCount = Math.max(1, ...months.map(m => m.count));

      const circ = 2 * Math.PI * 32;
      const dash = (verifiedRate / 100) * circ;

      return `
        <div class="stat-grid">
          <div class="stat-card grad-pink"><div class="val">${totalSessions}</div><div class="lbl">${t('sessions_attended')}</div></div>
          <div class="stat-card grad-cyan"><div class="val">${totalHours}h</div><div class="lbl">${t('total_hours')}</div></div>
          <div class="stat-card grad-violet"><div class="val">${thisMonthCount}</div><div class="lbl">${t('this_month')}</div></div>
          <div class="stat-card grad-green"><div class="val">${verifiedRate}%</div><div class="lbl">${t('verified_rate')}</div></div>
        </div>

        <div class="ring-card">
          <svg width="80" height="80" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="32" stroke="rgba(255,255,255,0.08)" stroke-width="8" fill="none"/>
            <circle cx="40" cy="40" r="32" stroke="url(#teacherGrad)" stroke-width="8" fill="none" stroke-linecap="round"
              stroke-dasharray="${dash} ${circ}" transform="rotate(-90 40 40)"/>
          </svg>
          <div class="ring-info">
            <h3>${t('verified_rate')}</h3>
            <p>${verified} / ${totalSessions} ${t('verified').toLowerCase()}</p>
          </div>
        </div>

        <div class="chart-card">
          <h3>${t('sessions_this_month')}</h3>
          <div class="bars">
            ${months.map(m => {
              const h = m.count === 0 ? 4 : Math.max(8, Math.round((m.count / maxCount) * 100));
              return `<div class="bar-wrap">
                <div class="bar-count">${m.count || ''}</div>
                <div class="bar" style="height:${h}px"></div>
                <div class="bar-lbl">${m.label}</div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
    }

    function renderTeacherHistory() {
      const ended = state.myAttendances.filter(a => a.state === 'ended')
        .sort((a, b) => (toDate(b.attendedAt)?.getTime() || 0) - (toDate(a.attendedAt)?.getTime() || 0));

      if (ended.length === 0) {
        return `<div class="empty" style="margin-top:40px"><strong>${t('no_history')}</strong><span>${t('ready')}</span></div>`;
      }

      const groups = {};
      ended.forEach(a => {
        const d = toDate(a.attendedAt);
        if (!d) return;
        const key = d.toLocaleString('en', { month: 'long', year: 'numeric' });
        if (!groups[key]) groups[key] = [];
        groups[key].push(a);
      });

      return `<div class="section-title">${t('attendance_history')}</div>` +
        Object.entries(groups).map(([month, list]) => `
          <div class="hist-month">${month}</div>
          ${list.map(a => {
            const s1 = toDate(a.attendedAt)?.getTime();
            const e1 = toDate(a.endedAt)?.getTime();
            const mins = (s1 && e1) ? Math.round((e1 - s1) / 60000) : 0;
            const durStr = mins >= 60 ? `${Math.floor(mins/60)}h ${mins%60}m` : `${mins}m`;
            const badge = a.verified ? `<span class="badge badge-verified">✓ ${t('verified')}</span>` : `<span class="badge badge-flagged">⚠ ${t('flagged')}</span>`;
            return `<div class="hist-item">
              <div class="hist-info">
                <h4>${escapeHtml(a.cpdTitle)}</h4>
                <p>${fmtDate(a.attendedAt)} · ${fmtTime(a.attendedAt)} → ${fmtTime(a.endedAt)} · ${durStr}</p>
              </div>
              ${badge}
            </div>`;
          }).join('')}
        `).join('');
    }

    async function handleAttend(cpdId, btn) {
      const cpd = state.cpds.find(c => c.id === cpdId); if (!cpd) return;
      if (state.myAttendances.some(a => a.state === 'active')) { toast(t('finish_current'), 'warn'); return; }
      btn.disabled = true;
      btn.innerHTML = `<span class="spin" style="width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block"></span> ${t('locating')}`;
      try {
        const pos = await getPositionOnce();
        const dist = distanceMeters(pos.lat, pos.lng, cpd.venueLat, cpd.venueLng);
        const status = classify(dist, cpd.radiusMeters);
        await addDoc(collection(db, 'attendance'), {
          cpdId, cpdTitle: cpd.title, teacherId: state.user.uid,
          teacherName: state.profile?.fullName || state.user.email,
          teacherEmail: state.user.email,
          teacherPhotoURL: state.user.photoURL || state.profile?.photoURL || null,
          attendedAt: serverTimestamp(), attendedLat: pos.lat, attendedLng: pos.lng,
          attendedDistanceMeters: dist, attendedStatus: status,
          liveLat: pos.lat, liveLng: pos.lng, liveAccuracy: pos.accuracy, liveUpdatedAt: serverTimestamp(),
          state: 'active', verified: false,
        });
        toast('Attendance recorded!', 'success');
      } catch (err) {
        toast(err.message || 'GPS Error', 'error');
        btn.disabled = false; btn.innerHTML = `▶ ${t('attend')}`;
      }
    }
    async function handleEnd(attId, btn) {
      const att = state.myAttendances.find(a => a.id === attId);
      const cpd = state.cpds.find(c => c.id === att?.cpdId);
      if (!att || !cpd) return;
      btn.disabled = true;
      btn.innerHTML = `<span class="spin" style="width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block"></span> ${t('finalizing')}`;
      try {
        const pos = await getPositionOnce();
        const dist = distanceMeters(pos.lat, pos.lng, cpd.venueLat, cpd.venueLng);
        const status = classify(dist, cpd.radiusMeters);
        const verified = att.attendedStatus === 'near' && status === 'near';
        await updateDoc(doc(db, 'attendance', att.id), {
          endedAt: serverTimestamp(), endedLat: pos.lat, endedLng: pos.lng,
          endedDistanceMeters: dist, endedStatus: status, state: 'ended', verified,
        });
        clearWatch();
        toast(verified ? t('verified') : t('flagged'), verified ? 'success' : 'warn');
        showThankYouModal();
      } catch (err) {
        toast(err.message || 'GPS Error', 'error');
        btn.disabled = false; btn.innerHTML = `■ ${t('end')}`;
      }
    }

    /* ==================== ADMIN ==================== */
    function goAdmin() {
      state.view = 'admin'; clearWatch();
      if (state.subMine) { try { state.subMine(); } catch {} state.subMine = null; }
      if (state.subDetail) { try { state.subDetail(); } catch {} state.subDetail = null; }
      if (state.subDetailAtt) { try { state.subDetailAtt(); } catch {} state.subDetailAtt = null; }
      if (!state.subCpds) state.subCpds = onSnapshot(collection(db, 'cpds'),
        snap => { state.cpds = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (state.view === 'admin') renderAdmin(); },
        err => console.error(err));
      if (!state.subAllAtt) state.subAllAtt = onSnapshot(collection(db, 'attendance'),
        snap => {
          state.allAttendances = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          if (state.view === 'admin' && state.adminTab !== 'new_cpd') renderAdmin();
        },
        err => console.error(err));
      renderAdmin();
    }

    function adminTabBar() {
      const tabs = [
        { id: 'overview', icon: '<path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-5a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 001 1h3a1 1 0 001-1V10"/>' },
        { id: 'sessions', icon: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>' },
        { id: 'new_cpd', icon: '<path d="M12 5v14M5 12h14"/>' }
      ];
      return `<nav class="tab-bar">${tabs.map(tb => `<button class="tab-btn ${state.adminTab === tb.id ? 'active' : ''}" data-atab="${tb.id}"><svg viewBox="0 0 24 24">${tb.icon}</svg>${t(tb.id)}</button>`).join('')}</nav>`;
    }

    function renderAdmin() {
      let body = '';
      if (state.adminTab === 'sessions') body = renderAdminSessions();
      else if (state.adminTab === 'new_cpd') body = renderAdminNew();
      else body = renderAdminOverview();

      document.getElementById('app').innerHTML = `${headerHtml()}<main class="main">${body}</main>${state.adminTab === 'new_cpd' ? '' : adminTabBar()}`;
      bindHeaderEvents();
      document.querySelectorAll('[data-atab]').forEach(b => b.onclick = () => { state.adminTab = b.dataset.atab; renderAdmin(); });
      document.querySelectorAll('[data-open-cpd]').forEach(el => { el.onclick = () => goCpdDetail(el.dataset.openCpd); });
      document.querySelectorAll('[data-del-cpd]').forEach(el => {
        el.onclick = async () => {
          if (!confirm(t('msg_delete'))) return;
          try { await deleteDoc(doc(db, 'cpds', el.dataset.delCpd)); toast('Deleted.', 'success'); }
          catch (err) { toast(err.message, 'error'); }
        };
      });
      document.querySelectorAll('[data-filter]').forEach(b => {
        b.onclick = () => { state.adminSessionFilter = b.dataset.filter; renderAdmin(); };
      });
      if (state.adminTab === 'new_cpd') bindAdminNewEvents();
    }

    function renderAdminOverview() {
      const list = state.cpds;
      const now = Date.now();
      const ongoing = list.filter(c => cpdStatus(c) === 'ongoing');
      const upcoming = list.filter(c => cpdStatus(c) === 'upcoming').sort((a, b) => (toDate(a.startTime)?.getTime() || 0) - (toDate(b.startTime)?.getTime() || 0));
      const nextSession = upcoming[0];

      const liveNow = ongoing.length;
      let nextStr = '—';
      if (nextSession) {
        const d = toDate(nextSession.startTime);
        if (d) {
          const diffMs = d.getTime() - now;
          const diffH = Math.floor(diffMs / 3600000);
          const diffM = Math.floor((diffMs % 3600000) / 60000);
          nextStr = diffH > 0 ? `${diffH}h ${diffM}m` : `${diffM}m`;
        }
      }

      const ongoingCards = ongoing.map(c => `
        <div class="a-session-card">
          <div class="row">
            <div style="flex:1;min-width:0">
              <div><span class="badge badge-live">● ${t('live')}</span></div>
              <h3>${escapeHtml(c.title)}</h3>
              <p>${fmtTime(c.startTime)} – ${fmtTime(c.endTime)} · ${escapeHtml(c.venueName)}</p>
            </div>
            <div class="actions">
              <button data-open-cpd="${c.id}" class="btn btn-primary">${t('open')}</button>
            </div>
          </div>
        </div>`).join('');

      const upcomingCards = upcoming.slice(0, 4).map(c => `
        <div class="a-session-card">
          <div class="row">
            <div style="flex:1;min-width:0">
              <div><span class="badge badge-upcoming">${t('upcoming')}</span></div>
              <h3>${escapeHtml(c.title)}</h3>
              <p>${fmtDateTime(c.startTime)} · ${escapeHtml(c.venueName)}</p>
            </div>
            <div class="actions">
              <button data-open-cpd="${c.id}" class="btn btn-primary">${t('open')}</button>
            </div>
          </div>
        </div>`).join('');

      const endedList = list
        .filter(c => cpdStatus(c) === 'ended')
        .sort((a, b) => (toDate(b.startTime)?.getTime() || 0) - (toDate(a.startTime)?.getTime() || 0))
        .slice(0, 4);

      const endedCards = endedList.map(c => {
        const atts = state.allAttendances.filter(a => a.cpdId === c.id);
        const total = atts.length;
        const verified = atts.filter(a => a.verified).length;
        return `
        <div class="a-session-card">
          <div class="row">
            <div style="flex:1;min-width:0">
              <div><span class="badge badge-ended">${t('ended')}</span></div>
              <h3>${escapeHtml(c.title)}</h3>
              <p>${fmtDateTime(c.startTime)} · ${escapeHtml(c.venueName)}</p>
              <div class="past-stats">
                <span class="past-stat">👥 ${total} ${t('attendees')}</span>
                <span class="past-stat ok">✓ ${verified} ${t('verified')}</span>
              </div>
            </div>
            <div class="actions">
              <button data-open-cpd="${c.id}" class="btn btn-primary">${t('open')}</button>
            </div>
          </div>
        </div>`;
      }).join('');

      return `
        ${greetingCardHtml()}

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
          <h1 style="font-size:22px;font-weight:900;margin:0;color:#fff;text-shadow:0 0 20px rgba(0,255,204,0.35);">${t('admin_title')}</h1>
          <button id="btn-top-new" class="btn btn-primary" style="width:auto; padding: 10px 16px; font-size: 13px;">+ ${t('new_cpd')}</button>
        </div>

        <div class="a-stat-grid">
          <div class="a-stat"><div class="val" style="color:#00ffcc">${liveNow}</div><div class="lbl">${t('stat_live_now')}</div></div>
          <div class="a-stat"><div class="val">${list.length}</div><div class="lbl">${t('stat_total')}</div></div>
          <div class="a-stat"><div class="val" style="color:#a855f7">${upcoming.length}</div><div class="lbl">${t('stat_upcoming')}</div></div>
          <div class="a-stat"><div class="val" style="color:#fbbf24;font-size:18px">${nextStr}</div><div class="lbl">${t('stat_next_session')}</div></div>
        </div>

        ${ongoing.length > 0 ? `<div class="section-title">${t('ongoing')}</div>${ongoingCards}` : ''}
        ${upcoming.length > 0 ? `<div class="section-title">${t('upcoming')}</div>${upcomingCards}` : ''}
        ${endedList.length > 0 ? `<div class="section-title">${t('past_sessions')}</div>${endedCards}` : ''}
        ${list.length === 0 ? `<div class="empty" style="margin-top:20px"><strong>${t('all_sessions')}</strong><span>${t('create_sub')}</span></div>` : ''}
      `;
    }

    function renderAdminSessions() {
      const filter = state.adminSessionFilter;
      const list = [...state.cpds].sort((a, b) => (toDate(b.startTime)?.getTime() || 0) - (toDate(a.startTime)?.getTime() || 0));
      const filtered = filter === 'all' ? list : list.filter(c => cpdStatus(c) === filter);

      const rows = filtered.map(c => {
        const st = cpdStatus(c);
        const badge = st === 'ongoing' ? `<span class="badge badge-live">● ${t('ongoing')}</span>` : st === 'upcoming' ? `<span class="badge badge-upcoming">${t('upcoming')}</span>` : `<span class="badge badge-ended">${t('ended')}</span>`;
        return `<div class="a-session-card">
          <div class="row">
            <div style="flex:1;min-width:0">
              <div>${badge}</div>
              <h3>${escapeHtml(c.title)}</h3>
              <p>${fmtDateTime(c.startTime)} · ${escapeHtml(c.venueName)}</p>
            </div>
            <div class="actions">
              <button data-open-cpd="${c.id}" class="btn btn-primary">${t('open')}</button>
              <button data-del-cpd="${c.id}" class="btn btn-danger">🗑</button>
            </div>
          </div>
        </div>`;
      }).join('');

      return `
        <h1 style="font-size:22px;font-weight:900;margin:0 0 16px;color:#fff;text-shadow:0 0 20px rgba(0,255,204,0.35);">${t('sessions')}</h1>

        <div class="filter-tabs">
          <button data-filter="all" class="filter-tab ${filter === 'all' ? 'active' : ''}">${t('all_sessions')}</button>
          <button data-filter="ongoing" class="filter-tab ${filter === 'ongoing' ? 'active' : ''}">${t('ongoing')}</button>
          <button data-filter="upcoming" class="filter-tab ${filter === 'upcoming' ? 'active' : ''}">${t('upcoming')}</button>
          <button data-filter="ended" class="filter-tab ${filter === 'ended' ? 'active' : ''}">${t('ended')}</button>
        </div>

        ${filtered.length === 0 ? `<div class="empty"><strong>${t('all_sessions')}</strong><span>${t('create_sub')}</span></div>` : rows}
